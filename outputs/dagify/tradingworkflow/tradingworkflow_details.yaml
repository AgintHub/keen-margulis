dag_type: shim
description: Execute a trading workflow involving market data analysis, trade signal
  generation, and trade execution
name: tradingworkflow
nodes:
  analyze_market_trends:
    agent: false
    code_node_type: shim
    description: Analyze market trends using historical data and technical indicators
    implementation: "from ._analyze_market_trends.validate_market_data import validate_market_data\n\
      from ._analyze_market_trends.calculate_technical_indicators import calculate_technical_indicators\n\
      from ._analyze_market_trends.determine_trend_directions import determine_trend_directions\n\
      from ._analyze_market_trends.normalize_trend_indicators import normalize_trend_indicators\n\
      \nfrom pydantic import BaseModel, Field\nfrom typing import List\n\n\nclass\
      \ FetchMarketDataOutput(BaseModel):\n    \"\"\"Pydantic model for fetch_market_data\
      \ node outputs.\"\"\"\n    market_prices: List[float] = (\n        Field(...,\
      \ description=\"List of current market prices\")\n    )\n    market_volumes:\
      \ List[int] = (\n        Field(..., description=\"List of current market volumes\"\
      )\n    )\n\n\nclass AnalyzeMarketTrendsOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for analyze_market_trends node outputs.\"\"\"\n    trend_indicators:\
      \ List[float] = (\n        Field(..., description=\"List of trend indicators\"\
      )\n    )\n    trend_directions: List[str] = (\n        Field(..., description=\"\
      List of trend directions (up, down, neutral)\")\n    )\n\n\ndef analyze_market_trends(fetch_market_data_input:\
      \ FetchMarketDataOutput, **kwargs) -> AnalyzeMarketTrendsOutput:\n    \"\"\"\
      \n    Analyze market trends using historical data and technical indicators.\n\
      \n    Parameters\n    ----------\n    market_prices : List[float]\n        List\
      \ of current market prices from fetch_market_data node.\n    market_volumes\
      \ : List[int]\n        List of current market volumes from fetch_market_data\
      \ node.\n\n    Returns\n    -------\n    Tuple[List[float], List[str]]\n   \
      \     A tuple containing a list of trend indicators and a list of trend\n  \
      \      directions.\n\n    Raises\n    ------\n    ValueError\n        If market_prices\
      \ or market_volumes are empty or malformed.\n\n    Examples\n    --------\n\
      \    >>> market_prices = [100.0, 120.0, 110.0]\n    >>> market_volumes = [1000,\
      \ 1200, 1100]\n    >>> trend_indicators, trend_directions =\n    analyze_market_trends(market_prices,\
      \ market_volumes)\n    ([1.2, 0.9, 1.1], ['up', 'down', 'up'])\n\n    \"\"\"\
      \n    validated_data: dict = validate_market_data(prices=fetch_market_data_input.market_prices,\
      \ volumes=fetch_market_data_input.market_volumes)\n    \n    technical_indicators:\
      \ List[float] = calculate_technical_indicators(prices=fetch_market_data_input.market_prices,\
      \ volumes=fetch_market_data_input.market_volumes)\n    \n    trend_signals:\
      \ List[str] = determine_trend_directions(indicators=technical_indicators, prices=fetch_market_data_input.market_prices)\n\
      \    \n    normalized_indicators: List[float] = normalize_trend_indicators(raw_indicators=technical_indicators)\n\
      \    \n    return AnalyzeMarketTrendsOutput(\n        trend_indicators=normalized_indicators,\n\
      \        trend_directions=trend_signals\n    )"
    name: analyze_market_trends
    nodes_depended_on:
    - fetch_market_data
    nodes_dependent_on: []
    output_structure:
    - description: List of trend indicators
      key: trend_indicators
      type: List[float]
    - description: List of trend directions (up, down, neutral)
      key: trend_directions
      type: List[str]
    prd:
      conceptual_info: This node analyzes market trends using historical data and
        technical indicators, producing trend indicators and directions.
      docstring:
        examples:
        - lines:
          - market_prices = [100.0, 120.0, 110.0]
          - market_volumes = [1000, 1200, 1100]
          - trend_indicators, trend_directions = analyze_market_trends(market_prices,
            market_volumes)
          output: ([1.2, 0.9, 1.1], ['up', 'down', 'up'])
        parameters:
        - description: List of current market prices from fetch_market_data node.
          name: market_prices
          type: List[float]
        - description: List of current market volumes from fetch_market_data node.
          name: market_volumes
          type: List[int]
        raises:
        - description: If market_prices or market_volumes are empty or malformed.
          type: ValueError
        returns:
          description: A tuple containing a list of trend indicators and a list of
            trend directions.
          type: Tuple[List[float], List[str]]
        summary: Analyze market trends using historical data and technical indicators.
    prompt: Analyze market trends using historical data and technical indicators
    shims:
    - agent: false
      code_node_type: virtual-stub
      description: Validates market data by checking the consistency and correctness
        of the provided prices and volumes.
      implementation: "def validate_market_data(prices: str, volumes: str) -> str:\n\
        \    \"\"\"\n    Validates market data by checking the consistency and correctness\
        \ of the\n    provided prices and volumes.\n\n    Parameters\n    ----------\n\
        \    prices : str\n        A string representation of a list of market prices.\n\
        \    volumes : str\n        A string representation of a list of market volumes.\n\
        \n    Returns\n    -------\n    str\n        A dictionary containing the validation\
        \ result, including information\n        about the validity of the market\
        \ data.\n\n    Raises\n    ------\n    ValueError\n        If the input prices\
        \ or volumes are not valid (e.g., not numeric,\n        negative, or mismatched\
        \ lengths).\n    TypeError\n        If the input types are incorrect (e.g.,\
        \ not strings representing\n        lists).\n\n    Examples\n    --------\n\
        \    >>> validate_market_data(prices='[10.5, 20.3, 30.7]', volumes='[100,\
        \ 200,\n    300]')\n    {'valid': True, 'message': 'Market data is valid'}\n\
        \n    >>> validate_market_data(prices='[10.5, 20.3]', volumes='[100, 200,\
        \ 300]')\n    {'valid': False, 'message': 'Mismatch in prices and volumes\
        \ lengths'}\n\n    \"\"\"\n    raise NotImplementedError(\"This is a virtual\
        \ stub node that needs to be implemented\")"
      name: validate_market_data
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type dict
        key: output
        type: str
      - description: Input parameter of type str
        key: prices
        type: str
      - description: Input parameter of type str
        key: volumes
        type: str
      prd:
        conceptual_info: This shim node is responsible for validating market data,
          ensuring that the provided prices and volumes are consistent and correct
          before further processing.
        docstring:
          examples:
          - lines:
            - validate_market_data(prices='[10.5, 20.3, 30.7]', volumes='[100, 200,
              300]')
            output: '{''valid'': True, ''message'': ''Market data is valid''}'
          - lines:
            - validate_market_data(prices='[10.5, 20.3]', volumes='[100, 200, 300]')
            output: '{''valid'': False, ''message'': ''Mismatch in prices and volumes
              lengths''}'
          parameters:
          - description: A string representation of a list of market prices.
            name: prices
            type: str
          - description: A string representation of a list of market volumes.
            name: volumes
            type: str
          raises:
          - description: If the input prices or volumes are not valid (e.g., not numeric,
              negative, or mismatched lengths).
            type: ValueError
          - description: If the input types are incorrect (e.g., not strings representing
              lists).
            type: TypeError
          returns:
            description: A dictionary containing the validation result, including
              information about the validity of the market data.
            type: str
          summary: Validates market data by checking the consistency and correctness
            of the provided prices and volumes.
      prompt: 'Description: Typed node for shim validate_market_data'
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Calculates technical indicators based on given market prices and
        volumes.
      implementation: "from typing import List\n\n\ndef calculate_technical_indicators(prices:\
        \ str, volumes: str) -> List[float]:\n    \"\"\"\n    Calculates technical\
        \ indicators from given market prices and volumes.\n\n    Parameters\n   \
        \ ----------\n    prices : str\n        String representation of market prices,\
        \ expected to be a list of\n        floats.\n    volumes : str\n        String\
        \ representation of market volumes, expected to be a list of\n        integers.\n\
        \n    Returns\n    -------\n    List[float]\n        List of technical indicators\
        \ calculated from the input prices and\n        volumes.\n\n    Raises\n \
        \   ------\n    ValueError\n        If the input strings cannot be parsed\
        \ into lists of numbers.\n    TypeError\n        If the input types are not\
        \ strings or if the parsed lists contain\n        non-numeric values.\n\n\
        \    Examples\n    --------\n    >>> prices = '[1.0, 2.0, 3.0]'\n    >>> volumes\
        \ = '[100, 200, 300]'\n    >>> calculate_technical_indicators(prices=prices,\
        \ volumes=volumes)\n    [0.5, 1.0, 1.5]\n\n    >>> prices = '[4.0, 5.0, 6.0]'\n\
        \    >>> volumes = '[400, 500, 600]'\n    >>> calculate_technical_indicators(prices=prices,\
        \ volumes=volumes)\n    [2.0, 2.5, 3.0]\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: calculate_technical_indicators
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[float]
        key: output
        type: List[float]
      - description: Input parameter of type str
        key: prices
        type: str
      - description: Input parameter of type str
        key: volumes
        type: str
      prd:
        conceptual_info: This shim node is responsible for computing technical indicators
          from market data, which are crucial for analyzing market trends.
        docstring:
          examples:
          - lines:
            - prices = '[1.0, 2.0, 3.0]'
            - volumes = '[100, 200, 300]'
            - calculate_technical_indicators(prices=prices, volumes=volumes)
            output: '[0.5, 1.0, 1.5]'
          - lines:
            - prices = '[4.0, 5.0, 6.0]'
            - volumes = '[400, 500, 600]'
            - calculate_technical_indicators(prices=prices, volumes=volumes)
            output: '[2.0, 2.5, 3.0]'
          parameters:
          - description: String representation of market prices, expected to be a
              list of floats.
            name: prices
            type: str
          - description: String representation of market volumes, expected to be a
              list of integers.
            name: volumes
            type: str
          raises:
          - description: If the input strings cannot be parsed into lists of numbers.
            type: ValueError
          - description: If the input types are not strings or if the parsed lists
              contain non-numeric values.
            type: TypeError
          returns:
            description: List of technical indicators calculated from the input prices
              and volumes.
            type: List[float]
          summary: Calculates technical indicators from given market prices and volumes.
      prompt: Calculate technical indicators using the given market prices and volumes.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Determines trend directions based on technical indicators and market
        prices.
      implementation: "from typing import List\n\n\ndef determine_trend_directions(indicators:\
        \ str, prices: str) -> List[str]:\n    \"\"\"\n    Determines trend directions\
        \ based on the provided technical indicators and\n    market prices.\n\n \
        \   Parameters\n    ----------\n    indicators : str\n        A string representation\
        \ of technical indicators used for trend\n        analysis.\n    prices :\
        \ str\n        A string representation of market prices used in conjunction\
        \ with\n        indicators for trend analysis.\n\n    Returns\n    -------\n\
        \    List[str]\n        A list of strings representing trend directions (up,\
        \ down, neutral)\n        corresponding to the input indicators and prices.\n\
        \n    Raises\n    ------\n    ValueError\n        If the input indicators\
        \ or prices are not valid or cannot be\n        processed.\n    TypeError\n\
        \        If the input types do not match the expected types.\n\n    Examples\n\
        \    --------\n    >>> determine_trend_directions(indicators='[0.5, 0.7, 0.3]',\
        \ prices='[100,\n    120, 90]')\n    ['up', 'up', 'down']\n\n    >>> determine_trend_directions(indicators='[0.2,\
        \ 0.4, 0.6]', prices='[80,\n    100, 120]')\n    ['down', 'neutral', 'up']\n\
        \n    \"\"\"\n    raise NotImplementedError(\"This is a virtual stub node\
        \ that needs to be implemented\")"
      name: determine_trend_directions
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: indicators
        type: str
      - description: Input parameter of type str
        key: prices
        type: str
      prd:
        conceptual_info: This shim node analyzes technical indicators and market prices
          to determine trend directions, playing a crucial role in market trend analysis.
        docstring:
          examples:
          - lines:
            - determine_trend_directions(indicators='[0.5, 0.7, 0.3]', prices='[100,
              120, 90]')
            output: '[''up'', ''up'', ''down'']'
          - lines:
            - determine_trend_directions(indicators='[0.2, 0.4, 0.6]', prices='[80,
              100, 120]')
            output: '[''down'', ''neutral'', ''up'']'
          parameters:
          - description: A string representation of technical indicators used for
              trend analysis.
            name: indicators
            type: str
          - description: A string representation of market prices used in conjunction
              with indicators for trend analysis.
            name: prices
            type: str
          raises:
          - description: If the input indicators or prices are not valid or cannot
              be processed.
            type: ValueError
          - description: If the input types do not match the expected types.
            type: TypeError
          returns:
            description: A list of strings representing trend directions (up, down,
              neutral) corresponding to the input indicators and prices.
            type: List[str]
          summary: Determines trend directions based on the provided technical indicators
            and market prices.
      prompt: 'Description: Typed node for shim determine_trend_directions'
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Normalizes raw trend indicators to a standardized scale for consistent
        trend analysis.
      implementation: "from typing import List\n\n\ndef normalize_trend_indicators(raw_indicators:\
        \ str) -> List[float]:\n    \"\"\"\n    Normalizes raw trend indicators to\
        \ a standardized scale between 0 and 1.\n\n    Parameters\n    ----------\n\
        \    raw_indicators : str\n        Raw trend indicators as a string representation\
        \ that needs to be\n        normalized\n\n    Returns\n    -------\n    List[float]\n\
        \        A list of normalized trend indicators scaled between 0 and 1\n\n\
        \    Raises\n    ------\n    ValueError\n        When the input string cannot\
        \ be converted to a list of numbers\n    TypeError\n        When the input\
        \ is not a string or when the input string contains\n        non-numeric values\n\
        \n    Examples\n    --------\n    >>> import json\n    >>> raw_indicators\
        \ = '[1.2, 2.3, 3.4, 4.5]'\n    >>> normalized = normalize_trend_indicators(raw_indicators=raw_indicators)\n\
        \    >>> print(json.dumps(normalized))\n    [0.0, 0.3333333333333333, 0.6666666666666666,\
        \ 1.0]\n\n    >>> raw_indicators = '[10, 20, 30, 40]'\n    >>> normalized\
        \ = normalize_trend_indicators(raw_indicators=raw_indicators)\n    >>> print(normalized)\n\
        \    [0.0, 0.3333333333333333, 0.6666666666666666, 1.0]\n\n    \"\"\"\n  \
        \  raise NotImplementedError(\"This is a virtual stub node that needs to be\
        \ implemented\")"
      name: normalize_trend_indicators
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[float]
        key: output
        type: List[float]
      - description: Input parameter of type str
        key: raw_indicators
        type: str
      prd:
        conceptual_info: This shim node is responsible for normalizing raw trend indicators
          to a standardized scale, enabling consistent trend analysis across different
          market conditions.
        docstring:
          examples:
          - lines:
            - import json
            - raw_indicators = '[1.2, 2.3, 3.4, 4.5]'
            - normalized = normalize_trend_indicators(raw_indicators=raw_indicators)
            - print(json.dumps(normalized))
            output: '[0.0, 0.3333333333333333, 0.6666666666666666, 1.0]'
          - lines:
            - raw_indicators = '[10, 20, 30, 40]'
            - normalized = normalize_trend_indicators(raw_indicators=raw_indicators)
            - print(normalized)
            output: '[0.0, 0.3333333333333333, 0.6666666666666666, 1.0]'
          parameters:
          - description: Raw trend indicators as a string representation that needs
              to be normalized
            name: raw_indicators
            type: str
          raises:
          - description: When the input string cannot be converted to a list of numbers
            type: ValueError
          - description: When the input is not a string or when the input string contains
              non-numeric values
            type: TypeError
          returns:
            description: A list of normalized trend indicators scaled between 0 and
              1
            type: List[float]
          summary: Normalizes raw trend indicators to a standardized scale between
            0 and 1.
      prompt: Implement the normalize_trend_indicators function to normalize raw trend
        indicators
      shims: []
  execute_trades:
    agent: false
    code_node_type: shim
    description: Execute trades based on generated trade signals
    implementation: "from ._execute_trades.validate_signal_inputs import validate_signal_inputs\n\
      from ._execute_trades.generate_trade_id import generate_trade_id\nfrom ._execute_trades.execute_single_trade\
      \ import execute_single_trade\n\nfrom pydantic import BaseModel, Field\nfrom\
      \ typing import List\n\n\nclass GenerateTradeSignalsOutput(BaseModel):\n   \
      \ \"\"\"Pydantic model for generate_trade_signals node outputs.\"\"\"\n    trade_signals:\
      \ List[str] = (\n        Field(..., description=\"List of trade signals (buy,\
      \ sell, hold)\")\n    )\n    signal_confidences: List[float] = (\n        Field(...,\
      \ description=\"List of signal confidences\")\n    )\n\n\nclass ExecuteTradesOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for execute_trades node outputs.\"\"\"\n    trade_outcomes:\
      \ List[str] = (\n        Field(..., description=\"List of trade outcomes (success,\
      \ failure)\")\n    )\n    trade_ids: List[str] = Field(..., description=\"List\
      \ of trade IDs\")\n\n\ndef execute_trades(generate_trade_signals_input: GenerateTradeSignalsOutput,\
      \ **kwargs) -> ExecuteTradesOutput:\n    \"\"\"\n    Execute trades based on\
      \ generated trade signals and return the outcomes and\n    trade IDs.\n\n  \
      \  Parameters\n    ----------\n    trade_signals : List[str]\n        List of\
      \ trade signals (buy, sell, hold) generated by the\n        generate_trade_signals\
      \ node.\n    signal_confidences : List[float]\n        List of signal confidences\
      \ corresponding to the trade signals.\n\n    Returns\n    -------\n    Tuple[List[str],\
      \ List[str]]\n        A tuple containing a list of trade outcomes (success,\
      \ failure) and a\n        list of trade IDs.\n\n    Raises\n    ------\n   \
      \ ValueError\n        If the lengths of trade_signals and signal_confidences\
      \ do not match.\n    RuntimeError\n        If trade execution fails due to external\
      \ factors.\n\n    Examples\n    --------\n    >>> trade_signals = ['buy', 'sell',\
      \ 'hold']\n    >>> signal_confidences = [0.8, 0.9, 0.7]\n    >>> trade_outcomes,\
      \ trade_ids = execute_trades(trade_signals,\n    signal_confidences)\n    (['success',\
      \ 'success', 'failure'], ['trade123', 'trade456', 'trade789'])\n\n    >>> trade_signals\
      \ = ['buy', 'sell']\n    >>> signal_confidences = [0.85, 0.95]\n    >>> trade_outcomes,\
      \ trade_ids = execute_trades(trade_signals,\n    signal_confidences)\n    (['success',\
      \ 'success'], ['trade101', 'trade102'])\n\n    \"\"\"\n    trade_signals = generate_trade_signals_input.trade_signals\n\
      \    signal_confidences = generate_trade_signals_input.signal_confidences\n\
      \    \n    validate_signal_inputs(signals=trade_signals, confidences=signal_confidences)\n\
      \    \n    trade_outcomes: List[str] = []\n    trade_ids: List[str] = []\n \
      \   \n    for signal, confidence in zip(trade_signals, signal_confidences):\n\
      \        trade_id: str = generate_trade_id()\n        execution_result: str\
      \ = execute_single_trade(signal=signal, confidence=confidence, trade_id=trade_id)\n\
      \        trade_outcomes.append(execution_result)\n        trade_ids.append(trade_id)\n\
      \    \n    return ExecuteTradesOutput(\n        trade_outcomes=trade_outcomes,\n\
      \        trade_ids=trade_ids,\n    )"
    name: execute_trades
    nodes_depended_on:
    - generate_trade_signals
    nodes_dependent_on: []
    output_structure:
    - description: List of trade outcomes (success, failure)
      key: trade_outcomes
      type: List[str]
    - description: List of trade IDs
      key: trade_ids
      type: List[str]
    prd:
      conceptual_info: This node executes trades based on the trade signals generated
        by its parent node, generate_trade_signals.
      docstring:
        examples:
        - lines:
          - trade_signals = ['buy', 'sell', 'hold']
          - signal_confidences = [0.8, 0.9, 0.7]
          - trade_outcomes, trade_ids = execute_trades(trade_signals, signal_confidences)
          output: (['success', 'success', 'failure'], ['trade123', 'trade456', 'trade789'])
        - lines:
          - trade_signals = ['buy', 'sell']
          - signal_confidences = [0.85, 0.95]
          - trade_outcomes, trade_ids = execute_trades(trade_signals, signal_confidences)
          output: (['success', 'success'], ['trade101', 'trade102'])
        parameters:
        - description: List of trade signals (buy, sell, hold) generated by the generate_trade_signals
            node.
          name: trade_signals
          type: List[str]
        - description: List of signal confidences corresponding to the trade signals.
          name: signal_confidences
          type: List[float]
        raises:
        - description: If the lengths of trade_signals and signal_confidences do not
            match.
          type: ValueError
        - description: If trade execution fails due to external factors.
          type: RuntimeError
        returns:
          description: A tuple containing a list of trade outcomes (success, failure)
            and a list of trade IDs.
          type: Tuple[List[str], List[str]]
        summary: Execute trades based on generated trade signals and return the outcomes
          and trade IDs.
    prompt: Execute trades based on generated trade signals
    shims:
    - agent: false
      code_node_type: virtual-stub
      description: Validates the input signals and their corresponding confidences
        for trading.
      implementation: "def validate_signal_inputs(signals: str, confidences: str)\
        \ -> str:\n    \"\"\"\n    Validates the input trade signals and their corresponding\
        \ confidences.\n\n    Parameters\n    ----------\n    signals : str\n    \
        \    A string representation of a list of trade signals (buy, sell,\n    \
        \    hold).\n    confidences : str\n        A string representation of a list\
        \ of signal confidences\n        corresponding to the trade signals.\n\n \
        \   Returns\n    -------\n    str\n        A string indicating whether the\
        \ input signals are valid.\n\n    Raises\n    ------\n    ValueError\n   \
        \     If the lengths of signals and confidences lists do not match.\n    TypeError\n\
        \        If the input signals or confidences are not in the expected format.\n\
        \n    Examples\n    --------\n    >>> validate_signal_inputs(signals='[\"\
        buy\", \"sell\", \"hold\"]',\n    confidences='[0.8, 0.7, 0.9]')\n    'Valid\
        \ signals and confidences'\n\n    >>> validate_signal_inputs(signals='[\"\
        buy\", \"sell\"]', confidences='[0.8,\n    0.7, 0.9]')\n    ValueError: Signals\
        \ and confidences lists must be of the same length\n\n    \"\"\"\n    raise\
        \ NotImplementedError(\"This is a virtual stub node that needs to be implemented\"\
        )"
      name: validate_signal_inputs
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type Any
        key: output
        type: str
      - description: Input parameter of type str
        key: signals
        type: str
      - description: Input parameter of type str
        key: confidences
        type: str
      prd:
        conceptual_info: This shim node is responsible for validating trade signals
          and their confidences before they are used for executing trades.
        docstring:
          examples:
          - lines:
            - validate_signal_inputs(signals='["buy", "sell", "hold"]', confidences='[0.8,
              0.7, 0.9]')
            output: '''Valid signals and confidences'''
          - lines:
