      \    )"
    name: sentiment_analysis
    nodes_depended_on:
    - fetch_song_data
    nodes_dependent_on: []
    output_structure:
    - description: Sentiment score for each song.
      key: sentiment_scores
      type: List[float]
    prd:
      conceptual_info: Performs sentiment analysis on song lyrics, producing a sentiment
        score for each track.
      docstring:
        examples:
        - lines:
          - scores = sentiment_analysis(["Love Story", "Bad Blood"], ["I knew you
            were trouble, so I stayed away", "I used to love you, now I hate you"])
          output: '[0.76, -0.62]'
        - lines:
          - scores = sentiment_analysis(["Blank Space"], ["So nice I can't decide
            if I'm a love or a lie"])
          output: '[0.48]'
        parameters:
        - description: List of song titles corresponding to the lyrics.
          name: song_titles
          type: List[str]
        - description: List of full lyrics for each song.
          name: song_lyrics
          type: List[str]
        raises:
        - description: If input lists are not the same length or are empty.
          type: ValueError
        returns:
          description: Sentiment score for each song.
          type: List[float]
        summary: Computes overall sentiment scores for a list of song lyrics, returning
          a list of floats between -1 and 1 aligned with song titles.
    prompt: Calculate an overall sentiment score between -1 (very negative) and 1
      (very positive) for each song's lyrics. Return a list of scores aligned with
