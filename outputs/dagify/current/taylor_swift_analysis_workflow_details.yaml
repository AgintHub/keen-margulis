dag_type: stub
description: A typed workflow that fetches Taylor Swift songs, analyzes their lyrics,
  extracts key themes, computes sentiment trends over time, and produces a concise
  summary.
name: taylor_swift_analysis_workflow
nodes:
  analyze_lyrics:
    agent: false
    code_node_type: stub
    description: Generate word frequency statistics from all lyrics.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass FetchSongDataOutput(BaseModel):\n    \"\"\"Pydantic model for fetch_song_data\
      \ node outputs.\"\"\"\n    song_titles: List[str] = Field(..., description=\"\
      List of song titles in the same order as the other lists.\")\n    song_lyrics:\
      \ List[str] = Field(..., description=\"List of full lyrics corresponding to\
      \ each song title.\")\n    release_years: List[int] = Field(..., description=\"\
      List of release years corresponding to each song title.\")\n\n\nclass AnalyzeLyricsOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for analyze_lyrics node outputs.\"\"\"\n    unique_words:\
      \ List[str] = Field(..., description=\"All distinct words found in the lyrics,\
      \ ordered by descending frequency.\")\n    word_counts: List[int] = Field(...,\
      \ description=\"Number of occurrences for each word, aligned with unique_words.\"\
      )\n\n\ndef analyze_lyrics(fetch_song_data_input: FetchSongDataOutput, **kwargs)\
      \ -> AnalyzeLyricsOutput:\n    \"\"\"Generate word frequency statistics from\
      \ all lyrics.\n\n    Args:\n        fetch_song_data_input: Input from the 'fetch_song_data'\
      \ node.\n        **kwargs: Additional keyword arguments.\n\n    Returns:\n \
      \       AnalyzeLyricsOutput: Object containing outputs for this node.\n    \"\
      \"\"\n    # TODO: Implement this function\n\n    # Return stub output with placeholder\
      \ values\n    return AnalyzeLyricsOutput(\n        unique_words=[],\n      \
      \  word_counts=[],\n    )"
    name: analyze_lyrics
    nodes_depended_on:
    - fetch_song_data
    nodes_dependent_on: []
    output_structure:
    - description: All distinct words found in the lyrics, ordered by descending frequency.
      key: unique_words
      type: List[str]
    - description: Number of occurrences for each word, aligned with unique_words.
      key: word_counts
      type: List[int]
    prd:
      conceptual_info: This node aggregates raw lyrical text into a concise frequency
        table, enabling downstream theme extraction and sentiment analysis.
      docstring:
        examples:
        - lines:
          - song_titles = ['A', 'B']
          - song_lyrics = ['Hello world hello', 'World of code']
          - unique, counts = analyze_lyrics(song_titles, song_lyrics)
          - print(unique)
          - print(counts)
          output: '[''hello'', ''world'', ''of'', ''code'']

            [3, 2, 1, 1]'
        - lines:
          - song_titles = ['Song']
          - song_lyrics = ['I love coding', 'I love coding', 'Coding is fun']
          - unique, counts = analyze_lyrics(song_titles, song_lyrics)
          - print(dict(zip(unique, counts)))
          output: '{''i'': 3, ''love'': 2, ''coding'': 3, ''is'': 1, ''fun'': 1}'
        parameters:
        - description: Parallel list of song titles; provided for context but not
            used in frequency computation.
          name: song_titles
          type: List[str]
        - description: Parallel list of full lyrics corresponding to each song title.
          name: song_lyrics
          type: List[str]
        raises:
        - description: Raised if `song_lyrics` is empty or all entries are blank.
          type: ValueError
        - description: Raised if inputs are not lists of strings.
          type: TypeError
        returns:
          description: A tuple containing the list of unique words sorted by descending
            frequency and a parallel list of their counts.
          type: Tuple[List[str], List[int]]
        summary: Computes the frequency of every unique word across all song lyrics
          and returns the words sorted by decreasing count.
    prompt: Using the parallel lists of titles and lyrics from fetch_song_data, compute
      the set of unique words across all songs and count how many times each appears.
      Return the list of unique words and a parallel list of their counts.
    shims: []
  extract_themes:
    agent: false
    code_node_type: stub
    description: Identify the dominant lyrical themes.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass AnalyzeLyricsOutput(BaseModel):\n    \"\"\"Pydantic model for analyze_lyrics\
      \ node outputs.\"\"\"\n    unique_words: List[str] = Field(..., description=\"\
      All distinct words found in the lyrics, ordered by descending frequency.\")\n\
      \    word_counts: List[int] = Field(..., description=\"Number of occurrences\
      \ for each word, aligned with unique_words.\")\n\n\nclass ExtractThemesOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for extract_themes node outputs.\"\"\"\n    themes:\
      \ List[str] = Field(..., description=\"Top 5 thematic words in descending order\
      \ of frequency.\")\n    theme_scores: List[float] = Field(..., description=\"\
      Normalized frequency score for each theme (count / total word count).\")\n\n\
      \ndef extract_themes(analyze_lyrics_input: AnalyzeLyricsOutput, **kwargs) ->\
      \ ExtractThemesOutput:\n    \"\"\"Identify the dominant lyrical themes.\n\n\
      \    Args:\n        analyze_lyrics_input: Input from the 'analyze_lyrics' node.\n\
      \        **kwargs: Additional keyword arguments.\n\n    Returns:\n        ExtractThemesOutput:\
      \ Object containing outputs for this node.\n    \"\"\"\n    # TODO: Implement\
      \ this function\n\n    # Return stub output with placeholder values\n    return\
      \ ExtractThemesOutput(\n        themes=[],\n        theme_scores=[],\n    )"
    name: extract_themes
    nodes_depended_on:
    - analyze_lyrics
    nodes_dependent_on: []
    output_structure:
    - description: Top 5 thematic words in descending order of frequency.
      key: themes
      type: List[str]
    - description: Normalized frequency score for each theme (count / total word count).
      key: theme_scores
      type: List[float]
    prd:
      conceptual_info: Extracts the five most frequent words from all song lyrics
        and calculates each word’s relative frequency as a normalized score.
      docstring:
        examples:
        - lines:
          - unique_words = ['love', 'heart', 'night', 'dream', 'sky']
          - word_counts = [10, 8, 5, 2, 1]
          - themes, scores = extract_themes(unique_words, word_counts)
          - print(themes)
          - print(scores)
          output: '[''love'', ''heart'', ''night'', ''dream'', ''sky'']\n[0.38461538461538464,
            0.3076923076923077, 0.19230769230769232, 0.07692307692307693, 0.038461538461538464]'
        - lines:
          - unique_words = ['sun', 'rain']
          - word_counts = [10, 5]
          - themes, scores = extract_themes(unique_words, word_counts)
          - print(themes)
          - print(scores)
          output: '[''sun'', ''rain'']\n[0.6666666666666666, 0.3333333333333333]'
        parameters:
        - description: List of unique words sorted by descending frequency.
          name: unique_words
          type: List[str]
        - description: Parallel list of counts corresponding to each word in `unique_words`.
          name: word_counts
          type: List[int]
        raises:
        - description: If `unique_words` and `word_counts` are empty or have mismatched
            lengths.
          type: ValueError
        - description: If the total word count is zero (cannot compute normalized
            scores).
          type: ValueError
        returns:
          description: A tuple containing the top 5 thematic words and a list of their
            normalized scores.
          type: Tuple[List[str], List[float]]
        summary: Selects the top five words by occurrence from lyric word statistics
          and returns them with their normalized frequency scores.
    prompt: From the word frequency data, select the top 5 words by count as main
      themes and compute a normalized score for each (count divided by total word
      count). Return the themes and their scores.
    shims: []
  fetch_song_data:
    agent: false
    code_node_type: stub
    description: Collect basic metadata and lyrics for all Taylor Swift songs.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass FetchSongDataOutput(BaseModel):\n    \"\"\"Pydantic model for fetch_song_data\
      \ node outputs.\"\"\"\n    song_titles: List[str] = Field(..., description=\"\
      List of song titles in the same order as the other lists.\")\n    song_lyrics:\
      \ List[str] = Field(..., description=\"List of full lyrics corresponding to\
      \ each song title.\")\n    release_years: List[int] = Field(..., description=\"\
      List of release years corresponding to each song title.\")\n\n\ndef fetch_song_data(general_input:\
      \ str, **kwargs) -> FetchSongDataOutput:\n    \"\"\"Collect basic metadata and\
      \ lyrics for all Taylor Swift songs.\n\n    Args:\n        general_input: General\
      \ input string for the root node.\n        **kwargs: Additional keyword arguments.\n\
      \n    Returns:\n        FetchSongDataOutput: Object containing outputs for this\
      \ node.\n    \"\"\"\n    # TODO: Implement this function\n\n    # Return stub\
      \ output with placeholder values\n    return FetchSongDataOutput(\n        song_titles=[],\n\
      \        song_lyrics=[],\n        release_years=[],\n    )"
    name: fetch_song_data
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of song titles in the same order as the other lists.
      key: song_titles
      type: List[str]
    - description: List of full lyrics corresponding to each song title.
      key: song_lyrics
      type: List[str]
    - description: List of release years corresponding to each song title.
      key: release_years
      type: List[int]
    prd:
      conceptual_info: Collect basic metadata and lyrics for all Taylor Swift songs.
      docstring:
        examples:
        - lines:
          - result = fetch_song_data()
          - print(result['song_titles'][0])
          output: '"Love Story"'
        - lines:
          - result = fetch_song_data(artist="Taylor Swift")
          - print(len(result['song_titles']))
          output: '"<total number of Taylor Swift songs>"'
        parameters:
        - description: Name of the artist to query. Defaults to "Taylor Swift".
          name: artist
          type: str
        raises:
        - description: If the API request fails or returns an unexpected status code.
          type: ValueError
        - description: If the API response is missing required fields (e.g., title,
            lyrics, or year).
          type: KeyError
        returns:
          description: 'Dictionary containing three keys: `song_titles` (List[str]),
            `song_lyrics` (List[str]), and `release_years` (List[int]). The lists
            are aligned by index.'
          type: dict
        summary: Fetches a list of all Taylor Swift songs along with their full lyrics
          and release years from a public API.
    prompt: Given the artist name "Taylor Swift", retrieve a list of song titles,
      their full lyrics, and release years from a public music or lyrics API. Return
      parallel lists of titles, lyrics, and years.
    shims: []
  generate_summary:
    agent: false
    code_node_type: stub
    description: Produce a human‑readable summary of the findings.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass ExtractThemesOutput(BaseModel):\n    \"\"\"Pydantic model for extract_themes\
      \ node outputs.\"\"\"\n    themes: List[str] = Field(..., description=\"Top\
      \ 5 thematic words in descending order of frequency.\")\n    theme_scores: List[float]\
      \ = Field(..., description=\"Normalized frequency score for each theme (count\
      \ / total word count).\")\n\n\nclass TrendOverTimeOutput(BaseModel):\n    \"\
      \"\"Pydantic model for trend_over_time node outputs.\"\"\"\n    years: List[int]\
      \ = Field(..., description=\"Chronological list of years with songs.\")\n  \
      \  avg_sentiment: List[float] = Field(..., description=\"Average sentiment for\
      \ each year.\")\n\n\nclass GenerateSummaryOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for generate_summary node outputs.\"\"\"\n    summary_text: str = Field(...,\
      \ description=\"Plain\\u2011text summary of the analysis.\")\n\n\ndef generate_summary(extract_themes_input:\
      \ ExtractThemesOutput, trend_over_time_input: TrendOverTimeOutput, **kwargs)\
      \ -> GenerateSummaryOutput:\n    \"\"\"Produce a human‑readable summary of the\
      \ findings.\n\n    Args:\n        extract_themes_input: Input from the 'extract_themes'\
      \ node.\n        trend_over_time_input: Input from the 'trend_over_time' node.\n\
      \        **kwargs: Additional keyword arguments.\n\n    Returns:\n        GenerateSummaryOutput:\
      \ Object containing outputs for this node.\n    \"\"\"\n    # TODO: Implement\
      \ this function\n\n    # Return stub output with placeholder values\n    return\
      \ GenerateSummaryOutput(\n        summary_text=\"\",\n    )"
    name: generate_summary
    nodes_depended_on:
    - extract_themes
    - trend_over_time
    nodes_dependent_on: []
    output_structure:
    - description: Plain‑text summary of the analysis.
      key: summary_text
      type: str
    prd:
      conceptual_info: Generates a short narrative that encapsulates the dominant
        lyrical themes and the sentiment trajectory over the artist's career, highlighting
        any key shifts or anomalies.
      docstring:
        examples:
        - lines:
          - generate_summary(
          - '    themes=["love", "heartbreak", "growth", "rebellion", "dreams"],'
          - '    theme_scores=[0.28, 0.22, 0.18, 0.12, 0.10],'
          - '    years=[2013, 2014, 2015, 2016, 2017],'
          - '    avg_sentiment=[0.15, 0.08, 0.02, -0.04, -0.10]'
          - )
          output: '"The analysis highlights love and heartbreak as the dominant lyrical
            themes, followed by growth, rebellion, and dreams. Sentiment shifts from
            mildly positive in 2013 to increasingly negative by 2017, indicating a
            noticeable downturn in overall lyrical mood during the latter years."

            '
        - lines:
          - generate_summary(
          - '    themes=["hope", "rain", "silence", "journey", "home"],'
          - '    theme_scores=[0.30, 0.20, 0.15, 0.12, 0.10],'
          - '    years=[2012, 2013, 2014],'
          - "    avg_sentiment=[0.05, 0.10, 0.15]\"\n                \")"
          output: '"The prevailing themes are hope, rain, silence, journey, and home.
            The sentiment trend shows a steady improvement from 2012 to 2014, suggesting
            an increasingly optimistic tone over time."

            '
        parameters:
        - description: Top 5 thematic words in descending frequency order.
          name: themes
          type: List[str]
        - description: Normalized frequency score for each corresponding theme (sum
            of all scores should equal 1).
          name: theme_scores
          type: List[float]
        - description: Chronological list of release years for which sentiment averages
            have been computed.
          name: years
          type: List[int]
        - description: Average sentiment score for each year, aligned with the `years`
            list. Scores range from -1 (very negative) to +1 (very positive).
          name: avg_sentiment
          type: List[float]
        raises:
        - description: If `themes` and `theme_scores` lists are of unequal length,
            or if any of the input lists are empty.
          type: ValueError
        - description: If any of the parameters is not of the expected type.
          type: TypeError
        returns:
          description: A single paragraph that lists the top themes, summarizes the
            sentiment trend over time, and notes any significant pattern shifts.
          type: str
        summary: Create a concise paragraph summarizing key lyrical themes and sentiment
          trends.
    prompt: 'Write a concise paragraph summarizing the analysis: list the top themes,
      describe the overall sentiment trend, and note any notable patterns or shifts.'
    shims: []
  sentiment_analysis:
    agent: false
    code_node_type: stub
    description: Compute sentiment for each song.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass FetchSongDataOutput(BaseModel):\n    \"\"\"Pydantic model for fetch_song_data\
      \ node outputs.\"\"\"\n    song_titles: List[str] = Field(..., description=\"\
