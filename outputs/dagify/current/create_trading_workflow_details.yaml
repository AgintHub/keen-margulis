      \ links\")\n    trading_rules_implemented: str = Field(..., description=\"List\
      \ of trading rules implemented in the trading system\")\n\n\ndef configure_trading_system(set_market_environment_input:\
      \ SetMarketEnvironmentOutput, **kwargs) -> ConfigureTradingSystemOutput:\n \
