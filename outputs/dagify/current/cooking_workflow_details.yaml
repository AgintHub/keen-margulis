dag_type: shim
description: A workflow that outlines the steps involved in cooking a meal
name: cooking_workflow
nodes:
  cook_meal:
    agent: false
    code_node_type: shim
    description: Cook the meal according to the planned recipe.
    implementation: "from ._cook_meal.extract_cooking_techniques import extract_cooking_techniques\n\
      from ._cook_meal.validate_cooking_techniques import validate_cooking_techniques\n\
      from ._cook_meal.validate_ingredients_sufficiency import validate_ingredients_sufficiency\n\
      from ._cook_meal.create_cooking_plan import create_cooking_plan\nfrom ._cook_meal.execute_cooking_process\
      \ import execute_cooking_process\nfrom ._cook_meal.finalize_meal_name import\
      \ finalize_meal_name\n\nfrom pydantic import BaseModel, Field\nfrom typing import\
      \ List\n\n\nclass PrepareIngredientsOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for prepare_ingredients node outputs.\"\"\"\n    prepared_ingredients: List[str]\
      \ = (\n        Field(..., description=\"List of prepared ingredients\")\n  \
      \  )\n\n\nclass CookMealOutput(BaseModel):\n    \"\"\"Pydantic model for cook_meal\
      \ node outputs.\"\"\"\n    cooked_meal: str = Field(..., description=\"Name\
      \ of the cooked meal\")\n\n\ndef cook_meal(prepare_ingredients_input: PrepareIngredientsOutput,\
      \ **kwargs) -> CookMealOutput:\n    \"\"\"\n    Cooks a meal using the prepared\
      \ ingredients and identified cooking\n    techniques.\n\n    Parameters\n  \
      \  ----------\n    prepared_ingredients : List[str]\n        List of ingredients\
      \ that have been prepared for cooking.\n    cooking_techniques : List[str]\n\
      \        List of cooking techniques required for the meal, derived from the\n\
      \        meal plan.\n\n    Returns\n    -------\n    str\n        The name of\
      \ the meal that has been cooked.\n\n    Raises\n    ------\n    ValueError\n\
      \        If the prepared ingredients are not sufficient for cooking the meal.\n\
      \    TypeError\n        If the cooking techniques are not provided or are of\
      \ incorrect type.\n\n    Examples\n    --------\n    >>> prepared_ingredients\
      \ = ['chopped onions', 'minced garlic', 'sliced\n    chicken']\n    >>> cooking_techniques\
      \ = ['grilling', 'sauteing']\n    >>> cooked_meal = cook_meal(prepared_ingredients,\
      \ cooking_techniques)\n    'Grilled Chicken'\n\n    \"\"\"\n    cooking_techniques:\
      \ List[str] = extract_cooking_techniques(kwargs=kwargs)\n    validate_cooking_techniques(cooking_techniques=cooking_techniques)\n\
      \    validate_ingredients_sufficiency(prepared_ingredients=prepare_ingredients_input.prepared_ingredients,\
      \ cooking_techniques=cooking_techniques)\n    cooking_plan: dict = create_cooking_plan(prepared_ingredients=prepare_ingredients_input.prepared_ingredients,\
      \ cooking_techniques=cooking_techniques)\n    cooked_result: str = execute_cooking_process(cooking_plan=cooking_plan)\n\
      \    final_meal_name: str = finalize_meal_name(cooked_result=cooked_result)\n\
      \    return CookMealOutput(cooked_meal=final_meal_name)"
    name: cook_meal
    nodes_depended_on:
    - prepare_ingredients
    nodes_dependent_on:
    - serve_meal
    output_structure:
    - description: Name of the cooked meal
      key: cooked_meal
      type: str
    prd:
      conceptual_info: This node is responsible for cooking a meal based on the prepared
        ingredients and previously identified cooking techniques.
      docstring:
        examples:
        - lines:
          - prepared_ingredients = ['chopped onions', 'minced garlic', 'sliced chicken']
          - cooking_techniques = ['grilling', 'sauteing']
          - cooked_meal = cook_meal(prepared_ingredients, cooking_techniques)
          output: '''Grilled Chicken'''
        parameters:
        - description: List of ingredients that have been prepared for cooking.
          name: prepared_ingredients
          type: List[str]
        - description: List of cooking techniques required for the meal, derived from
            the meal plan.
          name: cooking_techniques
          type: List[str]
        raises:
        - description: If the prepared ingredients are not sufficient for cooking
            the meal.
          type: ValueError
        - description: If the cooking techniques are not provided or are of incorrect
            type.
          type: TypeError
        returns:
          description: The name of the meal that has been cooked.
          type: str
        summary: Cooks a meal using the prepared ingredients and identified cooking
          techniques.
    prompt: Cook the meal using the prepared ingredients and identified cooking techniques.
    shims:
    - agent: false
      code_node_type: virtual-stub
      description: Extracts cooking techniques from the provided input string.
      implementation: "from typing import List\n\n\ndef extract_cooking_techniques(kwargs:\
        \ str) -> List[str]:\n    \"\"\"\n    Extracts a list of cooking techniques\
        \ from the input string provided in\n    kwargs.\n\n    Parameters\n    ----------\n\
        \    kwargs : str\n        Input string containing information about cooking\
        \ techniques.\n\n    Returns\n    -------\n    List[str]\n        A list of\
        \ cooking techniques extracted from the input string.\n\n    Raises\n    ------\n\
        \    ValueError\n        If the input string is empty or does not contain\
        \ valid cooking\n        techniques.\n    TypeError\n        If the input\
        \ is not a string.\n\n    Examples\n    --------\n    >>> extract_cooking_techniques(kwargs='Grill\
        \ the chicken, then roast the\n    vegetables.')\n    >>> # Expected output:\
        \ ['Grill', 'roast']\n    ['Grill', 'roast']\n\n    >>> extract_cooking_techniques(kwargs='Boil\
        \ water and then steam the\n    broccoli.')\n    >>> # Expected output: ['Boil',\
        \ 'steam']\n    ['Boil', 'steam']\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: extract_cooking_techniques
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: kwargs
        type: str
      prd:
        conceptual_info: This shim node is responsible for extracting cooking techniques
          from a given input string, which is expected to contain information about
          how to cook a meal.
        docstring:
          examples:
          - lines:
            - extract_cooking_techniques(kwargs='Grill the chicken, then roast the
              vegetables.')
            - '# Expected output: [''Grill'', ''roast'']'
            output: '[''Grill'', ''roast'']'
          - lines:
            - extract_cooking_techniques(kwargs='Boil water and then steam the broccoli.')
            - '# Expected output: [''Boil'', ''steam'']'
            output: '[''Boil'', ''steam'']'
          parameters:
          - description: Input string containing information about cooking techniques.
            name: kwargs
            type: str
          raises:
          - description: If the input string is empty or does not contain valid cooking
              techniques.
            type: ValueError
          - description: If the input is not a string.
            type: TypeError
          returns:
            description: A list of cooking techniques extracted from the input string.
            type: List[str]
          summary: Extracts a list of cooking techniques from the input string provided
            in kwargs.
      prompt: 'Extract cooking techniques from the input: {kwargs}'
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Validates the cooking techniques provided to ensure they are appropriate
        for meal preparation.
      implementation: "def validate_cooking_techniques(cooking_techniques: str) ->\
        \ str:\n    \"\"\"\n    Validates cooking techniques to ensure they are appropriate\
        \ for meal\n    preparation.\n\n    Parameters\n    ----------\n    cooking_techniques\
        \ : str\n        A string containing cooking techniques separated by commas.\n\
        \n    Returns\n    -------\n    str\n        A message indicating whether\
        \ the cooking techniques are valid.\n\n    Raises\n    ------\n    ValueError\n\
        \        When the cooking techniques provided are invalid or not supported.\n\
        \    TypeError\n        When the input type is not a string.\n\n    Examples\n\
        \    --------\n    >>> validate_cooking_techniques(cooking_techniques='roasting,baking')\n\
        \    'Cooking techniques are valid.'\n\n    >>> validate_cooking_techniques(cooking_techniques='invalid_technique')\n\
        \    'ValueError: Invalid cooking technique: invalid_technique'\n\n    \"\"\
        \"\n    raise NotImplementedError(\"This is a virtual stub node that needs\
        \ to be implemented\")"
      name: validate_cooking_techniques
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type Any
        key: output
        type: str
      - description: Input parameter of type str
        key: cooking_techniques
        type: str
      prd:
        conceptual_info: This shim node is responsible for validating cooking techniques
          provided as input to ensure they are valid and appropriate for meal preparation.
        docstring:
          examples:
          - lines:
            - validate_cooking_techniques(cooking_techniques='roasting,baking')
            output: '''Cooking techniques are valid.'''
          - lines:
            - validate_cooking_techniques(cooking_techniques='invalid_technique')
            output: '''ValueError: Invalid cooking technique: invalid_technique'''
          parameters:
          - description: A string containing cooking techniques separated by commas.
            name: cooking_techniques
            type: str
          raises:
          - description: When the cooking techniques provided are invalid or not supported.
            type: ValueError
          - description: When the input type is not a string.
            type: TypeError
          returns:
            description: A message indicating whether the cooking techniques are valid.
            type: str
          summary: Validates cooking techniques to ensure they are appropriate for
            meal preparation.
      prompt: Validate the given cooking techniques.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Validates if the prepared ingredients are sufficient for the given
        cooking techniques.
      implementation: "def validate_ingredients_sufficiency(prepared_ingredients:\
        \ str, cooking_techniques: str) -> str:\n    \"\"\"\n    Validates the sufficiency\
        \ of prepared ingredients for given cooking\n    techniques and returns a\
        \ validation result.\n\n    Parameters\n    ----------\n    prepared_ingredients\
        \ : str\n        A string representing the list of prepared ingredients.\n\
        \    cooking_techniques : str\n        A string representing the list of cooking\
        \ techniques to be applied.\n\n    Returns\n    -------\n    str\n       \
        \ A string indicating whether the prepared ingredients are sufficient\n  \
        \      for the cooking techniques.\n\n    Raises\n    ------\n    ValueError\n\
        \        If the input strings are not in the expected format or if the\n \
        \       ingredients are insufficient.\n    TypeError\n        If the input\
        \ types are not strings.\n\n    Examples\n    --------\n    >>> validate_ingredients_sufficiency(prepared_ingredients='[\"\
        salt\",\n    \"pepper\", \"oil\"]', cooking_techniques='[\"frying\", \"seasoning\"\
        ]')\n    'Ingredients are sufficient.'\n\n    >>> validate_ingredients_sufficiency(prepared_ingredients='[\"\
        salt\"]',\n    cooking_techniques='[\"frying\", \"boiling\"]')\n    'Insufficient\
        \ ingredients for the required cooking techniques.'\n\n    \"\"\"\n    raise\
        \ NotImplementedError(\"This is a virtual stub node that needs to be implemented\"\
        )"
      name: validate_ingredients_sufficiency
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type Any
        key: output
        type: str
      - description: Input parameter of type str
        key: prepared_ingredients
        type: str
      - description: Input parameter of type str
        key: cooking_techniques
        type: str
      prd:
        conceptual_info: This shim node validates the sufficiency of prepared ingredients
          based on the required cooking techniques, playing a crucial role in the
          meal preparation pipeline.
        docstring:
          examples:
          - lines:
            - validate_ingredients_sufficiency(prepared_ingredients='["salt", "pepper",
              "oil"]', cooking_techniques='["frying", "seasoning"]')
            output: '''Ingredients are sufficient.'''
          - lines:
            - validate_ingredients_sufficiency(prepared_ingredients='["salt"]', cooking_techniques='["frying",
              "boiling"]')
            output: '''Insufficient ingredients for the required cooking techniques.'''
          parameters:
          - description: A string representing the list of prepared ingredients.
            name: prepared_ingredients
            type: str
          - description: A string representing the list of cooking techniques to be
              applied.
            name: cooking_techniques
            type: str
          raises:
          - description: If the input strings are not in the expected format or if
              the ingredients are insufficient.
            type: ValueError
          - description: If the input types are not strings.
            type: TypeError
          returns:
            description: A string indicating whether the prepared ingredients are
              sufficient for the cooking techniques.
            type: str
          summary: Validates the sufficiency of prepared ingredients for given cooking
            techniques and returns a validation result.
      prompt: Validate if the prepared ingredients are sufficient for the given cooking
        techniques.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Creates a cooking plan based on prepared ingredients and cooking
        techniques.
      implementation: "def create_cooking_plan(prepared_ingredients: str, cooking_techniques:\
        \ str) -> str:\n    \"\"\"\n    Creates a cooking plan by integrating prepared\
        \ ingredients and cooking\n    techniques into a structured plan.\n\n    Parameters\n\
        \    ----------\n    prepared_ingredients : str\n        A string representation\
        \ of a list of prepared ingredients.\n    cooking_techniques : str\n     \
        \   A string representation of a list of cooking techniques to be\n      \
        \  applied.\n\n    Returns\n    -------\n    str\n        A JSON-formatted\
        \ string representing the cooking plan, including\n        ingredient allocation\
        \ and technique application sequence.\n\n    Raises\n    ------\n    ValueError\n\
        \        If the prepared ingredients or cooking techniques are not in the\n\
        \        expected format.\n    TypeError\n        If the input types are not\
        \ string representations of lists.\n\n    Examples\n    --------\n    >>>\
        \ create_cooking_plan(prepared_ingredients='[\"chicken\", \"rice\",\n    \"\
        vegetables\"]', cooking_techniques='[\"grilling\", \"boiling\"]')\n    \"\
        {'ingredients': ['chicken', 'rice', 'vegetables'], 'techniques':\n    ['grilling',\
        \ 'boiling'], 'plan': ['grill chicken', 'boil rice and\n    vegetables']}\"\
        \n\n    >>> create_cooking_plan(prepared_ingredients='[\"eggs\", \"milk\"\
        , \"flour\"]',\n    cooking_techniques='[\"whisking\", \"frying\"]')\n   \
        \ \"{'ingredients': ['eggs', 'milk', 'flour'], 'techniques': ['whisking',\n\
        \    'frying'], 'plan': ['whisk eggs and milk', 'mix with flour and fry']}\"\
        \n\n    \"\"\"\n    raise NotImplementedError(\"This is a virtual stub node\
        \ that needs to be implemented\")"
      name: create_cooking_plan
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type dict
        key: output
        type: str
      - description: Input parameter of type str
        key: prepared_ingredients
        type: str
      - description: Input parameter of type str
        key: cooking_techniques
        type: str
      prd:
        conceptual_info: This shim generates a cooking plan by combining the prepared
          ingredients and selected cooking techniques, serving as a crucial step in
          the meal preparation process.
        docstring:
          examples:
          - lines:
            - create_cooking_plan(prepared_ingredients='["chicken", "rice", "vegetables"]',
              cooking_techniques='["grilling", "boiling"]')
            output: '"{''ingredients'': [''chicken'', ''rice'', ''vegetables''], ''techniques'':
              [''grilling'', ''boiling''], ''plan'': [''grill chicken'', ''boil rice
              and vegetables'']}"'
          - lines:
            - create_cooking_plan(prepared_ingredients='["eggs", "milk", "flour"]',
              cooking_techniques='["whisking", "frying"]')
            output: '"{''ingredients'': [''eggs'', ''milk'', ''flour''], ''techniques'':
              [''whisking'', ''frying''], ''plan'': [''whisk eggs and milk'', ''mix
              with flour and fry'']}"'
          parameters:
          - description: A string representation of a list of prepared ingredients.
            name: prepared_ingredients
            type: str
          - description: A string representation of a list of cooking techniques to
              be applied.
            name: cooking_techniques
            type: str
          raises:
          - description: If the prepared ingredients or cooking techniques are not
              in the expected format.
            type: ValueError
          - description: If the input types are not string representations of lists.
            type: TypeError
          returns:
            description: A JSON-formatted string representing the cooking plan, including
              ingredient allocation and technique application sequence.
            type: str
          summary: Creates a cooking plan by integrating prepared ingredients and
            cooking techniques into a structured plan.
      prompt: 'Create a cooking plan using the prepared ingredients: {prepared_ingredients}
        and cooking techniques: {cooking_techniques}'
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Executes the cooking process based on the provided cooking plan
        and returns the result.
      implementation: "def execute_cooking_process(cooking_plan: str) -> str:\n  \
        \  \"\"\"\n    Executes the cooking process according to the provided cooking\
        \ plan and\n    returns the result as a string.\n\n    Parameters\n    ----------\n\
        \    cooking_plan : str\n        A string representation of the cooking plan\
        \ that outlines the steps\n        and ingredients needed for cooking.\n\n\
        \    Returns\n    -------\n    str\n        The outcome of the cooking process,\
        \ which could be a description of\n        the cooked meal or any relevant\
        \ status message.\n\n    Raises\n    ------\n    ValueError\n        If the\
        \ cooking plan is invalid or missing essential information.\n    TypeError\n\
        \        If the input cooking plan is not of type string.\n\n    Examples\n\
        \    --------\n    >>> cooking_plan = '{\"recipe\": \"grilled chicken\", \"\
        ingredients\": [\"chicken\",\n    \"salt\", \"pepper\"], \"steps\": [\"marinate\"\
        , \"grill\"]}'\n    >>> result = execute_cooking_process(cooking_plan=cooking_plan)\n\
        \    \"Grilled chicken is ready.\"\n\n    >>> cooking_plan = '{\"recipe\"\
        : \"scrambled eggs\", \"ingredients\": [\"eggs\",\n    \"salt\", \"butter\"\
        ], \"steps\": [\"crack eggs\", \"scramble\"]}'\n    >>> result = execute_cooking_process(cooking_plan=cooking_plan)\n\
        \    \"Scrambled eggs are ready.\"\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: execute_cooking_process
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type str
        key: output
        type: str
      - description: Input parameter of type str
        key: cooking_plan
        type: str
      prd:
        conceptual_info: This shim node represents the execution of a cooking process
          based on a predefined cooking plan. It acts as a bridge between the planning
          stage and the actual cooking execution, encapsulating the complexity of
          cooking.
        docstring:
          examples:
          - lines:
            - 'cooking_plan = ''{"recipe": "grilled chicken", "ingredients": ["chicken",
              "salt", "pepper"], "steps": ["marinate", "grill"]}'''
            - result = execute_cooking_process(cooking_plan=cooking_plan)
            output: '"Grilled chicken is ready."'
          - lines:
            - 'cooking_plan = ''{"recipe": "scrambled eggs", "ingredients": ["eggs",
              "salt", "butter"], "steps": ["crack eggs", "scramble"]}'''
            - result = execute_cooking_process(cooking_plan=cooking_plan)
            output: '"Scrambled eggs are ready."'
          parameters:
          - description: A string representation of the cooking plan that outlines
              the steps and ingredients needed for cooking.
            name: cooking_plan
            type: str
          raises:
          - description: If the cooking plan is invalid or missing essential information.
            type: ValueError
          - description: If the input cooking plan is not of type string.
            type: TypeError
          returns:
            description: The outcome of the cooking process, which could be a description
              of the cooked meal or any relevant status message.
            type: str
          summary: Executes the cooking process according to the provided cooking
            plan and returns the result as a string.
      prompt: Execute the cooking process according to the given cooking plan.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Finalizes the name of the cooked meal based on the cooked result.
      implementation: "def finalize_meal_name(cooked_result: str) -> str:\n    \"\"\
        \"\n    Finalizes the name of the cooked meal based on the input cooked result.\n\
        \n    Parameters\n    ----------\n    cooked_result : str\n        The result\
        \ from the cooking process that needs to be finalized into\n        a meal\
        \ name.\n\n    Returns\n    -------\n    str\n        The finalized name of\
        \ the cooked meal, ready for presentation.\n\n    Raises\n    ------\n   \
        \ ValueError\n        If the cooked result is empty or not a valid string.\n\
        \    TypeError\n        If the input cooked result is not of type string.\n\
        \n    Examples\n    --------\n    >>> finalize_meal_name(cooked_result='Grilled\
        \ chicken with spices')\n    'Spicy Grilled Chicken Delight'\n\n    >>> finalize_meal_name(cooked_result='Vegetable\
        \ stir-fry')\n    'Veggie Stir-Fry'\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: finalize_meal_name
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type str
        key: output
        type: str
      - description: Input parameter of type str
        key: cooked_result
        type: str
      prd:
        conceptual_info: This shim function takes the cooked result from the cooking
          process and generates a final name for the meal, making it presentable and
          identifiable.
        docstring:
          examples:
          - lines:
            - finalize_meal_name(cooked_result='Grilled chicken with spices')
            output: '''Spicy Grilled Chicken Delight'''
          - lines:
            - finalize_meal_name(cooked_result='Vegetable stir-fry')
            output: '''Veggie Stir-Fry'''
          parameters:
          - description: The result from the cooking process that needs to be finalized
              into a meal name.
            name: cooked_result
            type: str
          raises:
          - description: If the cooked result is empty or not a valid string.
            type: ValueError
          - description: If the input cooked result is not of type string.
            type: TypeError
          returns:
            description: The finalized name of the cooked meal, ready for presentation.
            type: str
          summary: Finalizes the name of the cooked meal based on the input cooked
            result.
      prompt: 'Generate a final name for the meal based on the cooking result: ''{cooked_result}'''
      shims: []
  create_shopping_list:
    agent: false
    code_node_type: shim
    description: Generate a shopping list from the meal plan.
    implementation: "from ._create_shopping_list.validate_meal_plan_input import validate_meal_plan_input\n\
      from ._create_shopping_list.extract_ingredients_from_plan import extract_ingredients_from_plan\n\
      from ._create_shopping_list.process_shopping_ingredients import process_shopping_ingredients\n\
      \nfrom pydantic import BaseModel, Field\nfrom typing import List\n\n\nclass\
      \ PlanMealOutput(BaseModel):\n    \"\"\"Pydantic model for plan_meal node outputs.\"\
      \"\"\n    meal_name: str = Field(..., description=\"Name of the meal to be cooked\"\
      )\n    ingredients: str = (\n        Field(..., description=\"List of ingredients\
      \ required for the meal\")\n    )\n    cooking_techniques: str = (\n       \
      \ Field(..., description=\"List of cooking techniques required for the meal\"\
      )\n    )\n\n\nclass CreateShoppingListOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for create_shopping_list node outputs.\"\"\"\n    shopping_list: List[str]\
      \ = (\n        Field(..., description=\"List of ingredients to purchase\")\n\
      \    )\n\n\ndef create_shopping_list(plan_meal_input: PlanMealOutput, **kwargs)\
      \ -> CreateShoppingListOutput:\n    \"\"\"\n    Create a shopping list from\
      \ the meal plan ingredients.\n\n    Parameters\n    ----------\n    meal_plan\
      \ : dict\n        Meal plan details containing ingredients, meal name, and cooking\n\
      \        techniques.\n\n    Returns\n    -------\n    List[str]\n        A list\
      \ of ingredients to purchase for the meal.\n\n    Raises\n    ------\n    KeyError\n\
      \        If 'ingredients' key is missing from the meal plan.\n    TypeError\n\
      \        If the meal plan is not a dictionary or if ingredients is not a\n \
      \       list.\n\n    Examples\n    --------\n    >>> meal_plan = {'meal_name':\
      \ 'Pasta', 'ingredients': ['pasta', 'sauce',\n    'cheese'], 'cooking_techniques':\
      \ ['boiling', 'heating']}\n    >>> shopping_list = create_shopping_list(meal_plan)\n\
      \    >>> print(shopping_list)\n    ['pasta', 'sauce', 'cheese']\n\n    >>> meal_plan\
      \ = {'meal_name': 'Salad', 'ingredients': ['lettuce',\n    'tomatoes', 'cucumber'],\
      \ 'cooking_techniques': []}\n    >>> shopping_list = create_shopping_list(meal_plan)\n\
      \    >>> print(shopping_list)\n    ['lettuce', 'tomatoes', 'cucumber']\n\n \
      \   \"\"\"\n    validated_input: dict = validate_meal_plan_input(meal_plan=plan_meal_input)\n\
      \    ingredients_list: List[str] = extract_ingredients_from_plan(meal_plan=validated_input)\n\
      \    processed_ingredients: List[str] = process_shopping_ingredients(ingredients=ingredients_list)\n\
      \    return CreateShoppingListOutput(shopping_list=processed_ingredients)"
    name: create_shopping_list
    nodes_depended_on:
    - plan_meal
    nodes_dependent_on:
    - purchase_ingredients
