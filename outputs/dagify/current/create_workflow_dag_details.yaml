dag_type: shim
description: Create a typed workflow DAG that achieves the given objective
name: create_workflow_dag
nodes:
  construct_dag:
    agent: false
    code_node_type: shim
    description: Construct the workflow DAG using the decomposed tasks and their dependencies
    implementation: "from ._construct_dag.validate_inputs import validate_inputs\n\
      from ._construct_dag.parse_dependency_map import parse_dependency_map\nfrom\
      \ ._construct_dag.extract_task_list import extract_task_list\nfrom ._construct_dag.validate_dag_consistency\
      \ import validate_dag_consistency\nfrom ._construct_dag.build_dag_edges import\
      \ build_dag_edges\nfrom ._construct_dag.format_digraph import format_digraph\n\
      \nfrom pydantic import BaseModel, Field\nfrom typing import List\n\n\nclass\
      \ IdentifyDependenciesOutput(BaseModel):\n    \"\"\"Pydantic model for identify_dependencies\
      \ node outputs.\"\"\"\n    dependency_map: List[str] = (\n        Field(...,\
      \ description=\"List representing the dependency map between tasks\")\n    )\n\
      \n\nclass DefineNodeOutputsOutput(BaseModel):\n    \"\"\"Pydantic model for\
      \ define_node_outputs node outputs.\"\"\"\n    node_outputs: List[str] = (\n\
      \        Field(..., description=\"List containing output structures for each\
      \ node\")\n    )\n\n\nclass ConstructDagOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for construct_dag node outputs.\"\"\"\n    dag_structure: str = (\n\
      \        Field(..., description=\"The constructed workflow DAG structure\")\n\
      \    )\n\n\ndef construct_dag(identify_dependencies_input: IdentifyDependenciesOutput,\
      \ define_node_outputs_input: DefineNodeOutputsOutput, **kwargs) -> ConstructDagOutput:\n\
      \    \"\"\"\n    Constructs the workflow DAG using the task list, dependency\
      \ map, and node\n    outputs.\n\n    Parameters\n    ----------\n    task_list\
      \ : List[str]\n        List of decomposed tasks or steps derived from the objective.\n\
      \    dependency_map : List[str]\n        List representing the dependency map\
      \ between tasks.\n    node_outputs : List[str]\n        List containing output\
      \ structures for each node.\n\n    Returns\n    -------\n    str\n        The\
      \ constructed workflow DAG structure represented as a string.\n\n    Raises\n\
      \    ------\n    ValueError\n        If the task list, dependency map, or node\
      \ outputs are inconsistent\n        or malformed.\n\n    Examples\n    --------\n\
      \    >>> task_list = ['task1', 'task2', 'task3']\n    >>> dependency_map = [('task1',\
      \ 'task2'), ('task2', 'task3')]\n    >>> node_outputs = [{'task1': 'output1'},\
      \ {'task2': 'output2'}, {'task3':\n    'output3'}]\n    >>> dag_structure =\
      \ construct_dag(task_list, dependency_map, node_outputs)\n    digraph G { task1\
      \ -> task2; task2 -> task3; }\n\n    >>> task_list = ['A', 'B', 'C']\n    >>>\
      \ dependency_map = [('A', 'B'), ('B', 'C')]\n    >>> node_outputs = [{'A': 'resultA'},\
      \ {'B': 'resultB'}, {'C': 'resultC'}]\n    >>> dag_structure = construct_dag(task_list,\
      \ dependency_map, node_outputs)\n    digraph G { A -> B; B -> C; }\n\n    \"\
      \"\"\n    dependency_map = identify_dependencies_input.dependency_map\n    node_outputs\
      \ = define_node_outputs_input.node_outputs\n    \n    validate_inputs(dependency_map=dependency_map,\
      \ node_outputs=node_outputs)\n    \n    parsed_dependencies: List[tuple] = parse_dependency_map(dependency_map=dependency_map)\n\
      \    task_list: List[str] = extract_task_list(dependency_map=dependency_map,\
      \ node_outputs=node_outputs)\n    \n    validate_dag_consistency(task_list=task_list,\
      \ dependencies=parsed_dependencies, node_outputs=node_outputs)\n    \n    dag_edges:\
      \ List[str] = build_dag_edges(dependencies=parsed_dependencies)\n    dag_structure:\
      \ str = format_digraph(edges=dag_edges)\n    \n    return ConstructDagOutput(dag_structure=dag_structure)"
    name: construct_dag
    nodes_depended_on:
    - identify_dependencies
    - define_node_outputs
    nodes_dependent_on: []
    output_structure:
    - description: The constructed workflow DAG structure
      key: dag_structure
      type: str
    prd:
      conceptual_info: This node constructs a Directed Acyclic Graph (DAG) representing
        the workflow based on the decomposed tasks, their dependencies, and output
        structures.
      docstring:
        examples:
        - lines:
          - task_list = ['task1', 'task2', 'task3']
          - dependency_map = [('task1', 'task2'), ('task2', 'task3')]
          - 'node_outputs = [{''task1'': ''output1''}, {''task2'': ''output2''}, {''task3'':
            ''output3''}]'
          - dag_structure = construct_dag(task_list, dependency_map, node_outputs)
          output: digraph G { task1 -> task2; task2 -> task3; }
        - lines:
          - task_list = ['A', 'B', 'C']
          - dependency_map = [('A', 'B'), ('B', 'C')]
          - 'node_outputs = [{''A'': ''resultA''}, {''B'': ''resultB''}, {''C'': ''resultC''}]'
          - dag_structure = construct_dag(task_list, dependency_map, node_outputs)
          output: digraph G { A -> B; B -> C; }
        parameters:
        - description: List of decomposed tasks or steps derived from the objective.
          name: task_list
          type: List[str]
        - description: List representing the dependency map between tasks.
          name: dependency_map
          type: List[str]
        - description: List containing output structures for each node.
          name: node_outputs
          type: List[str]
        raises:
        - description: If the task list, dependency map, or node outputs are inconsistent
            or malformed.
          type: ValueError
        returns:
          description: The constructed workflow DAG structure represented as a string.
          type: str
        summary: Constructs the workflow DAG using the task list, dependency map,
          and node outputs.
    prompt: Use the task list, dependency map, and node outputs to construct the workflow
      DAG
    shims:
    - agent: false
      code_node_type: virtual-stub
      description: Validates the inputs for constructing a DAG, checking dependency
        map and node outputs for correctness.
      implementation: "def validate_inputs(dependency_map: str, node_outputs: str)\
        \ -> str:\n    \"\"\"\n    Validates the dependency map and node outputs for\
        \ DAG construction.\n\n    Parameters\n    ----------\n    dependency_map\
        \ : str\n        A string representing the dependency map between tasks.\n\
        \    node_outputs : str\n        A string containing output structures for\
        \ each node.\n\n    Returns\n    -------\n    str\n        A string indicating\
        \ the result of the validation.\n\n    Raises\n    ------\n    ValueError\n\
        \        If the dependency map or node outputs are invalid or inconsistent.\n\
        \    TypeError\n        If the input types are incorrect.\n\n    Examples\n\
        \    --------\n    >>> validate_inputs(dependency_map='task1:task2,task3',\n\
        \    node_outputs='task1:out1,task2:out2')\n    >>> print(output)\n    'Validation\
        \ successful'\n\n    >>> validate_inputs(dependency_map='invalid_map', node_outputs='task1:out1')\n\
        \    >>> print(output)\n    'Validation failed: Invalid dependency map'\n\n\
        \    \"\"\"\n    raise NotImplementedError(\"This is a virtual stub node that\
        \ needs to be implemented\")"
      name: validate_inputs
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type Any
        key: output
        type: str
      - description: Input parameter of type str
        key: dependency_map
        type: str
      - description: Input parameter of type str
        key: node_outputs
        type: str
      prd:
        conceptual_info: This shim node is responsible for validating the inputs required
          for constructing a Directed Acyclic Graph (DAG). It checks the dependency
          map and node outputs to ensure they are correctly formatted and consistent.
        docstring:
          examples:
          - lines:
            - validate_inputs(dependency_map='task1:task2,task3', node_outputs='task1:out1,task2:out2')
            - print(output)
            output: '''Validation successful'''
          - lines:
            - validate_inputs(dependency_map='invalid_map', node_outputs='task1:out1')
            - print(output)
            output: '''Validation failed: Invalid dependency map'''
          parameters:
          - description: A string representing the dependency map between tasks.
            name: dependency_map
            type: str
          - description: A string containing output structures for each node.
            name: node_outputs
            type: str
          raises:
          - description: If the dependency map or node outputs are invalid or inconsistent.
            type: ValueError
          - description: If the input types are incorrect.
            type: TypeError
          returns:
            description: A string indicating the result of the validation.
            type: str
          summary: Validates the dependency map and node outputs for DAG construction.
      prompt: Validate the inputs for DAG construction
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Parses a given dependency map string into a list of tuples representing
        task dependencies.
      implementation: "from typing import List\n\n\ndef parse_dependency_map(dependency_map:\
        \ str) -> List[str]:\n    \"\"\"\n    Parses a dependency map string into\
        \ a list of tuples, where each tuple\n    represents a dependency between\
        \ tasks.\n\n    Parameters\n    ----------\n    dependency_map : str\n   \
        \     A string representing the dependency map between tasks.\n\n    Returns\n\
        \    -------\n    List[tuple]\n        A list of tuples, where each tuple\
        \ contains information about task\n        dependencies.\n\n    Raises\n \
        \   ------\n    ValueError\n        If the input dependency map string is\
        \ malformed or cannot be parsed.\n    TypeError\n        If the input is not\
        \ a string.\n\n    Examples\n    --------\n    >>> dependency_map_str = 'task1:task2,task3;task2:task4'\n\
        \    >>> parsed_dependencies =\n    parse_dependency_map(dependency_map=dependency_map_str)\n\
        \    [('task1', ['task2', 'task3']), ('task2', ['task4'])]\n\n    >>> dependency_map_str\
        \ = 'A:B,C;B:D'\n    >>> parsed_dependencies =\n    parse_dependency_map(dependency_map=dependency_map_str)\n\
        \    [('A', ['B', 'C']), ('B', ['D'])]\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: parse_dependency_map
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[tuple]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: dependency_map
        type: str
      prd:
        conceptual_info: This shim function is crucial for converting a string representation
          of task dependencies into a structured format that can be used for constructing
          a Directed Acyclic Graph (DAG) in workflow management systems.
        docstring:
          examples:
          - lines:
            - dependency_map_str = 'task1:task2,task3;task2:task4'
            - parsed_dependencies = parse_dependency_map(dependency_map=dependency_map_str)
            output: '[(''task1'', [''task2'', ''task3'']), (''task2'', [''task4''])]'
          - lines:
            - dependency_map_str = 'A:B,C;B:D'
            - parsed_dependencies = parse_dependency_map(dependency_map=dependency_map_str)
            output: '[(''A'', [''B'', ''C'']), (''B'', [''D''])]'
          parameters:
          - description: A string representing the dependency map between tasks.
            name: dependency_map
            type: str
          raises:
          - description: If the input dependency map string is malformed or cannot
              be parsed.
            type: ValueError
          - description: If the input is not a string.
            type: TypeError
          returns:
            description: A list of tuples, where each tuple contains information about
              task dependencies.
            type: List[tuple]
          summary: Parses a dependency map string into a list of tuples, where each
            tuple represents a dependency between tasks.
      prompt: Typed node for shim parse_dependency_map
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Extracts a list of tasks from the given dependency map and node
        outputs.
      implementation: "from typing import List\n\n\ndef extract_task_list(dependency_map:\
        \ str, node_outputs: str) -> List[str]:\n    \"\"\"\n    Extracts a list of\
        \ tasks from the given dependency map and node outputs.\n\n    Parameters\n\
        \    ----------\n    dependency_map : str\n        A string representing the\
        \ dependency map between tasks.\n    node_outputs : str\n        A string\
        \ containing output structures for each node.\n\n    Returns\n    -------\n\
        \    List[str]\n        A list of task names extracted from the dependency\
        \ map and node\n        outputs.\n\n    Raises\n    ------\n    ValueError\n\
        \        If the input dependency map or node outputs are invalid or\n    \
        \    malformed.\n    TypeError\n        If the input types are not as expected\
        \ (e.g., not strings).\n\n    Examples\n    --------\n    >>> dependency_map\
        \ = 'task1:task2,task3;task2:task4'\n    >>> node_outputs = 'task1:out1;task2:out2;task3:out3'\n\
        \    >>> extract_task_list(dependency_map=dependency_map,\n    node_outputs=node_outputs)\n\
        \    ['task1', 'task2', 'task3', 'task4']\n\n    >>> dependency_map = 'A:B,C;B:D'\n\
        \    >>> node_outputs = 'A:1;B:2;C:3;D:4'\n    >>> extract_task_list(dependency_map=dependency_map,\n\
        \    node_outputs=node_outputs)\n    ['A', 'B', 'C', 'D']\n\n    \"\"\"\n\
        \    raise NotImplementedError(\"This is a virtual stub node that needs to\
        \ be implemented\")"
      name: extract_task_list
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: dependency_map
        type: str
      - description: Input parameter of type str
        key: node_outputs
        type: str
      prd:
        conceptual_info: This shim is responsible for extracting a list of tasks based
          on the dependency map and node outputs provided.
        docstring:
          examples:
          - lines:
            - dependency_map = 'task1:task2,task3;task2:task4'
            - node_outputs = 'task1:out1;task2:out2;task3:out3'
            - extract_task_list(dependency_map=dependency_map, node_outputs=node_outputs)
            output: '[''task1'', ''task2'', ''task3'', ''task4'']'
          - lines:
            - dependency_map = 'A:B,C;B:D'
            - node_outputs = 'A:1;B:2;C:3;D:4'
            - extract_task_list(dependency_map=dependency_map, node_outputs=node_outputs)
            output: '[''A'', ''B'', ''C'', ''D'']'
          parameters:
          - description: A string representing the dependency map between tasks.
            name: dependency_map
            type: str
          - description: A string containing output structures for each node.
            name: node_outputs
            type: str
          raises:
          - description: If the input dependency map or node outputs are invalid or
              malformed.
            type: ValueError
          - description: If the input types are not as expected (e.g., not strings).
            type: TypeError
          returns:
            description: A list of task names extracted from the dependency map and
              node outputs.
            type: List[str]
          summary: Extracts a list of tasks from the given dependency map and node
            outputs.
      prompt: Extract a task list based on the provided dependency map and node outputs.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Validates the consistency of a Directed Acyclic Graph (DAG) given
        task list, dependencies, and node outputs.
      implementation: "def validate_dag_consistency(task_list: str, dependencies:\
        \ str, node_outputs: str) -> str:\n    \"\"\"\n    Validates the DAG consistency\
        \ by checking if the task list, dependencies,\n    and node outputs are coherent.\n\
        \n    Parameters\n    ----------\n    task_list : str\n        A string representing\
        \ the list of tasks in the DAG.\n    dependencies : str\n        A string\
        \ representing the dependencies between tasks in the DAG.\n    node_outputs\
        \ : str\n        A string representing the outputs of each node in the DAG.\n\
        \n    Returns\n    -------\n    str\n        A string indicating whether the\
        \ DAG is consistent. Returns 'DAG is\n        consistent' if valid, otherwise\
        \ raises an exception.\n\n    Raises\n    ------\n    ValueError\n       \
        \ If the task list, dependencies, or node outputs are invalid or\n       \
        \ inconsistent.\n    TypeError\n        If the input types are not as expected\
        \ (e.g., not strings).\n\n    Examples\n    --------\n    >>> validate_dag_consistency(task_list='task1,task2,task3',\n\
        \    dependencies='task1->task2,task2->task3',\n    node_outputs='task1:out1,task2:out2,task3:out3')\n\
        \    'DAG is consistent'\n\n    >>> validate_dag_consistency(task_list='task1,task2',\n\
        \    dependencies='task1->task2,task2->task3',\n    node_outputs='task1:out1,task2:out2')\n\
        \    ValueError: Inconsistent DAG structure detected.\n\n    \"\"\"\n    raise\
        \ NotImplementedError(\"This is a virtual stub node that needs to be implemented\"\
        )"
      name: validate_dag_consistency
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type Any
        key: output
        type: str
      - description: Input parameter of type str
        key: task_list
        type: str
      - description: Input parameter of type str
        key: dependencies
        type: str
      - description: Input parameter of type str
        key: node_outputs
        type: str
      prd:
        conceptual_info: This shim node plays a crucial role in ensuring the integrity
          of the DAG structure by validating its consistency against the provided
          task list, dependencies, and node outputs.
        docstring:
          examples:
          - lines:
            - validate_dag_consistency(task_list='task1,task2,task3', dependencies='task1->task2,task2->task3',
              node_outputs='task1:out1,task2:out2,task3:out3')
            output: '''DAG is consistent'''
          - lines:
            - validate_dag_consistency(task_list='task1,task2', dependencies='task1->task2,task2->task3',
              node_outputs='task1:out1,task2:out2')
            output: 'ValueError: Inconsistent DAG structure detected.'
          parameters:
          - description: A string representing the list of tasks in the DAG.
            name: task_list
            type: str
          - description: A string representing the dependencies between tasks in the
              DAG.
            name: dependencies
            type: str
          - description: A string representing the outputs of each node in the DAG.
            name: node_outputs
            type: str
          raises:
          - description: If the task list, dependencies, or node outputs are invalid
              or inconsistent.
            type: ValueError
          - description: If the input types are not as expected (e.g., not strings).
            type: TypeError
          returns:
            description: A string indicating whether the DAG is consistent. Returns
              'DAG is consistent' if valid, otherwise raises an exception.
            type: str
          summary: Validates the DAG consistency by checking if the task list, dependencies,
            and node outputs are coherent.
      prompt: Validate the consistency of the DAG structure with the given task list,
        dependencies, and node outputs.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: This shim node generates a list of edges representing the DAG structure
        based on the provided dependencies.
      implementation: "from typing import List\n\n\ndef build_dag_edges(dependencies:\
        \ str) -> List[str]:\n    \"\"\"\n    Generates a list of edges for the DAG\
        \ based on the provided dependencies.\n\n    Parameters\n    ----------\n\
        \    dependencies : List[tuple]\n        A list of tuples representing the\
        \ dependencies between tasks.\n\n    Returns\n    -------\n    List[str]\n\
        \        A list of strings representing the edges in the DAG, where each edge\n\
        \        is in the format 'task1 -> task2'.\n\n    Raises\n    ------\n  \
        \  ValueError\n        If the dependencies are malformed or inconsistent.\n\
        \    TypeError\n        If the input dependencies are not a list of tuples.\n\
        \n    Examples\n    --------\n    >>> dependencies = [('A', 'B'), ('B', 'C'),\
        \ ('A', 'C')]\n    >>> dag_edges = build_dag_edges(dependencies=dependencies)\n\
        \    ['A -> B', 'B -> C', 'A -> C']\n\n    >>> dependencies = [('task1', 'task2'),\
        \ ('task2', 'task3')]\n    >>> dag_edges = build_dag_edges(dependencies=dependencies)\n\
        \    ['task1 -> task2', 'task2 -> task3']\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: build_dag_edges
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: dependencies
        type: str
      prd:
        conceptual_info: The build_dag_edges shim is crucial for constructing the
          Directed Acyclic Graph (DAG) structure by generating edges based on task
          dependencies.
        docstring:
          examples:
          - lines:
            - dependencies = [('A', 'B'), ('B', 'C'), ('A', 'C')]
            - dag_edges = build_dag_edges(dependencies=dependencies)
            output: '[''A -> B'', ''B -> C'', ''A -> C'']'
          - lines:
            - dependencies = [('task1', 'task2'), ('task2', 'task3')]
            - dag_edges = build_dag_edges(dependencies=dependencies)
            output: '[''task1 -> task2'', ''task2 -> task3'']'
          parameters:
          - description: A list of tuples representing the dependencies between tasks.
            name: dependencies
            type: List[tuple]
          raises:
          - description: If the dependencies are malformed or inconsistent.
            type: ValueError
          - description: If the input dependencies are not a list of tuples.
            type: TypeError
          returns:
            description: A list of strings representing the edges in the DAG, where
              each edge is in the format 'task1 -> task2'.
            type: List[str]
          summary: Generates a list of edges for the DAG based on the provided dependencies.
      prompt: 'Description: Typed node for shim build_dag_edges'
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Formats the given edges into a digraph structure.
      implementation: "def format_digraph(edges: str) -> str:\n    \"\"\"\n    Formats\
        \ the given edges into a digraph structure represented as a string.\n\n  \
        \  Parameters\n    ----------\n    edges : str\n        A string representing\
        \ the edges of the digraph, expected to be in a\n        format that can be\
        \ processed into a digraph structure.\n\n    Returns\n    -------\n    str\n\
        \        A string representing the formatted digraph structure.\n\n    Raises\n\
        \    ------\n    ValueError\n        If the input edges cannot be properly\
        \ formatted into a digraph.\n    TypeError\n        If the input edges are\
        \ not of the expected type.\n\n    Examples\n    --------\n    >>> format_digraph(edges='A->B;B->C')\n\
        \    'digraph { A -> B; B -> C }'\n\n    >>> format_digraph(edges='X->Y;Y->Z;Z->X')\n\
        \    'digraph { X -> Y; Y -> Z; Z -> X }'\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: format_digraph
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type str
        key: output
        type: str
      - description: Input parameter of type str
        key: edges
        type: str
      prd:
        conceptual_info: This shim function is responsible for taking a list of edges
          representing a directed graph and formatting them into a string that represents
          the digraph structure.
        docstring:
          examples:
          - lines:
            - format_digraph(edges='A->B;B->C')
            output: '''digraph { A -> B; B -> C }'''
          - lines:
            - format_digraph(edges='X->Y;Y->Z;Z->X')
            output: '''digraph { X -> Y; Y -> Z; Z -> X }'''
          parameters:
          - description: A string representing the edges of the digraph, expected
              to be in a format that can be processed into a digraph structure.
            name: edges
            type: str
          raises:
          - description: If the input edges cannot be properly formatted into a digraph.
            type: ValueError
          - description: If the input edges are not of the expected type.
            type: TypeError
          returns:
            description: A string representing the formatted digraph structure.
            type: str
          summary: Formats the given edges into a digraph structure represented as
            a string.
      prompt: Typed node for shim format_digraph
      shims: []
  decompose_objective:
    agent: false
    code_node_type: shim
    description: Decompose the objective into smaller, manageable tasks or steps
    implementation: "from ._decompose_objective.validate_objective_input import validate_objective_input\n\
      from ._decompose_objective.parse_objective_structure import parse_objective_structure\n\
      from ._decompose_objective.generate_task_breakdown import generate_task_breakdown\n\
      from ._decompose_objective.refine_and_order_tasks import refine_and_order_tasks\n\
      \nfrom pydantic import BaseModel, Field\nfrom typing import List\n\n\nclass\
      \ DefineObjectiveOutput(BaseModel):\n    \"\"\"Pydantic model for define_objective\
      \ node outputs.\"\"\"\n    objective: str = (\n        Field(..., description=\"\
