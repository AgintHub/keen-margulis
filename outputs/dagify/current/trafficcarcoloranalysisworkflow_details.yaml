          name: vehicle_confidence_scores
          type: List[float]
        raises:
        - description: If the input lists (vehicle_colors and vehicle_confidence_scores)
            are of different lengths.
          type: ValueError
        - description: If the input types are not as expected (List[str] for vehicle_colors
            and List[float] for vehicle_confidence_scores).
          type: TypeError
        returns:
          description: A tuple containing the frequency of each observed vehicle color,
            the list of most common vehicle colors observed, and statistical measures
            (mean, median, std dev) of color distribution.
          type: Tuple[List[float], List[str], List[float]]
        summary: Analyze vehicle color distribution from extracted vehicle data.
    prompt: Calculate the frequency and distribution of different vehicle colors observed.
      Identify the most common colors and any patterns.
