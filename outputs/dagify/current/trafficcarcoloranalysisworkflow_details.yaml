        colors, and providing statistical measures of the color distribution.
      docstring:
        examples:
        - lines:
          - vehicle_colors = ['red', 'blue', 'red', 'green', 'blue', 'blue']
          - vehicle_confidence_scores = [0.8, 0.9, 0.7, 0.6, 0.95, 0.85]
          - color_frequencies, most_common_colors, color_distribution_stats = analyze_color_distribution(vehicle_colors,
            vehicle_confidence_scores)
          output: ([0.3333333333333333, 0.5, 0.16666666666666666], ['blue'], [0.8166666666666667,
            0.875, 0.10246950860768163])
        - lines:
          - vehicle_colors = ['black', 'white', 'black', 'white', 'black']
          - vehicle_confidence_scores = [0.9, 0.8, 0.85, 0.7, 0.95]
          - color_frequencies, most_common_colors, color_distribution_stats = analyze_color_distribution(vehicle_colors,
            vehicle_confidence_scores)
          output: ([0.6, 0.4], ['black'], [0.8833333333333333, 0.9, 0.08164965809277261])
        parameters:
        - description: List of detected vehicle colors from the extract_vehicle_data_from_images
            node.
          name: vehicle_colors
          type: List[str]
        - description: Confidence scores for the detected vehicle colors (same order
