dag_type: shim
description: Analyze traffic car colors during rush hour to identify common colors
  and patterns
name: trafficcarcoloranalysisworkflow
nodes:
  analyze_color_distribution:
    agent: false
    code_node_type: shim
    description: Analyze the distribution of vehicle colors observed during rush hour
    implementation: "from ._analyze_color_distribution.validate_input_lengths import\
      \ validate_input_lengths\nfrom ._analyze_color_distribution.validate_input_types\
      \ import validate_input_types\nfrom ._analyze_color_distribution.get_unique_colors\
      \ import get_unique_colors\nfrom ._analyze_color_distribution.count_color_occurrences\
      \ import count_color_occurrences\nfrom ._analyze_color_distribution.calculate_frequencies\
      \ import calculate_frequencies\nfrom ._analyze_color_distribution.find_most_common_colors\
      \ import find_most_common_colors\nfrom ._analyze_color_distribution.calculate_mean\
      \ import calculate_mean\nfrom ._analyze_color_distribution.calculate_median\
      \ import calculate_median\nfrom ._analyze_color_distribution.calculate_std_deviation\
      \ import calculate_std_deviation\n\nfrom pydantic import BaseModel, Field\n\
      from typing import List\n\n\nclass ExtractVehicleDataFromImagesOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for extract_vehicle_data_from_images node outputs.\"\
      \"\"\n    vehicle_colors: List[str] = (\n        Field(..., description=\"List\
      \ of detected vehicle colors\")\n    )\n    vehicle_confidence_scores: List[float]\
      \ = (\n        Field(..., description=\"Confidence scores for the detected vehicle\
      \ colors (same order as vehicle_colors)\")\n    )\n\n\nclass AnalyzeColorDistributionOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for analyze_color_distribution node outputs.\"\"\"\
      \n    color_frequencies: List[float] = (\n        Field(..., description=\"\
      Frequency of each observed vehicle color\")\n    )\n    most_common_colors:\
      \ List[str] = (\n        Field(..., description=\"List of most common vehicle\
      \ colors observed\")\n    )\n    color_distribution_stats: List[float] = (\n\
      \        Field(..., description=\"Statistical measures (mean, median, std dev)\
      \ of color distribution\")\n    )\n\n\ndef analyze_color_distribution(extract_vehicle_data_from_images_input:\
      \ ExtractVehicleDataFromImagesOutput, **kwargs) -> AnalyzeColorDistributionOutput:\n\
      \    \"\"\"\n    Analyze vehicle color distribution from extracted vehicle data.\n\
      \n    Parameters\n    ----------\n    vehicle_colors : List[str]\n        List\
      \ of detected vehicle colors from the\n        extract_vehicle_data_from_images\
      \ node.\n    vehicle_confidence_scores : List[float]\n        Confidence scores\
      \ for the detected vehicle colors (same order as\n        vehicle_colors).\n\
      \n    Returns\n    -------\n    Tuple[List[float], List[str], List[float]]\n\
      \        A tuple containing the frequency of each observed vehicle color, the\n\
      \        list of most common vehicle colors observed, and statistical\n    \
      \    measures (mean, median, std dev) of color distribution.\n\n    Raises\n\
      \    ------\n    ValueError\n        If the input lists (vehicle_colors and\
      \ vehicle_confidence_scores)\n        are of different lengths.\n    TypeError\n\
      \        If the input types are not as expected (List[str] for vehicle_colors\n\
      \        and List[float] for vehicle_confidence_scores).\n\n    Examples\n \
      \   --------\n    >>> vehicle_colors = ['red', 'blue', 'red', 'green', 'blue',\
      \ 'blue']\n    >>> vehicle_confidence_scores = [0.8, 0.9, 0.7, 0.6, 0.95, 0.85]\n\
      \    >>> color_frequencies, most_common_colors, color_distribution_stats =\n\
      \    analyze_color_distribution(vehicle_colors, vehicle_confidence_scores)\n\
      \    ([0.3333333333333333, 0.5, 0.16666666666666666], ['blue'],\n    [0.8166666666666667,\
      \ 0.875, 0.10246950860768163])\n\n    >>> vehicle_colors = ['black', 'white',\
      \ 'black', 'white', 'black']\n    >>> vehicle_confidence_scores = [0.9, 0.8,\
      \ 0.85, 0.7, 0.95]\n    >>> color_frequencies, most_common_colors, color_distribution_stats\
      \ =\n    analyze_color_distribution(vehicle_colors, vehicle_confidence_scores)\n\
      \    ([0.6, 0.4], ['black'], [0.8833333333333333, 0.9, 0.08164965809277261])\n\
      \n    \"\"\"\n    vehicle_colors = extract_vehicle_data_from_images_input.vehicle_colors\n\
      \    vehicle_confidence_scores = extract_vehicle_data_from_images_input.vehicle_confidence_scores\n\
      \    \n    validate_input_lengths(colors=vehicle_colors, scores=vehicle_confidence_scores)\n\
      \    validate_input_types(colors=vehicle_colors, scores=vehicle_confidence_scores)\n\
      \    \n    unique_colors: List[str] = get_unique_colors(colors=vehicle_colors)\n\
      \    color_counts: List[int] = count_color_occurrences(colors=vehicle_colors,\
      \ unique_colors=unique_colors)\n    color_frequencies: List[float] = calculate_frequencies(counts=color_counts,\
      \ total=len(vehicle_colors))\n    \n    most_common_colors: List[str] = find_most_common_colors(unique_colors=unique_colors,\
      \ counts=color_counts)\n    \n    mean_score: float = calculate_mean(scores=vehicle_confidence_scores)\n\
      \    median_score: float = calculate_median(scores=vehicle_confidence_scores)\n\
      \    std_dev_score: float = calculate_std_deviation(scores=vehicle_confidence_scores)\n\
      \    color_distribution_stats: List[float] = [mean_score, median_score, std_dev_score]\n\
      \    \n    return AnalyzeColorDistributionOutput(\n        color_frequencies=color_frequencies,\n\
      \        most_common_colors=most_common_colors,\n        color_distribution_stats=color_distribution_stats\n\
      \    )"
    name: analyze_color_distribution
    nodes_depended_on:
    - extract_vehicle_data_from_images
    nodes_dependent_on: []
    output_structure:
    - description: Frequency of each observed vehicle color
