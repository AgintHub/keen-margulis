      \    >>> league_names = list_major_leagues(selected_sport=\"basketball\")\n\
      \    [\"NBA\", \"EuroLeague\", \"NBL\", \"CBA\", \"Liga ACB\"]\n\n    >>> league_names\
      \ = list_major_leagues(selected_sport=\"soccer\")\n    [\"Premier League\",\
      \ \"La Liga\", \"Bundesliga\", \"Serie A\", \"Ligue 1\"]\n\n    \"\"\"\n   \
      \ return ListMajorLeaguesOutput(\n        league_names=[],\n    )"
