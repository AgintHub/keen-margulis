          - print(result['sport_type'])
          - print(result['rationale'])
          output: '''individual''

            ''Tennis is played by one or two players competing against each other,
            making it an individual sport.'''
        parameters:
        - description: The name of the sport identified by the parent node.
          name: selected_sport
          type: str
        raises:
        - description: If `selected_sport` is empty or not recognized.
          type: ValueError
        returns:
          description: A dictionary containing `sport_type` and `rationale` keys.
          type: Dict[str, str]
        summary: Determines whether a sport is team-based or individual.
    prompt: Decide whether the identified sport is team-based or individual. Provide
      a one-sentence rationale.
    shims: []
  gather_sport_info:
    agent: false
    code_node_type: stub
    description: Gather general information about the identified sport
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass IdentifySportOutput(BaseModel):\n    \"\"\"Pydantic model for identify_sport\
      \ node outputs.\"\"\"\n    selected_sport: str = (\n        Field(..., description=\"\
      The name of the sport identified or specified by the user\")\n    )\n\n\nclass\
      \ GatherSportInfoOutput(BaseModel):\n    \"\"\"Pydantic model for gather_sport_info\
      \ node outputs.\"\"\"\n    rules: List[str] = (\n        Field(..., description=\"\
      List of key rules governing the sport\")\n    )\n    popular_leagues: List[str]\
      \ = (\n        Field(..., description=\"List of major professional leagues associated\
      \ with the sport\")\n    )\n    major_tournaments: List[str] = (\n        Field(...,\
      \ description=\"List of major international tournaments or competitions for\
      \ the sport\")\n    )\n\n\ndef gather_sport_info(identify_sport_input: IdentifySportOutput,\
      \ **kwargs) -> GatherSportInfoOutput:\n    \"\"\"\n    Gather general information\
      \ about the identified sport.\n\n    Parameters\n    ----------\n    selected_sport\
      \ : str\n        The name of the sport identified by the user, e.g., 'soccer',\n\
      \        'basketball', 'tennis'.\n\n    Returns\n    -------\n    dict\n   \
      \     A dictionary with three keys:   * rules (List[str]) – key rules\n    \
      \    governing the sport.   * popular_leagues (List[str]) – major\n        professional\
      \ leagues.   * major_tournaments (List[str]) – major\n        international\
      \ tournaments.\n\n    Raises\n    ------\n    ValueError\n        If `selected_sport`\
      \ is empty or not recognized in the knowledge\n        base.\n\n    Examples\n\
      \    --------\n    >>> gather_sport_info('soccer')\n    {\n      'rules': [\n\
      \        'Players may not use their hands except the goalkeeper.',\n       \
      \ 'Each team has 11 players on the field.',\n        'A match lasts 90 minutes\
      \ with two 45‑minute halves.'\n      ],\n      'popular_leagues': [\n      \
      \  'Premier League',\n        'La Liga',\n        'Bundesliga',\n        'Serie\
      \ A'\n      ],\n      'major_tournaments': [\n        'FIFA World Cup',\n  \
      \      'UEFA Champions League',\n        'Copa América'\n      ]\n    }\n\n\
      \    >>> gather_sport_info('basketball')\n    {\n      'rules': [\n        'Each\
      \ team has five players on the court.',\n        'The game is played in four\
      \ 12‑minute quarters.',\n        'Players must advance the ball by dribbling\
      \ or passing.'\n      ],\n      'popular_leagues': [\n        'NBA',\n     \
      \   'EuroLeague',\n        'NBL'\n      ],\n      'major_tournaments': [\n \
      \       'NBA Finals',\n        'FIBA World Cup',\n        'Olympic Games Basketball'\
      \ \n      ]\n    }\n\n    \"\"\"\n    return GatherSportInfoOutput(\n      \
      \  rules=[],\n        popular_leagues=[],\n        major_tournaments=[],\n \
      \   )"
    name: gather_sport_info
    nodes_depended_on:
    - identify_sport
    nodes_dependent_on: []
    output_structure:
    - description: List of key rules governing the sport
      key: rules
      type: List[str]
    - description: List of major professional leagues associated with the sport
      key: popular_leagues
      type: List[str]
    - description: List of major international tournaments or competitions for the
        sport
      key: major_tournaments
      type: List[str]
    prd:
      conceptual_info: This node compiles core facts about a sport once its name is
        known, providing a structured set of rules, leagues, and tournaments.
      docstring:
        examples:
        - lines:
