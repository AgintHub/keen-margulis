          output: "{\n  'rules': [\n    'Players may not use their hands except the\
            \ goalkeeper.',\n    'Each team has 11 players on the field.',\n    'A\
            \ match lasts 90 minutes with two 45‑minute halves.'\n  ],\n  'popular_leagues':\
            \ [\n    'Premier League',\n    'La Liga',\n    'Bundesliga',\n    'Serie\
            \ A'\n  ],\n  'major_tournaments': [\n    'FIFA World Cup',\n    'UEFA\
            \ Champions League',\n    'Copa América'\n  ]\n}"
        - lines:
          - gather_sport_info('basketball')
          output: "{\n  'rules': [\n    'Each team has five players on the court.',\n\
            \    'The game is played in four 12‑minute quarters.',\n    'Players must\
            \ advance the ball by dribbling or passing.'\n  ],\n  'popular_leagues':\
            \ [\n    'NBA',\n    'EuroLeague',\n    'NBL'\n  ],\n  'major_tournaments':\
            \ [\n    'NBA Finals',\n    'FIBA World Cup',\n    'Olympic Games Basketball'\
            \ \n  ]\n}"
        parameters:
        - description: The name of the sport identified by the user, e.g., 'soccer',
            'basketball', 'tennis'.
          name: selected_sport
          type: str
        raises:
        - description: If `selected_sport` is empty or not recognized in the knowledge
            base.
          type: ValueError
        returns:
          description: "A dictionary with three keys:\n  * rules (List[str]) – key\
            \ rules governing the sport.\n  * popular_leagues (List[str]) – major\
            \ professional leagues.\n  * major_tournaments (List[str]) – major international\
            \ tournaments."
          type: dict
        summary: Gather general information about the identified sport.
    prompt: Collect general information about the identified sport, including its
      rules, popular leagues, and major tournaments.
    shims: []
  identify_key_players:
    agent: false
    code_node_type: stub
    description: Identify key players in the sport
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass IdentifySportOutput(BaseModel):\n    \"\"\"Pydantic model for identify_sport\
      \ node outputs.\"\"\"\n    selected_sport: str = (\n        Field(..., description=\"\
      The name of the sport identified or specified by the user\")\n    )\n\n\nclass\
      \ ListMajorLeaguesOutput(BaseModel):\n    \"\"\"Pydantic model for list_major_leagues\
      \ node outputs.\"\"\"\n    league_names: List[str] = (\n        Field(..., description=\"\
      List of major professional leagues for the identified sport\")\n    )\n\n\n\
      class IdentifyKeyPlayersOutput(BaseModel):\n    \"\"\"Pydantic model for identify_key_players\
      \ node outputs.\"\"\"\n    player_names: List[str] = (\n        Field(..., description=\"\
      Names of the 3-5 key players\")\n    )\n    player_leagues: List[str] = (\n\
      \        Field(..., description=\"Leagues corresponding to each player\")\n\
      \    )\n\n\ndef identify_key_players(identify_sport_input: IdentifySportOutput,\
      \ list_major_leagues_input: ListMajorLeaguesOutput, **kwargs) -> IdentifyKeyPlayersOutput:\n\
      \    \"\"\"\n    Retrieve 3–5 prominent active players for a specified sport\
      \ along with the\n    league each player belongs to.\n\n    Parameters\n   \
      \ ----------\n    selected_sport : str\n        The sport for which key players\
      \ should be identified (e.g.,\n        'soccer', 'basketball').\n    league_names\
      \ : List[str]\n        A list of major professional leagues associated with\
      \ the sport,\n        obtained from the `list_major_leagues` node.\n\n    Returns\n\
      \    -------\n    Tuple[List[str], List[str]]\n        A tuple containing two\
      \ lists: the first list holds the names of 3‑5\n        key players, and the\
      \ second list holds the corresponding league\n        names for each player.\n\
      \n    Raises\n    ------\n    ValueError\n        Raised if the function cannot\
      \ find at least three suitable players\n        or if the input lists are empty.\n\
      \n    Examples\n    --------\n    >>> player_names, player_leagues = identify_key_players(\n\
      \    ...     'soccer',\n    ...     ['Premier League', 'La Liga', 'Serie A']\n\
      \    >>> )\n    (['Lionel Messi', 'Cristiano Ronaldo', 'Neymar Jr.'], ['Premier\
      \ League', 'La\n    Liga', 'Serie A'])\n\n    >>> names, leagues = identify_key_players(\n\
      \    ...     'basketball',\n    ...     ['NBA', 'EuroLeague']\n    >>> )\n \
      \   (['LeBron James', 'Kevin Durant', 'Stephen Curry'], ['NBA', 'NBA', 'NBA'])\n\
      \n    \"\"\"\n    return IdentifyKeyPlayersOutput(\n        player_names=[],\n\
      \        player_leagues=[],\n    )"
    name: identify_key_players
    nodes_depended_on:
    - identify_sport
    - list_major_leagues
    nodes_dependent_on: []
    output_structure:
    - description: Names of the 3-5 key players
      key: player_names
      type: List[str]
    - description: Leagues corresponding to each player
      key: player_leagues
      type: List[str]
    prd:
      conceptual_info: This node selects a short list of currently active, top‑tier
        players for a given sport and maps each player to one of the sport's major
        professional leagues.
      docstring:
        examples:
        - lines:
          - player_names, player_leagues = identify_key_players(
          - '    ''soccer'','
          - '    [''Premier League'', ''La Liga'', ''Serie A'']'
          - )
          output: (['Lionel Messi', 'Cristiano Ronaldo', 'Neymar Jr.'], ['Premier
            League', 'La Liga', 'Serie A'])
        - lines:
          - names, leagues = identify_key_players(
          - '    ''basketball'','
          - '    [''NBA'', ''EuroLeague'']'
          - )
          output: (['LeBron James', 'Kevin Durant', 'Stephen Curry'], ['NBA', 'NBA',
            'NBA'])
        parameters:
        - description: The sport for which key players should be identified (e.g.,
            'soccer', 'basketball').
          name: selected_sport
          type: str
        - description: A list of major professional leagues associated with the sport,
            obtained from the `list_major_leagues` node.
          name: league_names
          type: List[str]
        raises:
        - description: Raised if the function cannot find at least three suitable
            players or if the input lists are empty.
          type: ValueError
        returns:
          description: 'A tuple containing two lists: the first list holds the names
            of 3‑5 key players, and the second list holds the corresponding league
            names for each player.'
          type: Tuple[List[str], List[str]]
        summary: Retrieve 3–5 prominent active players for a specified sport along
          with the league each player belongs to.
    prompt: Name 3-5 key players currently active in the identified sport and their
      respective leagues.
    shims: []
