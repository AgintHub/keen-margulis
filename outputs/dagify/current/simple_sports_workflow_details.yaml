  summarize_sport_info:
    agent: false
    code_node_type: stub
    description: Summarize the gathered information about the sport
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass GatherSportInfoOutput(BaseModel):\n    \"\"\"Pydantic model for gather_sport_info\
      \ node outputs.\"\"\"\n    rules: List[str] = (\n        Field(..., description=\"\
      List of key rules governing the sport\")\n    )\n    popular_leagues: List[str]\
      \ = (\n        Field(..., description=\"List of major professional leagues associated\
      \ with the sport\")\n    )\n    major_tournaments: List[str] = (\n        Field(...,\
      \ description=\"List of major international tournaments or competitions for\
      \ the sport\")\n    )\n\n\nclass DetermineSportTypeOutput(BaseModel):\n    \"\
      \"\"Pydantic model for determine_sport_type node outputs.\"\"\"\n    sport_type:\
      \ str = (\n        Field(..., description=\"Whether the sport is team-based\
      \ or individual\")\n    )\n    rationale: str = (\n        Field(..., description=\"\
      One-sentence explanation for the classification\")\n    )\n\n\nclass ListMajorLeaguesOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for list_major_leagues node outputs.\"\"\"\n    league_names:\
      \ List[str] = (\n        Field(..., description=\"List of major professional\
      \ leagues for the identified sport\")\n    )\n\n\nclass IdentifyKeyPlayersOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for identify_key_players node outputs.\"\"\"\n   \
      \ player_names: List[str] = (\n        Field(..., description=\"Names of the\
      \ 3-5 key players\")\n    )\n    player_leagues: List[str] = (\n        Field(...,\
      \ description=\"Leagues corresponding to each player\")\n    )\n\n\nclass SummarizeSportInfoOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for summarize_sport_info node outputs.\"\"\"\n   \
      \ sport_type: str = (\n        Field(..., description=\"Whether the sport is\
      \ team-based or individual.\")\n    )\n    major_leagues: List[str] = (\n  \
      \      Field(..., description=\"List of major professional leagues associated\
      \ with the sport.\")\n    )\n    key_players: List[str] = (\n        Field(...,\
      \ description=\"List of 3-5 key players currently active in the sport and their\
      \ respective leagues.\")\n    )\n    summary: str = (\n        Field(..., description=\"\
      Concise summary of the sport, not exceeding 200 words.\")\n    )\n    word_count:\
      \ int = Field(..., description=\"Number of words in the summary.\")\n\n\ndef\
      \ summarize_sport_info(gather_sport_info_input: GatherSportInfoOutput, determine_sport_type_input:\
      \ DetermineSportTypeOutput, list_major_leagues_input: ListMajorLeaguesOutput,\
      \ identify_key_players_input: IdentifyKeyPlayersOutput, **kwargs) -> SummarizeSportInfoOutput:\n\
      \    \"\"\"\n    Generate a concise summary of a sport and return a structured\
      \ dictionary\n    with metadata.\n\n    Parameters\n    ----------\n    sport_type\
      \ : str\n        Classification of the sport, e.g., \"team-based\" or \"individual\"\
      .\n    major_leagues : List[str]\n        Names of the major professional leagues\
      \ for the sport.\n    key_players : List[str]\n        A list of 3–5 active\
      \ players and their leagues (formatted as \"Player\n        – League\").\n\n\
      \    Returns\n    -------\n    Dict[str, Any]\n        Dictionary containing\
      \ sport_type (str), major_leagues (List[str]),\n        key_players (List[str]),\
      \ summary (str), and word_count (int).\n\n    Raises\n    ------\n    ValueError\n\
      \        If the constructed summary exceeds 200 words.\n    TypeError\n    \
      \    If any input parameter is of an unexpected type.\n\n    Examples\n    --------\n\
      \    >>> result = summarize_sport_info(\n    ...     sport_type='team-based',\n\
      \    ...     major_leagues=['NBA', 'EuroLeague'],\n    ...     key_players=['LeBron\
      \ James – NBA', 'Giannis Antetokounmpo – NBA']\n    >>> )\n    >>> print(result['summary'])\n\
      \    \"Basketball is a team-based sport played worldwide, with major leagues\
      \ such\n    as the NBA and EuroLeague showcasing elite talent. Key players include\n\
      \    LeBron James and Giannis Antetokounmpo, both stars of the NBA.\"\n    \"\
      word_count: 27\"\n\n    >>> summary_data = summarize_sport_info(\n    ...  \
      \   sport_type='team-based',\n    ...     major_leagues=['Premier League', 'La\
      \ Liga', 'Serie A'],\n    ...     key_players=['Lionel Messi – La Liga', 'Cristiano\
      \ Ronaldo – Serie\n    A', 'Kevin De Bruyne – Premier League']\n    >>> )\n\
      \    >>> print(summary_data['summary'])\n    \"Football (soccer) is a team-based\
      \ sport with premier competitions including\n    the Premier League, La Liga,\
      \ and Serie A. Notable players feature Lionel\n    Messi and Cristiano Ronaldo\
      \ in top European clubs, along with Kevin De\n    Bruyne.\"\n    \"word_count:\
      \ 31\"\n\n    \"\"\"\n    return SummarizeSportInfoOutput(\n        sport_type=\"\
      \",\n        major_leagues=[],\n        key_players=[],\n        summary=\"\"\
      ,\n        word_count=0,\n    )"
    name: summarize_sport_info
    nodes_depended_on:
    - gather_sport_info
    - determine_sport_type
    - list_major_leagues
    - identify_key_players
    nodes_dependent_on: []
    output_structure:
    - description: Whether the sport is team-based or individual.
