  determine_sport_type:
    agent: false
    code_node_type: stub
    description: Determine if the sport is team-based or individual
    implementation: "from pydantic import BaseModel, Field\n\n\nclass IdentifySportOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for identify_sport node outputs.\"\"\"\n    selected_sport:\
      \ str = (\n        Field(..., description=\"The name of the sport identified\
      \ or specified by the user\")\n    )\n\n\nclass DetermineSportTypeOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for determine_sport_type node outputs.\"\"\"\n   \
      \ sport_type: str = (\n        Field(..., description=\"Whether the sport is\
      \ team-based or individual\")\n    )\n    rationale: str = (\n        Field(...,\
      \ description=\"One-sentence explanation for the classification\")\n    )\n\n\
      \ndef determine_sport_type(identify_sport_input: IdentifySportOutput, **kwargs)\
      \ -> DetermineSportTypeOutput:\n    \"\"\"\n    Determines whether a sport is\
      \ team-based or individual.\n\n    Parameters\n    ----------\n    selected_sport\
      \ : str\n        The name of the sport identified by the parent node.\n\n  \
      \  Returns\n    -------\n    Dict[str, str]\n        A dictionary containing\
      \ `sport_type` and `rationale` keys.\n\n    Raises\n    ------\n    ValueError\n\
      \        If `selected_sport` is empty or not recognized.\n\n    Examples\n \
      \   --------\n    >>> result = determine_sport_type('soccer')\n    >>> print(result['sport_type'])\n\
      \    >>> print(result['rationale'])\n    'team-based'\n    'Soccer is a team\
      \ sport because each side fields 11 players who must\n    coordinate to score\
      \ goals.'\n\n    >>> result = determine_sport_type('tennis')\n    >>> print(result['sport_type'])\n\
      \    >>> print(result['rationale'])\n    'individual'\n    'Tennis is played\
      \ by one or two players competing against each other, making\n    it an individual\
      \ sport.'\n\n    \"\"\"\n    return DetermineSportTypeOutput(\n        sport_type=\"\
      \",\n        rationale=\"\",\n    )"
    name: determine_sport_type
    nodes_depended_on:
    - identify_sport
    nodes_dependent_on: []
    output_structure:
    - description: Whether the sport is team-based or individual
      key: sport_type
      type: str
    - description: One-sentence explanation for the classification
      key: rationale
      type: str
    prd:
      conceptual_info: Classifies a sport as team-based or individual using a concise
