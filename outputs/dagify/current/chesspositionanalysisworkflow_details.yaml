dag_type: shim
description: Generated workflow from UI.
name: chesspositionanalysisworkflow
nodes:
  analyze_pawn_structure:
    agent: false
    code_node_type: shim
    description: Examine pawn chain, isolated pawns, and other structural elements.
    implementation: "from ._analyze_pawn_structure.validate_input import validate_input\n\
      from ._analyze_pawn_structure.extract_pawn_positions import extract_pawn_positions\n\
      from ._analyze_pawn_structure.identify_pawn_chains import identify_pawn_chains\n\
      from ._analyze_pawn_structure.analyze_pawn_chains import analyze_pawn_chains\n\
      from ._analyze_pawn_structure.find_isolated_pawns import find_isolated_pawns\n\
      from ._analyze_pawn_structure.find_passed_pawns import find_passed_pawns\n\n\
      from pydantic import BaseModel, Field\nfrom typing import List\n\n\nclass ParseChessPositionOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for parse_chess_position node outputs.\"\"\"\n   \
      \ piece_positions: List[str] = (\n        Field(..., description=\"Positions\
      \ of all pieces on the board\")\n    )\n    castling_rights: List[bool] = (\n\
      \        Field(..., description=\"Castling rights for both white and black\"\
      )\n    )\n    en_passant_square: str = (\n        Field(..., description=\"\
      En passant square if available\")\n    )\n    side_to_move: str = Field(...,\
      \ description=\"Side to move (white or black)\")\n\n\nclass AnalyzePawnStructureOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for analyze_pawn_structure node outputs.\"\"\"\n \
      \   pawn_chain_analysis: List[str] = (\n        Field(..., description = (\n\
      \            \"Analysis of pawn chains and their implications.\")\n        )\n\
      \    )\n    isolated_pawns: List[str] = (\n        Field(..., description=\"\
      Positions of isolated pawns.\")\n    )\n    passed_pawns: List[str] = (\n  \
      \      Field(..., description=\"Positions of passed pawns.\")\n    )\n\n\ndef\
      \ analyze_pawn_structure(parse_chess_position_input: ParseChessPositionOutput,\
      \ **kwargs) -> AnalyzePawnStructureOutput:\n    \"\"\"\n    Analyze the pawn\
      \ structure from the parsed chess position.\n\n    Parameters\n    ----------\n\
      \    piece_positions : List[str]\n        Positions of all pieces on the board,\
      \ provided by the\n        parse_chess_position node.\n    side_to_move : str\n\
      \        Side to move (white or black), provided by the parse_chess_position\n\
      \        node.\n\n    Returns\n    -------\n    Tuple[List[str], List[str],\
      \ List[str]]\n        A tuple containing the analysis of pawn chains, positions\
      \ of\n        isolated pawns, and positions of passed pawns.\n\n    Raises\n\
      \    ------\n    ValueError\n        If the piece_positions list is empty or\
      \ if side_to_move is not\n        'white' or 'black'.\n\n    Examples\n    --------\n\
      \    >>> piece_positions = ['e2', 'e4', 'd4', 'c3']\n    >>> side_to_move =\
      \ 'white'\n    >>> result = analyze_pawn_structure(piece_positions, side_to_move)\n\
      \    (['Pawn chain on d4 and c3 is strong'], ['b2'], ['e4'])\n\n    >>> piece_positions\
      \ = ['e7', 'd5', 'c6']\n    >>> side_to_move = 'black'\n    >>> result = analyze_pawn_structure(piece_positions,\
      \ side_to_move)\n    (['Pawn chain on d5 and c6 is flexible'], ['a7'], ['d5'])\n\
      \n    \"\"\"\n    validate_input(piece_positions=parse_chess_position_input.piece_positions,\
      \ side_to_move=parse_chess_position_input.side_to_move)\n    \n    pawn_positions:\
      \ List[str] = extract_pawn_positions(piece_positions=parse_chess_position_input.piece_positions,\
      \ side=parse_chess_position_input.side_to_move)\n    \n    pawn_chains: List[str]\
      \ = identify_pawn_chains(pawn_positions=pawn_positions)\n    chain_analysis:\
      \ List[str] = analyze_pawn_chains(pawn_chains=pawn_chains)\n    \n    isolated_pawn_positions:\
      \ List[str] = find_isolated_pawns(pawn_positions=pawn_positions)\n    \n   \
      \ passed_pawn_positions: List[str] = find_passed_pawns(pawn_positions=pawn_positions,\
      \ all_piece_positions=parse_chess_position_input.piece_positions, side=parse_chess_position_input.side_to_move)\n\
      \    \n    return AnalyzePawnStructureOutput(\n        pawn_chain_analysis=chain_analysis,\n\
      \        isolated_pawns=isolated_pawn_positions,\n        passed_pawns=passed_pawn_positions\n\
      \    )"
    name: analyze_pawn_structure
    nodes_depended_on:
    - parse_chess_position
    nodes_dependent_on: []
    output_structure:
    - description: Analysis of pawn chains and their implications.
      key: pawn_chain_analysis
      type: List[str]
    - description: Positions of isolated pawns.
      key: isolated_pawns
      type: List[str]
    - description: Positions of passed pawns.
      key: passed_pawns
      type: List[str]
    prd:
      conceptual_info: This node analyzes the pawn structure of a given chess position
        to identify strengths and weaknesses.
      docstring:
        examples:
        - lines:
          - piece_positions = ['e2', 'e4', 'd4', 'c3']
          - side_to_move = 'white'
          - result = analyze_pawn_structure(piece_positions, side_to_move)
          output: (['Pawn chain on d4 and c3 is strong'], ['b2'], ['e4'])
        - lines:
          - piece_positions = ['e7', 'd5', 'c6']
          - side_to_move = 'black'
          - result = analyze_pawn_structure(piece_positions, side_to_move)
          output: (['Pawn chain on d5 and c6 is flexible'], ['a7'], ['d5'])
        parameters:
        - description: Positions of all pieces on the board, provided by the parse_chess_position
            node.
          name: piece_positions
          type: List[str]
        - description: Side to move (white or black), provided by the parse_chess_position
            node.
          name: side_to_move
          type: str
        raises:
        - description: If the piece_positions list is empty or if side_to_move is
            not 'white' or 'black'.
          type: ValueError
        returns:
          description: A tuple containing the analysis of pawn chains, positions of
            isolated pawns, and positions of passed pawns.
          type: Tuple[List[str], List[str], List[str]]
        summary: Analyze the pawn structure from the parsed chess position.
    prompt: Analyze the pawn structure to identify weaknesses and strengths.
    shims:
    - agent: false
      code_node_type: virtual-stub
      description: Validates chess piece positions and side to move, returning a success
        message or raising errors if invalid.
      implementation: "def validate_input(piece_positions: str, side_to_move: str)\
        \ -> str:\n    \"\"\"\n    Validate chess piece positions and side-to-move\
        \ string, returning a\n    confirmation message or raising appropriate errors.\n\
        \n    Parameters\n    ----------\n    piece_positions : List[str]\n      \
        \  A list of strings representing the positions of all pieces on the\n   \
        \     board in standard algebraic notation (e.g., 'e4', 'g8').\n    side_to_move\
        \ : str\n        The side that is to move, either 'white' or 'black' (case-\n\
        \        insensitive).\n\n    Returns\n    -------\n    str\n        A confirmation\
        \ message such as 'Validation successful.' when inputs\n        are valid.\n\
        \n    Raises\n    ------\n    ValueError\n        Raised when any piece position\
        \ is not a valid square (e.g., 'i9') or\n        when the side_to_move is\
        \ not 'white' or 'black'.\n    TypeError\n        Raised when piece_positions\
        \ is not a list or when side_to_move is\n        not a string.\n\n    Examples\n\
        \    --------\n    >>> validate_input(['e4', 'd5', 'g2'], 'white')\n    \"\
        Validation successful.\"\n\n    >>> try:\n    ...     validate_input(['e4',\
        \ 'x9', 'g2'], 'black')\n    >>> except Exception as e:\n    ...     print(e)\n\
        \    \"ValueError: Invalid piece position 'x9'.\"\n\n    \"\"\"\n    raise\
        \ NotImplementedError(\"This is a virtual stub node that needs to be implemented\"\
        )"
      name: validate_input
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type Any
        key: output
        type: str
      - description: Input parameter of type str
        key: piece_positions
        type: str
      - description: Input parameter of type str
        key: side_to_move
        type: str
      prd:
        conceptual_info: The validate_input shim verifies that the provided list of
          piece positions and the side-to-move string are syntactically correct and
          conform to basic chess rules before proceeding to more complex analysis
          functions.
        docstring:
          examples:
          - lines:
            - validate_input(['e4', 'd5', 'g2'], 'white')
            output: '"Validation successful."'
          - lines:
            - 'try:'
            - '    validate_input([''e4'', ''x9'', ''g2''], ''black'')'
            - 'except Exception as e:'
            - '    print(e)'
            output: '"ValueError: Invalid piece position ''x9''."'
          parameters:
          - description: A list of strings representing the positions of all pieces
              on the board in standard algebraic notation (e.g., 'e4', 'g8').
            name: piece_positions
            type: List[str]
          - description: The side that is to move, either 'white' or 'black' (case-insensitive).
            name: side_to_move
            type: str
          raises:
          - description: Raised when any piece position is not a valid square (e.g.,
              'i9') or when the side_to_move is not 'white' or 'black'.
            type: ValueError
          - description: Raised when piece_positions is not a list or when side_to_move
              is not a string.
            type: TypeError
          returns:
            description: A confirmation message such as 'Validation successful.' when
              inputs are valid.
            type: str
          summary: Validate chess piece positions and side-to-move string, returning
            a confirmation message or raising appropriate errors.
      prompt: 'Implement validate_input(piece_positions: List[str], side_to_move:
        str) -> str'
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Returns the list of board coordinates occupied by the pawns of
        a specified side from a list of all piece positions.
      implementation: "from typing import List\n\n\ndef extract_pawn_positions(piece_positions:\
        \ str, side: str) -> List[str]:\n    \"\"\"\n    Extracts the positions of\
        \ all pawns for a specified side from a list of all\n    piece positions.\n\
        \n    Parameters\n    ----------\n    piece_positions : List[str]\n      \
        \  A list of strings representing all piece positions on the board\n     \
        \   (e.g., ['e4', 'd5', 'c3']). Each string follows standard algebraic\n \
        \       notation without piece type identifiers.\n    side : str\n       \
        \ The side whose pawn positions should be returned; expected values\n    \
        \    are 'white' or 'black'.\n\n    Returns\n    -------\n    List[str]\n\
        \        A list of position strings corresponding to the pawns belonging to\n\
        \        the specified side.\n\n    Raises\n    ------\n    ValueError\n \
        \       Raised when `side` is not 'white' or 'black', or when\n        `piece_positions`\
        \ contains an invalid board coordinate.\n    TypeError\n        Raised when\
        \ `piece_positions` is not a list of strings or when\n        `side` is not\
        \ a string.\n\n    Examples\n    --------\n    >>> extract_pawn_positions(['a2',\
        \ 'b2', 'c3', 'd5', 'e4'], 'white')\n    ['a2', 'b2']\n\n    >>> extract_pawn_positions(['a7',\
        \ 'b6', 'c5', 'd4', 'e3'], 'black')\n    ['a7', 'b6', 'c5']\n\n    \"\"\"\n\
        \    raise NotImplementedError(\"This is a virtual stub node that needs to\
        \ be implemented\")"
      name: extract_pawn_positions
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: piece_positions
        type: str
      - description: Input parameter of type str
        key: side
        type: str
      prd:
        conceptual_info: This shim isolates the pawn locations on the board for a
          given side, enabling downstream analysis of pawn structure such as chains,
          isolation, and passing.
        docstring:
          examples:
          - lines:
            - extract_pawn_positions(['a2', 'b2', 'c3', 'd5', 'e4'], 'white')
            output: '[''a2'', ''b2'']'
          - lines:
            - extract_pawn_positions(['a7', 'b6', 'c5', 'd4', 'e3'], 'black')
            output: '[''a7'', ''b6'', ''c5'']'
          parameters:
          - description: A list of strings representing all piece positions on the
              board (e.g., ['e4', 'd5', 'c3']). Each string follows standard algebraic
              notation without piece type identifiers.
            name: piece_positions
            type: List[str]
          - description: The side whose pawn positions should be returned; expected
              values are 'white' or 'black'.
            name: side
            type: str
          raises:
          - description: Raised when `side` is not 'white' or 'black', or when `piece_positions`
              contains an invalid board coordinate.
            type: ValueError
          - description: Raised when `piece_positions` is not a list of strings or
              when `side` is not a string.
            type: TypeError
          returns:
            description: A list of position strings corresponding to the pawns belonging
              to the specified side.
            type: List[str]
          summary: Extracts the positions of all pawns for a specified side from a
            list of all piece positions.
      prompt: "def extract_pawn_positions(piece_positions: List[str], side: str) ->\
        \ List[str]:\n    \"\"\"\n    Extract positions of pawns belonging to the\
        \ specified side.\n    \"\"\"\n    # implementation goes here"
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Returns a list of pawn chain strings derived from the provided
        pawn positions.
      implementation: "from typing import List\n\n\ndef identify_pawn_chains(pawn_positions:\
        \ str) -> List[str]:\n    \"\"\"\n    Identify pawn chains from a string of\
        \ pawn positions.\n\n    Parameters\n    ----------\n    pawn_positions :\
        \ str\n        A space-separated string of pawn square identifiers (e.g.,\
        \ 'a2 b2\n        c3').\n\n    Returns\n    -------\n    List[str]\n     \
        \   A list where each element is a string representation of a pawn\n     \
        \   chain, with squares joined by hyphens.\n\n    Raises\n    ------\n   \
        \ ValueError\n        If pawn_positions is empty or contains invalid square\
        \ notation.\n    TypeError\n        If pawn_positions is not a string.\n\n\
        \    Examples\n    --------\n    >>> identify_pawn_chains('a2 b2 c3')\n  \
        \  ['a2-b2', 'c3']\n\n    >>> identify_pawn_chains('d4 e5 f6')\n    ['d4-e5-f6']\n\
        \n    \"\"\"\n    raise NotImplementedError(\"This is a virtual stub node\
        \ that needs to be implemented\")"
      name: identify_pawn_chains
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: pawn_positions
        type: str
      prd:
        conceptual_info: The identify_pawn_chains shim processes a string of pawn
          positions, grouping them into connected chains based on their relative file
          and rank relationships, and outputs each chain as a formatted string.
        docstring:
          examples:
          - lines:
            - identify_pawn_chains('a2 b2 c3')
            output: '[''a2-b2'', ''c3'']'
          - lines:
            - identify_pawn_chains('d4 e5 f6')
            output: '[''d4-e5-f6'']'
          parameters:
          - description: A space-separated string of pawn square identifiers (e.g.,
              'a2 b2 c3').
            name: pawn_positions
            type: str
          raises:
          - description: If pawn_positions is empty or contains invalid square notation.
            type: ValueError
          - description: If pawn_positions is not a string.
            type: TypeError
          returns:
            description: A list where each element is a string representation of a
              pawn chain, with squares joined by hyphens.
            type: List[str]
          summary: Identify pawn chains from a string of pawn positions.
      prompt: Identify pawn chains from a string of pawn positions.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Returns a list of analysis strings describing pawn chains for the
        given pawn chain representation.
      implementation: "from typing import List\n\n\ndef analyze_pawn_chains(pawn_chains:\
        \ str) -> List[str]:\n    \"\"\"\n    Analyze the pawn chains provided in\
        \ a string and return a list of\n    descriptive analysis strings for each\
        \ chain.\n\n    Parameters\n    ----------\n    pawn_chains : str\n      \
        \  A string representation of pawn chains. Each chain is expected to be\n\
        \        on its own line, with squares separated by commas, e.g. \"a2,b2,c2\"\
        .\n\n    Returns\n    -------\n    List[str]\n        A list of strings, each\
        \ describing the strategic implications of one\n        pawn chain (e.g.,\
        \ solidity, weaknesses, passed pawn potential).\n\n    Raises\n    ------\n\
        \    ValueError\n        If the input string is empty or does not contain\
        \ any valid pawn\n        chain representation.\n    TypeError\n        If\
        \ the input is not of type str.\n\n    Examples\n    --------\n    >>> result\
        \ = analyze_pawn_chains('a2,b2,c2\\n')\n    >>> print(result)\n    ['A solid\
        \ chain on the a-file with potential for a passed pawn on a2.']\n\n    >>>\
        \ result = analyze_pawn_chains('')\n    ValueError: Input string must contain\
        \ at least one pawn chain.\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: analyze_pawn_chains
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: pawn_chains
        type: str
      prd:
        conceptual_info: The analyze_pawn_chains shim interprets a textual representation
          of pawn chains and produces human‑readable insights that can be used downstream
          in pawn structure analysis.
        docstring:
          examples:
          - lines:
            - result = analyze_pawn_chains('a2,b2,c2\n')
            - print(result)
            output: '[''A solid chain on the a-file with potential for a passed pawn
              on a2.'']'
          - lines:
            - result = analyze_pawn_chains('')
            output: 'ValueError: Input string must contain at least one pawn chain.'
          parameters:
          - description: A string representation of pawn chains. Each chain is expected
              to be on its own line, with squares separated by commas, e.g. "a2,b2,c2".
            name: pawn_chains
            type: str
          raises:
          - description: If the input string is empty or does not contain any valid
              pawn chain representation.
            type: ValueError
          - description: If the input is not of type str.
            type: TypeError
          returns:
            description: A list of strings, each describing the strategic implications
              of one pawn chain (e.g., solidity, weaknesses, passed pawn potential).
            type: List[str]
          summary: Analyze the pawn chains provided in a string and return a list
            of descriptive analysis strings for each chain.
      prompt: Analyze the pawn chains in the provided string and return a list of
        descriptive analysis strings for each chain.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Finds isolated pawn positions from a list of pawn positions.
      implementation: "from typing import List\n\n\ndef find_isolated_pawns(pawn_positions:\
        \ str) -> List[str]:\n    \"\"\"\n    Return the list of isolated pawn positions\
        \ from the provided pawn list.\n\n    Parameters\n    ----------\n    pawn_positions\
        \ : List[str]\n        A list of chessboard square identifiers (e.g., 'e4')\
        \ representing\n        the positions of all pawns of the side to move.\n\n\
        \    Returns\n    -------\n    List[str]\n        A list containing the square\
        \ identifiers of all isolated pawns. If\n        no isolated pawns are found,\
        \ an empty list is returned.\n\n    Raises\n    ------\n    ValueError\n \
        \       Raised when any element of `pawn_positions` is not a valid\n     \
        \   2‑character algebraic notation (e.g., 'i9' or 'a10').\n    TypeError\n\
        \        Raised when `pawn_positions` is not a list or contains non‑string\n\
        \        elements.\n\n    Examples\n    --------\n    >>> find_isolated_pawns(['c2',\
        \ 'd2', 'e2'])\n    []\n\n    >>> find_isolated_pawns(['a2', 'c2', 'e2', 'g2'])\n\
        \    ['a2', 'c2', 'e2', 'g2']\n\n    >>> find_isolated_pawns(['b2', 'd3',\
        \ 'f4', 'h5'])\n    ['b2', 'd3', 'f4', 'h5']\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: find_isolated_pawns
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: pawn_positions
        type: str
      prd:
        conceptual_info: This shim identifies all pawns on a chessboard that have
          no allied pawns on the files immediately to their left or right, thereby
          isolating them. It is used within pawn structure analysis to flag potential
          weaknesses in a player's pawn formation.
        docstring:
          examples:
          - lines:
            - find_isolated_pawns(['c2', 'd2', 'e2'])
            output: '[]'
          - lines:
            - find_isolated_pawns(['a2', 'c2', 'e2', 'g2'])
            output: '[''a2'', ''c2'', ''e2'', ''g2'']'
          - lines:
            - find_isolated_pawns(['b2', 'd3', 'f4', 'h5'])
            output: '[''b2'', ''d3'', ''f4'', ''h5'']'
          parameters:
          - description: A list of chessboard square identifiers (e.g., 'e4') representing
              the positions of all pawns of the side to move.
            name: pawn_positions
            type: List[str]
          raises:
          - description: Raised when any element of `pawn_positions` is not a valid
              2‑character algebraic notation (e.g., 'i9' or 'a10').
            type: ValueError
          - description: Raised when `pawn_positions` is not a list or contains non‑string
              elements.
            type: TypeError
          returns:
            description: A list containing the square identifiers of all isolated
              pawns. If no isolated pawns are found, an empty list is returned.
            type: List[str]
          summary: Return the list of isolated pawn positions from the provided pawn
            list.
      prompt: 'Implement `find_isolated_pawns(pawn_positions: List[str]) -> List[str]`
        that returns all pawn positions that are isolated (no allied pawns on adjacent
        files).'
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Identifies passed pawns for a given side based on pawn and piece
        positions.
      implementation: "from typing import List\n\n\ndef find_passed_pawns(pawn_positions:\
        \ str, all_piece_positions: str, side: str) -> List[str]:\n    \"\"\"\n  \
        \  Return the list of passed pawn positions for the specified side based on\
        \ the\n    provided pawn and full piece positions.\n\n    Parameters\n   \
        \ ----------\n    pawn_positions : str\n        Comma‑separated string of\
        \ pawn squares belonging to the side to\n        evaluate (e.g., \"a2,b3\"\
        ).\n    all_piece_positions : str\n        Comma‑separated string of all piece\
        \ squares on the board, regardless\n        of color.\n    side : str\n  \
        \      Either \"white\" or \"black\" indicating which side's passed pawns\
        \ to\n        find.\n\n    Returns\n    -------\n    LIST_STR\n        A list\
        \ of board squares that are passed pawns for the specified\n        side.\n\
        \n    Raises\n    ------\n    ValueError\n        Raised when `side` is not\
        \ \"white\" or \"black\", or when\n        `pawn_positions` is empty.\n  \
        \  TypeError\n        Raised when any of the arguments are not of type `str`.\n\
        \n    Examples\n    --------\n    >>> find_passed_pawns('a2', 'a2,b3', 'white')\n\
        \    ['a2']\n\n    >>> find_passed_pawns('c7', 'a2,b3,c7,d5', 'black')\n \
        \   ['c7']\n\n    \"\"\"\n    raise NotImplementedError(\"This is a virtual\
        \ stub node that needs to be implemented\")"
      name: find_passed_pawns
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: pawn_positions
        type: str
      - description: Input parameter of type str
        key: all_piece_positions
        type: str
      - description: Input parameter of type str
        key: side
        type: str
