    description: Assess material advantage or disadvantage
    implementation: "from ._evaluate_material_balance.validate_piece_positions import\
      \ validate_piece_positions\nfrom ._evaluate_material_balance.extract_white_pieces\
      \ import extract_white_pieces\nfrom ._evaluate_material_balance.extract_black_pieces\
      \ import extract_black_pieces\nfrom ._evaluate_material_balance.count_pieces_by_type\
