  source_news_articles:
    agent: false
    code_node_type: shim
    description: Collects a curated set of news articles from multiple online sources,
      returning URLs, titles, texts, and source names for each article. The function
      is designed for robustness, logging, and graceful error handling, producing
      a Pydantic model for downstream processing.
    implementation: "import logging\nfrom typing import List\nfrom pydantic import\
      \ BaseModel, Field\n\nfrom ._source_news_articles.get_predefined_news_sources\
      \ import get_predefined_news_sources\nfrom ._source_news_articles.fetch_articles_from_source\
      \ import fetch_articles_from_source\nfrom ._source_news_articles.extract_urls\
      \ import extract_urls\nfrom ._source_news_articles.extract_titles import extract_titles\n\
      from ._source_news_articles.extract_texts import extract_texts\nfrom ._source_news_articles.extract_source_names\
      \ import extract_source_names\nfrom ._source_news_articles.handle_fetch_error\
      \ import handle_fetch_error\nfrom ._source_news_articles.validate_collected_data\
      \ import validate_collected_data\n\n\nclass SourceNewsArticlesOutput(BaseModel):\n\
      \    article_urls: List[str] = (\n        Field(..., description=\"List of URLs\
      \ for the news articles collected.\")\n    )\n    article_titles: List[str]\
      \ = (\n        Field(..., description=\"Headlines of the news articles collected.\"\
      )\n    )\n    article_texts: List[str] = (\n        Field(..., description=\"\
      Full text content of each news article.\")\n    )\n    article_sources: List[str]\
      \ = (\n        Field(..., description=\"Names of the sources from which each\
      \ article was retrieved.\")\n    )\n    article_count: int = (\n        Field(...,\
      \ description=\"Total number of news articles collected.\")\n    )\n    fetch_successful:\
      \ bool = (\n        Field(..., description=\"Indicates whether the fetch operation\
      \ succeeded for at least one source.\")\n    )\n\nlogger = logging.getLogger(__name__)\n\
      \ndef source_news_articles(general_input: str | None = None, **kwargs) -> SourceNewsArticlesOutput:\n\
      \    \"\"\"\n    Retrieve news articles from a set of predefined sources, returning\n\
      \    structured metadata and content.\n\n    Parameters\n    ----------\n  \
      \  general_input : str | None\n        Optional textual input that can be used\
      \ to influence source\n        selection or filtering. Currently unused but\
      \ kept for compatibility.\n    kwargs : dict\n        Additional keyword arguments\
      \ forwarded to downstream helpers.\n\n    Returns\n    -------\n    SourceNewsArticlesOutput\n\
      \        Model containing article URLs, titles, texts, source names, count,\n\
      \        and a success flag.\n\n    Raises\n    ------\n    ValueError\n   \
      \     Raised when an unexpected type is passed or collected data cannot be\n\
      \        validated.\n\n    Examples\n    --------\n    >>> result = source_news_articles()\n\
      \    >>> print(result.article_count)\n    7\n\n    \"\"\"\n    if general_input\
      \ is not None and not isinstance(general_input, str):\n        logger.error(\"\
      general_input must be a string if provided\")\n        raise ValueError(\"general_input\
      \ must be a string if provided\")\n\n    source_list: List[str] = get_predefined_news_sources()\n\
      \    collected_urls: List[str] = []\n    collected_titles: List[str] = []\n\
      \    collected_texts: List[str] = []\n    collected_sources: List[str] = []\n\
      \n    fetch_success: bool = True\n\n    for source in source_list:\n       \
      \ try:\n            article_data: dict = fetch_articles_from_source(source=source)\n\
      \            urls: List[str] = extract_urls(data=article_data)\n           \
      \ titles: List[str] = extract_titles(data=article_data)\n            texts:\
      \ List[str] = extract_texts(data=article_data)\n            sources: List[str]\
      \ = extract_source_names(data=article_data, source=source)\n            collected_urls.extend(urls)\n\
      \            collected_titles.extend(titles)\n            collected_texts.extend(texts)\n\
      \            collected_sources.extend(sources)\n            logger.info(\"Fetched\
      \ %d articles from %s\", len(urls), source)\n        except Exception as e:\n\
      \            logger.exception(\"Error fetching articles from %s: %s\", source,\
      \ e)\n            fetch_success = handle_fetch_error(error=e, source=source)\n\
      \n    validated_data: dict = validate_collected_data(\n        urls=collected_urls,\n\
      \        titles=collected_titles,\n        texts=collected_texts,\n        sources=collected_sources\n\
      \    )\n\n    total_count: int = len(validated_data[\"urls\"]) if validated_data\
      \ else 0\n\n    return SourceNewsArticlesOutput(\n        article_urls=validated_data[\"\
      urls\"],\n        article_titles=validated_data[\"titles\"],\n        article_texts=validated_data[\"\
      texts\"],\n        article_sources=validated_data[\"sources\"],\n        article_count=total_count,\n\
      \        fetch_successful=fetch_success and total_count > 0\n    )"
