dag_type: shim
description: Generated workflow from UI.
name: news_analysis_workflow
nodes:
  analyze_sentiment:
    agent: false
    code_node_type: shim
    description: Analyzes the sentiment of concise news article summaries, returning
      an ordered list of article indices, sentiment categories, and confidence scores
      for each article.
    implementation: "import logging\\nfrom typing import List\\nfrom pydantic import\
      \ BaseModel, Field\\n\\n# Helper function imports\\nfrom ._analyze_sentiment.validate_summaries_input\
      \ import validate_summaries_input\\nfrom ._analyze_sentiment.generate_article_indices\
      \ import generate_article_indices\\nfrom ._analyze_sentiment.analyze_sentiment_batch\
      \ import analyze_sentiment_batch\\nfrom ._analyze_sentiment.extract_sentiment_categories\
      \ import extract_sentiment_categories\\nfrom ._analyze_sentiment.extract_confidence_scores\
      \ import extract_confidence_scores\\n\\nclass SummarizeNewsArticlesOutput(BaseModel):\\\
      n    summary_count: int = (\n    Field(..., description=\"Number of article\
      \ summaries generated\")\\n    summaries: List[str] = Field(..., description=\"\
      Concise summaries for each news article, ordered as input\")\\n\\nclass AnalyzeSentimentOutput(BaseModel):\\\
      n    article_index: List[int] = Field(..., description=\"The sequential index\
      \ of each article in the input list.\")\\n    sentiment_category: List[str]\
      \ = Field(..., description=\"Sentiment category for each article, one of 'positive',\
      \ 'negative', or 'neutral'.\")\\n    sentiment_confidence: List[float] = Field(...,\
      \ description=\"Confidence score (0.0 to 1.0) for the assigned sentiment.\"\
      )\\n\\nlogger = logging.getLogger(__name__)\\n\\ndef analyze_sentiment(summarize_news_articles_input:\
      \ SummarizeNewsArticlesOutput, **kwargs) -> AnalyzeSentimentOutput:\\n    if\
      \ not isinstance(summarize_news_articles_input, SummarizeNewsArticlesOutput):\\\
      n        logger.error(\"Input must be instance of SummarizeNewsArticlesOutput\"\
      )\\n        raise TypeError(\"Input must be instance of SummarizeNewsArticlesOutput\"\
      )\\n    summaries: List[str] = summarize_news_articles_input.summaries\\n  \
      \  if not summaries:\\n        logger.error(\"Empty summaries list received\"\
      )\\n        raise ValueError(\"No summaries provided for sentiment analysis\"\
      )\\n    validate_summaries_input(summaries=summaries)\\n    article_indices:\
      \ List[int] = generate_article_indices(summaries_count=len(summaries))\\n  \
      \  sentiment_results: List[dict] = analyze_sentiment_batch(summaries=summaries)\\\
      n    sentiment_categories: List[str] = extract_sentiment_categories(results=sentiment_results)\\\
      n    confidence_scores: List[float] = extract_confidence_scores(results=sentiment_results)\\\
      n    if not (len(article_indices) == len(sentiment_categories) == len(confidence_scores)):\\\
      n        logger.error(\"Mismatch in output lengths from sentiment analysis batch\"\
      )\\n        raise RuntimeError(\"Length mismatch between indices, categories,\
      \ and confidence scores.\")\\n    return AnalyzeSentimentOutput(\\n        article_index=article_indices,\\\
      n        sentiment_category=sentiment_categories,\\n        sentiment_confidence=confidence_scores\\\
      n    )\n)"
    name: analyze_sentiment
    nodes_depended_on:
    - summarize_news_articles
    nodes_dependent_on: []
    output_structure:
    - description: The sequential index of each article in the input list.
      key: article_index
      type: List[int]
    - description: Sentiment category for each article, one of 'positive', 'negative',
        or 'neutral'.
      key: sentiment_category
      type: List[str]
    - description: Confidence score (0.0 to 1.0) for the assigned sentiment.
      key: sentiment_confidence
      type: List[float]
    prd:
      conceptual_info: The node takes concise article summaries and determines the
        overall sentiment of each article, returning a list of indices, sentiment
        categories, and confidence scores.
      docstring:
        examples:
        - lines:
          - result = analyze_sentiment(SummarizeNewsArticlesOutput(summary_count=2,
            summaries=["A positive event occurred", "A negative event occurred"]))
          - print(result)
          output: AnalyzeSentimentOutput(article_index=[0, 1], sentiment_category=['positive',
            'negative'], sentiment_confidence=[0.92, 0.85])
        parameters:
        - description: Output of the summarize_news_articles node containing a list
            of article summaries.
          name: summarize_news_articles_input
          type: SummarizeNewsArticlesOutput
        raises:
        - description: Raised if the summary list is empty.
          type: ValueError
        - description: Raised if any summary entry is not a string or if the input
            is not a SummarizeNewsArticlesOutput instance.
          type: TypeError
        - description: Raised when internal sentiment analysis returns mismatched
            lengths.
          type: RuntimeError
        returns:
          description: An object containing article indices, sentiment categories,
            and confidence scores.
          type: AnalyzeSentimentOutput
        summary: Analyze the sentiment of news article summaries.
    prompt: Determine the sentiment of each summarized news article, producing a positive,
      negative, or neutral label with a confidence score.
    shims: []
  categorize_news_articles:
    agent: false
    code_node_type: shim
    description: Assigns topical categories to a list of filtered news article titles,
      normalizes the headlines, and provides statistics on the resulting categories
      for downstream analysis.
    implementation: "import logging\nfrom typing import List\nfrom pydantic import\
      \ BaseModel, Field\nfrom ._categorize_news_articles.normalize_article_titles\
      \ import normalize_article_titles\nfrom ._categorize_news_articles.assign_categories\
      \ import assign_categories\nfrom ._categorize_news_articles.get_unique_categories\
      \ import get_unique_categories\n\n\nclass FilterNewsArticlesOutput(BaseModel):\n\
      \    filtered_article_ids: List[str] = (\n        Field(..., description=\"\
      List of article titles that passed filtering.\")\n    )\n    removed_article_ids:\
      \ List[str] = (\n        Field(..., description=\"List of article titles that\
      \ were removed.\")\n    )\n    filter_success: bool = (\n        Field(...,\
      \ description=\"Indicates whether filtering succeeded.\")\n    )\n\nclass CategorizeNewsArticlesOutput(BaseModel):\n\
      \    article_titles: List[str] = (\n        Field(..., description=\"List of\
      \ article titles that were categorized.\")\n    )\n    categories: List[str]\
      \ = Field(..., description=\"Category for each article.\")\n    unique_category_count:\
      \ int = (\n        Field(..., description=\"Number of distinct categories.\"\
      )\n    )\n    article_count: int = Field(..., description=\"Total articles processed.\"\
      )\n    is_successful: bool = (\n        Field(..., description=\"Indicates success\
      \ of categorization.\")\n    )\n\ndef categorize_news_articles(filter_news_articles_input:\
      \ FilterNewsArticlesOutput, **kwargs) -> CategorizeNewsArticlesOutput:\n   \
      \ \"\"\"\n    Categorizes news article titles by topic.\n\n    Parameters\n\
      \    ----------\n    filter_news_articles_input : FilterNewsArticlesOutput\n\
      \        Output from the filtering step containing the list of article titles\n\
      \        to be categorized.\n\n    Returns\n    -------\n    CategorizeNewsArticlesOutput\n\
      \        Structured output containing categorized titles, category list, and\n\
      \        statistics.\n\n    Raises\n    ------\n    ValueError\n        Raised\
      \ when `filtered_article_ids` is empty or not a list of\n        strings.\n\
      \    RuntimeError\n        Raised when the prior filtering step failed or an\
      \ internal error\n        occurs during categorization.\n\n    Examples\n  \
      \  --------\n    >>> filtered = FilterNewsArticlesOutput(**{\n    ...     'filtered_article_ids':\
      \ ['Economic growth forecast', 'Parliament\n    passes new law', 'Local community\
      \ event'],\n    ...     'removed_article_ids': [],\n    ...     'filter_success':\
      \ True\n    >>> })\n    >>> result = categorize_news_articles(filtered)\n  \
      \  >>> print(result)\n    CategorizeNewsArticlesOutput(article_titles=['Economic\
      \ growth forecast',\n    'Parliament passes new law', 'Local community event'],\n\
      \    categories=['Economics', 'Politics', 'Social Issues'],\n    unique_category_count=3,\
      \ article_count=3, is_successful=True)\n\n    \"\"\"\n    logger = logging.getLogger(__name__)\n\
      \    try:\n        if not filter_news_articles_input.filter_success:\n     \
      \       logger.error(\"Filtering failed; cannot categorize.\")\n           \
      \ raise RuntimeError(\"Previous filtering step failed.\")\n        titles =\
      \ filter_news_articles_input.filtered_article_ids\n        if not titles:\n\
      \            logger.error(\"No titles provided for categorization.\")\n    \
      \        raise ValueError(\"filtered_article_ids must be non-empty.\")\n   \
      \     normalized_titles = normalize_article_titles(article_ids=titles)\n   \
      \     categories = assign_categories(article_titles=normalized_titles)\n   \
      \     unique_categories = get_unique_categories(categories=categories)\n   \
      \     return CategorizeNewsArticlesOutput(\n            article_titles=normalized_titles,\n\
      \            categories=categories,\n            unique_category_count=len(unique_categories),\n\
      \            article_count=len(normalized_titles),\n            is_successful=True\n\
      \        )\n    except Exception as e:\n        logger.exception(\"Categorization\
      \ failed: %s\", e)\n        return CategorizeNewsArticlesOutput(\n         \
      \   article_titles=[],\n            categories=[],\n            unique_category_count=0,\n\
      \            article_count=0,\n            is_successful=False\n        )"
    name: categorize_news_articles
    nodes_depended_on:
    - filter_news_articles
    nodes_dependent_on: []
    output_structure:
    - description: List of article titles that were filtered and are now categorized.
      key: article_titles
      type: List[str]
    - description: List of category labels corresponding to each article in `article_titles`;
        indices match.
      key: categories
      type: List[str]
    - description: Total number of distinct categories identified.
      key: unique_category_count
      type: int
    - description: Total number of articles processed by this node.
      key: article_count
      type: int
    - description: Indicates whether the categorization succeeded without errors.
      key: is_successful
      type: bool
    prd:
      conceptual_info: The node transforms a cleaned list of news headlines into topic‑labelled
        records, enabling downstream analytics such as sentiment, trend or clustering
        analysis. It normalizes headline text, applies a lightweight NLP classifier,
        and returns cardinality metrics for reporting.
      docstring:
        examples:
        - lines:
          - filtered = FilterNewsArticlesOutput(**{
          - '    ''filtered_article_ids'': [''Economic growth forecast'', ''Parliament
            passes new law'', ''Local community event''],'
          - '    ''removed_article_ids'': [],'
          - '    ''filter_success'': True'
          - '})'
          - result = categorize_news_articles(filtered)
          - print(result)
          output: CategorizeNewsArticlesOutput(article_titles=['Economic growth forecast',
            'Parliament passes new law', 'Local community event'], categories=['Economics',
            'Politics', 'Social Issues'], unique_category_count=3, article_count=3,
            is_successful=True)
        parameters:
        - description: Output from the filtering step containing the list of article
            titles to be categorized.
          name: filter_news_articles_input
          type: FilterNewsArticlesOutput
        raises:
        - description: Raised when `filtered_article_ids` is empty or not a list of
            strings.
          type: ValueError
        - description: Raised when the prior filtering step failed or an internal
            error occurs during categorization.
          type: RuntimeError
        returns:
          description: Structured output containing categorized titles, category list,
            and statistics.
          type: CategorizeNewsArticlesOutput
        summary: Categorizes news article titles by topic.
    prompt: Group news articles by topic or theme, using robust NLP classification,
      and return titles, categories, and summary statistics.
    shims: []
  compile_analysis_report:
    agent: false
    code_node_type: shim
    description: Generates a comprehensive and validated textual analysis report by
      integrating sentiment scores and trend data. Ensures robust validation, clear
      summaries, and structured output for downstream consumption.
    implementation: "import logging\nfrom typing import List\nfrom pydantic import\
      \ BaseModel, Field\n\n\ndef compile_analysis_report(\n    \"\"\"\n    Generates\
      \ a summarized analysis report from sentiment and trend data.\n\n    Parameters\n\
      \    ----------\n    analyze_sentiment_input : AnalyzeSentimentOutput\n    \
      \    Output of the analyze_sentiment node, including sentiment categories\n\
      \        and confidence scores.\n    identify_trends_input : IdentifyTrendsOutput\n\
      \        Output of the identify_trends node, including trending topics and\n\
      \        sentiment trends.\n\n    Returns\n    -------\n    CompileAnalysisReportOutput\n\
      \        Structured output containing the completed analysis report,\n     \
      \   summaries, and validation status.\n\n    Raises\n    ------\n    ValueError\n\
      \        Raised if input validation fails or if inconsistencies are found in\n\
      \        the inputs.\n    TypeError\n        Raised if input parameters are\
      \ of unexpected types.\n\n    Examples\n    --------\n    >>> analyze_output\
      \ = AnalyzeSentimentOutput(\n    ...     article_index=[0, 1],\n    ...    \
      \ sentiment_category=['positive', 'neutral'],\n    ...     sentiment_confidence=[0.95,\
      \ 0.78]\n    >>> )\n    >>> trends_output = IdentifyTrendsOutput(\n    ... \
      \    trending_topics=['AI', 'Climate Change'],\n    ...     sentiment_trends=['increasing\
      \ positive', 'stable neutral'],\n    ...     overall_trend_summary='AI topics\
      \ are gaining positivity while\n    climate sentiment remains neutral.'\n  \
      \  >>> )\n    >>> result = compile_analysis_report(\n    ...     analyze_sentiment_input=analyze_output,\n\
      \    ...     identify_trends_input=trends_output\n    >>> )\n    >>> print(result.report_text)\n\
      \    Full analysis report combining sentiment and trend insights.\n\n    \"\"\
      \"\n    analyze_sentiment_input: 'AnalyzeSentimentOutput',\n    identify_trends_input:\
      \ 'IdentifyTrendsOutput',\n    **kwargs: dict\n) -> 'CompileAnalysisReportOutput':\n\
      \    logger = logging.getLogger(__name__)\n\n    try:\n        if not analyze_sentiment_input\
      \ or not identify_trends_input:\n            raise ValueError(\"Input data for\
      \ sentiment analysis and trends cannot be empty.\")\n\n        sentiment_count\
      \ = {\n            \"positive\": analyze_sentiment_input.sentiment_category.count(\"\
      positive\"),\n            \"negative\": analyze_sentiment_input.sentiment_category.count(\"\
      negative\"),\n            \"neutral\": analyze_sentiment_input.sentiment_category.count(\"\
      neutral\")\n        }\n\n        sentiment_summary = (\n            f\"Sentiment\
      \ Distribution: Positive={sentiment_count['positive']}, \"\n            f\"\
      Neutral={sentiment_count['neutral']}, Negative={sentiment_count['negative']}\"\
      \n        )\n\n        trend_summary = (\n            identify_trends_input.overall_trend_summary\
      \ or\n            \"No notable trends were identified in the input data.\"\n\
      \        )\n\n        full_report = (\n            f\"Analysis Report\\n\\n\"\
      \n            f\"--- Sentiment Summary ---\\n{sentiment_summary}\\n\\n\"\n \
      \           f\"--- Trends ---\\n\"\n            f\"Topics: {', '.join(identify_trends_input.trending_topics)}\\\
      n\"\n            f\"Details: {trend_summary}\\n\"\n        )\n\n        return\
      \ CompileAnalysisReportOutput(\n            report_text=full_report,\n     \
      \       sentiment_summary=sentiment_summary,\n            trend_summary=trend_summary,\n\
      \            sentiment_per_article=analyze_sentiment_input.sentiment_category,\n\
      \            trend_topics=identify_trends_input.trending_topics,\n         \
      \   article_count=len(analyze_sentiment_input.sentiment_category),\n       \
      \     is_valid=True\n        )\n\n    except ValueError as e:\n        logger.error(\"\
      Input validation failed: %s\", e)\n        return CompileAnalysisReportOutput(\n\
      \            report_text=\"\", trend_summary=\"\", sentiment_summary=\"\",\n\
      \            sentiment_per_article=[], trend_topics=[], article_count=0, is_valid=False\n\
      \        )\n    except Exception as e:\n        logger.error(\"Unhandled error\
      \ during report compilation: %s\", e)\n        return CompileAnalysisReportOutput(\n\
      \            report_text=\"\", trend_summary=\"\", sentiment_summary=\"\",\n\
      \            sentiment_per_article=[], trend_topics=[], article_count=0, is_valid=False\n\
      \        )"
    name: compile_analysis_report
    nodes_depended_on:
    - analyze_sentiment
    - identify_trends
    nodes_dependent_on: []
    output_structure:
    - description: Full textual analysis report combining sentiment and trend insights.
      key: report_text
      type: str
    - description: Brief summary of overall sentiment distribution (positive/negative/neutral).
      key: sentiment_summary
      type: str
    - description: Brief summary of key trends identified across articles.
      key: trend_summary
      type: str
    - description: Sentiment category for each article in the order processed.
      key: sentiment_per_article
      type: List[str]
    - description: List of trending topics or themes identified in the articles.
      key: trend_topics
      type: List[str]
    - description: Total number of articles included in the analysis.
      key: article_count
      type: int
    - description: Flag indicating whether the report was generated successfully.
      key: is_valid
      type: bool
    prd:
      conceptual_info: This node aggregates sentiment analysis and trend detection
        results into a detailed report for downstream applications.
      docstring:
        examples:
        - lines:
          - analyze_output = AnalyzeSentimentOutput(
          - '    article_index=[0, 1],'
          - '    sentiment_category=[''positive'', ''neutral''],'
          - '    sentiment_confidence=[0.95, 0.78]'
          - )
          - trends_output = IdentifyTrendsOutput(
          - '    trending_topics=[''AI'', ''Climate Change''],'
          - '    sentiment_trends=[''increasing positive'', ''stable neutral''],'
          - '    overall_trend_summary=''AI topics are gaining positivity while climate
            sentiment remains neutral.'''
          - )
          - result = compile_analysis_report(
          - '    analyze_sentiment_input=analyze_output,'
          - '    identify_trends_input=trends_output'
          - )
          - print(result.report_text)
          output: Full analysis report combining sentiment and trend insights.
        parameters:
        - description: Output of the analyze_sentiment node, including sentiment categories
            and confidence scores.
          name: analyze_sentiment_input
          type: AnalyzeSentimentOutput
        - description: Output of the identify_trends node, including trending topics
            and sentiment trends.
          name: identify_trends_input
          type: IdentifyTrendsOutput
        raises:
        - description: Raised if input validation fails or if inconsistencies are
            found in the inputs.
          type: ValueError
        - description: Raised if input parameters are of unexpected types.
          type: TypeError
        returns:
          description: Structured output containing the completed analysis report,
            summaries, and validation status.
          type: CompileAnalysisReportOutput
        summary: Generates a summarized analysis report from sentiment and trend data.
    prompt: Combine sentiment and trend data into a full analysis report with validations
      and concise summaries.
    shims: []
  filter_news_articles:
    agent: false
    code_node_type: shim
    description: Enhances the original filtering logic by adding comprehensive input
      validation, detailed logging, and fallback handling to ensure reliability in
      downstream analyses.
    implementation: "import logging\nfrom typing import List\n\nfrom pydantic import\
      \ BaseModel, Field\n\nfrom ._filter_news_articles.validate_input_consistency\
      \ import validate_input_consistency\nfrom ._filter_news_articles.detect_duplicate_articles\
      \ import detect_duplicate_articles\nfrom ._filter_news_articles.identify_irrelevant_articles\
      \ import identify_irrelevant_articles\nfrom ._filter_news_articles.combine_removal_indices\
      \ import combine_removal_indices\nfrom ._filter_news_articles.get_remaining_indices\
      \ import get_remaining_indices\nfrom ._filter_news_articles.extract_article_ids\
      \ import extract_article_ids\n\n\nlogger = logging.getLogger(__name__)\n\nclass\
      \ SourceNewsArticlesOutput(BaseModel):\n    article_urls: List[str] = (\n  \
      \      Field(..., description='List of URLs for the news articles collected.')\n\
      \    )\n    article_titles: List[str] = (\n        Field(..., description='Headlines\
      \ of the news articles collected.')\n    )\n    article_texts: List[str] = (\n\
      \        Field(..., description='Full text content of each news article.')\n\
      \    )\n    article_sources: List[str] = (\n        Field(..., description='Names\
      \ of the sources from which each article was retrieved.')\n    )\n    article_count:\
      \ int = (\n        Field(..., description='Total number of news articles collected.')\n\
      \    )\n    fetch_successful: bool = (\n        Field(..., description='Indicates\
      \ whether the fetch operation succeeded.')\n    )\n\nclass FilterNewsArticlesOutput(BaseModel):\n\
      \    filtered_article_ids: List[str] = (\n        Field(..., description='List\
      \ of article identifiers or titles that passed the relevance and duplication\
      \ filters.')\n    )\n    removed_article_ids: List[str] = (\n        Field(...,\
      \ description='List of article identifiers or titles that were excluded due\
      \ to irrelevance or duplication.')\n    )\n    filter_success: bool = (\n  \
      \      Field(..., description='Indicates whether the filtering operation completed\
      \ successfully without errors.')\n    )\n\ndef filter_news_articles(source_news_articles_input:\
      \ SourceNewsArticlesOutput, **kwargs) -> FilterNewsArticlesOutput:\n    \"\"\
      \"\n    Filter news articles to remove irrelevant or duplicate entries.\n\n\
      \    Parameters\n    ----------\n    source_news_articles_input : SourceNewsArticlesOutput\n\
      \        Validated output from the source_news_articles node.\n\n    Returns\n\
      \    -------\n    FilterNewsArticlesOutput\n        Output containing filtered\
      \ and removed article ids, and a success\n        flag.\n\n    Raises\n    ------\n\
      \    ValueError\n        Raised when input validation fails.\n    RuntimeError\n\
      \        Raised when internal filtering logic encounters an unexpected error.\n\
      \n    Examples\n    --------\n    >>> from filter_news_articles import filter_news_articles,\n\
      \    SourceNewsArticlesOutput, FilterNewsArticlesOutput\n    >>> # Sample input\
      \ with three articles\n    >>> input_data = SourceNewsArticlesOutput(\n    ...\
      \     article_urls=['url1', 'url2', 'url3'],\n    ...     article_titles=['Title\
      \ A', 'Title B', 'Title C'],\n    ...     article_texts=['text A', 'text B',\
      \ 'text C'],\n    ...     article_sources=['Source X', 'Source Y', 'Source Z'],\n\
      \    ...     article_count=3,\n    ...     fetch_successful=True\n    >>> )\n\
      \    >>> output = filter_news_articles(input_data)\n    >>> print(output)\n\
      \    FilterNewsArticlesOutput(filtered_article_ids=['Title A', 'Title B', 'Title\n\
      \    C'], removed_article_ids=[], filter_success=True)\n\n    >>> # Sample input\
      \ with a duplicate title\n    >>> input_data = SourceNewsArticlesOutput(\n \
      \   ...     article_urls=['url1', 'url2', 'url3'],\n    ...     article_titles=['Title\
      \ A', 'Title B', 'Title B'],\n    ...     article_texts=['text A', 'text B',\
      \ 'text B'],\n    ...     article_sources=['Source X', 'Source Y', 'Source Y'],\n\
      \    ...     article_count=3,\n    ...     fetch_successful=True\n    >>> )\n\
      \    >>> output = filter_news_articles(input_data)\n    >>> print(output)\n\
      \    FilterNewsArticlesOutput(filtered_article_ids=['Title A', 'Title B'],\n\
      \    removed_article_ids=['Title B'], filter_success=True)\n\n    \"\"\"\n \
      \   try:\n        validate_input_consistency(\n            titles=source_news_articles_input.article_titles,\n\
      \            texts=source_news_articles_input.article_texts,\n            count=source_news_articles_input.article_count\n\
      \        )\n    except Exception as e:\n        logger.error('Input validation\
      \ failed: %s', e)\n        raise ValueError(f'Input validation error: {e}')\n\
      \    try:\n        duplicate_indices = detect_duplicate_articles(\n        \
      \    titles=source_news_articles_input.article_titles,\n            texts=source_news_articles_input.article_texts\n\
      \        )\n        irrelevant_indices = identify_irrelevant_articles(\n   \
      \         titles=source_news_articles_input.article_titles,\n            texts=source_news_articles_input.article_texts\n\
      \        )\n        removed_indices = combine_removal_indices(duplicates=duplicate_indices,\
      \ irrelevant=irrelevant_indices)\n        filtered_indices = get_remaining_indices(\n\
      \            total_count=source_news_articles_input.article_count,\n       \
      \     removed_indices=removed_indices\n        )\n        filtered_ids = extract_article_ids(\n\
      \            titles=source_news_articles_input.article_titles,\n           \
      \ indices=filtered_indices\n        )\n        removed_ids = extract_article_ids(\n\
      \            titles=source_news_articles_input.article_titles,\n           \
      \ indices=removed_indices\n        )\n        return FilterNewsArticlesOutput(\n\
      \            filtered_article_ids=filtered_ids,\n            removed_article_ids=removed_ids,\n\
      \            filter_success=True\n        )\n    except Exception as e:\n  \
      \      logger.exception('Filtering failed: %s', e)\n        return FilterNewsArticlesOutput(\n\
      \            filtered_article_ids=[],\n            removed_article_ids=[],\n\
      \            filter_success=False\n        )"
    name: filter_news_articles
    nodes_depended_on:
    - source_news_articles
    nodes_dependent_on: []
    output_structure:
    - description: List of article identifiers or titles that passed the relevance
        and duplication filters.
      key: filtered_article_ids
      type: List[str]
    - description: List of article identifiers or titles that were excluded due to
        irrelevance or duplication.
      key: removed_article_ids
      type: List[str]
    - description: Indicates whether the filtering operation completed successfully
        without errors.
      key: filter_success
