dag_type: plain_text
description: A workflow to create a simple cup of coffee
name: simple_coffee_workflow
nodes:
  boil_water:
    agent: false
    description: Boil water for the coffee
    name: boil_water
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Boil water to the appropriate temperature for brewing coffee.
  brew_coffee:
    agent: false
    description: Brew the coffee
    name: brew_coffee
    nodes_depended_on:
    - boil_water
    - prepare_coffee_maker
    nodes_dependent_on: []
    prompt: Pour the boiled water into the coffee maker and start the brewing process.
  measure_coffee:
    agent: false
    description: Measure the coffee grounds
    name: measure_coffee
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Measure the appropriate amount of coffee grounds for the desired number
      of cups.
  prepare_coffee_maker:
    agent: false
    description: Prepare the coffee maker
    name: prepare_coffee_maker
    nodes_depended_on:
    - measure_coffee
    nodes_dependent_on: []
    prompt: Put the measured coffee grounds into the coffee maker's filter.
  serve_coffee:
    agent: false
    description: Serve the coffee
    name: serve_coffee
    nodes_depended_on:
    - brew_coffee
    nodes_dependent_on: []
    prompt: Pour the freshly brewed coffee into a cup and serve.
