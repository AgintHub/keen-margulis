dag_type: shim
description: A workflow for building a trading system that includes data collection,
  analysis, and execution
name: tradingworkflow
nodes:
  analyze_market_trends:
    agent: false
    code_node_type: shim
    description: Analyze historical market data to identify trends
    implementation: "from ._analyze_market_trends.validate_input_data import validate_input_data\n\
      from ._analyze_market_trends.preprocess_price_data import preprocess_price_data\n\
      from ._analyze_market_trends.preprocess_volume_data import preprocess_volume_data\n\
      from ._analyze_market_trends.analyze_price_trends import analyze_price_trends\n\
      from ._analyze_market_trends.analyze_volume_trends import analyze_volume_trends\n\
      from ._analyze_market_trends.analyze_other_metrics import analyze_other_metrics\n\
      from ._analyze_market_trends.combine_trend_indicators import combine_trend_indicators\n\
      from ._analyze_market_trends.determine_trend_directions import determine_trend_directions\n\
      \nfrom pydantic import BaseModel, Field\nfrom typing import List\n\n\nclass\
      \ CollectHistoricalMarketDataOutput(BaseModel):\n    \"\"\"Pydantic model for\
      \ collect_historical_market_data node outputs.\"\"\"\n    historical_prices:\
      \ List[float] = (\n        Field(..., description=\"List of historical prices\"\
      )\n    )\n    historical_volumes: List[float] = (\n        Field(..., description=\"\
      List of historical volumes\")\n    )\n    other_metrics: List[str] = (\n   \
      \     Field(..., description=\"Other relevant historical metrics\")\n    )\n\
      \n\nclass AnalyzeMarketTrendsOutput(BaseModel):\n    \"\"\"Pydantic model for\
      \ analyze_market_trends node outputs.\"\"\"\n    trend_indicators: List[str]\
      \ = (\n        Field(..., description=\"List of trend indicators\")\n    )\n\
      \    trend_directions: List[str] = (\n        Field(..., description=\"List\
      \ of trend directions\")\n    )\n\n\ndef analyze_market_trends(collect_historical_market_data_input:\
      \ CollectHistoricalMarketDataOutput, **kwargs) -> AnalyzeMarketTrendsOutput:\n\
      \    \"\"\"\n    Analyze historical market data to identify trends and patterns,\
      \ returning\n    trend indicators and directions.\n\n    Parameters\n    ----------\n\
      \    historical_prices : List[float]\n        List of historical prices from\
      \ collect_historical_market_data\n    historical_volumes : List[float]\n   \
      \     List of historical volumes from collect_historical_market_data\n    other_metrics\
      \ : List[str]\n        Other relevant historical metrics from\n        collect_historical_market_data\n\
      \n    Returns\n    -------\n    Tuple[List[str], List[str]]\n        A tuple\
      \ containing a list of trend indicators and a list of trend\n        directions.\n\
      \n    Raises\n    ------\n    ValueError\n        If historical_prices, historical_volumes,\
      \ or other_metrics are empty\n        or inconsistent.\n\n    Examples\n   \
      \ --------\n    >>> historical_prices = [100.0, 105.0, 110.0, 115.0, 120.0]\n\
      \    >>> historical_volumes = [1000.0, 1200.0, 1500.0, 1800.0, 2000.0]\n   \
      \ >>> other_metrics = ['metric1', 'metric2', 'metric3', 'metric4', 'metric5']\n\
      \    >>> trend_indicators, trend_directions =\n    analyze_market_trends(historical_prices,\
      \ historical_volumes, other_metrics)\n    (['indicator1', 'indicator2'], ['up',\
      \ 'up'])\n\n    \"\"\"\n    validate_input_data(prices=collect_historical_market_data_input.historical_prices,\
      \ volumes=collect_historical_market_data_input.historical_volumes, metrics=collect_historical_market_data_input.other_metrics)\n\
      \    \n    cleaned_prices: List[float] = preprocess_price_data(prices=collect_historical_market_data_input.historical_prices)\n\
      \    cleaned_volumes: List[float] = preprocess_volume_data(volumes=collect_historical_market_data_input.historical_volumes)\n\
      \    \n    price_trends: List[str] = analyze_price_trends(prices=cleaned_prices)\n\
      \    volume_trends: List[str] = analyze_volume_trends(volumes=cleaned_volumes)\n\
      \    metric_indicators: List[str] = analyze_other_metrics(metrics=collect_historical_market_data_input.other_metrics)\n\
      \    \n    combined_indicators: List[str] = combine_trend_indicators(price_trends=price_trends,\
      \ volume_trends=volume_trends, metric_indicators=metric_indicators)\n    trend_directions:\
      \ List[str] = determine_trend_directions(indicators=combined_indicators, prices=cleaned_prices,\
      \ volumes=cleaned_volumes)\n    \n    return AnalyzeMarketTrendsOutput(trend_indicators=combined_indicators,\
      \ trend_directions=trend_directions)"
    name: analyze_market_trends
    nodes_depended_on:
    - collect_historical_market_data
    nodes_dependent_on:
    - identify_trading_opportunities
    output_structure:
    - description: List of trend indicators
      key: trend_indicators
      type: List[str]
    - description: List of trend directions
      key: trend_directions
      type: List[str]
