      \nfrom pydantic import BaseModel, Field\nfrom typing import List\n\n\nclass\
      \ AnalyzeStockTrendsOutput(BaseModel):\n    \"\"\"Pydantic model for analyze_stock_trends\
      \ node outputs.\"\"\"\n    trend_analysis: List[str] = (\n        Field(...,\
