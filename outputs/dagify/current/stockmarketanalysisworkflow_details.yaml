      \ description=\"Relative Strength Index values.\")\n    )\n    volatility: float\
      \ = (\n        Field(..., description=\"Stock price volatility measure.\")\n\
      \    )\n\n\nclass GenerateStockInsightsOutput(BaseModel):\n    \"\"\"Pydantic\
