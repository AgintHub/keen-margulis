dag_type: stub
description: Generated workflow from UI.
name: create_simple_workflow
nodes:
  create_task_dag:
    agent: false
    code_node_type: stub
    description: Create a Directed Acyclic Graph (DAG) of tasks.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass IdentifyTaskDependenciesOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for identify_task_dependencies node outputs.\"\"\"\n    task_names: List[str]\
      \ = (\n        Field(..., description=\"List of all task names identified from\
      \ decomposition.\")\n    )\n    dependency_pairs: List[str] = (\n        Field(...,\
      \ description=\"List of dependency relationships in the format 'TaskA -> TaskB'\
      \ indicating TaskA must be completed before TaskB can start.\")\n    )\n   \
      \ dependency_count: int = (\n        Field(..., description=\"Total number of\
      \ dependency relationships identified.\")\n    )\n\n\nclass CreateTaskDagOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for create_task_dag node outputs.\"\"\"\n    dag_nodes:\
      \ List[str] = (\n        Field(..., description=\"Ordered list of task identifiers\
      \ in the DAG.\")\n    )\n    dag_edges: List[str] = (\n        Field(..., description=\"\
      List of edges representing dependencies, formatted as 'source->target'.\")\n\
      \    )\n    is_acyclic: bool = (\n        Field(..., description=\"Indicates\
      \ whether the constructed DAG is acyclic.\")\n    )\n\n\ndef create_task_dag(identify_task_dependencies_input:\
      \ IdentifyTaskDependenciesOutput, **kwargs) -> CreateTaskDagOutput:\n    \"\"\
      \"\n    Constructs a Directed Acyclic Graph (DAG) of tasks from dependency\n\
      \    information, returning an ordered list of tasks, the edge list, and an\n\
      \    acyclicity flag.\n\n    Parameters\n    ----------\n    task_names : List[str]\n\
      \        All task identifiers identified from decomposition.\n    dependency_pairs\
      \ : List[str]\n        Dependency relationships in the format 'TaskA -> TaskB',\
      \ indicating\n        TaskA must complete before TaskB.\n    dependency_count\
      \ : int\n        Total number of dependency relationships identified.\n\n  \
      \  Returns\n    -------\n    Tuple[List[str], List[str], bool]\n        A tuple\
      \ containing the ordered list of tasks, the formatted edge\n        list, and\
      \ a boolean indicating if the DAG is acyclic.\n\n    Raises\n    ------\n  \
      \  ValueError\n        If the provided dependencies contain a cycle or if input\
      \ lists are\n        inconsistent.\n\n    Examples\n    --------\n    >>> dag_nodes,\
      \ dag_edges, is_acyclic = create_task_dag(     ['A', 'B', 'C'],\n    ['A ->\
      \ B', 'B -> C'],     2 )\n    >>> print(dag_nodes, dag_edges, is_acyclic)\n\
      \    (['A', 'B', 'C'], ['A->B', 'B->C'], True)\n\n    >>> try:\n    ...    \
      \ create_task_dag(['A', 'B'], ['A -> B', 'B -> A'], 2)\n    >>> except ValueError\
      \ as e:\n    ...     print(e)\n    \"Cycle detected in task dependencies: ['A\
      \ -> B', 'B -> A']\"\n\n    \"\"\"\n    return CreateTaskDagOutput(\n      \
      \  dag_nodes=[],\n        dag_edges=[],\n        is_acyclic=False,\n    )"
    name: create_task_dag
    nodes_depended_on:
    - identify_task_dependencies
    nodes_dependent_on: []
    output_structure:
    - description: Ordered list of task identifiers in the DAG.
      key: dag_nodes
      type: List[str]
    - description: List of edges representing dependencies, formatted as 'source->target'.
      key: dag_edges
      type: List[str]
    - description: Indicates whether the constructed DAG is acyclic.
      key: is_acyclic
      type: bool
    prd:
      conceptual_info: Builds a topological representation of tasks based on identified
        dependencies, ensuring no cycles exist and producing an execution order.
      docstring:
        examples:
        - lines:
          - "dag_nodes, dag_edges, is_acyclic = create_task_dag(\n    ['A', 'B', 'C'],\n\
            \    ['A -> B', 'B -> C'],\n    2\n)"
          - print(dag_nodes, dag_edges, is_acyclic)
          output: (['A', 'B', 'C'], ['A->B', 'B->C'], True)
        - lines:
          - 'try:'
          - '    create_task_dag([''A'', ''B''], [''A -> B'', ''B -> A''], 2)'
          - 'except ValueError as e:'
          - '    print(e)'
          output: '"Cycle detected in task dependencies: [''A -> B'', ''B -> A'']"'
        parameters:
        - description: All task identifiers identified from decomposition.
          name: task_names
          type: List[str]
        - description: Dependency relationships in the format 'TaskA -> TaskB', indicating
            TaskA must complete before TaskB.
          name: dependency_pairs
          type: List[str]
        - description: Total number of dependency relationships identified.
          name: dependency_count
          type: int
        raises:
        - description: If the provided dependencies contain a cycle or if input lists
            are inconsistent.
          type: ValueError
        returns:
          description: A tuple containing the ordered list of tasks, the formatted
            edge list, and a boolean indicating if the DAG is acyclic.
          type: Tuple[List[str], List[str], bool]
        summary: Constructs a Directed Acyclic Graph (DAG) of tasks from dependency
          information, returning an ordered list of tasks, the edge list, and an acyclicity
          flag.
    prompt: Using the task dependencies, construct a DAG that represents the workflow.
      Ensure it is acyclic and properly ordered.
    shims: []
  decompose_objective_into_tasks:
    agent: false
    code_node_type: stub
    description: Break down the workflow objective into fundamental tasks.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass DefineWorkflowObjectiveOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for define_workflow_objective node outputs.\"\"\"\n    objective: str = (\n\
      \        Field(..., description=\"Primary goal statement of the workflow\")\n\
      \    )\n\n\nclass DecomposeObjectiveIntoTasksOutput(BaseModel):\n    \"\"\"\
      Pydantic model for decompose_objective_into_tasks node outputs.\"\"\"\n    task_names:\
      \ List[str] = (\n        Field(..., description=\"List of task names identified\
      \ by decomposition.\")\n    )\n    task_descriptions: List[str] = (\n      \
      \  Field(..., description=\"Brief descriptions for each corresponding task.\"\
      )\n    )\n    num_tasks: int = Field(..., description=\"Total number of tasks\
      \ identified.\")\n\n\ndef decompose_objective_into_tasks(define_workflow_objective_input:\
      \ DefineWorkflowObjectiveOutput, **kwargs) -> DecomposeObjectiveIntoTasksOutput:\n\
      \    \"\"\"\n    Decomposes a workflow objective string into a list of task\
      \ names,\n    descriptions, and a task count.\n\n    Parameters\n    ----------\n\
      \    objective : str\n        Primary goal statement of the workflow provided\
      \ by\n        `define_workflow_objective`.\n\n    Returns\n    -------\n   \
      \ tuple[List[str], List[str], int]\n        A tuple containing: 1) list of task\
      \ names, 2) list of brief task\n        descriptions, 3) integer count of tasks.\n\
      \n    Raises\n    ------\n    ValueError\n        Raised when the `objective`\
      \ string is empty or cannot be parsed into\n        distinct tasks.\n\n    Examples\n\
      \    --------\n    >>> result = decompose_objective_into_tasks(\"Process customer\
      \ orders and\n    generate invoices\")\n    {'task_names': ['Process orders',\
      \ 'Generate invoices'], 'task_descriptions':\n    ['Handle incoming orders from\
      \ sales', 'Create and send invoices to\n    customers'], 'num_tasks': 2}\n\n\
      \    >>> result = decompose_objective_into_tasks(\"Collect data, clean data,\
      \ and\n    train a machine learning model\")\n    {'task_names': ['Collect data',\
      \ 'Clean data', 'Train ML model'],\n    'task_descriptions': ['Gather raw data\
      \ from sources', 'Perform data cleaning\n    and preprocessing', 'Train a predictive\
      \ model on cleaned data'],\n    'num_tasks': 3}\n\n    \"\"\"\n    return DecomposeObjectiveIntoTasksOutput(\n\
      \        task_names=[],\n        task_descriptions=[],\n        num_tasks=0,\n\
      \    )"
    name: decompose_objective_into_tasks
    nodes_depended_on:
    - define_workflow_objective
    nodes_dependent_on: []
    output_structure:
    - description: List of task names identified by decomposition.
      key: task_names
      type: List[str]
    - description: Brief descriptions for each corresponding task.
      key: task_descriptions
      type: List[str]
    - description: Total number of tasks identified.
      key: num_tasks
      type: int
    prd:
      conceptual_info: This node transforms a high‑level workflow goal into a concrete,
        actionable set of tasks. It interprets the objective text, extracts meaningful
        sub‑tasks, and returns an ordered list of task names, short descriptions,
        and the overall count. The decomposition is intentionally kept self‑contained
        so that downstream nodes can establish dependencies and construct a DAG.
      docstring:
        examples:
        - lines:
          - result = decompose_objective_into_tasks("Process customer orders and generate
            invoices")
          output: '{''task_names'': [''Process orders'', ''Generate invoices''], ''task_descriptions'':
            [''Handle incoming orders from sales'', ''Create and send invoices to
            customers''], ''num_tasks'': 2}'
        - lines:
          - result = decompose_objective_into_tasks("Collect data, clean data, and
            train a machine learning model")
          output: '{''task_names'': [''Collect data'', ''Clean data'', ''Train ML
            model''], ''task_descriptions'': [''Gather raw data from sources'', ''Perform
            data cleaning and preprocessing'', ''Train a predictive model on cleaned
            data''], ''num_tasks'': 3}'
        parameters:
        - description: Primary goal statement of the workflow provided by `define_workflow_objective`.
          name: objective
          type: str
        raises:
        - description: Raised when the `objective` string is empty or cannot be parsed
            into distinct tasks.
          type: ValueError
        returns:
          description: 'A tuple containing: 1) list of task names, 2) list of brief
            task descriptions, 3) integer count of tasks.'
          type: tuple[List[str], List[str], int]
        summary: Decomposes a workflow objective string into a list of task names,
          descriptions, and a task count.
    prompt: Decompose the workflow objective into individual, self-contained tasks
      or steps.
    shims: []
  define_workflow_objective:
    agent: false
    code_node_type: stub
    description: Define the objective of the workflow
    implementation: "from pydantic import BaseModel, Field\n\n\nclass DefineWorkflowObjectiveOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for define_workflow_objective node outputs.\"\"\"\n\
      \    objective: str = (\n        Field(..., description=\"Primary goal statement\
      \ of the workflow\")\n    )\n\n\ndef define_workflow_objective(general_input:\
      \ str, **kwargs) -> DefineWorkflowObjectiveOutput:\n    \"\"\"\n    Generate\
      \ a concise primary goal statement for the workflow.\n\n    Returns\n    -------\n\
      \    str\n        A natural‑language statement describing the workflow’s overall\n\
      \        objective.\n\n    Raises\n    ------\n    ValueError\n        If the\
      \ generated objective is empty or consists only of whitespace.\n\n    Examples\n\
      \    --------\n    >>> # Example 1: Basic workflow objective\n    >>> objective\
      \ = define_workflow_objective()\n    >>> print(objective)\n    'Automate the\
      \ ingestion, transformation, and reporting of sales data.'\n\n    >>> # Example\
      \ 2: High‑level objective for a data science pipeline\n    >>> objective = define_workflow_objective()\n\
      \    >>> print(objective)\n    'Deliver actionable insights from customer behavior\
      \ data through automated\n    analysis and visualization.'\n\n    \"\"\"\n \
      \   return DefineWorkflowObjectiveOutput(\n        objective=\"\",\n    )"
    name: define_workflow_objective
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Primary goal statement of the workflow
      key: objective
      type: str
    prd:
      conceptual_info: The node captures the high‑level purpose of the entire workflow,
        producing a single natural‑language sentence that guides downstream task decomposition.
      docstring:
        examples:
        - lines:
          - '# Example 1: Basic workflow objective'
          - objective = define_workflow_objective()
          - print(objective)
          output: '''Automate the ingestion, transformation, and reporting of sales
            data.'''
        - lines:
          - '# Example 2: High‑level objective for a data science pipeline'
          - objective = define_workflow_objective()
          - print(objective)
          output: '''Deliver actionable insights from customer behavior data through
            automated analysis and visualization.'''
        parameters: []
        raises:
        - description: If the generated objective is empty or consists only of whitespace.
          type: ValueError
        returns:
          description: A natural‑language statement describing the workflow’s overall
            objective.
          type: str
        summary: Generate a concise primary goal statement for the workflow.
    prompt: Clearly state the primary goal of the workflow. What is it intended to
      achieve?
    shims: []
  finalize_workflow:
    agent: false
    code_node_type: stub
    description: Finalize the workflow DAG
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass RefineDagOutput(BaseModel):\n    \"\"\"Pydantic model for refine_dag\
      \ node outputs.\"\"\"\n    dag_edges: List[str] = (\n        Field(..., description=\"\
      List of directed edges in the refined DAG, formatted as \\\"TaskA->TaskB\\\"\
      .\")\n    )\n    is_acyclic: bool = (\n        Field(..., description=\"Indicates\
      \ whether the refined DAG contains any cycles.\")\n    )\n    is_concurrent:\
      \ bool = (\n        Field(..., description=\"Indicates whether the DAG has been\
      \ adjusted to allow concurrent execution of independent tasks.\")\n    )\n \
      \   max_concurrency: int = (\n        Field(..., description=\"Maximum number\
      \ of tasks that can run concurrently in the refined DAG.\")\n    )\n\n\nclass\
      \ FinalizeWorkflowOutput(BaseModel):\n    \"\"\"Pydantic model for finalize_workflow\
      \ node outputs.\"\"\"\n    dag_is_complete: bool = (\n        Field(..., description=\"\
      Whether the DAG is fully defined and ready\")\n    )\n    dag_is_concurrent:\
      \ bool = (\n        Field(..., description=\"Whether the DAG has maximized concurrency\"\
      )\n    )\n    dag_is_acyclic: bool = (\n        Field(..., description=\"Whether\
      \ the DAG contains no cycles\")\n    )\n    adjusted_node_list: str = (\n  \
      \      Field(..., description=\"List of node names that were adjusted during\
      \ finalization\")\n    )\n    dag_summary: str = (\n        Field(..., description=\"\
      Human-readable summary of the finalized DAG\")\n    )\n\n\ndef finalize_workflow(refine_dag_input:\
      \ RefineDagOutput, **kwargs) -> FinalizeWorkflowOutput:\n    \"\"\"\n    Finalize\
      \ and validate a workflow DAG, ensuring it is complete, concurrent,\n    and\
      \ acyclic.\n\n    Parameters\n    ----------\n    dag_edges : List[str]\n  \
      \      Directed edges of the refined DAG, formatted as 'TaskA->TaskB'.\n   \
      \ is_acyclic : bool\n        True if the refined DAG contains no cycles.\n \
      \   is_concurrent : bool\n        True if the refined DAG already supports maximum\
      \ concurrency.\n    max_concurrency : int\n        Maximum number of tasks that\
      \ can run concurrently in the refined\n        DAG.\n\n    Returns\n    -------\n\
      \    dict\n        A dictionary with keys `dag_is_complete`, `dag_is_concurrent`,\n\
      \        `dag_is_acyclic`, `adjusted_node_list`, and `dag_summary`.\n\n    Raises\n\
      \    ------\n    ValueError\n        If `dag_edges` is empty or malformed.\n\
      \    RuntimeError\n        If the DAG cannot be made acyclic or fully concurrent\
      \ after\n        adjustments.\n\n    Examples\n    --------\n    >>> result\
      \ = finalize_workflow(dag_edges=['A->B', 'B->C'], is_acyclic=True,\n    is_concurrent=False,\
      \ max_concurrency=2)\n    >>> print(result)\n    {'dag_is_complete': True, 'dag_is_concurrent':\
      \ True, 'dag_is_acyclic': True,\n    'adjusted_node_list': ['B'], 'dag_summary':\
      \ 'DAG has 3 nodes and 2 edges.\n    Concurrency adjusted to 2.'}\n\n    >>>\
      \ try:\n    ...     finalize_workflow(dag_edges=[], is_acyclic=True, is_concurrent=True,\n\
      \    max_concurrency=1)\n    >>> except ValueError as e:\n    ...     print(e)\n\
      \    'dag_edges list is empty or contains malformed entries.'\n\n    \"\"\"\n\
      \    return FinalizeWorkflowOutput(\n        dag_is_complete=False,\n      \
      \  dag_is_concurrent=False,\n        dag_is_acyclic=False,\n        adjusted_node_list=\"\
      \",\n        dag_summary=\"\",\n    )"
    name: finalize_workflow
    nodes_depended_on:
    - refine_dag
    nodes_dependent_on: []
    output_structure:
    - description: Whether the DAG is fully defined and ready
      key: dag_is_complete
      type: bool
    - description: Whether the DAG has maximized concurrency
      key: dag_is_concurrent
      type: bool
    - description: Whether the DAG contains no cycles
      key: dag_is_acyclic
      type: bool
    - description: List of node names that were adjusted during finalization
      key: adjusted_node_list
      type: str
    - description: Human-readable summary of the finalized DAG
      key: dag_summary
      type: str
    prd:
      conceptual_info: The `finalize_workflow` node validates the refined DAG for
        completeness, acyclicity, and optimal concurrency. It performs any last‑minute
        adjustments such as re‑ordering parallel branches or inserting dummy synchronization
        nodes, and produces a concise summary of the final graph.
      docstring:
        examples:
        - lines:
          - result = finalize_workflow(dag_edges=['A->B', 'B->C'], is_acyclic=True,
            is_concurrent=False, max_concurrency=2)
          - print(result)
          output: '{''dag_is_complete'': True, ''dag_is_concurrent'': True, ''dag_is_acyclic'':
            True, ''adjusted_node_list'': [''B''], ''dag_summary'': ''DAG has 3 nodes
            and 2 edges. Concurrency adjusted to 2.''}'
        - lines:
          - 'try:'
          - '    finalize_workflow(dag_edges=[], is_acyclic=True, is_concurrent=True,
            max_concurrency=1)'
          - 'except ValueError as e:'
          - '    print(e)'
          output: '''dag_edges list is empty or contains malformed entries.'''
        parameters:
        - description: Directed edges of the refined DAG, formatted as 'TaskA->TaskB'.
          name: dag_edges
          type: List[str]
        - description: True if the refined DAG contains no cycles.
          name: is_acyclic
          type: bool
        - description: True if the refined DAG already supports maximum concurrency.
          name: is_concurrent
          type: bool
        - description: Maximum number of tasks that can run concurrently in the refined
            DAG.
          name: max_concurrency
          type: int
        raises:
        - description: If `dag_edges` is empty or malformed.
          type: ValueError
        - description: If the DAG cannot be made acyclic or fully concurrent after
            adjustments.
          type: RuntimeError
        returns:
          description: A dictionary with keys `dag_is_complete`, `dag_is_concurrent`,
            `dag_is_acyclic`, `adjusted_node_list`, and `dag_summary`.
          type: dict
        summary: Finalize and validate a workflow DAG, ensuring it is complete, concurrent,
          and acyclic.
    prompt: Confirm that the workflow DAG is complete, concurrent, and acyclic. Make
      any final adjustments as needed.
    shims: []
  identify_task_dependencies:
    agent: false
    code_node_type: stub
    description: Determines precedence relationships among tasks produced by the decomposition
      step, producing an explicit list of dependency pairs.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass DecomposeObjectiveIntoTasksOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for decompose_objective_into_tasks node outputs.\"\"\"\n    task_names:\
      \ List[str] = (\n        Field(..., description=\"List of task names identified\
      \ by decomposition.\")\n    )\n    task_descriptions: List[str] = (\n      \
      \  Field(..., description=\"Brief descriptions for each corresponding task.\"\
      )\n    )\n    num_tasks: int = Field(..., description=\"Total number of tasks\
      \ identified.\")\n\n\nclass IdentifyTaskDependenciesOutput(BaseModel):\n   \
      \ \"\"\"Pydantic model for identify_task_dependencies node outputs.\"\"\"\n\
      \    task_names: List[str] = (\n        Field(..., description=\"List of all\
      \ task names identified from decomposition.\")\n    )\n    dependency_pairs:\
      \ List[str] = (\n        Field(..., description=\"List of dependency relationships\
      \ in the format 'TaskA -> TaskB' indicating TaskA must be completed before TaskB\
      \ can start.\")\n    )\n    dependency_count: int = (\n        Field(..., description=\"\
      Total number of dependency relationships identified.\")\n    )\n\n\ndef identify_task_dependencies(decompose_objective_into_tasks_input:\
      \ DecomposeObjectiveIntoTasksOutput, **kwargs) -> IdentifyTaskDependenciesOutput:\n\
      \    \"\"\"\n    Identify dependencies between decomposed tasks and return a\
      \ list of\n    dependency pairs.\n\n    Parameters\n    ----------\n    task_names\
      \ : List[str]\n        Names of the individual tasks produced by the decomposition\
      \ step.\n    task_descriptions : List[str]\n        Brief textual descriptions\
      \ of each task corresponding to task_names.\n\n    Returns\n    -------\n  \
      \  Dict[str, Any]\n        A dictionary containing three keys:  - 'task_names'\
      \ (List[str]): The\n        original list of task names. - 'dependency_pairs'\
      \ (List[str]):\n        Explicit dependencies formatted as 'TaskA -> TaskB'.\
      \ -\n        'dependency_count' (int): Total number of dependencies identified.\n\
      \n    Raises\n    ------\n    ValueError\n        If task_names and task_descriptions\
      \ are of different lengths, or if\n        either list is empty.\n\n    Examples\n\
      \    --------\n    >>> task_names = ['Collect Data', 'Clean Data', 'Analyze\
      \ Data']\n    >>> task_descriptions = ['Gather raw data', 'Remove noise', 'Run\
      \ statistical\n    models']\n    >>> result = identify_task_dependencies(task_names,\
      \ task_descriptions)\n    >>> print(result['dependency_pairs'])\n    ['Collect\
      \ Data -> Clean Data', 'Clean Data -> Analyze Data']\n\n    >>> task_names =\
      \ ['Design Model', 'Train Model', 'Validate Model', 'Deploy\n    Model']\n \
      \   >>> task_descriptions = ['Create architecture', 'Fit parameters', 'Evaluate\n\
      \    performance', 'Release to production']\n    >>> result = identify_task_dependencies(task_names,\
      \ task_descriptions)\n    >>> print(result['dependency_count'])\n    3\n\n \
      \   \"\"\"\n    return IdentifyTaskDependenciesOutput(\n        task_names=[],\n\
      \        dependency_pairs=[],\n        dependency_count=0,\n    )"
    name: identify_task_dependencies
    nodes_depended_on:
    - decompose_objective_into_tasks
    nodes_dependent_on: []
    output_structure:
    - description: List of all task names identified from decomposition.
      key: task_names
      type: List[str]
    - description: List of dependency relationships in the format 'TaskA -> TaskB'
        indicating TaskA must be completed before TaskB can start.
      key: dependency_pairs
      type: List[str]
    - description: Total number of dependency relationships identified.
      key: dependency_count
      type: int
    prd:
      conceptual_info: This node takes the set of tasks generated by the decomposition
        step and infers which tasks must precede others, producing a set of explicit
        dependency pairs that can be used to construct a DAG.
      docstring:
        examples:
        - lines:
          - task_names = ['Collect Data', 'Clean Data', 'Analyze Data']
          - task_descriptions = ['Gather raw data', 'Remove noise', 'Run statistical
            models']
          - result = identify_task_dependencies(task_names, task_descriptions)
          - print(result['dependency_pairs'])
          output: '[''Collect Data -> Clean Data'', ''Clean Data -> Analyze Data'']'
        - lines:
          - task_names = ['Design Model', 'Train Model', 'Validate Model', 'Deploy
            Model']
          - task_descriptions = ['Create architecture', 'Fit parameters', 'Evaluate
            performance', 'Release to production']
          - result = identify_task_dependencies(task_names, task_descriptions)
          - print(result['dependency_count'])
          output: '3'
        parameters:
        - description: Names of the individual tasks produced by the decomposition
            step.
          name: task_names
          type: List[str]
        - description: Brief textual descriptions of each task corresponding to task_names.
          name: task_descriptions
          type: List[str]
        raises:
        - description: If task_names and task_descriptions are of different lengths,
            or if either list is empty.
          type: ValueError
        returns:
          description: 'A dictionary containing three keys:


            - ''task_names'' (List[str]): The original list of task names.

            - ''dependency_pairs'' (List[str]): Explicit dependencies formatted as
            ''TaskA -> TaskB''.

            - ''dependency_count'' (int): Total number of dependencies identified.'
          type: Dict[str, Any]
        summary: Identify dependencies between decomposed tasks and return a list
          of dependency pairs.
    prompt: Analyze the tasks and identify any dependencies between them. Which tasks
      must be completed before others can start?
    shims: []
  refine_dag:
    agent: false
    code_node_type: stub
    description: Refine the DAG to maximize concurrency and ensure acyclicity.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass CreateTaskDagOutput(BaseModel):\n    \"\"\"Pydantic model for create_task_dag\
      \ node outputs.\"\"\"\n    dag_nodes: List[str] = (\n        Field(..., description=\"\
      Ordered list of task identifiers in the DAG.\")\n    )\n    dag_edges: List[str]\
      \ = (\n        Field(..., description=\"List of edges representing dependencies,\
      \ formatted as 'source->target'.\")\n    )\n    is_acyclic: bool = (\n     \
