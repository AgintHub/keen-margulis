dag_type: shim
description: Generated workflow from UI.
name: create_simple_workflow
nodes:
  create_task_dag:
    agent: false
    code_node_type: stub
    description: Constructs a directed acyclic graph (DAG) from explicit dependency
      pairs, performs a topological sort to produce a deterministic execution order,
      and validates that the graph contains no cycles. The node returns the ordered
      task list, the dependency edge list in compact form, and a boolean flag indicating
      acyclicity.
    implementation: "import logging\nfrom collections import defaultdict, deque\n\
      from typing import Set, List\n\n\nlog = logging.getLogger(__name__)\n\n\ndef\
      \ _parse_edge(edge: str) -> tuple[str, str]:\n    \"\"\"\n    Creates a DAG\
      \ from dependency pairs and returns an execution order.\n\n    Parameters\n\
      \    ----------\n    identify_task_dependencies_input : IdentifyTaskDependenciesOutput\n\
      \        Output from the identify_task_dependencies node containing task\n \
      \       names and dependency pairs.\n    kwargs : dict\n        Additional keyword\
      \ arguments for future extensions.\n\n    Returns\n    -------\n    CreateTaskDagOutput\n\
      \        Dataclass containing the ordered task list, edge list, and\n      \
      \  acyclicity flag.\n\n    Raises\n    ------\n    ValueError\n        If input\
      \ validation fails or a cycle is detected in the dependency\n        graph.\n\
      \n    Examples\n    --------\n    >>> from your_module import create_task_dag,\
      \ IdentifyTaskDependenciesOutput\n    >>> input_data = IdentifyTaskDependenciesOutput(\n\
      \    ...     task_names=[\"A\", \"B\", \"C\"],\n    ...     dependency_pairs=[\"\
      A -> B\", \"B -> C\"],\n    ...     dependency_count=2\n    >>> )\n    >>> output\
      \ = create_task_dag(input_data)\n    >>> print(output.dag_nodes, output.dag_edges,\
      \ output.is_acyclic)\n    [\"A\", \"B\", \"C\"] ['A->B', 'B->C'] True\n\n  \
      \  \"\"\"\n    parts = [p.strip() for p in edge.split('->')]\n    if len(parts)\
      \ != 2 or not parts[0] or not parts[1]:\n        raise ValueError(f\"Invalid\
      \ dependency format: '{edge}'. Expected 'TaskA -> TaskB'\")\n    return parts[0],\
      \ parts[1]\n\n\ndef create_task_dag(identify_task_dependencies_input: IdentifyTaskDependenciesOutput,\
      \ **kwargs) -> CreateTaskDagOutput:\n    \"\"\"\n    Constructs a Directed Acyclic\
      \ Graph (DAG) from dependency pairs and returns an execution order.\n    \"\"\
      \"\n    task_names = identify_task_dependencies_input.task_names\n    dependency_pairs\
      \ = identify_task_dependencies_input.dependency_pairs\n    dependency_count\
      \ = identify_task_dependencies_input.dependency_count\n\n    if not isinstance(task_names,\
      \ list) or not all(isinstance(t, str) and t for t in task_names):\n        raise\
      \ ValueError(\"task_names must be a list of non-empty strings\")\n    if not\
      \ isinstance(dependency_pairs, list) or not all(isinstance(d, str) and d for\
      \ d in dependency_pairs):\n        raise ValueError(\"dependency_pairs must\
      \ be a list of non-empty strings\")\n    if dependency_count != len(dependency_pairs):\n\
      \        raise ValueError(\"dependency_count does not match the number of dependency_pairs\"\
      )\n\n    task_set: Set[str] = set(task_names)\n    adjacency: defaultdict[str,\
      \ Set[str]] = defaultdict(set)\n    indegree: defaultdict[str, int] = defaultdict(int)\n\
      \n    for pair in dependency_pairs:\n        src, dst = _parse_edge(pair)\n\
      \        if src == dst:\n            raise ValueError(f\"Self‑dependency detected:\
      \ '{src}' -> '{dst}'\")\n        if src not in task_set or dst not in task_set:\n\
      \            raise ValueError(f\"Dependency references unknown task: '{pair}'\"\
      )\n        if dst not in adjacency[src]:\n            adjacency[src].add(dst)\n\
      \            indegree[dst] += 1\n            if src not in indegree:\n     \
      \           indegree[src] += 0\n\n    zero_indegree = deque([t for t in task_names\
      \ if indegree[t] == 0])\n    topo_order: List[str] = []\n    while zero_indegree:\n\
      \        node = zero_indegree.popleft()\n        topo_order.append(node)\n \
      \       for neighbor in adjacency[node]:\n            indegree[neighbor] -=\
      \ 1\n            if indegree[neighbor] == 0:\n                zero_indegree.append(neighbor)\n\
      \n    is_acyclic = len(topo_order) == len(task_names)\n    if not is_acyclic:\n\
      \        cycle_nodes = [t for t in task_names if indegree[t] > 0]\n        raise\
      \ ValueError(f\"Cycle detected in task dependencies involving: {cycle_nodes}\"\
      )\n\n    dag_edges = [f\"{src}->{dst}\" for src in adjacency for dst in adjacency[src]]\n\
      \n    return CreateTaskDagOutput(\n        dag_nodes=topo_order,\n        dag_edges=dag_edges,\n\
      \        is_acyclic=is_acyclic\n    )"
    name: create_task_dag
    nodes_depended_on:
    - identify_task_dependencies
    nodes_dependent_on: []
    output_structure:
    - description: Ordered list of task identifiers in the DAG.
      key: dag_nodes
      type: List[str]
    - description: List of edges representing dependencies, formatted as 'source->target'.
      key: dag_edges
      type: List[str]
    - description: Indicates whether the constructed DAG is acyclic.
      key: is_acyclic
      type: bool
    prd:
      conceptual_info: Builds a topological representation of tasks based on identified
        dependencies, ensuring no cycles exist and producing an execution order.
      docstring:
        examples:
        - lines:
          - from your_module import create_task_dag, IdentifyTaskDependenciesOutput
          - input_data = IdentifyTaskDependenciesOutput(
          - '    task_names=["A", "B", "C"],'
          - '    dependency_pairs=["A -> B", "B -> C"],'
          - '    dependency_count=2'
          - )
          - output = create_task_dag(input_data)
          - print(output.dag_nodes, output.dag_edges, output.is_acyclic)
          output: '["A", "B", "C"] [''A->B'', ''B->C''] True'
        parameters:
        - description: Output from the identify_task_dependencies node containing
            task names and dependency pairs.
          name: identify_task_dependencies_input
          type: IdentifyTaskDependenciesOutput
        - description: Additional keyword arguments for future extensions.
          name: kwargs
          type: dict
        raises:
        - description: If input validation fails or a cycle is detected in the dependency
            graph.
          type: ValueError
        returns:
          description: Dataclass containing the ordered task list, edge list, and
            acyclicity flag.
          type: CreateTaskDagOutput
        summary: Creates a DAG from dependency pairs and returns an execution order.
    prompt: Using the task dependencies, construct a DAG that represents the workflow.
      Ensure it is acyclic and properly ordered.
    shims: []
  decompose_objective_into_tasks:
    agent: false
    code_node_type: shim
    description: Captures the high‑level purpose of a workflow as a single natural‑language
      sentence, ensuring clarity and consistency for downstream decomposition.
    implementation: "from ._decompose_objective_into_tasks.validate_input_type_and_content\
      \ import validate_input_type_and_content\nfrom ._decompose_objective_into_tasks.sanitize_and_normalize_text\
      \ import sanitize_and_normalize_text\nfrom ._decompose_objective_into_tasks.enhance_objective_clarity\
      \ import enhance_objective_clarity\nfrom ._decompose_objective_into_tasks.apply_workflow_formatting_standards\
      \ import apply_workflow_formatting_standards\n\nimport logging\nfrom pydantic\
      \ import BaseModel, Field\n\n\nlogger = logging.getLogger(__name__)\n\nclass\
      \ DefineWorkflowObjectiveOutput(BaseModel):\n    objective: str = (\n      \
      \  Field(..., description=\"Primary goal statement of the workflow\")\n    )\n\
      \ndef define_workflow_objective(general_input: str, **kwargs) -> DefineWorkflowObjectiveOutput:\n\
      \    \"\"\"\n    Return a validated objective string.\n\n    Parameters\n  \
      \  ----------\n    general_input : str\n        Human‑readable description of\
      \ the desired workflow.\n\n    Returns\n    -------\n    DefineWorkflowObjectiveOutput\n\
      \        A pydantic model containing the validated objective.\n\n    Raises\n\
      \    ------\n    ValueError\n        If the input is empty, non‑string, or only\
      \ whitespace.\n\n    Examples\n    --------\n    >>> from your_package import\
      \ define_workflow_objective\n    >>> objective_output = define_workflow_objective(\"\
      Automate the ingestion,\n    transformation, and reporting of sales data.\"\
      )\n    >>> print(objective_output.objective)\n    \"Automate the ingestion,\
      \ transformation, and reporting of sales data.\"\n\n    \"\"\"\n    validated_input:\
      \ str = validate_input_type_and_content(input_value=general_input)\n    cleaned_objective:\
      \ str = sanitize_and_normalize_text(text=validated_input)\n    enhanced_objective:\
      \ str = enhance_objective_clarity(objective=cleaned_objective)\n    final_objective:\
      \ str = apply_workflow_formatting_standards(objective=enhanced_objective)\n\
      \    return DefineWorkflowObjectiveOutput(objective=final_objective)"
    name: decompose_objective_into_tasks
    nodes_depended_on:
    - define_workflow_objective
    nodes_dependent_on: []
    output_structure:
    - description: List of task names identified by decomposition.
      key: task_names
      type: List[str]
    - description: Brief descriptions for each corresponding task.
      key: task_descriptions
      type: List[str]
    - description: Total number of tasks identified.
      key: num_tasks
      type: int
    prd:
      conceptual_info: This node serves as the foundational description of a workflow.
        By accepting a human‑friendly prompt and validating it, it guarantees that
        downstream nodes start from a well‑formed objective, reducing ambiguity and
        improving maintainability.
      docstring:
        examples:
        - lines:
          - from your_package import define_workflow_objective
          - objective_output = define_workflow_objective("Automate the ingestion,
            transformation, and reporting of sales data.")
          - print(objective_output.objective)
          output: '"Automate the ingestion, transformation, and reporting of sales
            data."'
        parameters:
        - description: Human‑readable description of the desired workflow.
          name: general_input
          type: str
        raises:
        - description: If the input is empty, non‑string, or only whitespace.
          type: ValueError
        returns:
          description: A pydantic model containing the validated objective.
          type: DefineWorkflowObjectiveOutput
        summary: Return a validated objective string.
    prompt: Provide a concise primary goal statement for the workflow.
    shims:
    - agent: false
      code_node_type: virtual-stub
      description: Validates that the input is a non‑empty string and returns the
        input trimmed of leading and trailing whitespace.
      implementation: "def validate_input_type_and_content(input_value: str) -> str:\n\
        \    \"\"\"\n    Validate the input type and content for workflow objective\
        \ definition,\n    ensuring the input is a non‑empty string and trimming extraneous\
        \ whitespace.\n\n    Parameters\n    ----------\n    input_value : str\n \
        \       The raw input string to validate and clean.\n\n    Returns\n    -------\n\
        \    str\n        A cleaned string with leading and trailing whitespace removed;\
        \ may\n        raise exceptions if validation fails.\n\n    Raises\n    ------\n\
        \    ValueError\n        Raised when the input string is empty or contains\
        \ only whitespace.\n    TypeError\n        Raised when the input is not of\
        \ type str.\n\n    Examples\n    --------\n    >>> validate_input_type_and_content('\
        \  Hello World  ')\n    'Hello World'\n\n    >>> validate_input_type_and_content('Python\
        \ 3.11')\n    'Python 3.11'\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: validate_input_type_and_content
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type str
        key: output
        type: str
      - description: Input parameter of type str
        key: input_value
        type: str
      prd:
        conceptual_info: Ensures that the provided input is a non‑empty string, performs
          basic sanity checks, and returns the cleaned string for downstream workflow
          processing.
        docstring:
          examples:
          - lines:
            - validate_input_type_and_content('  Hello World  ')
            output: '''Hello World'''
          - lines:
            - validate_input_type_and_content('Python 3.11')
            output: '''Python 3.11'''
          parameters:
          - description: The raw input string to validate and clean.
            name: input_value
            type: str
          raises:
          - description: Raised when the input string is empty or contains only whitespace.
            type: ValueError
          - description: Raised when the input is not of type str.
            type: TypeError
          returns:
            description: A cleaned string with leading and trailing whitespace removed;
              may raise exceptions if validation fails.
            type: str
          summary: Validate the input type and content for workflow objective definition,
            ensuring the input is a non‑empty string and trimming extraneous whitespace.
      prompt: 'Implement validate_input_type_and_content(input_value: str) -> str
        that performs type and content validation on the input string and returns
        a cleaned version.'
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Sanitizes and normalizes raw input text into a clean, consistent
        string suitable for downstream processing.
      implementation: "def sanitize_and_normalize_text(text: str) -> str:\n    \"\"\
        \"\n    Sanitize and normalize a text string, ensuring it is trimmed, single-spaced,\n\
        \    printable, and line breaks are standardized.\n\n    Parameters\n    ----------\n\
        \    text : str\n        Raw input text that may contain irregular spacing,\
        \ line breaks, or\n        non-printable characters.\n\n    Returns\n    -------\n\
        \    str\n        The cleaned text string with uniform spacing and line breaks.\n\
        \n    Raises\n    ------\n    TypeError\n        Raised if the input is not\
        \ a string.\n    ValueError\n        Raised if the input is an empty string\
        \ or contains only whitespace\n        after sanitization.\n\n    Examples\n\
        \    --------\n    >>> sanitize_and_normalize_text('  Hello   world  ')\n\
        \    'Hello world'\n\n    >>> sanitize_and_normalize_text('Line1\\nLine2')\n\
        \    'Line1 Line2'\n\n    \"\"\"\n    raise NotImplementedError(\"This is\
        \ a virtual stub node that needs to be implemented\")"
      name: sanitize_and_normalize_text
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type str
        key: output
        type: str
      - description: Input parameter of type str
        key: text
        type: str
      prd:
        conceptual_info: This shim normalizes raw user input by trimming whitespace,
          collapsing consecutive spaces, removing non-printable characters, and standardizing
          line breaks into a single space, producing a clean, consistent string ready
          for further processing.
        docstring:
          examples:
          - lines:
            - sanitize_and_normalize_text('  Hello   world  ')
            output: '''Hello world'''
          - lines:
            - sanitize_and_normalize_text('Line1\nLine2')
            output: '''Line1 Line2'''
          parameters:
          - description: Raw input text that may contain irregular spacing, line breaks,
              or non-printable characters.
            name: text
            type: str
          raises:
          - description: Raised if the input is not a string.
            type: TypeError
          - description: Raised if the input is an empty string or contains only whitespace
              after sanitization.
            type: ValueError
          returns:
            description: The cleaned text string with uniform spacing and line breaks.
            type: str
          summary: Sanitize and normalize a text string, ensuring it is trimmed, single-spaced,
            printable, and line breaks are standardized.
      prompt: sanitize_and_normalize_text(text)
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Refines an objective statement to be clearer, more specific, and
        action‑oriented.
      implementation: "def enhance_objective_clarity(objective: str) -> str:\n   \
        \ \"\"\"\n    Improve the clarity of an objective by refining wording, adding\
        \ specificity,\n    and ensuring an actionable, concise statement.\n\n   \
        \ Parameters\n    ----------\n    objective : str\n        The raw objective\
        \ statement to be enhanced.\n\n    Returns\n    -------\n    str\n       \
        \ A refined objective statement that is clear, specific, and\n        actionable.\n\
        \n    Raises\n    ------\n    TypeError\n        If the `objective` parameter\
        \ is not a string.\n    ValueError\n        If the `objective` parameter is\
        \ empty or contains only whitespace.\n\n    Examples\n    --------\n    >>>\
        \ enhance_objective_clarity('Improve user engagement')\n    'Increase user\
        \ engagement by 20% within six months.'\n\n    >>> enhance_objective_clarity('Create\
        \ a more robust system')\n    'Develop a robust, fault‑tolerant system that\
        \ can handle 10,000 concurrent\n    users.'\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: enhance_objective_clarity
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type str
        key: output
        type: str
      - description: Input parameter of type str
        key: objective
        type: str
      prd:
        conceptual_info: This shim takes a raw objective string and produces a more
          precise, actionable statement suitable for workflow design.
        docstring:
          examples:
          - lines:
            - enhance_objective_clarity('Improve user engagement')
            output: '''Increase user engagement by 20% within six months.'''
          - lines:
            - enhance_objective_clarity('Create a more robust system')
            output: '''Develop a robust, fault‑tolerant system that can handle 10,000
              concurrent users.'''
          parameters:
          - description: The raw objective statement to be enhanced.
            name: objective
            type: str
          raises:
          - description: If the `objective` parameter is not a string.
            type: TypeError
          - description: If the `objective` parameter is empty or contains only whitespace.
            type: ValueError
          returns:
            description: A refined objective statement that is clear, specific, and
              actionable.
            type: str
          summary: Improve the clarity of an objective by refining wording, adding
            specificity, and ensuring an actionable, concise statement.
      prompt: Enhance the clarity of the objective statement by refining wording,
        adding specificity, and ensuring concise actionable goals.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Formats a workflow objective string into a standardized format
        suitable for downstream processing.
      implementation: "def apply_workflow_formatting_standards(objective: str) ->\
        \ str:\n    \"\"\"\n    Applies workflow formatting standards to the given\
        \ objective string.\n\n    Parameters\n    ----------\n    objective : str\n\
        \        The raw workflow objective that needs standardization.\n\n    Returns\n\
        \    -------\n    str\n        The objective string after applying formatting\
        \ standards such as\n        trimming whitespace, normalizing sentence case,\
        \ and ensuring a\n        single period at the end.\n\n    Raises\n    ------\n\
        \    TypeError\n        Raised if `objective` is not a string.\n    ValueError\n\
        \        Raised if `objective` is empty or consists only of whitespace.\n\n\
        \    Examples\n    --------\n    >>> formatted = apply_workflow_formatting_standards('design\
        \ a user-friendly\n    interface')\n    >>> print(formatted)\n    'Design\
        \ a user-friendly interface.'\n\n    >>> formatted = apply_workflow_formatting_standards('\
        \   create a test plan\n    and    review  ')\n    >>> print(formatted)\n\
        \    'Create a test plan and review.'\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: apply_workflow_formatting_standards
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type str
        key: output
        type: str
      - description: Input parameter of type str
        key: objective
        type: str
      prd:
        conceptual_info: This shim ensures that a workflow objective is cleaned, standardized,
