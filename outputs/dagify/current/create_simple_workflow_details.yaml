        docstring:
          examples:
          - lines:
            - formatted = apply_workflow_formatting_standards('design a user-friendly
              interface')
            - print(formatted)
            output: '''Design a user-friendly interface.'''
          - lines:
            - formatted = apply_workflow_formatting_standards('   create a test plan
              and    review  ')
            - print(formatted)
            output: '''Create a test plan and review.'''
          parameters:
          - description: The raw workflow objective that needs standardization.
            name: objective
            type: str
          raises:
          - description: Raised if `objective` is not a string.
            type: TypeError
          - description: Raised if `objective` is empty or consists only of whitespace.
            type: ValueError
          returns:
            description: The objective string after applying formatting standards
              such as trimming whitespace, normalizing sentence case, and ensuring
              a single period at the end.
            type: str
          summary: Applies workflow formatting standards to the given objective string.
      prompt: 'Implement `apply_workflow_formatting_standards(objective: str) -> str`
        that enforces workflow formatting standards.'
      shims: []
  define_workflow_objective:
    agent: false
    code_node_type: shim
    description: Creates a clear, single-sentence statement that defines the primary
      goal of the entire workflow, serving as a guiding beacon for downstream task
      decomposition.
    implementation: "from ._define_workflow_objective.validate_input_string import\
      \ validate_input_string\nfrom ._define_workflow_objective.clean_and_normalize_input\
      \ import clean_and_normalize_input\nfrom ._define_workflow_objective.generate_objective_statement\
      \ import generate_objective_statement\nfrom ._define_workflow_objective.create_output_model\
      \ import create_output_model\n\nimport logging\nfrom typing import Any\nfrom\
      \ pydantic import BaseModel, Field\n\n\nlogger = logging.getLogger(__name__)\n\
      \nclass DefineWorkflowObjectiveOutput(BaseModel):\n    objective: str = (\n\
      \        Field(..., description=\"Primary goal statement of the workflow\")\n\
      \    )\n\ndef define_workflow_objective(general_input: str, **kwargs: Any) ->\
      \ DefineWorkflowObjectiveOutput:\n    \"\"\"\n    Defines the workflow’s primary\
      \ objective statement.\n\n    Parameters\n    ----------\n    general_input\
      \ : str\n        High‑level description or context used to generate the objective.\n\
      \n    Returns\n    -------\n    DefineWorkflowObjectiveOutput\n        Object\
      \ containing the primary goal sentence.\n\n    Raises\n    ------\n    ValueError\n\
      \        If the input is empty or consists only of whitespace.\n\n    Examples\n\
      \    --------\n    >>> output = define_workflow_objective(\"automate data ingestion\
      \ and\n    reporting\")\n    >>> print(output.objective)\n    \"The primary\
      \ objective of this workflow is to automate data ingestion and\n    reporting.\"\
      \n\n    \"\"\"\n    validated_input: str = validate_input_string(input_value=general_input)\n\
      \    cleaned_input: str = clean_and_normalize_input(raw_input=validated_input)\n\
      \    objective_statement: str = generate_objective_statement(cleaned_description=cleaned_input)\n\
      \    output_model: DefineWorkflowObjectiveOutput = create_output_model(objective=objective_statement)\n\
      \    return output_model"
    name: define_workflow_objective
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Primary goal statement of the workflow
      key: objective
      type: str
    prd:
      conceptual_info: Captures the high-level purpose of the workflow in a single
        natural-language sentence, ensuring all downstream tasks align with a clear,
        actionable goal.
      docstring:
        examples:
        - lines:
          - output = define_workflow_objective("automate data ingestion and reporting")
          - print(output.objective)
          output: '"The primary objective of this workflow is to automate data ingestion
            and reporting."'
        parameters:
        - description: High‑level description or context used to generate the objective.
          name: general_input
          type: str
        raises:
        - description: If the input is empty or consists only of whitespace.
          type: ValueError
        returns:
          description: Object containing the primary goal sentence.
          type: DefineWorkflowObjectiveOutput
        summary: Defines the workflow’s primary objective statement.
    prompt: Generate a concise, single-sentence objective for the workflow based on
      the provided context or description.
    shims:
    - agent: false
      code_node_type: virtual-stub
      description: Validates and normalizes a string input for the workflow objective
        function.
      implementation: "def validate_input_string(input_value: str) -> str:\n    \"\
        \"\"\n    Validate a string input, ensuring it is non-empty and contains meaningful\n\
        \    content, then strip extraneous whitespace.\n\n    Parameters\n    ----------\n\
        \    input_value : str\n        The raw string provided by the user.\n\n \
        \   Returns\n    -------\n    str\n        A clean, non-empty string with\
        \ leading and trailing whitespace\n        removed.\n\n    Raises\n    ------\n\
        \    ValueError\n        Raised when the input is an empty string or contains\
        \ only\n        whitespace.\n    TypeError\n        Raised when the input\
        \ is not of type `str`.\n\n    Examples\n    --------\n    >>> validated =\
        \ validate_input_string('  Hello, Workflow!  ')\n    'Hello, Workflow!'\n\n\
        \    >>> validate_input_string('   ')\n    ValueError: Input string must contain\
        \ at least one non-whitespace character\n\n    >>> validate_input_string(42)\n\
        \    TypeError: input_value must be a string\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: validate_input_string
      nodes_depended_on: []
      nodes_dependent_on: []
