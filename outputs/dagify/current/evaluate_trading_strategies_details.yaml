dag_type: shim
description: Generated workflow from UI.
name: evaluate_trading_strategies
nodes:
  analyze_market_trends:
    agent: false
    code_node_type: shim
    description: Analyze market trends based on historical data to predict future
      movements.
    implementation: "from ._analyze_market_trends.validate_input_data import validate_input_data\n\
      from ._analyze_market_trends.preprocess_price_data import preprocess_price_data\n\
      from ._analyze_market_trends.preprocess_volume_data import preprocess_volume_data\n\
      from ._analyze_market_trends.preprocess_metrics_data import preprocess_metrics_data\n\
      from ._analyze_market_trends.analyze_price_trends import analyze_price_trends\n\
      from ._analyze_market_trends.analyze_volume_trends import analyze_volume_trends\n\
      from ._analyze_market_trends.analyze_metric_trends import analyze_metric_trends\n\
      from ._analyze_market_trends.combine_trend_predictions import combine_trend_predictions\n\
      from ._analyze_market_trends.calculate_confidence_levels import calculate_confidence_levels\n\
      \nfrom pydantic import BaseModel, Field\nfrom typing import List\n\n\nclass\
      \ GatherMarketDataOutput(BaseModel):\n    \"\"\"Pydantic model for gather_market_data\
      \ node outputs.\"\"\"\n    stock_prices: List[float] = (\n        Field(...,\
      \ description=\"Current prices of relevant stocks\")\n    )\n    trading_volumes:\
      \ List[int] = (\n        Field(..., description=\"Current trading volumes of\
      \ relevant stocks\")\n    )\n    market_metrics: List[str] = (\n        Field(...,\
      \ description=\"Other relevant market metrics\")\n    )\n\n\nclass AnalyzeMarketTrendsOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for analyze_market_trends node outputs.\"\"\"\n  \
      \  trend_predictions: List[str] = (\n        Field(..., description=\"Predictions\
      \ of future market trends.\")\n    )\n    trend_confidence: List[float] = (\n\
      \        Field(..., description=\"Confidence levels in trend predictions.\"\
      )\n    )\n\n\ndef analyze_market_trends(gather_market_data_input: GatherMarketDataOutput,\
      \ **kwargs) -> AnalyzeMarketTrendsOutput:\n    \"\"\"\n    Analyze historical\
      \ market data to predict future trends and their confidence\n    levels.\n\n\
      \    Parameters\n    ----------\n    stock_prices : List[float]\n        Historical\
      \ prices of relevant stocks.\n    trading_volumes : List[int]\n        Historical\
      \ trading volumes of relevant stocks.\n    market_metrics : List[str]\n    \
      \    Other relevant historical market metrics.\n\n    Returns\n    -------\n\
      \    Tuple[List[str], List[float]]\n        A tuple containing a list of trend\
      \ predictions and a list of their\n        corresponding confidence levels.\n\
      \n    Raises\n    ------\n    ValueError\n        If the input lists are of\
      \ different lengths or if the data is\n        inconsistent.\n\n    Examples\n\
      \    --------\n    >>> stock_prices = [100.0, 120.0, 110.0]\n    >>> trading_volumes\
      \ = [1000, 1200, 1100]\n    >>> market_metrics = ['metric1', 'metric2', 'metric3']\n\
      \    >>> trend_predictions, trend_confidence =\n    analyze_market_trends(stock_prices,\
      \ trading_volumes, market_metrics)\n    (['uptrend', 'downtrend'], [0.8, 0.7])\n\
      \n    >>> stock_prices = [90.0, 100.0, 95.0]\n    >>> trading_volumes = [900,\
      \ 1000, 950]\n    >>> market_metrics = ['metric4', 'metric5', 'metric6']\n \
      \   >>> trend_predictions, trend_confidence =\n    analyze_market_trends(stock_prices,\
      \ trading_volumes, market_metrics)\n    (['uptrend', 'downtrend'], [0.85, 0.75])\n\
      \n    \"\"\"\n    validate_input_data(stock_prices=gather_market_data_input.stock_prices,\
      \ trading_volumes=gather_market_data_input.trading_volumes, market_metrics=gather_market_data_input.market_metrics)\n\
      \    \n    processed_price_data: List[float] = preprocess_price_data(prices=gather_market_data_input.stock_prices)\n\
      \    processed_volume_data: List[float] = preprocess_volume_data(volumes=gather_market_data_input.trading_volumes)\n\
      \    processed_metrics_data: List[float] = preprocess_metrics_data(metrics=gather_market_data_input.market_metrics)\n\
      \    \n    price_trends: List[str] = analyze_price_trends(price_data=processed_price_data)\n\
      \    volume_trends: List[str] = analyze_volume_trends(volume_data=processed_volume_data)\n\
      \    metric_trends: List[str] = analyze_metric_trends(metrics_data=processed_metrics_data)\n\
      \    \n    combined_predictions: List[str] = combine_trend_predictions(price_trends=price_trends,\
      \ volume_trends=volume_trends, metric_trends=metric_trends)\n    confidence_scores:\
      \ List[float] = calculate_confidence_levels(price_data=processed_price_data,\
      \ volume_data=processed_volume_data, metrics_data=processed_metrics_data, predictions=combined_predictions)\n\
      \    \n    return AnalyzeMarketTrendsOutput(\n        trend_predictions=combined_predictions,\n\
      \        trend_confidence=confidence_scores\n    )"
    name: analyze_market_trends
    nodes_depended_on:
    - gather_market_data
    nodes_dependent_on: []
    output_structure:
    - description: Predictions of future market trends.
      key: trend_predictions
      type: List[str]
    - description: Confidence levels in trend predictions.
      key: trend_confidence
      type: List[float]
    prd:
      conceptual_info: This node analyzes historical market data to predict future
        market trends and their confidence levels.
      docstring:
        examples:
        - lines:
          - stock_prices = [100.0, 120.0, 110.0]
          - trading_volumes = [1000, 1200, 1100]
          - market_metrics = ['metric1', 'metric2', 'metric3']
          - trend_predictions, trend_confidence = analyze_market_trends(stock_prices,
            trading_volumes, market_metrics)
          output: (['uptrend', 'downtrend'], [0.8, 0.7])
        - lines:
          - stock_prices = [90.0, 100.0, 95.0]
          - trading_volumes = [900, 1000, 950]
          - market_metrics = ['metric4', 'metric5', 'metric6']
          - trend_predictions, trend_confidence = analyze_market_trends(stock_prices,
            trading_volumes, market_metrics)
          output: (['uptrend', 'downtrend'], [0.85, 0.75])
        parameters:
        - description: Historical prices of relevant stocks.
          name: stock_prices
          type: List[float]
        - description: Historical trading volumes of relevant stocks.
          name: trading_volumes
          type: List[int]
        - description: Other relevant historical market metrics.
          name: market_metrics
          type: List[str]
        raises:
        - description: If the input lists are of different lengths or if the data
            is inconsistent.
          type: ValueError
        returns:
          description: A tuple containing a list of trend predictions and a list of
            their corresponding confidence levels.
          type: Tuple[List[str], List[float]]
        summary: Analyze historical market data to predict future trends and their
          confidence levels.
    prompt: Analyze historical market data to identify trends.
    shims:
    - agent: false
      code_node_type: virtual-stub
      description: This shim validates market data inputs, ensuring they are correctly
        formatted and contain plausible values before analysis.
      implementation: "def validate_input_data(stock_prices: str, trading_volumes:\
        \ str, market_metrics: str) -> str:\n    \"\"\"\n    Validate JSON‑encoded\
        \ market data arrays for correct type and content.\n\n    Parameters\n   \
        \ ----------\n    stock_prices : str\n        JSON string representing a list\
        \ of float stock prices.\n    trading_volumes : str\n        JSON string representing\
        \ a list of integer trading volumes.\n    market_metrics : str\n        JSON\
        \ string representing a list of string metric identifiers.\n\n    Returns\n\
        \    -------\n    str\n        A status message, e.g., 'Validation passed',\
        \ indicating that all\n        inputs were successfully validated.\n\n   \
        \ Raises\n    ------\n    ValueError\n        If any input list is empty,\
        \ contains wrong data types, or fails\n        semantic checks (e.g., negative\
        \ prices).\n    TypeError\n        If any argument is not a string.\n\n  \
        \  Examples\n    --------\n    >>> result = validate_input_data(stock_prices='[100.5,\
        \ 101.2]',\n    trading_volumes='[10000, 15000]', market_metrics='[\"volume\"\
        , \"price\"]')\n    'Validation passed'\n\n    >>> try:\n    ...     validate_input_data(stock_prices='[100.5,\
        \ \"abc\"]',\n    trading_volumes='[10000, 15000]', market_metrics='[\"volume\"\
        , \"price\"]')\n    >>> except ValueError as e:\n    ...     print(str(e))\n\
        \    'stock_prices contains invalid elements: expected float values.'\n\n\
        \    \"\"\"\n    raise NotImplementedError(\"This is a virtual stub node that\
        \ needs to be implemented\")"
      name: validate_input_data
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type Any
        key: output
        type: str
      - description: Input parameter of type str
        key: stock_prices
        type: str
      - description: Input parameter of type str
        key: trading_volumes
        type: str
      - description: Input parameter of type str
        key: market_metrics
        type: str
      prd:
        conceptual_info: The validate_input_data shim ensures that the raw market
          data provided to downstream analysis functions is syntactically correct
          and semantically meaningful, preventing runtime errors and data quality
          issues.
        docstring:
          examples:
          - lines:
            - result = validate_input_data(stock_prices='[100.5, 101.2]', trading_volumes='[10000,
              15000]', market_metrics='["volume", "price"]')
            output: '''Validation passed'''
          - lines:
            - 'try:'
            - '    validate_input_data(stock_prices=''[100.5, "abc"]'', trading_volumes=''[10000,
              15000]'', market_metrics=''["volume", "price"]'')'
            - 'except ValueError as e:'
            - '    print(str(e))'
            output: '''stock_prices contains invalid elements: expected float values.'''
          parameters:
          - description: JSON string representing a list of float stock prices.
            name: stock_prices
            type: str
          - description: JSON string representing a list of integer trading volumes.
            name: trading_volumes
            type: str
          - description: JSON string representing a list of string metric identifiers.
            name: market_metrics
            type: str
          raises:
          - description: If any input list is empty, contains wrong data types, or
              fails semantic checks (e.g., negative prices).
            type: ValueError
          - description: If any argument is not a string.
            type: TypeError
          returns:
            description: A status message, e.g., 'Validation passed', indicating that
              all inputs were successfully validated.
            type: str
          summary: Validate JSON‑encoded market data arrays for correct type and content.
      prompt: Implement a function `validate_input_data` that accepts three JSON string
        arguments—`stock_prices`, `trading_volumes`, and `market_metrics`—parses them
        into lists, verifies that `stock_prices` is a non‑empty list of floats, `trading_volumes`
        is a non‑empty list of ints, and `market_metrics` is a non‑empty list of strings,
        and returns a single status string. The function should raise a `ValueError`
        with a clear message if validation fails and a `TypeError` if any argument
        is not a string.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Preprocesses raw stock price data by validating, filtering invalid
        entries, and sorting the remaining prices.
      implementation: "from typing import List\n\n\ndef preprocess_price_data(prices:\
        \ str) -> List[float]:\n    \"\"\"\n    Preprocesses raw stock price data\
        \ by validating the input list, filtering\n    out non‑numeric or negative\
        \ entries, sorting the remaining values, and\n    returning the cleaned list.\n\
        \n    Parameters\n    ----------\n    prices : List[float]\n        A list\
        \ of raw stock prices to be cleaned. Each element should\n        represent\
        \ a price as a float.\n\n    Returns\n    -------\n    List[float]\n     \
        \   A list containing only valid, non‑negative stock prices sorted in\n  \
        \      ascending order.\n\n    Raises\n    ------\n    TypeError\n       \
        \ Raised if `prices` is not a list.\n    ValueError\n        Raised if any\
        \ element in `prices` cannot be cast to float or if the\n        list is empty\
        \ after cleaning.\n\n    Examples\n    --------\n    >>> preprocess_price_data([100.0,\
        \ 101.5, 99.3])\n    [99.3, 100.0, 101.5]\n\n    >>> preprocess_price_data([100.0,\
        \ -5.0, 102.0])\n    [100.0, 102.0]\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: preprocess_price_data
      nodes_depended_on: []
