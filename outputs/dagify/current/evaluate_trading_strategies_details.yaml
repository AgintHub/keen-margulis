      prd:
        conceptual_info: The shim preprocess_price_data serves to sanitize and normalize
          raw price inputs so that downstream analysis functions receive clean, reliable
          numeric data.
        docstring:
          examples:
          - lines:
            - preprocess_price_data([100.0, 101.5, 99.3])
            output: '[99.3, 100.0, 101.5]'
          - lines:
            - preprocess_price_data([100.0, -5.0, 102.0])
            output: '[100.0, 102.0]'
          parameters:
          - description: A list of raw stock prices to be cleaned. Each element should
              represent a price as a float.
            name: prices
            type: List[float]
          raises:
          - description: Raised if `prices` is not a list.
            type: TypeError
          - description: Raised if any element in `prices` cannot be cast to float
              or if the list is empty after cleaning.
            type: ValueError
          returns:
            description: A list containing only valid, non‑negative stock prices sorted
              in ascending order.
            type: List[float]
          summary: Preprocesses raw stock price data by validating the input list,
            filtering out non‑numeric or negative entries, sorting the remaining values,
            and returning the cleaned list.
      prompt: 'Implement a function `preprocess_price_data(prices: List[float]) ->
        List[float]` that validates the input, removes any non-numeric or negative
