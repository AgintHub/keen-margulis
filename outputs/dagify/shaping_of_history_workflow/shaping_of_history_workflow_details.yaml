    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass IdentifyKeyFactorsOutput(BaseModel):\n    \"\"\"Pydantic model for\
      \ identify_key_factors node outputs.\"\"\"\n    social_factors: List[str] =\
      \ (\n        Field(..., description=\"List of primary social factors that influenced\
      \ the event or period.\")\n    )\n    political_factors: List[str] = (\n   \
      \     Field(..., description=\"List of primary political factors that influenced\
      \ the event or period.\")\n    )\n    economic_factors: List[str] = (\n    \
      \    Field(..., description=\"List of primary economic factors that influenced\
      \ the event or period.\")\n    )\n    cultural_factors: List[str] = (\n    \
      \    Field(..., description=\"List of primary cultural factors that influenced\
      \ the event or period.\")\n    )\n\n\nclass AnalyzeSocialInfluencesOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for analyze_social_influences node outputs.\"\"\"\n\
      \    number_of_factors: int = (\n        Field(..., description=\"Total number\
      \ of distinct social factors identified.\")\n    )\n    social_factors: str\
      \ = (\n        Field(..., description=\"List of names or brief descriptions\
      \ of each social factor that influenced the event.\")\n    )\n    impact_scores:\
      \ float = (\n        Field(..., description=\"Impact rating for each social\
      \ factor on a scale from 0.0 (minimal) to 1.0 (major). Order corresponds to\
      \ the social_factors list.\")\n    )\n    summary: str = (\n        Field(...,\
      \ description=\"A concise narrative summarizing how the identified social factors\
      \ interacted to shape the historical event.\")\n    )\n\n\ndef analyze_social_influences(identify_key_factors_input:\
      \ IdentifyKeyFactorsOutput, **kwargs) -> AnalyzeSocialInfluencesOutput:\n  \
      \  \"\"\"\n    Analyze the social influences on a historical event, assigning\
      \ impact scores\n    and summarizing their combined effect.\n\n    Parameters\n\
      \    ----------\n    input_social_factors : List[str]\n        List of primary\
      \ social factors returned by the parent node\n        `identify_key_factors`.\n\
      \n    Returns\n    -------\n    Dict[str, Any]\n        A dictionary containing\
      \ the number of factors, the list of social\n        factors, their impact scores,\
      \ and a summary narrative.\n\n    Raises\n    ------\n    ValueError\n     \
      \   Raised when `input_social_factors` is empty or None.\n\n    Examples\n \
      \   --------\n    >>> result = analyze_social_influences([\"Women’s suffrage\"\
      , \"Urbanization\"])\n    {\"number_of_factors\": 2, \"social_factors\": [\"\
      Women’s suffrage\",\n    \"Urbanization\"], \"impact_scores\": [0.8, 0.6], \"\
      summary\": \"Women’s suffrage\n    and urbanization combined accelerated democratic\
      \ reforms.\"}\n\n    >>> result = analyze_social_influences([\"Industrial labor\
      \ strikes\"])\n    {\"number_of_factors\": 1, \"social_factors\": [\"Industrial\
      \ labor strikes\"],\n    \"impact_scores\": [0.7], \"summary\": \"Industrial\
      \ labor strikes pressured\n    governments to enact labor protections.\"}\n\n\
      \    \"\"\"\n    return AnalyzeSocialInfluencesOutput(\n        number_of_factors=0,\n\
      \        social_factors=\"\",\n        impact_scores=0.0,\n        summary=\"\
      \",\n    )"
    name: analyze_social_influences
    nodes_depended_on:
    - identify_key_factors
    nodes_dependent_on: []
    output_structure:
