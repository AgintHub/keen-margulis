    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass IdentifyKeyFactorsOutput(BaseModel):\n    \"\"\"Pydantic model for\
      \ identify_key_factors node outputs.\"\"\"\n    social_factors: List[str] =\
      \ (\n        Field(..., description=\"List of primary social factors that influenced\
      \ the event or period.\")\n    )\n    political_factors: List[str] = (\n   \
      \     Field(..., description=\"List of primary political factors that influenced\
      \ the event or period.\")\n    )\n    economic_factors: List[str] = (\n    \
      \    Field(..., description=\"List of primary economic factors that influenced\
      \ the event or period.\")\n    )\n    cultural_factors: List[str] = (\n    \
      \    Field(..., description=\"List of primary cultural factors that influenced\
      \ the event or period.\")\n    )\n\n\nclass AnalyzeEconomicInfluencesOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for analyze_economic_influences node outputs.\"\"\"\
      \n    economic_factor_name: str = (\n        Field(..., description=\"Name of\
      \ the economic factor considered.\")\n    )\n    impact_summary: str = (\n \
      \       Field(..., description=\"Brief description of how this factor impacted\
      \ the event.\")\n    )\n    evidence_sources: str = (\n        Field(..., description=\"\
      List of primary source references or data points supporting the analysis.\"\
      )\n    )\n    impact_strength: float = (\n        Field(..., description=\"\
      Rating of the factor's impact strength on a scale from 0 to 1.\")\n    )\n \
      \   time_period_affected: str = (\n        Field(..., description=\"Time period\
      \ during which the factor was most influential.\")\n    )\n    is_consensus:\
      \ bool = (\n        Field(..., description=\"Whether there is scholarly consensus\
      \ on the factor's significance.\")\n    )\n\n\ndef analyze_economic_influences(identify_key_factors_input:\
      \ IdentifyKeyFactorsOutput, **kwargs) -> AnalyzeEconomicInfluencesOutput:\n\
      \    \"\"\"\n    Analyzes each economic factor from the input list and returns\
      \ a structured\n    assessment of its impact on the historical event or period.\n\
      \n    Parameters\n    ----------\n    economic_factors : List[str]\n       \
      \ List of economic factors identified by the `identify_key_factors`\n      \
      \  node.\n\n    Returns\n    -------\n    List[Dict[str, Any]]\n        A list\
      \ of dictionaries, each containing structured information about\n        an\
      \ economic factor.\n\n    Raises\n    ------\n    ValueError\n        Raised\
      \ when the `economic_factors` list is empty.\n    TypeError\n        Raised\
      \ when `economic_factors` is not a list of strings.\n\n    Examples\n    --------\n\
      \    >>> analyze_economic_influences(['Inflation', 'Trade Embargo'])\n    [{'economic_factor_name':\
      \ 'Inflation', 'impact_summary': 'High inflation\n    reduced purchasing power\
      \ and disrupted domestic markets.',\n    'evidence_sources': ['Economic Report\
      \ 1931', 'Historical GDP Data'],\n    'impact_strength': 0.85, 'time_period_affected':\
      \ '1931-1933',\n    'is_consensus': True}, {'economic_factor_name': 'Trade Embargo',\n\
      \    'impact_summary': 'The embargo limited exports, weakening the national\n\
      \    economy.', 'evidence_sources': ['Trade Records 1940', 'Diplomatic\n   \
      \ Correspondence'], 'impact_strength': 0.70, 'time_period_affected':\n    '1940-1945',\
      \ 'is_consensus': False}]\n\n    >>> analyze_economic_influences(['Industrial\
      \ Production Growth'])\n    [{'economic_factor_name': 'Industrial Production\
      \ Growth', 'impact_summary':\n    'Rapid industrial growth fueled wartime manufacturing.',\
      \ 'evidence_sources':\n    ['Industrial Production Index 1944'], 'impact_strength':\
      \ 0.90,\n    'time_period_affected': '1942-1945', 'is_consensus': True}]\n\n\
      \    \"\"\"\n    return AnalyzeEconomicInfluencesOutput(\n        economic_factor_name=\"\
      \",\n        impact_summary=\"\",\n        evidence_sources=\"\",\n        impact_strength=0.0,\n\
      \        time_period_affected=\"\",\n        is_consensus=False,\n    )"
    name: analyze_economic_influences
    nodes_depended_on:
    - identify_key_factors
    nodes_dependent_on: []
    output_structure:
    - description: Name of the economic factor considered.
      key: economic_factor_name
      type: str
    - description: Brief description of how this factor impacted the event.
      key: impact_summary
      type: str
    - description: List of primary source references or data points supporting the
        analysis.
      key: evidence_sources
      type: str
    - description: Rating of the factor's impact strength on a scale from 0 to 1.
      key: impact_strength
      type: float
    - description: Time period during which the factor was most influential.
      key: time_period_affected
      type: str
    - description: Whether there is scholarly consensus on the factor's significance.
      key: is_consensus
      type: bool
    prd:
      conceptual_info: Transforms a list of economic factors identified by the parent
        node into a structured assessment that quantifies each factor's influence
        on the historical event.
      docstring:
        examples:
        - lines:
          - analyze_economic_influences(['Inflation', 'Trade Embargo'])
          output: '[{''economic_factor_name'': ''Inflation'', ''impact_summary'':
            ''High inflation reduced purchasing power and disrupted domestic markets.'',
            ''evidence_sources'': [''Economic Report 1931'', ''Historical GDP Data''],
            ''impact_strength'': 0.85, ''time_period_affected'': ''1931-1933'', ''is_consensus'':
            True}, {''economic_factor_name'': ''Trade Embargo'', ''impact_summary'':
            ''The embargo limited exports, weakening the national economy.'', ''evidence_sources'':
            [''Trade Records 1940'', ''Diplomatic Correspondence''], ''impact_strength'':
            0.70, ''time_period_affected'': ''1940-1945'', ''is_consensus'': False}]'
        - lines:
          - analyze_economic_influences(['Industrial Production Growth'])
          output: '[{''economic_factor_name'': ''Industrial Production Growth'', ''impact_summary'':
            ''Rapid industrial growth fueled wartime manufacturing.'', ''evidence_sources'':
            [''Industrial Production Index 1944''], ''impact_strength'': 0.90, ''time_period_affected'':
            ''1942-1945'', ''is_consensus'': True}]'
        parameters:
        - description: List of economic factors identified by the `identify_key_factors`
            node.
          name: economic_factors
          type: List[str]
        raises:
        - description: Raised when the `economic_factors` list is empty.
          type: ValueError
        - description: Raised when `economic_factors` is not a list of strings.
          type: TypeError
        returns:
          description: A list of dictionaries, each containing structured information
            about an economic factor.
          type: List[Dict[str, Any]]
        summary: Analyzes each economic factor from the input list and returns a structured
          assessment of its impact on the historical event or period.
    prompt: Evaluate the economic conditions, trade, or financial events that impacted
      the historical event or period.
    shims: []
  analyze_political_influences:
    agent: false
    code_node_type: stub
    description: Investigate the political factors that shaped the historical event
      or period.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass IdentifyKeyFactorsOutput(BaseModel):\n    \"\"\"Pydantic model for\
      \ identify_key_factors node outputs.\"\"\"\n    social_factors: List[str] =\
      \ (\n        Field(..., description=\"List of primary social factors that influenced\
      \ the event or period.\")\n    )\n    political_factors: List[str] = (\n   \
      \     Field(..., description=\"List of primary political factors that influenced\
      \ the event or period.\")\n    )\n    economic_factors: List[str] = (\n    \
      \    Field(..., description=\"List of primary economic factors that influenced\
      \ the event or period.\")\n    )\n    cultural_factors: List[str] = (\n    \
      \    Field(..., description=\"List of primary cultural factors that influenced\
      \ the event or period.\")\n    )\n\n\nclass AnalyzePoliticalInfluencesOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for analyze_political_influences node outputs.\"\"\
      \"\n    political_decisions: List[str] = (\n        Field(..., description=\"\
      Key political decisions that influenced the historical event or period.\")\n\
      \    )\n    policies_influenced: List[str] = (\n        Field(..., description=\"\
      Policies enacted that had an impact on the event or period.\")\n    )\n    leadership_figures:\
      \ List[str] = (\n        Field(..., description=\"Principal political leaders\
      \ or figures involved in shaping the event.\")\n    )\n    summary: str = (\n\
      \        Field(..., description=\"Concise summary of political influence on\
      \ the event.\")\n    )\n\n\ndef analyze_political_influences(identify_key_factors_input:\
      \ IdentifyKeyFactorsOutput, **kwargs) -> AnalyzePoliticalInfluencesOutput:\n\
      \    \"\"\"\n    Generates a structured summary of the political influences\
      \ affecting a\n    historical event, based on primary political factors identified\
      \ by the\n    previous node.\n\n    Parameters\n    ----------\n    political_factors\
      \ : List[str]\n        List of primary political factors (e.g., treaties, revolutions,\n\
      \        wars) supplied by the identify_key_factors node.\n\n    Returns\n \
      \   -------\n    Dict[str, Any]\n        A dictionary containing four keys:\
      \ - political_decisions: List of\n        key decisions. - policies_influenced:\
      \ List of policies that were\n        enacted. - leadership_figures: List of\
      \ main political leaders. -\n        summary: A concise narrative describing\
      \ the political influence.\n\n    Raises\n    ------\n    ValueError\n     \
      \   Raised if political_factors is empty or None.\n    TypeError\n        Raised\
      \ if political_factors is not a list.\n\n    Examples\n    --------\n    >>>\
      \ result = analyze_political_influences([\n    ...     'Treaty of Versailles',\n\
      \    ...     'French Revolution',\n    ...     'Napoleonic Wars'\n    >>> ])\n\
      \    >>> print(result['summary'])\n    \"The Treaty of Versailles, the French\
      \ Revolution, and the Napoleonic Wars\n    collectively redefined European borders,\
      \ governance structures, and\n    international law, setting the stage for the\
      \ modern nation-state system.\"\n\n    >>> result = analyze_political_influences(['Industrial\
      \ Revolution'])\n    >>> print(result['political_decisions'])\n    \"['Industrial\
      \ Revolution']\"\n\n    \"\"\"\n    return AnalyzePoliticalInfluencesOutput(\n\
      \        political_decisions=[],\n        policies_influenced=[],\n        leadership_figures=[],\n\
      \        summary=\"\",\n    )"
    name: analyze_political_influences
    nodes_depended_on:
    - identify_key_factors
    nodes_dependent_on: []
    output_structure:
    - description: Key political decisions that influenced the historical event or
        period.
      key: political_decisions
      type: List[str]
    - description: Policies enacted that had an impact on the event or period.
      key: policies_influenced
      type: List[str]
    - description: Principal political leaders or figures involved in shaping the
        event.
      key: leadership_figures
      type: List[str]
    - description: Concise summary of political influence on the event.
      key: summary
      type: str
    prd:
      conceptual_info: The node extracts and synthesizes the political dimensions—decisions,
        policies, and leadership—that directed the course of a historical event.
      docstring:
        examples:
        - lines:
          - result = analyze_political_influences([
          - '    ''Treaty of Versailles'','
          - '    ''French Revolution'','
          - '    ''Napoleonic Wars'''
          - '])'
          - print(result['summary'])
          output: '"The Treaty of Versailles, the French Revolution, and the Napoleonic
            Wars collectively redefined European borders, governance structures, and
            international law, setting the stage for the modern nation-state system."'
        - lines:
          - result = analyze_political_influences(['Industrial Revolution'])
          - print(result['political_decisions'])
          output: '"[''Industrial Revolution'']"'
        parameters:
        - description: List of primary political factors (e.g., treaties, revolutions,
            wars) supplied by the identify_key_factors node.
          name: political_factors
          type: List[str]
        raises:
        - description: Raised if political_factors is empty or None.
          type: ValueError
        - description: Raised if political_factors is not a list.
          type: TypeError
        returns:
          description: 'A dictionary containing four keys:

            - political_decisions: List of key decisions.

            - policies_influenced: List of policies that were enacted.

            - leadership_figures: List of main political leaders.

            - summary: A concise narrative describing the political influence.'
          type: Dict[str, Any]
        summary: Generates a structured summary of the political influences affecting
          a historical event, based on primary political factors identified by the
          previous node.
    prompt: Examine the political decisions, policies, or leadership that influenced
      the historical event or period.
    shims: []
  analyze_social_influences:
    agent: false
    code_node_type: stub
    description: Examine the social influences that contributed to the historical
