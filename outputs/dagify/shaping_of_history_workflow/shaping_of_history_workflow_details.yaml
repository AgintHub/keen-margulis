  compile_historical_narrative:
    agent: false
    code_node_type: stub
    description: Construct a narrative that encapsulates the historical event or period
      and its shaping factors.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass DrawConclusionsOutput(BaseModel):\n    \"\"\"Pydantic model for draw_conclusions\
      \ node outputs.\"\"\"\n    conclusion_summary: str = (\n        Field(..., description=\"\
      Concise summary of the main conclusions about the key drivers and outcomes.\"\
      )\n    )\n    key_factors: List[str] = (\n        Field(..., description=\"\
      List of primary factors identified as key drivers.\")\n    )\n    impact_assessment:\
      \ List[str] = (\n        Field(..., description=\"Assessment of each factor's\
      \ impact level (e.g., high, medium, low).\")\n    )\n    confidence_score: float\
      \ = (\n        Field(..., description=\"Overall confidence level (0-1) in the\
      \ conclusions.\")\n    )\n    recommendations: List[str] = (\n        Field(...,\
      \ description=\"Actionable recommendations or implications derived from the\
      \ conclusions.\")\n    )\n\n\nclass CompileHistoricalNarrativeOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for compile_historical_narrative node outputs.\"\"\
      \"\n    narrative_title: str = (\n        Field(..., description=\"Title of\
      \ the historical narrative.\")\n    )\n    introduction: str = (\n        Field(...,\
      \ description=\"Introductory paragraph setting the scene.\")\n    )\n    historical_context:\
      \ str = (\n        Field(..., description=\"Summary of the historical context.\"\
      )\n    )\n    key_factors: List[str] = (\n        Field(..., description=\"\
      List of key factors (cultural, economic, political, social) influencing the\
      \ event.\")\n    )\n    impact_summary: str = (\n        Field(..., description=\"\
