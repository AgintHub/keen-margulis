  analyze_cultural_influences:
    agent: false
    code_node_type: stub
    description: Investigate the cultural factors that shaped the historical event
      or period.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass IdentifyKeyFactorsOutput(BaseModel):\n    \"\"\"Pydantic model for\
      \ identify_key_factors node outputs.\"\"\"\n    social_factors: List[str] =\
      \ (\n        Field(..., description=\"List of primary social factors that influenced\
      \ the event or period.\")\n    )\n    political_factors: List[str] = (\n   \
      \     Field(..., description=\"List of primary political factors that influenced\
      \ the event or period.\")\n    )\n    economic_factors: List[str] = (\n    \
      \    Field(..., description=\"List of primary economic factors that influenced\
      \ the event or period.\")\n    )\n    cultural_factors: List[str] = (\n    \
      \    Field(..., description=\"List of primary cultural factors that influenced\
      \ the event or period.\")\n    )\n\n\nclass AnalyzeCulturalInfluencesOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for analyze_cultural_influences node outputs.\"\"\"\
      \n    cultural_factors: List[str] = (\n        Field(..., description=\"Names\
      \ of cultural factors identified\")\n    )\n    factor_categories: List[str]\
      \ = (\n        Field(..., description=\"Category of each cultural factor (e.g.,\
      \ norm, value, artistic movement, religious belief, linguistic trend)\")\n \
      \   )\n    factor_descriptions: List[str] = (\n        Field(..., description=\"\
      Brief description of each cultural factor\")\n    )\n    influence_scores: List[float]\
      \ = (\n        Field(..., description=\"Estimated influence score of each factor\
      \ on the historical event or period (0 to 1)\")\n    )\n    is_significant:\
      \ List[bool] = (\n        Field(..., description=\"Whether each factor is considered\
      \ significant (True = significant, False = not significant)\")\n    )\n\n\n\
      def analyze_cultural_influences(identify_key_factors_input: IdentifyKeyFactorsOutput,\
      \ **kwargs) -> AnalyzeCulturalInfluencesOutput:\n    \"\"\"\n    Analyze cultural\
      \ influences for a historical event and return detailed\n    scores and descriptors.\n\
      \n    Parameters\n    ----------\n    cultural_factors : List[str]\n       \
      \ List of cultural factor names produced by the identify_key_factors\n     \
      \   node.\n\n    Returns\n    -------\n    dict\n        Dictionary containing\
      \ the keys 'cultural_factors',\n        'factor_categories', 'factor_descriptions',\
      \ 'influence_scores', and\n        'is_significant', each mapping to a list\
      \ of equal length.\n\n    Raises\n    ------\n    ValueError\n        Raised\
      \ if the input list is empty or contains non-string elements.\n\n    Examples\n\
      \    --------\n    >>> result = analyze_cultural_influences(['Romanticism',\
      \ 'Buddhism'])\n    >>> print(result['cultural_factors'])\n    >>> print(result['factor_categories'])\n\
      \    >>> print(result['influence_scores'])\n    >>> print(result['is_significant'])\n\
      \    [\"Romanticism\", \"Buddhism\"]\n    [\"Artistic movement\", \"Religious\
      \ belief\"]\n    [0.8, 0.6]\n    [True, True]\n\n    >>> try:\n    ...     analyze_cultural_influences([])\n\
      \    >>> except ValueError as e:\n    ...     print(e)\n    \"No cultural factors\
      \ provided. At least one is required.\"\n\n    \"\"\"\n    return AnalyzeCulturalInfluencesOutput(\n\
      \        cultural_factors=[],\n        factor_categories=[],\n        factor_descriptions=[],\n\
      \        influence_scores=[],\n        is_significant=[],\n    )"
    name: analyze_cultural_influences
    nodes_depended_on:
    - identify_key_factors
    nodes_dependent_on: []
    output_structure:
    - description: Names of cultural factors identified
      key: cultural_factors
      type: List[str]
    - description: Category of each cultural factor (e.g., norm, value, artistic movement,
        religious belief, linguistic trend)
      key: factor_categories
      type: List[str]
    - description: Brief description of each cultural factor
      key: factor_descriptions
      type: List[str]
    - description: Estimated influence score of each factor on the historical event
        or period (0 to 1)
      key: influence_scores
      type: List[float]
    - description: Whether each factor is considered significant (True = significant,
        False = not significant)
      key: is_significant
      type: List[bool]
    prd:
      conceptual_info: This node transforms the list of cultural factors identified
        by its parent into a structured, scored representation that highlights each
        factor's category, description, influence magnitude, and overall significance.
      docstring:
        examples:
        - lines:
          - result = analyze_cultural_influences(['Romanticism', 'Buddhism'])
          - print(result['cultural_factors'])
          - print(result['factor_categories'])
          - print(result['influence_scores'])
          - print(result['is_significant'])
          output: '["Romanticism", "Buddhism"]

            ["Artistic movement", "Religious belief"]

            [0.8, 0.6]

            [True, True]'
        - lines:
          - 'try:'
          - '    analyze_cultural_influences([])'
          - 'except ValueError as e:'
          - '    print(e)'
          output: '"No cultural factors provided. At least one is required."'
        parameters:
        - description: List of cultural factor names produced by the identify_key_factors
            node.
          name: cultural_factors
          type: List[str]
        raises:
        - description: Raised if the input list is empty or contains non-string elements.
          type: ValueError
        returns:
          description: Dictionary containing the keys 'cultural_factors', 'factor_categories',
            'factor_descriptions', 'influence_scores', and 'is_significant', each
            mapping to a list of equal length.
          type: dict
        summary: Analyze cultural influences for a historical event and return detailed
          scores and descriptors.
    prompt: Analyze how cultural norms, values, or artistic movements influenced the
      historical event or period.
    shims: []
  analyze_economic_influences:
    agent: false
    code_node_type: stub
    description: Assess the economic factors that contributed to the historical event
