dag_type: spec
description: Generated workflow from UI.
name: trading_workflow
nodes:
  choose_trading_strategy:
    agent: false
    description: Select a suitable trading strategy based on the defined objectives.
    name: choose_trading_strategy
    nodes_depended_on:
    - define_trading_objectives
    nodes_dependent_on: []
    output_structure:
    - description: The name or identifier of the selected trading strategy.
      key: strategy_name
      type: str
    - description: The high‑level category of the strategy, e.g., 'trend following',
        'mean reversion', 'statistical arbitrage', or 'options play'.
      key: strategy_type
      type: str
    - description: A numeric score (0.0 to 1.0) indicating how well the strategy meets
        the defined objectives.
      key: alignment_score
      type: float
    - description: Primary risk factors associated with this strategy.
      key: key_risk_factors
      type: List[str]
    - description: Asset classes that the strategy intends to trade.
      key: asset_classes
      type: List[str]
    - description: Market conditions under which the strategy performs best.
      key: market_conditions
      type: List[str]
    - description: Approximate number of trades executed per day or per month.
      key: trade_frequency
      type: int
    prd:
      conceptual_info: This node evaluates the trading objectives defined in the parent
        node and selects a trading strategy that best satisfies those objectives while
        considering market conditions and asset classes. The selected strategy is
        scored for alignment, and key characteristics such as risk factors, asset
        classes, and trade frequency are documented for downstream workflow components.
      docstring:
        examples:
        - lines:
          - objectives = {
          - '    ''return_target_percent'': 12.0,'
          - '    ''max_drawdown_percent'': 8.0,'
          - '    ''risk_tolerance_category'': ''moderate'','
          - '    ''constraints'': [''no futures'', ''must trade equities'']'
          - '}'
          - strategy = choose_trading_strategy(objectives)
          - print(strategy['strategy_name'])
          output: '"Momentum Equity Swing"'
        - lines:
          - objectives = {
          - '    ''return_target_percent'': 20.0,'
          - '    ''max_drawdown_percent'': 4.0,'
          - '    ''risk_tolerance_category'': ''aggressive'','
          - '    ''constraints'': [''only options'', ''min volatility < 0.5'']'
          - '}'
          - strategy = choose_trading_strategy(objectives)
          - print(strategy['strategy_type'])
          output: '"options play"'
        parameters:
        - description: 'Dictionary containing the return target (%), maximum drawdown
            (%), risk tolerance category, and any additional constraints. Expected
            keys: ''return_target_percent'', ''max_drawdown_percent'', ''risk_tolerance_category'',
            ''constraints''.'
          name: objectives
          type: Dict[str, Any]
        raises:
        - description: Raised if any required objective key is missing or if the input
            type is incorrect.
          type: ValueError
        returns:
          description: 'A mapping of strategy attributes: strategy_name, strategy_type,
            alignment_score, key_risk_factors, asset_classes, market_conditions, trade_frequency.'
          type: Dict[str, Any]
        summary: Select a trading strategy that aligns with the specified objectives.
    prompt: Identify a trading strategy that aligns with the stated objectives, considering
      factors like market conditions and asset classes.
  compile_trading_workflow_summary:
    agent: false
    description: Synthesize the components into a comprehensive trading workflow summary.
    name: compile_trading_workflow_summary
    nodes_depended_on:
    - define_trading_objectives
    - choose_trading_strategy
    - develop_trade_execution_plan
    - design_monitoring_and_control_system
    nodes_dependent_on: []
    output_structure:
    - description: Concise description of the defined trading objectives.
      key: objectives_summary
      type: str
    - description: Brief overview of the selected trading strategy.
      key: strategy_summary
      type: str
    - description: Summary of the trade execution plan, including order types and
        venues.
      key: execution_plan_summary
      type: str
    - description: Description of the monitoring and control system with key alerts
        and reporting mechanisms.
      key: monitoring_system_summary
      type: str
    - description: Final consolidated summary that ties together objectives, strategy,
        execution plan, and monitoring system.
      key: overall_summary
      type: str
    prd:
      conceptual_info: This node collects the outputs of the four upstream nodes and
        transforms them into human‑readable, concise summary strings that capture
        the essence of the trading workflow.
      docstring:
        examples:
        - lines:
          - objectives = {
          - '    ''return_target_percent'': 12.5,'
          - '    ''max_drawdown_percent'': 7.0,'
          - '    ''risk_tolerance_category'': ''moderate'','
          - '    ''constraints'': [''no leveraged ETFs'', ''max 5% position per asset'']'
          - '}'
          - strategy = {
          - '    ''strategy_name'': ''Mean Reversion Bot'','
          - '    ''strategy_type'': ''mean reversion'','
          - '    ''alignment_score'': 0.85,'
          - '    ''key_risk_factors'': [''market volatility'', ''liquidity''],'
          - '    ''asset_classes'': [''equities'', ''ETFs''],'
          - '    ''market_conditions'': [''high volatility'', ''low correlation''],'
          - '    ''trade_frequency'': 20'
          - '}'
          - execution_plan = {
          - '    ''asset_classes'': [''equities'', ''ETFs''],'
          - '    ''order_types'': [''limit'', ''bracket''],'
          - '    ''execution_venues'': [''NYSE'', ''NASDAQ''],'
          - '    ''timing_strategy'': ''intraday'','
          - '    ''slippage_tolerance_pct'': 0.1,'
          - '    ''position_size_rule'': ''fixed 1% of capital'','
          - '    ''max_order_size'': 1000,'
          - '    ''execution_latency_ms'': 50.0,'
          - '    ''order_submission_method'': ''FIX'''
          - '}'
          - monitoring = {
          - '    ''monitored_metrics'': [''PnL'', ''Sharpe'', ''drawdown''],'
          - '    ''metric_thresholds'': [0.0, 1.0, 5.0],'
          - '    ''alert_enabled'': True,'
          - '    ''alert_frequency'': ''real-time'','
          - '    ''reporting_schedule'': ''daily'','
          - '    ''reporting_channels'': [''email'', ''dashboard''],'
          - '    ''intervention_steps'': [''pause orders'', ''notify risk manager''],'
          - '    ''manual_override_allowed'': False,'
          - '    ''control_automation_level'': ''fully automated'''
          - '}'
          - summary = compile_trading_workflow_summary(objectives, strategy, execution_plan,
            monitoring)
          - print(summary['overall_summary'])
          output: '"The trading workflow aims for a 12.5% annual return with a 7%
            maximum drawdown, employing a moderate risk tolerance. A mean‑reversion
            strategy targeting equities and ETFs is used, achieving an 85% alignment
            score. Trades are executed via limit and bracket orders on NYSE and NASDAQ,
            intraday, with 0.1% slippage tolerance and 1% capital position sizing.
            Monitoring tracks PnL, Sharpe ratio, and drawdown in real‑time, sending
            alerts and daily reports. All components are fully automated, ensuring
            rapid response to threshold breaches."

            '
        - lines:
          - '# Minimal example with placeholder values'
          - summary = compile_trading_workflow_summary({
          - '    ''return_target_percent'': 8.0,'
          - '    ''max_drawdown_percent'': 5.0,'
          - '    ''risk_tolerance_category'': ''conservative'','
          - '    ''constraints'': []'
          - '}, {'
          - '    ''strategy_name'': ''Trend Following'','
          - '    ''strategy_type'': ''trend following'','
          - '    ''alignment_score'': 0.9,'
          - '    ''key_risk_factors'': [],'
          - '    ''asset_classes'': [''forex''],'
          - '    ''market_conditions'': [''bullish''],'
          - '    ''trade_frequency'': 5'
          - '}, {'
          - '    ''asset_classes'': [''forex''],'
          - '    ''order_types'': [''market''],'
          - '    ''execution_venues'': [''OANDA''],'
          - '    ''timing_strategy'': ''market open'','
          - '    ''slippage_tolerance_pct'': 0.2,'
          - '    ''position_size_rule'': ''fixed 2% of capital'','
          - '    ''max_order_size'': 10000,'
          - '    ''execution_latency_ms'': 10.0,'
          - '    ''order_submission_method'': ''REST'''
          - '}, {'
          - '    ''monitored_metrics'': [''PnL''],'
          - '    ''metric_thresholds'': [0.0],'
          - '    ''alert_enabled'': False,'
          - '    ''alert_frequency'': ''none'','
          - '    ''reporting_schedule'': ''weekly'','
          - '    ''reporting_channels'': [''email''],'
          - '    ''intervention_steps'': [],'
          - '    ''manual_override_allowed'': True,'
          - '    ''control_automation_level'': ''semi-automated'''
          - '})'
          - print(summary['objectives_summary'])
          output: '"Objective: Target an 8% annual return with a 5% maximum drawdown
            under a conservative risk tolerance."

            '
        parameters:
        - description: 'Dictionary containing the outputs of the `define_trading_objectives`
            node. Expected keys: `return_target_percent`, `max_drawdown_percent`,
            `risk_tolerance_category`, `constraints`.'
          name: objectives
          type: dict
        - description: 'Dictionary containing the outputs of the `choose_trading_strategy`
            node. Expected keys: `strategy_name`, `strategy_type`, `alignment_score`,
            `key_risk_factors`, `asset_classes`, `market_conditions`, `trade_frequency`.'
          name: strategy
          type: dict
        - description: 'Dictionary containing the outputs of the `develop_trade_execution_plan`
            node. Expected keys: `asset_classes`, `order_types`, `execution_venues`,
            `timing_strategy`, `slippage_tolerance_pct`, `position_size_rule`, `max_order_size`,
            `execution_latency_ms`, `order_submission_method`.'
          name: execution_plan
          type: dict
        - description: 'Dictionary containing the outputs of the `design_monitoring_and_control_system`
            node. Expected keys: `monitored_metrics`, `metric_thresholds`, `alert_enabled`,
            `alert_frequency`, `reporting_schedule`, `reporting_channels`, `intervention_steps`,
            `manual_override_allowed`, `control_automation_level`.'
          name: monitoring
          type: dict
        raises:
        - description: Raised if any required field in one of the input dictionaries
            is missing or of an unexpected type.
          type: ValueError
        returns:
          description: 'A dictionary with the following string keys: `objectives_summary`,
            `strategy_summary`, `execution_plan_summary`, `monitoring_system_summary`,
            `overall_summary`.'
          type: dict
        summary: Generate a comprehensive trading workflow summary from the outputs
          of the objectives, strategy, execution plan, and monitoring nodes.
    prompt: Summarize the trading workflow, including objectives, strategy, execution
      plan, and monitoring system.
  define_risk_management_rules:
    agent: false
    description: Establish risk management rules to control exposure and potential
      losses.
    name: define_risk_management_rules
    nodes_depended_on:
    - choose_trading_strategy
    nodes_dependent_on: []
    output_structure:
    - description: Method for determining position size per trade (e.g., fixed percentage,
        volatility scaling, Kelly criterion).
      key: position_sizing_rule
      type: str
    - description: Maximum allowed position size as a percentage of total portfolio
        capital.
      key: max_position_size_pct
      type: float
    - description: Maximum daily drawdown allowed before rebalancing or halt.
      key: max_daily_drawdown_pct
      type: float
    - description: Stop‑loss level as a percentage of entry price.
      key: stop_loss_level_pct
      type: float
    - description: List of asset classes or instruments to diversify across.
      key: diversification_instruments
      type: List[str]
    - description: Textual guidelines for portfolio diversification (e.g., correlation
        thresholds, sector caps).
      key: portfolio_diversification_guidelines
      type: str
    prd:
      conceptual_info: This node synthesizes a set of risk‑management controls that
        align with the selected trading strategy, ensuring that exposure, loss limits,
        and diversification are quantified and enforceable.
      docstring:
        examples:
        - lines:
          - strategy = {
          - '    ''strategy_name'': ''MomentumTrader'','
          - '    ''strategy_type'': ''trend following'','
          - '    ''alignment_score'': 0.85,'
          - '    ''key_risk_factors'': [''market_risk'', ''liquidity_risk''],'
          - '    ''asset_classes'': [''equities'', ''ETFs''],'
          - '    ''market_conditions'': [''bullish''],'
          - '    ''trade_frequency'': 5'
          - '}'
          - risk = define_risk_management_rules(strategy)
          - print(risk)
          output: "{\n  'position_sizing_rule': 'fixed_percentage',\n  'max_position_size_pct':\
            \ 0.02,\n  'max_daily_drawdown_pct': 0.015,\n  'stop_loss_level_pct':\
            \ 0.01,\n  'diversification_instruments': ['equities', 'ETFs', 'bonds'],\n\
            \  'portfolio_diversification_guidelines': 'Limit any single sector to\
            \ <20% of total position, maintain at least 30% of capital in liquid equities.'\n\
            }"
        - lines:
          - strategy = {
          - '    ''strategy_name'': ''MeanReversionFX'','
          - '    ''strategy_type'': ''mean reversion'','
          - '    ''alignment_score'': 0.78,'
          - '    ''key_risk_factors'': [''currency_risk'', ''counterparty_risk''],'
          - '    ''asset_classes'': [''forex''],'
          - '    ''market_conditions'': [''stable''],'
          - '    ''trade_frequency'': 20'
          - '}'
          - risk = define_risk_management_rules(strategy)
          - print(risk)
          output: "{\n  'position_sizing_rule': 'volatility_scaling',\n  'max_position_size_pct':\
            \ 0.01,\n  'max_daily_drawdown_pct': 0.02,\n  'stop_loss_level_pct': 0.005,\n\
            \  'diversification_instruments': ['forex', 'interest_rate_futures'],\n\
            \  'portfolio_diversification_guidelines': 'Do not exceed 10% exposure\
            \ to any single currency pair; maintain a minimum 50/50 split between\
            \ currency and interest‑rate derivatives.'\n}"
        parameters:
        - description: A dictionary containing the output from the `choose_trading_strategy`
            node. Expected keys include `strategy_name`, `strategy_type`, `alignment_score`,
            `key_risk_factors`, `asset_classes`, `market_conditions`, and `trade_frequency`.
          name: strategy
          type: Dict[str, Any]
        raises:
        - description: Raised when the input `strategy` dictionary is missing any
            of the required keys.
          type: ValueError
        returns:
          description: 'A dictionary containing risk‑management parameters: `position_sizing_rule`,
            `max_position_size_pct`, `max_daily_drawdown_pct`, `stop_loss_level_pct`,
            `diversification_instruments`, and `portfolio_diversification_guidelines`.'
          type: Dict[str, Any]
        summary: Generate risk‑management rules based on the chosen trading strategy.
    prompt: Specify risk management rules, including position sizing, stop-loss levels,
      and portfolio diversification guidelines.
  define_trading_objectives:
    agent: false
    description: Specify the primary objectives of the trading system, including return
      targets and risk tolerance.
    name: define_trading_objectives
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Target annualized return expressed as a percentage
      key: return_target_percent
      type: float
    - description: Maximum acceptable drawdown expressed as a percentage
      key: max_drawdown_percent
      type: float
    - description: Risk tolerance level (e.g., 'conservative', 'moderate', 'aggressive')
      key: risk_tolerance_category
      type: str
    - description: List of textual constraints or special requirements for the trading
        strategy
      key: constraints
      type: List[str]
    prd:
      conceptual_info: This node collects high‑level financial goals and risk parameters
        that steer the entire trading system. The objectives shape strategy selection,
        risk rules, and monitoring thresholds downstream.
      docstring:
        examples:
        - lines:
          - objectives = define_trading_objectives()
          - print(objectives)
          output: '{\n  "return_target_percent": 12.5,\n  "max_drawdown_percent":
            20.0,\n  "risk_tolerance_category": "moderate",\n  "constraints": [\n    "No
            leverage over 2x",\n    "Position size capped at 5% of portfolio"\n  ]\n}'
        - lines:
          - objectives = define_trading_objectives()
          - objectives['risk_tolerance_category'] = "conservative"
          - print(objectives['risk_tolerance_category'])
          output: '"conservative"'
        parameters: []
        raises:
        - description: If the target return or drawdown is negative, or if the risk
            tolerance category is not one of the supported values.
          type: ValueError
        returns:
          description: A mapping with keys `return_target_percent`, `max_drawdown_percent`,
            `risk_tolerance_category`, and `constraints` corresponding to the output
            structure.
          type: dict
        summary: Generate a dictionary of core trading objectives such as target return,
          drawdown limits, risk tolerance, and any special constraints.
    prompt: List the core objectives for the trading system, focusing on return targets,
      risk limits, and any specific constraints.
  design_monitoring_and_control_system:
    agent: false
    description: Create a system to monitor and control the trading system's performance.
    name: design_monitoring_and_control_system
    nodes_depended_on:
    - specify_performance_metrics
    - develop_trade_execution_plan
    nodes_dependent_on: []
    output_structure:
    - description: List of performance metrics monitored by the system.
      key: monitored_metrics
      type: List[str]
    - description: Corresponding threshold values for each monitored metric.
      key: metric_thresholds
      type: List[float]
    - description: Whether alerts are enabled for threshold breaches.
      key: alert_enabled
      type: bool
    - description: Frequency of alerts (e.g., real-time, hourly).
      key: alert_frequency
      type: str
    - description: Schedule for performance reports (e.g., daily, weekly).
      key: reporting_schedule
      type: str
    - description: Channels for distributing reports (e.g., email, dashboard).
      key: reporting_channels
      type: List[str]
    - description: Steps to be taken when intervention is triggered.
      key: intervention_steps
      type: List[str]
    - description: Whether manual override of automated controls is allowed.
      key: manual_override_allowed
      type: bool
    - description: Level of automation in control actions (e.g., fully automated,
        semi-automated).
      key: control_automation_level
      type: str
    prd:
      conceptual_info: Configures the monitoring and control subsystem that keeps
        the trading engine within agreed performance bounds, triggers alerts, compiles
        periodic reports, and initiates intervention protocols.
      docstring:
        examples:
        - lines:
          - performance_metrics = {
          - '    ''roi'': 0.12,'
          - '    ''sharpe_ratio'': 1.4,'
          - '    ''max_drawdown'': 0.05,'
          - '    ''annualized_volatility'': 0.2,'
          - '    ''win_rate'': 0.55,'
          - '    ''annualized_return'': 0.15'
          - '} '
          - execution_plan = {
          - '    ''asset_classes'': [''Equities'', ''Futures''],'
          - '    ''order_types'': [''Market'', ''Limit''],'
          - '    ''execution_venues'': [''NYSE'', ''CME''],'
          - '    ''timing_strategy'': ''Intraday'','
          - '    ''slippage_tolerance_pct'': 0.01,'
          - '    ''position_size_rule'': ''Fixed %'','
          - '    ''max_order_size'': 1000,'
          - '    ''execution_latency_ms'': 10.0,'
          - "    'order_submission_method': 'FIX'\"\n                \"} "
          - config = design_monitoring_and_control_system(performance_metrics, execution_plan)
          - print(config['monitored_metrics'])
          output: '["roi", "sharpe_ratio", "max_drawdown", "annualized_volatility",
            "win_rate", "annualized_return"]'
        - lines:
          - print(config['alert_frequency'])
          output: '"real-time"'
        parameters:
        - description: 'Dictionary of performance metrics produced by ``specify_performance_metrics``.
            Expected keys include: ``roi``, ``sharpe_ratio``, ``max_drawdown``, ``annualized_volatility``,
            ``win_rate``, ``annualized_return``.'
          name: performance_metrics
          type: dict
        - description: 'Dictionary of execution parameters produced by ``develop_trade_execution_plan``.
            Expected keys include: ``asset_classes``, ``order_types``, ``execution_venues``,
            ``timing_strategy``, ``slippage_tolerance_pct``, ``position_size_rule``,
            ``max_order_size``, ``execution_latency_ms``, ``order_submission_method``.'
          name: execution_plan
          type: dict
        raises:
        - description: Raised if required metrics or execution plan keys are missing.
          type: ValueError
        returns:
          description: A configuration dictionary containing monitoring and control
            settings. Keys correspond to the node's output structure.
          type: dict
        summary: Builds a monitoring and control configuration from performance metrics
          and trade execution details.
    prompt: Describe the monitoring and control system, including alerts, reporting,
      and intervention protocols.
  develop_trade_execution_plan:
    agent: false
    description: Create a plan for executing trades, including order types and timing.
    name: develop_trade_execution_plan
    nodes_depended_on:
    - identify_tradable_assets
    - define_risk_management_rules
    nodes_dependent_on: []
    output_structure:
    - description: List of tradable asset classes or instruments identified by the
        parent node.
      key: asset_classes
      type: List[str]
    - description: Order types to be used in execution (e.g., market, limit, bracket,
        iceberg).
      key: order_types
      type: List[str]
    - description: Trading venues or exchanges where orders will be routed.
      key: execution_venues
      type: List[str]
    - description: Description of the timing strategy (e.g., intraday, market open,
        end‑of‑day).
      key: timing_strategy
      type: str
    - description: Maximum acceptable slippage as a percentage of the order price.
      key: slippage_tolerance_pct
      type: float
    - description: Reference to the position sizing rule from the risk management
        plan.
      key: position_size_rule
      type: str
    - description: Maximum number of units (shares/contracts) per individual order.
      key: max_order_size
      type: int
    - description: Expected average latency from order submission to execution in
        milliseconds.
      key: execution_latency_ms
      type: float
    - description: Method used to submit orders (e.g., FIX, REST API, proprietary
        interface).
      key: order_submission_method
      type: str
    prd:
      conceptual_info: The execution‑plan node takes asset and risk information from
        its parents and synthesizes a concrete set of trade‑execution parameters.
        It maps asset classes to appropriate order types, selects venues that meet
        latency and liquidity constraints, and codifies timing, slippage, and sizing
        rules that align with the overall risk‑management policy.
      docstring:
        examples:
        - lines:
          - plan = develop_trade_execution_plan(
          - '    tradable_assets=[''Equity:SPY'', ''Futures:ES'', ''Forex:EURUSD''],'
          - '    position_sizing_rule=''fixed_percentage'','
          - '    max_position_size_pct=2.0,'
          - '    stop_loss_level_pct=1.5'
          - )
          - print(plan['order_types'])
          output: '[''market'', ''limit'', ''iceberg'']'
        - lines:
          - plan = develop_trade_execution_plan(
          - '    tradable_assets=[''Equity:AAPL''],'
          - '    position_sizing_rule=''volatility_scaling'','
          - '    max_position_size_pct=1.0,'
          - '    stop_loss_level_pct=2.0'
          - )
          - print(plan['timing_strategy'])
          output: '''intraday, end‑of‑day'' (market close) '
        parameters:
        - description: List of tradable asset classes or instruments provided by `identify_tradable_assets`.
          name: tradable_assets
          type: List[str]
        - description: Identifier of the position‑sizing method defined in `define_risk_management_rules`.
          name: position_sizing_rule
          type: str
        - description: Maximum position size as a percentage of portfolio capital
            from risk rules.
          name: max_position_size_pct
          type: float
        - description: Stop‑loss threshold as a percentage of entry price.
          name: stop_loss_level_pct
          type: float
        raises:
        - description: If any required input list is empty or a numeric value is non‑positive.
          type: ValueError
        returns:
          description: Dictionary containing the execution plan fields as defined
            in the output structure.
          type: Dict[str, Any]
        summary: Generate a trade execution plan from asset and risk data.
    prompt: Outline the trade execution plan, including the types of orders to use,
      execution venues, and timing considerations.
  identify_tradable_assets:
    agent: false
    description: Determine the specific assets or instruments to be traded for the
      selected strategy.
    name: identify_tradable_assets
    nodes_depended_on:
    - choose_trading_strategy
    nodes_dependent_on: []
    output_structure:
    - description: List of tradable asset classes or instruments selected for the
        chosen trading strategy.
      key: tradable_assets
      type: List[str]
    - description: Number of tradable assets identified.
      key: asset_count
      type: int
    prd:
      conceptual_info: The node takes the list of asset classes proposed by the chosen
        trading strategy and verifies/filters them to produce the final tradable assets
        list and a count. It ensures that the strategy’s asset classes are valid and
        prepares the data for downstream execution planning.
      docstring:
        examples:
        - lines:
          - 'def identify_tradable_assets(asset_classes: List[str]) -> Dict[str, Any]:'
          - '    if not asset_classes:'
          - '        raise ValueError("No asset classes provided.")'
          - '    return {"tradable_assets": asset_classes, "asset_count": len(asset_classes)}'
          - '# Example 1'
          - result = identify_tradable_assets(["Equities", "Forex", "Futures"])
          - print(result)
          output: '{''tradable_assets'': [''Equities'', ''Forex'', ''Futures''], ''asset_count'':
            3}'
        - lines:
          - '# Example 2'
          - result = identify_tradable_assets(["Commodities"])
          - print(result)
          output: '{''tradable_assets'': [''Commodities''], ''asset_count'': 1}'
        parameters:
        - description: Asset classes or instruments suggested by the chosen trading
            strategy.
          name: asset_classes
          type: List[str]
        raises:
        - description: If `asset_classes` is empty or not provided.
          type: ValueError
        returns:
          description: A dictionary containing `tradable_assets` (List[str]) and `asset_count`
            (int).
          type: Dict[str, Any]
        summary: Identify the tradable assets for a chosen trading strategy.
    prompt: List the specific asset classes or instruments that the chosen strategy
      will trade, such as equities, futures, or currencies.
  specify_performance_metrics:
    agent: false
    description: Define metrics to evaluate the performance of the trading system.
    name: specify_performance_metrics
    nodes_depended_on:
    - define_trading_objectives
    nodes_dependent_on: []
    output_structure:
    - description: Return on investment over the evaluation period
      key: roi
      type: float
    - description: Sharpe ratio of the trading strategy
      key: sharpe_ratio
      type: float
    - description: Maximum drawdown as a percentage of equity
      key: max_drawdown
      type: float
    - description: Annualized volatility of returns
      key: annualized_volatility
      type: float
    - description: Percentage of profitable trades
      key: win_rate
      type: float
    - description: Annualized return percentage
      key: annualized_return
      type: float
    prd:
      conceptual_info: The `specify_performance_metrics` node takes the high‑level
        objectives defined for the trading system and produces a set of quantitative
        performance indicators that can be used by downstream monitoring and control
        systems. These metrics provide a standardized way to benchmark the strategy
        against its risk tolerance and return targets.
      docstring:
        examples:
        - lines:
          - metrics = specify_performance_metrics(
          - '    return_target_percent=12.0,'
          - '    max_drawdown_percent=10.0,'
          - '    risk_tolerance_category=''moderate'','
          - '    constraints=[''No leverage'']'
          - )
          output: '{''roi'': 0.12, ''sharpe_ratio'': 1.4, ''max_drawdown'': 0.10,
            ''annualized_volatility'': 0.25, ''win_rate'': 0.55, ''annualized_return'':
            0.12}'
        - lines:
          - metrics = specify_performance_metrics(
          - '    return_target_percent=8.0,'
          - '    max_drawdown_percent=5.0,'
          - '    risk_tolerance_category=''conservative'','
          - '    constraints=[]'
          - )
          output: '{''roi'': 0.08, ''sharpe_ratio'': 1.1, ''max_drawdown'': 0.05,
            ''annualized_volatility'': 0.18, ''win_rate'': 0.60, ''annualized_return'':
            0.08}'
        parameters:
        - description: Target annualized return expressed as a percentage (e.g., 12.0
            for 12%).
          name: return_target_percent
          type: float
        - description: Maximum acceptable drawdown expressed as a percentage of equity
            (e.g., 10.0 for 10%).
          name: max_drawdown_percent
          type: float
        - description: Risk tolerance level, one of 'conservative', 'moderate', or
