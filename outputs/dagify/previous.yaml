      \ of the source code files listed in 'source_code_files' are\n        not found.\n\
      \    AnalysisToolError\n        If there's an error running the static code\
      \ analysis tools.\n\n    Examples\n    --------\n    >>> source_code_files =\
      \ ['/path/to/file1.py', '/path/to/file2.py']\n    >>> static_analysis_results,\
      \ vulnerabilities_found =\n    perform_static_code_analysis(source_code_files)\n\
