      \ import parse_business_operations_data\nfrom ._analyze_business_operations.identify_strengths\
      \ import identify_strengths\nfrom ._analyze_business_operations.identify_weaknesses\
      \ import identify_weaknesses\nfrom ._analyze_business_operations.calculate_efficiency_metrics\
      \ import calculate_efficiency_metrics\n\nfrom pydantic import BaseModel, Field\n\
      from typing import List\n\n\nclass GatherWcfbDataOutput(BaseModel):\n    \"\"\
      \"Pydantic model for gather_wcfb_data node outputs.\"\"\"\n    business_operations_data:\
      \ str = (\n        Field(..., description=\"Data related to business operations\"\
      )\n    )\n    customer_feedback_data: str = (\n        Field(..., description=\"\
      List of customer feedback comments\")\n    )\n    market_trends_data: float\
      \ = (\n        Field(..., description=\"List of market trend metrics\")\n  \
      \  )\n\n\nclass AnalyzeBusinessOperationsOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for analyze_business_operations node outputs.\"\"\"\n    strengths:\
      \ List[str] = (\n        Field(..., description=\"List of business operation\
      \ strengths\")\n    )\n    weaknesses: List[str] = (\n        Field(..., description=\"\
      List of business operation weaknesses\")\n    )\n    efficiency_metrics: List[float]\
      \ = (\n        Field(..., description=\"List of efficiency metrics for business\
      \ operations\")\n    )\n\n\ndef analyze_business_operations(gather_wcfb_data_input:\
      \ GatherWcfbDataOutput, **kwargs) -> AnalyzeBusinessOperationsOutput:\n    \"\
      \"\"\n    Analyzes business operations data to identify areas of strength and\n\
      \    weakness.\n\n    Parameters\n    ----------\n    business_operations_data\
      \ : str\n        Data related to business operations gathered from the\n   \
      \     'gather_wcfb_data' node.\n\n    Returns\n    -------\n    Tuple[List[str],\
      \ List[str], List[float]]\n        A tuple containing a list of business operation\
      \ strengths, a list of\n        business operation weaknesses, and a list of\
      \ efficiency metrics for\n        business operations.\n\n    Raises\n    ------\n\
      \    ValueError\n        If the input 'business_operations_data' is empty or\
      \ not in the\n        expected format.\n\n    Examples\n    --------\n    >>>\
      \ business_operations_data = '{\"sales\": 1000, \"expenses\": 500,\n    \"productivity\"\
      : 0.8}'\n    >>> strengths, weaknesses, efficiency_metrics =\n    analyze_business_operations(business_operations_data)\n\
      \    >>> print(strengths, weaknesses, efficiency_metrics)\n    ['High sales']\
      \ ['High expenses'] [0.8]\n\n    >>> business_operations_data = '{\"sales\"\
      : 800, \"expenses\": 600,\n    \"productivity\": 0.7}'\n    >>> strengths, weaknesses,\
      \ efficiency_metrics =\n    analyze_business_operations(business_operations_data)\n\
      \    >>> print(strengths, weaknesses, efficiency_metrics)\n    ['Moderate sales']\
      \ ['High expenses'] [0.7]\n\n    \"\"\"\n    validate_input_data(data=gather_wcfb_data_input.business_operations_data)\n\
      \    parsed_data: dict = parse_business_operations_data(data=gather_wcfb_data_input.business_operations_data)\n\
      \    \n    strengths_list: List[str] = identify_strengths(parsed_data=parsed_data)\n\
      \    weaknesses_list: List[str] = identify_weaknesses(parsed_data=parsed_data)\n\
      \    efficiency_metrics_list: List[float] = calculate_efficiency_metrics(parsed_data=parsed_data)\n\
      \    \n    return AnalyzeBusinessOperationsOutput(\n        strengths=strengths_list,\n\
      \        weaknesses=weaknesses_list,\n        efficiency_metrics=efficiency_metrics_list\n\
      \    )"
    name: analyze_business_operations
