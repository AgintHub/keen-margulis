dag_type: shim
description: A workflow to create a comprehensive WCFB (Work Capability Framework
  Baseline) analysis
name: wcfb_analysis_workflow
nodes:
  analyze_business_operations:
    agent: false
    code_node_type: shim
    description: Analyze business operations data
    implementation: "from ._analyze_business_operations.validate_input_data import\
