        \  --------\n    >>> fetch_historical_prices(assets='AAPL,GOOG', start_date='2022-01-01',\n\
        \    end_date='2022-01-31')\n    [100.0, 101.0, 102.0, ...]\n\n    >>> fetch_historical_prices(assets='MSFT',\
        \ start_date='2023-01-01',\n    end_date='2023-01-05')\n    [200.0, 201.0,\
        \ 202.0, 203.0, 204.0]\n\n    \"\"\"\n    \n    if not isinstance(assets,\
        \ str):\n        raise TypeError(\"assets must be a string\")\n    if not\
        \ isinstance(start_date, str):\n        raise TypeError(\"start_date must\
        \ be a string\")\n    if not isinstance(end_date, str):\n        raise TypeError(\"\
        end_date must be a string\")\n    \n    try:\n        start_dt = datetime.datetime.strptime(start_date,\
        \ '%Y-%m-%d')\n        end_dt = datetime.datetime.strptime(end_date, '%Y-%m-%d')\n\
        \    except ValueError:\n        raise ValueError(\"Invalid date format. Use\
        \ 'YYYY-MM-DD' format.\")\n    \n    if start_dt > end_dt:\n        raise\
        \ ValueError(\"start_date cannot be later than end_date\")\n    \n    asset_list\
        \ = [asset.strip() for asset in assets.split(',') if asset.strip()]\n    \n\
        \    historical_prices = []\n    current_date = start_dt\n    \n    while\
        \ current_date <= end_dt:\n        for asset in asset_list:\n            base_price\
        \ = 100.0\n            if asset.upper() == 'AAPL':\n                base_price\
        \ = 150.0\n            elif asset.upper() == 'GOOG':\n                base_price\
        \ = 2500.0\n            elif asset.upper() == 'MSFT':\n                base_price\
        \ = 300.0\n            \n            days_from_start = (current_date - start_dt).days\n\
        \            price = base_price + (days_from_start * 0.5) + random.uniform(-2.0,\
        \ 2.0)\n            historical_prices.append(round(price, 2))\n        \n\
        \        current_date += datetime.timedelta(days=1)\n    \n    return historical_prices"
