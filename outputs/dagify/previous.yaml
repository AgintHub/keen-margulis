      \ for each file.\")\n    )\n    cyclomatic_complexity: List[int] = (\n     \
      \   Field(..., description=\"Cyclomatic complexity values for each file.\")\n\
      \    )\n\n\nclass CheckCodeStyleOutput(BaseModel):\n    \"\"\"Pydantic model\
