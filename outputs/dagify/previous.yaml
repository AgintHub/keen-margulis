dag_type: shim
description: A comprehensive trading workflow designed to execute trades based on
  market analysis and risk management strategies.
name: super_workflow
nodes:
  analyze_market_trends:
    agent: false
    code_node_type: shim
    description: Perform technical analysis on market data.
    implementation: "from ._analyze_market_trends.validate_market_data import validate_market_data\n\
      from ._analyze_market_trends.validate_volume_data import validate_volume_data\n\
      from ._analyze_market_trends.calculate_price_trends import calculate_price_trends\n\
      from ._analyze_market_trends.calculate_volume_trends import calculate_volume_trends\n\
      from ._analyze_market_trends.combine_trend_indicators import combine_trend_indicators\n\
      from ._analyze_market_trends.identify_price_patterns import identify_price_patterns\n\
      from ._analyze_market_trends.identify_volume_patterns import identify_volume_patterns\n\
      from ._analyze_market_trends.combine_pattern_results import combine_pattern_results\n\
      \nfrom pydantic import BaseModel, Field\nfrom typing import List\n\n\nclass\
      \ FetchMarketDataOutput(BaseModel):\n    \"\"\"Pydantic model for fetch_market_data\
      \ node outputs.\"\"\"\n    market_prices: List[float] = (\n        Field(...,\
      \ description=\"List of current market prices.\")\n    )\n    market_volumes:\
      \ List[int] = (\n        Field(..., description=\"List of current market volumes.\"\
      )\n    )\n\n\nclass AnalyzeMarketTrendsOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for analyze_market_trends node outputs.\"\"\"\n    trend_indicators:\
      \ List[float] = (\n        Field(..., description=\"List of indicators showing\
      \ market trends.\")\n    )\n    pattern_recognition_results: List[str] = (\n\
      \        Field(..., description=\"List of identified patterns in the market\
      \ data.\")\n    )\n\n\ndef analyze_market_trends(fetch_market_data_input: FetchMarketDataOutput,\
      \ **kwargs) -> AnalyzeMarketTrendsOutput:\n    \"\"\"\n    Analyze market data\
      \ to identify trends and patterns.\n\n    Parameters\n    ----------\n    market_prices\
      \ : List[float]\n        List of current market prices fetched from reliable\
      \ sources.\n    market_volumes : List[int]\n        List of current market volumes\
      \ fetched from reliable sources.\n\n    Returns\n    -------\n    Tuple[List[float],\
      \ List[str]]\n        A tuple containing a list of trend indicators and a list\
      \ of pattern\n        recognition results.\n\n    Raises\n    ------\n    ValueError\n\
      \        If market_prices or market_volumes are empty or malformed.\n\n    Examples\n\
      \    --------\n    >>> market_prices = [100.0, 105.0, 110.0, 115.0, 120.0]\n\
      \    >>> market_volumes = [1000, 1200, 1500, 1800, 2000]\n    >>> analyze_market_trends(market_prices,\
      \ market_volumes)\n    ([1.0, 1.2, 1.5, 1.8, 2.0], ['uptrend', 'increasing_volume'])\n\
      \n    >>> market_prices = [120.0, 115.0, 110.0, 105.0, 100.0]\n    >>> market_volumes\
      \ = [2000, 1800, 1500, 1200, 1000]\n    >>> analyze_market_trends(market_prices,\
      \ market_volumes)\n    ([-1.0, -1.2, -1.5, -1.8, -2.0], ['downtrend', 'decreasing_volume'])\n\
      \n    \"\"\"\n    validated_prices: List[float] = validate_market_data(prices=fetch_market_data_input.market_prices,\
      \ volumes=fetch_market_data_input.market_volumes)\n    validated_volumes: List[int]\
      \ = validate_volume_data(volumes=fetch_market_data_input.market_volumes)\n \
      \   \n    price_trends: List[float] = calculate_price_trends(prices=validated_prices)\n\
      \    volume_trends: List[float] = calculate_volume_trends(volumes=validated_volumes)\n\
      \    \n    combined_indicators: List[float] = combine_trend_indicators(price_trends=price_trends,\
      \ volume_trends=volume_trends)\n    \n    price_patterns: List[str] = identify_price_patterns(prices=validated_prices)\n\
      \    volume_patterns: List[str] = identify_volume_patterns(volumes=validated_volumes)\n\
      \    \n    all_patterns: List[str] = combine_pattern_results(price_patterns=price_patterns,\
      \ volume_patterns=volume_patterns)\n    \n    return AnalyzeMarketTrendsOutput(\n\
      \        trend_indicators=combined_indicators,\n        pattern_recognition_results=all_patterns\n\
      \    )"
    name: analyze_market_trends
    nodes_depended_on:
    - fetch_market_data
    nodes_dependent_on:
    - generate_trading_signals
    output_structure:
    - description: List of indicators showing market trends.
      key: trend_indicators
      type: List[float]
    - description: List of identified patterns in the market data.
      key: pattern_recognition_results
      type: List[str]
    prd:
      conceptual_info: This node performs technical analysis on the fetched market
        data to identify trends and patterns, providing crucial insights for generating
        trading signals.
      docstring:
        examples:
        - lines:
          - market_prices = [100.0, 105.0, 110.0, 115.0, 120.0]
          - market_volumes = [1000, 1200, 1500, 1800, 2000]
          - analyze_market_trends(market_prices, market_volumes)
          output: ([1.0, 1.2, 1.5, 1.8, 2.0], ['uptrend', 'increasing_volume'])
        - lines:
          - market_prices = [120.0, 115.0, 110.0, 105.0, 100.0]
          - market_volumes = [2000, 1800, 1500, 1200, 1000]
          - analyze_market_trends(market_prices, market_volumes)
          output: ([-1.0, -1.2, -1.5, -1.8, -2.0], ['downtrend', 'decreasing_volume'])
        parameters:
        - description: List of current market prices fetched from reliable sources.
          name: market_prices
          type: List[float]
        - description: List of current market volumes fetched from reliable sources.
          name: market_volumes
          type: List[int]
        raises:
        - description: If market_prices or market_volumes are empty or malformed.
          type: ValueError
        returns:
          description: A tuple containing a list of trend indicators and a list of
            pattern recognition results.
          type: Tuple[List[float], List[str]]
        summary: Analyze market data to identify trends and patterns.
    prompt: Analyze the fetched market data to identify trends and patterns.
    shims:
    - agent: false
      code_node_type: virtual-stub
      description: Validates market data by processing input prices and volumes to
