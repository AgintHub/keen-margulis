dag_type: shim
description: Generated workflow from UI.
name: shaping_of_history_workflow
nodes:
  analyze_cultural_influences:
    agent: false
    code_node_type: shim
    description: Investigate the cultural factors that shaped the historical event
      or period.
    implementation: "from ._analyze_cultural_influences.validate_cultural_factors\
      \ import validate_cultural_factors\nfrom ._analyze_cultural_influences.categorize_cultural_factors\
      \ import categorize_cultural_factors\nfrom ._analyze_cultural_influences.generate_factor_descriptions\
      \ import generate_factor_descriptions\nfrom ._analyze_cultural_influences.calculate_influence_scores\
      \ import calculate_influence_scores\nfrom ._analyze_cultural_influences.determine_significance\
      \ import determine_significance\n\nfrom pydantic import BaseModel, Field\nfrom\
      \ typing import List\n\n\nclass IdentifyKeyFactorsOutput(BaseModel):\n    \"\
      \"\"Pydantic model for identify_key_factors node outputs.\"\"\"\n    social_factors:\
      \ List[str] = (\n        Field(..., description = (\n            \"List of primary\
      \ social factors that influenced the event or period.\")\n        )\n    )\n\
      \    political_factors: List[str] = (\n        Field(..., description = (\n\
      \            \"List of primary political factors that influenced the event or\
      \ period.\")\n        )\n    )\n    economic_factors: List[str] = (\n      \
      \  Field(..., description = (\n            \"List of primary economic factors\
      \ that influenced the event or period.\")\n        )\n    )\n    cultural_factors:\
      \ List[str] = (\n        Field(..., description = (\n            \"List of primary\
      \ cultural factors that influenced the event or period.\")\n        )\n    )\n\
      \n\nclass AnalyzeCulturalInfluencesOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for analyze_cultural_influences node outputs.\"\"\"\n    cultural_factors:\
      \ List[str] = (\n        Field(..., description=\"Names of cultural factors\
      \ identified\")\n    )\n    factor_categories: List[str] = (\n        Field(...,\
      \ description = (\n            \"Category of each cultural factor (e.g., norm,\
      \ value, artistic movement, religious belief, linguistic trend)\")\n       \
      \ )\n    )\n    factor_descriptions: List[str] = (\n        Field(..., description=\"\
      Brief description of each cultural factor\")\n    )\n    influence_scores: List[float]\
      \ = (\n        Field(..., description = (\n            \"Estimated influence\
      \ score of each factor on the historical event or period (0 to 1)\")\n     \
      \   )\n    )\n    is_significant: List[bool] = (\n        Field(..., description\
      \ = (\n            \"Whether each factor is considered significant (True = significant,\
      \ False = not significant)\")\n        )\n    )\n\n\ndef analyze_cultural_influences(identify_key_factors_input:\
      \ IdentifyKeyFactorsOutput, **kwargs) -> AnalyzeCulturalInfluencesOutput:\n\
      \    \"\"\"\n    Analyze cultural influences for a historical event and return\
      \ detailed\n    scores and descriptors.\n\n    Parameters\n    ----------\n\
      \    cultural_factors : List[str]\n        List of cultural factor names produced\
      \ by the identify_key_factors\n        node.\n\n    Returns\n    -------\n \
      \   dict\n        Dictionary containing the keys 'cultural_factors',\n     \
      \   'factor_categories', 'factor_descriptions', 'influence_scores', and\n  \
      \      'is_significant', each mapping to a list of equal length.\n\n    Raises\n\
      \    ------\n    ValueError\n        Raised if the input list is empty or contains\
      \ non-string elements.\n\n    Examples\n    --------\n    >>> result = analyze_cultural_influences(['Romanticism',\
      \ 'Buddhism'])\n    >>> print(result['cultural_factors'])\n    >>> print(result['factor_categories'])\n\
      \    >>> print(result['influence_scores'])\n    >>> print(result['is_significant'])\n\
      \    [\"Romanticism\", \"Buddhism\"]\n    [\"Artistic movement\", \"Religious\
      \ belief\"]\n    [0.8, 0.6]\n    [True, True]\n\n    >>> try:\n    ...     analyze_cultural_influences([])\n\
      \    >>> except ValueError as e:\n    ...     print(e)\n    \"No cultural factors\
      \ provided. At least one is required.\"\n\n    \"\"\"\n    cultural_factors:\
      \ List[str] = identify_key_factors_input.cultural_factors\n    \n    validated_factors:\
      \ List[str] = validate_cultural_factors(factors=cultural_factors)\n    \n  \
      \  factor_categories: List[str] = categorize_cultural_factors(factors=validated_factors)\n\
      \    \n    factor_descriptions: List[str] = generate_factor_descriptions(factors=validated_factors)\n\
      \    \n    influence_scores: List[float] = calculate_influence_scores(factors=validated_factors)\n\
      \    \n    is_significant: List[bool] = determine_significance(scores=influence_scores)\n\
      \    \n    return AnalyzeCulturalInfluencesOutput(\n        cultural_factors=validated_factors,\n\
      \        factor_categories=factor_categories,\n        factor_descriptions=factor_descriptions,\n\
      \        influence_scores=influence_scores,\n        is_significant=is_significant,\n\
      \    )"
    name: analyze_cultural_influences
    nodes_depended_on:
    - identify_key_factors
    nodes_dependent_on: []
    output_structure:
    - description: Names of cultural factors identified
      key: cultural_factors
      type: List[str]
    - description: Category of each cultural factor (e.g., norm, value, artistic movement,
        religious belief, linguistic trend)
      key: factor_categories
      type: List[str]
    - description: Brief description of each cultural factor
      key: factor_descriptions
      type: List[str]
    - description: Estimated influence score of each factor on the historical event
        or period (0 to 1)
      key: influence_scores
      type: List[float]
    - description: Whether each factor is considered significant (True = significant,
        False = not significant)
      key: is_significant
      type: List[bool]
    prd:
      conceptual_info: This node transforms the list of cultural factors identified
        by its parent into a structured, scored representation that highlights each
        factor's category, description, influence magnitude, and overall significance.
      docstring:
        examples:
        - lines:
          - result = analyze_cultural_influences(['Romanticism', 'Buddhism'])
          - print(result['cultural_factors'])
          - print(result['factor_categories'])
          - print(result['influence_scores'])
          - print(result['is_significant'])
          output: '["Romanticism", "Buddhism"]

            ["Artistic movement", "Religious belief"]

            [0.8, 0.6]

            [True, True]'
        - lines:
          - 'try:'
          - '    analyze_cultural_influences([])'
          - 'except ValueError as e:'
          - '    print(e)'
          output: '"No cultural factors provided. At least one is required."'
        parameters:
        - description: List of cultural factor names produced by the identify_key_factors
            node.
          name: cultural_factors
          type: List[str]
        raises:
        - description: Raised if the input list is empty or contains non-string elements.
          type: ValueError
        returns:
          description: Dictionary containing the keys 'cultural_factors', 'factor_categories',
            'factor_descriptions', 'influence_scores', and 'is_significant', each
            mapping to a list of equal length.
          type: dict
        summary: Analyze cultural influences for a historical event and return detailed
          scores and descriptors.
    prompt: Analyze how cultural norms, values, or artistic movements influenced the
      historical event or period.
    shims:
    - agent: false
      code_node_type: virtual-stub
      description: Validates, normalizes, and deduplicates a list of cultural factor
        names.
      implementation: "from typing import List\n\n\ndef validate_cultural_factors(factors:\
        \ str) -> List[str]:\n    \"\"\"\n    Validate and normalize a list of cultural\
        \ factor names.\n\n    Parameters\n    ----------\n    factors : List[str]\n\
        \        List of cultural factor names that may contain leading/trailing\n\
        \        whitespace, inconsistent casing, duplicates, or empty strings.\n\n\
        \    Returns\n    -------\n    List[str]\n        A cleaned list of unique,\
        \ title‑cased factor names with all empty\n        strings removed.\n\n  \
        \  Raises\n    ------\n    TypeError\n        Raised if `factors` is not a\
        \ list or contains non‑string elements.\n    ValueError\n        Raised if\
        \ any element in `factors` is not a non‑empty string after\n        stripping\
        \ whitespace.\n\n    Examples\n    --------\n    >>> validated = validate_cultural_factors(['\
        \  art  ', 'culture', 'art', ''])\n    ['Art', 'Culture']\n\n    >>> validated\
        \ = validate_cultural_factors(['religion', 'tradition',\n    'music'])\n \
        \   ['Religion', 'Tradition', 'Music']\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: validate_cultural_factors
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: factors
        type: str
      prd:
        conceptual_info: This shim is responsible for sanitizing the cultural factors
          passed from the `identify_key_factors` node before they are further processed
          by downstream analysis functions. It ensures the data is clean, consistent,
          and free of duplicates, providing a reliable foundation for categorization,
          description generation, and influence scoring.
        docstring:
          examples:
          - lines:
            - validated = validate_cultural_factors(['  art  ', 'culture', 'art',
              ''])
            output: '[''Art'', ''Culture'']'
          - lines:
            - validated = validate_cultural_factors(['religion', 'tradition', 'music'])
            output: '[''Religion'', ''Tradition'', ''Music'']'
          parameters:
          - description: List of cultural factor names that may contain leading/trailing
              whitespace, inconsistent casing, duplicates, or empty strings.
            name: factors
            type: List[str]
          raises:
          - description: Raised if `factors` is not a list or contains non‑string
              elements.
            type: TypeError
          - description: Raised if any element in `factors` is not a non‑empty string
              after stripping whitespace.
            type: ValueError
          returns:
            description: A cleaned list of unique, title‑cased factor names with all
              empty strings removed.
            type: List[str]
          summary: Validate and normalize a list of cultural factor names.
      prompt: 'Validate cultural factors: `validate_cultural_factors(factors=[...])`
        should return a cleaned list of non‑empty, title‑cased strings with duplicates
        removed.'
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Categorizes each cultural factor into predefined categories such
        as norm, value, artistic movement, religious belief, or linguistic trend.
      implementation: "from typing import List\n\n\ndef categorize_cultural_factors(factors:\
        \ str) -> List[str]:\n    \"\"\"\n    Assigns each cultural factor to a predefined\
        \ category.\n\n    Parameters\n    ----------\n    factors : List[str]\n \
        \       List of cultural factor names to be categorized.\n\n    Returns\n\
        \    -------\n    List[str]\n        A list of categories corresponding to\
        \ each input factor.\n\n    Raises\n    ------\n    TypeError\n        If\
        \ `factors` is not a list of strings.\n    ValueError\n        If any factor\
        \ in `factors` is an empty string or if the list is\n        empty.\n\n  \
        \  Examples\n    --------\n    >>> categorize_cultural_factors(['Shakespeare',\
        \ 'Renaissance art',\n    'Confucianism', 'Romanticism'])\n    ['value', 'artistic\
        \ movement', 'religious belief', 'artistic movement']\n\n    >>> categorize_cultural_factors(['Collective\
        \ memory', 'Patriotic slogans'])\n    ['norm', 'value']\n\n    \"\"\"\n  \
        \  raise NotImplementedError(\"This is a virtual stub node that needs to be\
        \ implemented\")"
      name: categorize_cultural_factors
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: factors
        type: str
      prd:
        conceptual_info: This shim assigns a category to each cultural factor, enabling
          downstream analysis of factor influence and significance.
        docstring:
          examples:
          - lines:
            - categorize_cultural_factors(['Shakespeare', 'Renaissance art', 'Confucianism',
              'Romanticism'])
            output: '[''value'', ''artistic movement'', ''religious belief'', ''artistic
              movement'']'
          - lines:
            - categorize_cultural_factors(['Collective memory', 'Patriotic slogans'])
            output: '[''norm'', ''value'']'
          parameters:
          - description: List of cultural factor names to be categorized.
            name: factors
            type: List[str]
          raises:
          - description: If `factors` is not a list of strings.
            type: TypeError
          - description: If any factor in `factors` is an empty string or if the list
              is empty.
            type: ValueError
          returns:
            description: A list of categories corresponding to each input factor.
            type: List[str]
          summary: Assigns each cultural factor to a predefined category.
      prompt: Given a list of validated cultural factors, assign each factor to a
        category (e.g., norm, value, artistic movement, religious belief, linguistic
        trend).
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Creates concise descriptions for each cultural factor supplied
        in the input list.
      implementation: "from typing import List\n\n\ndef generate_factor_descriptions(factors:\
        \ str) -> List[str]:\n    \"\"\"\n    Return a short, descriptive sentence\
        \ for every cultural factor supplied.\n\n    Parameters\n    ----------\n\
        \    factors : List[str]\n        A list of cultural factor names to be described.\n\
        \n    Returns\n    -------\n    List[str]\n        A list of strings where\
        \ each string is a brief description of the\n        corresponding cultural\
        \ factor.\n\n    Raises\n    ------\n    TypeError\n        Raised if `factors`\
        \ is not a list or contains non‑string elements.\n    ValueError\n       \
        \ Raised if `factors` is empty.\n\n    Examples\n    --------\n    >>> generate_factor_descriptions(factors=[\"\
        industrialization\",\n    \"revolution\"])\n    [\"A period of rapid industrial\
        \ growth and economic change.\", \"A widespread\n    societal upheaval often\
        \ accompanied by significant social and political\n    transformations.\"\
        ]\n\n    >>> generate_factor_descriptions(factors=[\"artistic movement\",\
        \ \"linguistic\n    trend\"])\n    [\"An era of distinctive artistic styles\
        \ that influence cultural\n    expression.\", \"A shift in language usage\
        \ reflecting societal changes.\"]\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: generate_factor_descriptions
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: factors
        type: str
      prd:
        conceptual_info: The shim encapsulates the logic required to transform raw
          cultural factor names into human‑readable descriptions, enabling downstream
          analysis nodes to assess the significance and impact of each factor.
        docstring:
          examples:
          - lines:
            - generate_factor_descriptions(factors=["industrialization", "revolution"])
            output: '["A period of rapid industrial growth and economic change.",
              "A widespread societal upheaval often accompanied by significant social
              and political transformations."]'
          - lines:
            - generate_factor_descriptions(factors=["artistic movement", "linguistic
              trend"])
            output: '["An era of distinctive artistic styles that influence cultural
              expression.", "A shift in language usage reflecting societal changes."]'
          parameters:
          - description: A list of cultural factor names to be described.
            name: factors
            type: List[str]
          raises:
          - description: Raised if `factors` is not a list or contains non‑string
              elements.
            type: TypeError
          - description: Raised if `factors` is empty.
            type: ValueError
          returns:
            description: A list of strings where each string is a brief description
              of the corresponding cultural factor.
            type: List[str]
          summary: Return a short, descriptive sentence for every cultural factor
            supplied.
      prompt: Generate brief, one‑sentence descriptions for each cultural factor in
        the provided list and return them as a List[str].
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Calculates a list of influence scores (between 0 and 1) for each
        cultural factor provided.
      implementation: "from typing import List\n\n\ndef calculate_influence_scores(factors:\
        \ str) -> List[float]:\n    \"\"\"\n    Calculate influence scores for a list\
        \ of cultural factors.\n\n    Parameters\n    ----------\n    factors : List[str]\n\
        \        A list of cultural factor names to evaluate.\n\n    Returns\n   \
        \ -------\n    List[float]\n        A list of influence scores, one per input\
        \ factor, ranging from 0 (no\n        influence) to 1 (maximum influence).\n\
        \n    Raises\n    ------\n    ValueError\n        Raised if the factors list\
        \ is empty or contains non-string elements.\n    TypeError\n        Raised\
        \ if the input is not a list of strings.\n\n    Examples\n    --------\n \
        \   >>> calculate_influence_scores(['religion', 'artistic_movement'])\n  \
        \  [0.85, 0.42]\n\n    >>> calculate_influence_scores(['language_trend'])\n\
        \    [0.92]\n\n    \"\"\"\n    raise NotImplementedError(\"This is a virtual\
        \ stub node that needs to be implemented\")"
      name: calculate_influence_scores
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[float]
        key: output
        type: List[float]
      - description: Input parameter of type str
        key: factors
        type: str
      prd:
        conceptual_info: This shim evaluates the relative importance of each cultural
          factor by producing a normalized score between 0 and 1, enabling downstream
          modules to assess significance and rank factors.
        docstring:
          examples:
          - lines:
            - calculate_influence_scores(['religion', 'artistic_movement'])
            output: '[0.85, 0.42]'
          - lines:
            - calculate_influence_scores(['language_trend'])
            output: '[0.92]'
          parameters:
          - description: A list of cultural factor names to evaluate.
            name: factors
            type: List[str]
          raises:
          - description: Raised if the factors list is empty or contains non-string
              elements.
            type: ValueError
          - description: Raised if the input is not a list of strings.
            type: TypeError
          returns:
            description: A list of influence scores, one per input factor, ranging
              from 0 (no influence) to 1 (maximum influence).
            type: List[float]
          summary: Calculate influence scores for a list of cultural factors.
      prompt: Implement the calculate_influence_scores shim that accepts a list of
        factor names and returns a corresponding list of influence scores (0 to 1).
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Determines the significance of each cultural factor based on its
        influence score.
      implementation: "from typing import List\n\n\ndef determine_significance(scores:\
        \ str) -> List[bool]:\n    \"\"\"\n    Determines the significance of cultural\
        \ factors by thresholding influence\n    scores.\n\n    Parameters\n    ----------\n\
        \    scores : List[float]\n        Influence scores for each cultural factor,\
        \ values expected to be in\n        the range [0, 1].\n\n    Returns\n   \
        \ -------\n    List[bool]\n        A list of booleans where True indicates\
        \ the factor's score meets or\n        exceeds the significance threshold.\n\
        \n    Raises\n    ------\n    ValueError\n        Raised if any score is outside\
        \ the [0, 1] range or if the input list\n        is empty.\n    TypeError\n\
        \        Raised if the input is not a list or if any element is not a float.\n\
        \n    Examples\n    --------\n    >>> determine_significance([0.8, 0.3, 0.95])\n\
        \    [True, False, True]\n\n    >>> determine_significance([0.4, 0.6])\n \
        \   [False, True]\n\n    \"\"\"\n    raise NotImplementedError(\"This is a\
        \ virtual stub node that needs to be implemented\")"
      name: determine_significance
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[bool]
        key: output
        type: List[bool]
      - description: Input parameter of type str
        key: scores
        type: str
      prd:
        conceptual_info: This shim evaluates a list of influence scores and flags
          each factor as significant or not, allowing downstream analysis to filter
          or prioritize factors.
        docstring:
          examples:
          - lines:
            - determine_significance([0.8, 0.3, 0.95])
            output: '[True, False, True]'
          - lines:
            - determine_significance([0.4, 0.6])
            output: '[False, True]'
          parameters:
          - description: Influence scores for each cultural factor, values expected
              to be in the range [0, 1].
            name: scores
            type: List[float]
          raises:
          - description: Raised if any score is outside the [0, 1] range or if the
              input list is empty.
            type: ValueError
          - description: Raised if the input is not a list or if any element is not
              a float.
            type: TypeError
          returns:
            description: A list of booleans where True indicates the factor's score
              meets or exceeds the significance threshold.
            type: List[bool]
          summary: Determines the significance of cultural factors by thresholding
            influence scores.
      prompt: 'Implement determine_significance(scores: List[float]) -> List[bool]'
      shims: []
  analyze_economic_influences:
    agent: false
    code_node_type: shim
    description: Assess the economic factors that contributed to the historical event
      or period.
    implementation: "from ._analyze_economic_influences.validate_economic_factors_input\
      \ import validate_economic_factors_input\nfrom ._analyze_economic_influences.analyze_factor_impact\
      \ import analyze_factor_impact\nfrom ._analyze_economic_influences.gather_evidence_sources\
      \ import gather_evidence_sources\nfrom ._analyze_economic_influences.format_evidence_sources\
      \ import format_evidence_sources\nfrom ._analyze_economic_influences.calculate_impact_strength\
      \ import calculate_impact_strength\nfrom ._analyze_economic_influences.determine_time_period_affected\
      \ import determine_time_period_affected\nfrom ._analyze_economic_influences.check_scholarly_consensus\
      \ import check_scholarly_consensus\n\nfrom pydantic import BaseModel, Field\n\
      from typing import List\n\n\nclass IdentifyKeyFactorsOutput(BaseModel):\n  \
      \  \"\"\"Pydantic model for identify_key_factors node outputs.\"\"\"\n    social_factors:\
      \ List[str] = (\n        Field(..., description = (\n            \"List of primary\
      \ social factors that influenced the event or period.\")\n        )\n    )\n\
      \    political_factors: List[str] = (\n        Field(..., description = (\n\
      \            \"List of primary political factors that influenced the event or\
      \ period.\")\n        )\n    )\n    economic_factors: List[str] = (\n      \
      \  Field(..., description = (\n            \"List of primary economic factors\
      \ that influenced the event or period.\")\n        )\n    )\n    cultural_factors:\
      \ List[str] = (\n        Field(..., description = (\n            \"List of primary\
      \ cultural factors that influenced the event or period.\")\n        )\n    )\n\
      \n\nclass AnalyzeEconomicInfluencesOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for analyze_economic_influences node outputs.\"\"\"\n    economic_factor_name:\
      \ str = (\n        Field(..., description=\"Name of the economic factor considered.\"\
      )\n    )\n    impact_summary: str = (\n        Field(..., description = (\n\
      \            \"Brief description of how this factor impacted the event.\")\n\
      \        )\n    )\n    evidence_sources: str = (\n        Field(..., description\
      \ = (\n            \"List of primary source references or data points supporting\
      \ the analysis.\")\n        )\n    )\n    impact_strength: float = (\n     \
      \   Field(..., description = (\n            \"Rating of the factor's impact\
      \ strength on a scale from 0 to 1.\")\n        )\n    )\n    time_period_affected:\
      \ str = (\n        Field(..., description = (\n            \"Time period during\
      \ which the factor was most influential.\")\n        )\n    )\n    is_consensus:\
      \ bool = (\n        Field(..., description = (\n            \"Whether there\
      \ is scholarly consensus on the factor's significance.\")\n        )\n    )\n\
      \n\ndef analyze_economic_influences(identify_key_factors_input: IdentifyKeyFactorsOutput,\
      \ **kwargs) -> AnalyzeEconomicInfluencesOutput:\n    \"\"\"\n    Analyzes each\
      \ economic factor from the input list and returns a structured\n    assessment\
      \ of its impact on the historical event or period.\n\n    Parameters\n    ----------\n\
      \    economic_factors : List[str]\n        List of economic factors identified\
      \ by the `identify_key_factors`\n        node.\n\n    Returns\n    -------\n\
      \    List[Dict[str, Any]]\n        A list of dictionaries, each containing structured\
      \ information about\n        an economic factor.\n\n    Raises\n    ------\n\
      \    ValueError\n        Raised when the `economic_factors` list is empty.\n\
      \    TypeError\n        Raised when `economic_factors` is not a list of strings.\n\
      \n    Examples\n    --------\n    >>> analyze_economic_influences(['Inflation',\
      \ 'Trade Embargo'])\n    [{'economic_factor_name': 'Inflation', 'impact_summary':\
      \ 'High inflation\n    reduced purchasing power and disrupted domestic markets.',\n\
      \    'evidence_sources': ['Economic Report 1931', 'Historical GDP Data'],\n\
      \    'impact_strength': 0.85, 'time_period_affected': '1931-1933',\n    'is_consensus':\
      \ True}, {'economic_factor_name': 'Trade Embargo',\n    'impact_summary': 'The\
      \ embargo limited exports, weakening the national\n    economy.', 'evidence_sources':\
      \ ['Trade Records 1940', 'Diplomatic\n    Correspondence'], 'impact_strength':\
      \ 0.70, 'time_period_affected':\n    '1940-1945', 'is_consensus': False}]\n\n\
      \    >>> analyze_economic_influences(['Industrial Production Growth'])\n   \
