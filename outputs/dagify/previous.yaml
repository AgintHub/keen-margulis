dag_type: stub
description: A workflow that creates a trading strategy based on market data and executes
  trades accordingly.
name: trading_workflow
nodes:
  analyze_market_trends:
    agent: false
    code_node_type: stub
    description: Use technical indicators and machine learning algorithms to analyze
      market trends.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass GatherMarketDataOutput(BaseModel):\n    \"\"\"Pydantic model for gather_market_data\
      \ node outputs.\"\"\"\n    current_prices: List[float] = Field(..., description=\"\
      Current prices of relevant assets\")\n    historical_prices: List[float] = Field(...,\
      \ description=\"Historical price data for relevant assets\")\n    market_volumes:\
      \ List[float] = Field(..., description=\"Current trading volumes of relevant\
      \ assets\")\n\n\nclass AnalyzeMarketTrendsOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for analyze_market_trends node outputs.\"\"\"\n    trend_indicators:\
      \ List[float] = Field(..., description=\"Indicators showing the direction and\
      \ strength of market trends\")\n    pattern_recognition_results: List[str] =\
      \ Field(..., description=\"Results of pattern recognition analysis\")\n\n\n\
      def analyze_market_trends(gather_market_data_input: GatherMarketDataOutput,\
      \ **kwargs) -> AnalyzeMarketTrendsOutput:\n    \"\"\"\n    Analyzes market data\
      \ to identify trends and patterns.\n\n    Parameters\n    ----------\n    current_prices\
      \ : List[float]\n        Current prices of relevant assets gathered from gather_market_data\n\
      \        node.\n    historical_prices : List[float]\n        Historical price\
      \ data for relevant assets gathered from\n        gather_market_data node.\n\
      \    market_volumes : List[float]\n        Current trading volumes of relevant\
      \ assets gathered from\n        gather_market_data node.\n\n    Returns\n  \
      \  -------\n    Tuple[List[float], List[str]]\n        A tuple containing trend\
      \ indicators and pattern recognition results.\n\n    Raises\n    ------\n  \
      \  ValueError\n        If input data is inconsistent or missing.\n\n    Examples\n\
      \    --------\n    >>> current_prices = [100.0, 120.0, 110.0]\n    >>> historical_prices\
      \ = [90.0, 100.0, 110.0, 120.0, 130.0]\n    >>> market_volumes = [1000.0, 1200.0,\
      \ 1100.0]\n    >>> result = analyze_market_trends(current_prices, historical_prices,\n\
      \    market_volumes)\n    ([0.5, 0.7, 0.3], ['uptrend', 'reversal'])\n\n   \
      \ \"\"\"\n    return AnalyzeMarketTrendsOutput(\n        trend_indicators=[],\n\
      \        pattern_recognition_results=[],\n    )"
    name: analyze_market_trends
    nodes_depended_on:
    - gather_market_data
    nodes_dependent_on:
    - generate_trading_signals
    output_structure:
    - description: Indicators showing the direction and strength of market trends
      key: trend_indicators
      type: List[float]
    - description: Results of pattern recognition analysis
      key: pattern_recognition_results
      type: List[str]
    prd:
      conceptual_info: This node analyzes market trends using technical indicators
        and machine learning algorithms.
      docstring:
        examples:
        - lines:
          - current_prices = [100.0, 120.0, 110.0]
          - historical_prices = [90.0, 100.0, 110.0, 120.0, 130.0]
          - market_volumes = [1000.0, 1200.0, 1100.0]
          - result = analyze_market_trends(current_prices, historical_prices, market_volumes)
          output: ([0.5, 0.7, 0.3], ['uptrend', 'reversal'])
        parameters:
        - description: Current prices of relevant assets gathered from gather_market_data
            node.
          name: current_prices
          type: List[float]
        - description: Historical price data for relevant assets gathered from gather_market_data
            node.
          name: historical_prices
          type: List[float]
        - description: Current trading volumes of relevant assets gathered from gather_market_data
            node.
          name: market_volumes
          type: List[float]
        raises:
        - description: If input data is inconsistent or missing.
          type: ValueError
        returns:
          description: A tuple containing trend indicators and pattern recognition
            results.
          type: Tuple[List[float], List[str]]
        summary: Analyzes market data to identify trends and patterns.
    prompt: Analyze the gathered market data to identify trends and patterns.
    shims: []
  execute_trades:
    agent: false
    code_node_type: stub
    description: Use the trading signals to execute buy or sell orders on the relevant
      assets.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass GenerateTradingSignalsOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for generate_trading_signals node outputs.\"\"\"\n    trading_signals: List[str]\
      \ = Field(..., description=\"Final list of trading signals (buy or sell)\")\n\
      \    signal_confidence: List[float] = Field(..., description=\"Confidence level\
      \ for each trading signal\")\n\n\nclass ExecuteTradesOutput(BaseModel):\n  \
      \  \"\"\"Pydantic model for execute_trades node outputs.\"\"\"\n    trade_results:\
      \ List[str] = Field(..., description=\"Results of the executed trades\")\n \
      \   trade_status: List[str] = Field(..., description=\"Status of each executed\
      \ trade (success or failure)\")\n\n\ndef execute_trades(generate_trading_signals_input:\
      \ GenerateTradingSignalsOutput, **kwargs) -> ExecuteTradesOutput:\n    \"\"\"\
      \n    Executes trades according to the provided trading signals and returns\
      \ the\n    results and status of these trades.\n\n    Parameters\n    ----------\n\
      \    trading_signals : List[str]\n        List of trading signals (buy or sell)\
      \ generated by the\n        generate_trading_signals node.\n    signal_confidence\
      \ : List[float]\n        Confidence levels for each trading signal, indicating\
      \ the\n        reliability of the signal.\n\n    Returns\n    -------\n    Tuple[List[str],\
      \ List[str]]\n        A tuple containing two lists: trade_results and trade_status.\n\
      \        trade_results contains the outcomes of the executed trades, while\n\
      \        trade_status indicates whether each trade was successful or not.\n\n\
      \    Raises\n    ------\n    ValueError\n        If the lengths of trading_signals\
      \ and signal_confidence do not\n        match, indicating inconsistent input\
      \ data.\n    RuntimeError\n        If an error occurs during the execution of\
      \ trades, such as failure\n        to connect to the trading platform or insufficient\
      \ funds.\n\n    Examples\n    --------\n    >>> trading_signals = ['buy', 'sell',\
      \ 'buy']\n    >>> signal_confidence = [0.8, 0.7, 0.9]\n    >>> trade_results,\
      \ trade_status = execute_trades(trading_signals,\n    signal_confidence)\n \
      \   (['Trade executed: buy', 'Trade executed: sell', 'Trade executed: buy'],\n\
      \    ['success', 'success', 'success'])\n\n    >>> trading_signals = ['buy',\
      \ 'sell']\n    >>> signal_confidence = [0.6]\n    >>> try:\n    ...     trade_results,\
      \ trade_status = execute_trades(trading_signals,\n    signal_confidence)\n \
      \   >>> except ValueError as e:\n    ...     print(e)\n    \"Lengths of trading_signals\
      \ and signal_confidence must match\"\n\n    \"\"\"\n    return ExecuteTradesOutput(\n\
      \        trade_results=[],\n        trade_status=[],\n    )"
    name: execute_trades
    nodes_depended_on:
    - generate_trading_signals
    nodes_dependent_on: []
    output_structure:
    - description: Results of the executed trades
      key: trade_results
      type: List[str]
    - description: Status of each executed trade (success or failure)
      key: trade_status
      type: List[str]
    prd:
      conceptual_info: This node executes trades based on the generated trading signals,
        processing buy or sell orders for relevant assets.
      docstring:
        examples:
        - lines:
          - trading_signals = ['buy', 'sell', 'buy']
          - signal_confidence = [0.8, 0.7, 0.9]
          - trade_results, trade_status = execute_trades(trading_signals, signal_confidence)
          output: '([''Trade executed: buy'', ''Trade executed: sell'', ''Trade executed:
            buy''], [''success'', ''success'', ''success''])'
        - lines:
          - trading_signals = ['buy', 'sell']
          - signal_confidence = [0.6]
          - 'try:'
          - '    trade_results, trade_status = execute_trades(trading_signals, signal_confidence)'
          - 'except ValueError as e:'
          - '    print(e)'
          output: '"Lengths of trading_signals and signal_confidence must match"'
        parameters:
        - description: List of trading signals (buy or sell) generated by the generate_trading_signals
            node.
          name: trading_signals
          type: List[str]
        - description: Confidence levels for each trading signal, indicating the reliability
            of the signal.
          name: signal_confidence
          type: List[float]
        raises:
        - description: If the lengths of trading_signals and signal_confidence do
            not match, indicating inconsistent input data.
          type: ValueError
        - description: If an error occurs during the execution of trades, such as
            failure to connect to the trading platform or insufficient funds.
          type: RuntimeError
        returns:
          description: 'A tuple containing two lists: trade_results and trade_status.
            trade_results contains the outcomes of the executed trades, while trade_status
            indicates whether each trade was successful or not.'
          type: Tuple[List[str], List[str]]
        summary: Executes trades according to the provided trading signals and returns
          the results and status of these trades.
    prompt: Execute trades based on the generated trading signals.
    shims: []
  gather_market_data:
    agent: false
    code_node_type: stub
    description: Gather market data from various sources such as exchanges, APIs,
      or financial databases.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass GatherMarketDataOutput(BaseModel):\n    \"\"\"Pydantic model for gather_market_data\
      \ node outputs.\"\"\"\n    current_prices: List[float] = Field(..., description=\"\
      Current prices of relevant assets\")\n    historical_prices: List[float] = Field(...,\
      \ description=\"Historical price data for relevant assets\")\n    market_volumes:\
      \ List[float] = Field(..., description=\"Current trading volumes of relevant\
      \ assets\")\n\n\ndef gather_market_data(general_input: str, **kwargs) -> GatherMarketDataOutput:\n\
      \    \"\"\"\n    Gathers market data including current prices, historical prices,\
      \ and trading\n    volumes.\n\n    Parameters\n    ----------\n    data_sources\
      \ : List[str]\n        List of financial data sources (e.g., exchanges, APIs,\
      \ databases) to\n        gather data from.\n    assets : List[str]\n       \
      \ List of assets (e.g., stocks, cryptocurrencies) for which to gather\n    \
      \    market data.\n\n    Returns\n    -------\n    Dict[str, List[float]]\n\
      \        A dictionary containing current prices, historical prices, and\n  \
      \      market volumes for the specified assets.\n\n    Raises\n    ------\n\
      \    ConnectionError\n        If there's an issue connecting to any of the specified\
      \ data sources.\n    ValueError\n        If the list of assets or data sources\
      \ is empty or invalid.\n\n    Examples\n    --------\n    >>> gather_market_data(data_sources=['exchange1',\
      \ 'api2'], assets=['BTC',\n    'ETH'])\n    {'current_prices': [35000.0, 2500.0],\
      \ 'historical_prices': [[34000.0,\n    34500.0, 35000.0], [2400.0, 2450.0, 2500.0]],\
      \ 'market_volumes': [1000.0,\n    500.0]}\n\n    >>> gather_market_data(data_sources=['database3'],\
      \ assets=['AAPL', 'GOOGL'])\n    {'current_prices': [150.0, 2800.0], 'historical_prices':\
      \ [[145.0, 147.0,\n    150.0], [2750.0, 2780.0, 2800.0]], 'market_volumes':\
      \ [2000.0, 300.0]}\n\n    \"\"\"\n    return GatherMarketDataOutput(\n     \
      \   current_prices=[],\n        historical_prices=[],\n        market_volumes=[],\n\
      \    )"
    name: gather_market_data
    nodes_depended_on: []
    nodes_dependent_on:
    - analyze_market_trends
    - identify_trading_opportunities
    output_structure:
    - description: Current prices of relevant assets
      key: current_prices
      type: List[float]
    - description: Historical price data for relevant assets
      key: historical_prices
      type: List[float]
    - description: Current trading volumes of relevant assets
      key: market_volumes
      type: List[float]
    prd:
      conceptual_info: This node is responsible for collecting current and historical
        market data from various financial sources.
      docstring:
        examples:
        - lines:
          - gather_market_data(data_sources=['exchange1', 'api2'], assets=['BTC',
            'ETH'])
          output: '{''current_prices'': [35000.0, 2500.0], ''historical_prices'':
            [[34000.0, 34500.0, 35000.0], [2400.0, 2450.0, 2500.0]], ''market_volumes'':
            [1000.0, 500.0]}'
        - lines:
          - gather_market_data(data_sources=['database3'], assets=['AAPL', 'GOOGL'])
          output: '{''current_prices'': [150.0, 2800.0], ''historical_prices'': [[145.0,
            147.0, 150.0], [2750.0, 2780.0, 2800.0]], ''market_volumes'': [2000.0,
            300.0]}'
        parameters:
        - description: List of financial data sources (e.g., exchanges, APIs, databases)
            to gather data from.
          name: data_sources
          type: List[str]
        - description: List of assets (e.g., stocks, cryptocurrencies) for which to
            gather market data.
          name: assets
          type: List[str]
        raises:
        - description: If there's an issue connecting to any of the specified data
            sources.
          type: ConnectionError
        - description: If the list of assets or data sources is empty or invalid.
          type: ValueError
        returns:
          description: A dictionary containing current prices, historical prices,
            and market volumes for the specified assets.
          type: Dict[str, List[float]]
        summary: Gathers market data including current prices, historical prices,
          and trading volumes.
    prompt: Collect current and historical market data including prices, volumes,
      and other relevant metrics.
    shims: []
  generate_trading_signals:
    agent: false
    code_node_type: stub
    description: Combine the results of trend analysis and opportunity identification
      to generate final trading signals.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass AnalyzeMarketTrendsOutput(BaseModel):\n    \"\"\"Pydantic model for\
      \ analyze_market_trends node outputs.\"\"\"\n    trend_indicators: List[float]\
      \ = Field(..., description=\"Indicators showing the direction and strength of\
      \ market trends\")\n    pattern_recognition_results: List[str] = Field(...,\
      \ description=\"Results of pattern recognition analysis\")\n\n\nclass IdentifyTradingOpportunitiesOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for identify_trading_opportunities node outputs.\"\
      \"\"\n    buy_signals: List[str] = Field(..., description=\"List of assets to\
      \ buy\")\n    sell_signals: List[str] = Field(..., description=\"List of assets\
      \ to sell\")\n\n\nclass GenerateTradingSignalsOutput(BaseModel):\n    \"\"\"\
      Pydantic model for generate_trading_signals node outputs.\"\"\"\n    trading_signals:\
      \ List[str] = Field(..., description=\"Final list of trading signals (buy or\
      \ sell)\")\n    signal_confidence: List[float] = Field(..., description=\"Confidence\
      \ level for each trading signal\")\n\n\ndef generate_trading_signals(analyze_market_trends_input:\
      \ AnalyzeMarketTrendsOutput, identify_trading_opportunities_input: IdentifyTradingOpportunitiesOutput,\
      \ **kwargs) -> GenerateTradingSignalsOutput:\n    \"\"\"\n    Generates final\
      \ trading signals by combining trend analysis and opportunity\n    identification\
      \ results.\n\n    Parameters\n    ----------\n    trend_indicators : List[float]\n\
      \        Indicators showing the direction and strength of market trends from\n\
      \        analyze_market_trends.\n    pattern_recognition_results : List[str]\n\
      \        Results of pattern recognition analysis from analyze_market_trends.\n\
      \    buy_signals : List[str]\n        List of assets to buy from identify_trading_opportunities.\n\
      \    sell_signals : List[str]\n        List of assets to sell from identify_trading_opportunities.\n\
      \n    Returns\n    -------\n    Tuple[List[str], List[float]]\n        A tuple\
      \ containing the final list of trading signals and their\n        corresponding\
      \ confidence levels.\n\n    Raises\n    ------\n    ValueError\n        If the\
      \ input lists are of different lengths or if there are\n        conflicting\
      \ signals.\n\n    Examples\n    --------\n    >>> trend_indicators = [0.8, 0.2,\
      \ 0.5]\n    >>> pattern_recognition_results = ['uptrend', 'downtrend', 'neutral']\n\
      \    >>> buy_signals = ['asset1', 'asset3']\n    >>> sell_signals = ['asset2']\n\
      \    >>> trading_signals, signal_confidence =\n    generate_trading_signals(trend_indicators,\
      \ pattern_recognition_results,\n    buy_signals, sell_signals)\n    (['buy',\
      \ 'sell', 'buy'], [0.9, 0.8, 0.6])\n\n    >>> trend_indicators = [0.4, 0.6]\n\
      \    >>> pattern_recognition_results = ['neutral', 'uptrend']\n    >>> buy_signals\
      \ = ['asset1']\n    >>> sell_signals = []\n    >>> trading_signals, signal_confidence\
      \ =\n    generate_trading_signals(trend_indicators, pattern_recognition_results,\n\
      \    buy_signals, sell_signals)\n    (['buy'], [0.7])\n\n    \"\"\"\n    return\
      \ GenerateTradingSignalsOutput(\n        trading_signals=[],\n        signal_confidence=[],\n\
      \    )"
    name: generate_trading_signals
    nodes_depended_on:
    - analyze_market_trends
    - identify_trading_opportunities
    nodes_dependent_on:
    - execute_trades
    output_structure:
    - description: Final list of trading signals (buy or sell)
      key: trading_signals
      type: List[str]
    - description: Confidence level for each trading signal
      key: signal_confidence
      type: List[float]
    prd:
      conceptual_info: This node integrates trend analysis and opportunity identification
        to produce actionable trading signals.
      docstring:
        examples:
        - lines:
          - trend_indicators = [0.8, 0.2, 0.5]
          - pattern_recognition_results = ['uptrend', 'downtrend', 'neutral']
          - buy_signals = ['asset1', 'asset3']
          - sell_signals = ['asset2']
          - trading_signals, signal_confidence = generate_trading_signals(trend_indicators,
            pattern_recognition_results, buy_signals, sell_signals)
          output: (['buy', 'sell', 'buy'], [0.9, 0.8, 0.6])
        - lines:
          - trend_indicators = [0.4, 0.6]
          - pattern_recognition_results = ['neutral', 'uptrend']
          - buy_signals = ['asset1']
          - sell_signals = []
          - trading_signals, signal_confidence = generate_trading_signals(trend_indicators,
            pattern_recognition_results, buy_signals, sell_signals)
          output: (['buy'], [0.7])
        parameters:
        - description: Indicators showing the direction and strength of market trends
            from analyze_market_trends.
          name: trend_indicators
          type: List[float]
        - description: Results of pattern recognition analysis from analyze_market_trends.
          name: pattern_recognition_results
          type: List[str]
        - description: List of assets to buy from identify_trading_opportunities.
          name: buy_signals
          type: List[str]
        - description: List of assets to sell from identify_trading_opportunities.
          name: sell_signals
          type: List[str]
        raises:
        - description: If the input lists are of different lengths or if there are
            conflicting signals.
          type: ValueError
        returns:
          description: A tuple containing the final list of trading signals and their
            corresponding confidence levels.
          type: Tuple[List[str], List[float]]
        summary: Generates final trading signals by combining trend analysis and opportunity
          identification results.
    prompt: Generate trading signals based on the analyzed trends and identified opportunities.
    shims: []
  identify_trading_opportunities:
    agent: false
    code_node_type: stub
    description: Use the gathered data to identify potential buy or sell signals.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass GatherMarketDataOutput(BaseModel):\n    \"\"\"Pydantic model for gather_market_data\
      \ node outputs.\"\"\"\n    current_prices: List[float] = Field(..., description=\"\
      Current prices of relevant assets\")\n    historical_prices: List[float] = Field(...,\
      \ description=\"Historical price data for relevant assets\")\n    market_volumes:\
      \ List[float] = Field(..., description=\"Current trading volumes of relevant\
      \ assets\")\n\n\nclass IdentifyTradingOpportunitiesOutput(BaseModel):\n    \"\
      \"\"Pydantic model for identify_trading_opportunities node outputs.\"\"\"\n\
      \    buy_signals: List[str] = Field(..., description=\"List of assets to buy\"\
      )\n    sell_signals: List[str] = Field(..., description=\"List of assets to\
      \ sell\")\n\n\ndef identify_trading_opportunities(gather_market_data_input:\
      \ GatherMarketDataOutput, **kwargs) -> IdentifyTradingOpportunitiesOutput:\n\
      \    \"\"\"\n    Identify potential trading opportunities based on the analyzed\
      \ market data,\n    generating lists of assets to buy or sell.\n\n    Parameters\n\
      \    ----------\n    current_prices : List[float]\n        Current prices of\
      \ relevant assets gathered from various market\n        sources.\n    historical_prices\
      \ : List[float]\n        Historical price data for relevant assets used to analyze\
      \ trends and\n        patterns.\n    market_volumes : List[float]\n        Current\
      \ trading volumes of relevant assets, indicating market\n        activity and\
      \ liquidity.\n\n    Returns\n    -------\n    {'buy_signals': List[str], 'sell_signals':\
      \ List[str]}\n        A dictionary containing two lists: 'buy_signals' for assets\
      \ to buy\n        and 'sell_signals' for assets to sell.\n\n    Raises\n   \
      \ ------\n    ValueError\n        If any of the input lists (current_prices,\
      \ historical_prices,\n        market_volumes) are empty or inconsistent in length.\n\
      \n    Examples\n    --------\n    >>> current_prices = [100.0, 200.0, 300.0]\n\
      \    >>> historical_prices = [90.0, 210.0, 290.0]\n    >>> market_volumes =\
      \ [1000.0, 2000.0, 3000.0]\n    >>> result = identify_trading_opportunities(current_prices,\n\
      \    historical_prices, market_volumes)\n    {'buy_signals': ['Asset1', 'Asset3'],\
      \ 'sell_signals': ['Asset2']}\n\n    >>> current_prices = [150.0, 250.0, 350.0]\n\
      \    >>> historical_prices = [140.0, 260.0, 340.0]\n    >>> market_volumes =\
      \ [1500.0, 2500.0, 3500.0]\n    >>> result = identify_trading_opportunities(current_prices,\n\
      \    historical_prices, market_volumes)\n    {'buy_signals': ['Asset2'], 'sell_signals':\
      \ ['Asset1', 'Asset3']}\n\n    \"\"\"\n    return IdentifyTradingOpportunitiesOutput(\n\
      \        buy_signals=[],\n        sell_signals=[],\n    )"
    name: identify_trading_opportunities
    nodes_depended_on:
