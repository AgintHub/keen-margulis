    - agent: false
      code_node_type: virtual-pure
      description: Normalizes market data by processing current prices, historical
        prices, and trading volumes into a standardized format.
      implementation: "import json\n\n\ndef normalize_market_data(current_prices:\
        \ str, historical_prices: str, trading_volumes: str) -> str:\n    \"\"\"\n\
        \    Normalizes market data inputs into a standardized dictionary format.\n\
        \n    Parameters\n    ----------\n    current_prices : str\n        A string\
        \ representation of a list of current prices of assets.\n    historical_prices\
        \ : str\n        A string representation of a list of historical prices of\
        \ assets.\n    trading_volumes : str\n        A string representation of a\
        \ list of trading volumes of assets.\n\n    Returns\n    -------\n    str\n\
        \        A string representation of a dictionary containing the normalized\n\
        \        market data.\n\n    Raises\n    ------\n    ValueError\n        If\
        \ the input strings cannot be parsed into lists of floats.\n    TypeError\n\
        \        If the input parameters are not strings.\n\n    Examples\n    --------\n\
        \    >>> normalize_market_data('[100.0, 200.0]', '[50.0, 150.0, 250.0]',\n\
        \    '[1000.0, 2000.0]')\n    '{\"current_prices\": [100.0, 200.0], \"historical_prices\"\
        : [50.0, 150.0,\n    250.0], \"trading_volumes\": [1000.0, 2000.0]}'\n\n \
        \   >>> normalize_market_data('[150.0, 250.0]', '[75.0, 175.0, 275.0]',\n\
        \    '[1500.0, 2500.0]')\n    '{\"current_prices\": [150.0, 250.0], \"historical_prices\"\
        : [75.0, 175.0,\n    275.0], \"trading_volumes\": [1500.0, 2500.0]}'\n\n \
        \   \"\"\"\n    \n    if not isinstance(current_prices, str):\n        raise\
        \ TypeError(\"current_prices must be a string\")\n    if not isinstance(historical_prices,\
        \ str):\n        raise TypeError(\"historical_prices must be a string\")\n\
        \    if not isinstance(trading_volumes, str):\n        raise TypeError(\"\
        trading_volumes must be a string\")\n    \n    try:\n        current_prices_list\
        \ = json.loads(current_prices)\n        historical_prices_list = json.loads(historical_prices)\n\
        \        trading_volumes_list = json.loads(trading_volumes)\n    except json.JSONDecodeError\
        \ as e:\n        raise ValueError(\"Input strings cannot be parsed into lists\"\
        ) from e\n    \n    if not isinstance(current_prices_list, list):\n      \
        \  raise ValueError(\"current_prices must represent a list\")\n    if not\
        \ isinstance(historical_prices_list, list):\n        raise ValueError(\"historical_prices\
        \ must represent a list\")\n    if not isinstance(trading_volumes_list, list):\n\
        \        raise ValueError(\"trading_volumes must represent a list\")\n   \
        \ \n    try:\n        current_prices_floats = [float(x) for x in current_prices_list]\n\
        \        historical_prices_floats = [float(x) for x in historical_prices_list]\n\
        \        trading_volumes_floats = [float(x) for x in trading_volumes_list]\n\
        \    except (ValueError, TypeError) as e:\n        raise ValueError(\"Input\
        \ lists must contain values that can be converted to floats\") from e\n  \
        \  \n    normalized_data = {\n        \"current_prices\": current_prices_floats,\n\
        \        \"historical_prices\": historical_prices_floats,\n        \"trading_volumes\"\
        : trading_volumes_floats\n    }\n    \n    return json.dumps(normalized_data)"
      name: normalize_market_data
      nodes_depended_on: []
