        type: str
      - description: Input parameter of type str
        key: volumes
        type: str
      prd:
        conceptual_info: This shim node is responsible for validating market data.
          It takes string representations of prices and volumes, processes them, and
          returns a list of float values representing the validated market data.
        docstring:
          examples:
          - lines:
            - validate_market_data(prices='1.2, 3.4, 5.6', volumes='10, 20, 30')
            - validate_market_data(prices='7.8, 9.0', volumes='40, 50')
            output: '[1.2, 3.4, 5.6]'
          - lines:
            - validate_market_data(prices='invalid, data', volumes='10, 20')
            output: 'ValueError: Invalid input data'
          parameters:
