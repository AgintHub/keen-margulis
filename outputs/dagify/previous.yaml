      \  signal_confidence)\n    trade_outcomes = ['success', 'success', 'held']\n\
      \    trade_details = ['Bought 100 units', 'Sold 50 units', 'Held 200 units']\n\
      \n    >>> trading_signals = ['buy', 'sell']\n    >>> signal_confidence = [0.85,\
