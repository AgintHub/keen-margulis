dag_type: shim
description: A workflow designed to facilitate a praying process, breaking it down
  into elemental steps.
name: prayingworkflow
nodes:
  concludeprayer:
    agent: false
    code_node_type: shim
    description: Final step to conclude the praying process.
    implementation: "from ._concludeprayer.validate_inputs import validate_inputs\n\
      from ._concludeprayer.generate_gratitude_expression import generate_gratitude_expression\n\
      from ._concludeprayer.assess_prayer_closure import assess_prayer_closure\n\n\
      from pydantic import BaseModel, Field\nfrom typing import List\n\n\nclass ReflectonprayerOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for reflectonprayer node outputs.\"\"\"\n    insights_gained:\
      \ List[str] = (\n        Field(..., description=\"List of insights or understandings\
      \ gained from the prayer.\")\n    )\n    emotional_response: str = (\n     \
      \   Field(..., description=\"The emotional response or feeling after the prayer.\"\
      )\n    )\n\n\nclass ConcludeprayerOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for concludeprayer node outputs.\"\"\"\n    gratitude_expression: str = (\n\
      \        Field(..., description=\"Expression of gratitude at the end of the\
      \ prayer.\")\n    )\n    closure_status: bool = (\n        Field(..., description=\"\
      Whether the prayer was concluded satisfactorily.\")\n    )\n\n\ndef concludeprayer(reflectonprayer_input:\
      \ ReflectonprayerOutput, **kwargs) -> ConcludeprayerOutput:\n    \"\"\"\n  \
      \  Concludes the prayer process by formulating a gratitude expression and\n\
      \    assessing the closure status based on the reflection insights.\n\n    Parameters\n\
      \    ----------\n    insights_gained : List[str]\n        List of insights gained\
      \ from the prayer reflection.\n    emotional_response : str\n        Emotional\
      \ response or feeling after the prayer.\n\n    Returns\n    -------\n    Tuple[str,\
      \ bool]\n        A tuple containing the gratitude expression and the closure\
      \ status.\n\n    Raises\n    ------\n    ValueError\n        If insights_gained\
      \ is empty or emotional_response is not a valid\n        emotional state.\n\n\
      \    Examples\n    --------\n    >>> insights_gained = ['felt peace', 'grateful']\n\
      \    >>> emotional_response = 'calm'\n    >>> gratitude_expression, closure_status\
      \ = conclude_prayer(insights_gained,\n    emotional_response)\n    ('Thank you\
      \ for the peace and gratitude I felt.', True)\n\n    >>> insights_gained = []\n\
      \    >>> emotional_response = 'unsettled'\n    >>> gratitude_expression, closure_status\
      \ = conclude_prayer(insights_gained,\n    emotional_response)\n    ('Unable\
      \ to conclude prayer satisfactorily.', False)\n\n    \"\"\"\n    validate_inputs(insights=reflectonprayer_input.insights_gained,\
      \ emotional_response=reflectonprayer_input.emotional_response)\n    \n    gratitude_text:\
      \ str = generate_gratitude_expression(insights=reflectonprayer_input.insights_gained,\
      \ emotional_state=reflectonprayer_input.emotional_response)\n    \n    closure_satisfied:\
      \ bool = assess_prayer_closure(insights=reflectonprayer_input.insights_gained,\
      \ emotional_response=reflectonprayer_input.emotional_response)\n    \n    return\
      \ ConcludeprayerOutput(\n        gratitude_expression=gratitude_text,\n    \
      \    closure_status=closure_satisfied\n    )"
    name: concludeprayer
    nodes_depended_on:
    - reflectonprayer
    nodes_dependent_on: []
    output_structure:
    - description: Expression of gratitude at the end of the prayer.
      key: gratitude_expression
      type: str
    - description: Whether the prayer was concluded satisfactorily.
      key: closure_status
      type: bool
    prd:
      conceptual_info: The concludeprayer node is designed to finalize the praying
        process by generating an expression of gratitude and determining if the prayer
        was concluded satisfactorily, based on the insights and emotional response
        from the reflection step.
      docstring:
        examples:
        - lines:
          - insights_gained = ['felt peace', 'grateful']
          - emotional_response = 'calm'
          - gratitude_expression, closure_status = conclude_prayer(insights_gained,
            emotional_response)
          output: ('Thank you for the peace and gratitude I felt.', True)
        - lines:
          - insights_gained = []
          - emotional_response = 'unsettled'
          - gratitude_expression, closure_status = conclude_prayer(insights_gained,
            emotional_response)
          output: ('Unable to conclude prayer satisfactorily.', False)
        parameters:
        - description: List of insights gained from the prayer reflection.
          name: insights_gained
          type: List[str]
        - description: Emotional response or feeling after the prayer.
          name: emotional_response
          type: str
        raises:
        - description: If insights_gained is empty or emotional_response is not a
            valid emotional state.
          type: ValueError
        returns:
          description: A tuple containing the gratitude expression and the closure
            status.
          type: Tuple[str, bool]
        summary: Concludes the prayer process by formulating a gratitude expression
          and assessing the closure status based on the reflection insights.
    prompt: Conclude the prayer by expressing gratitude and closing the connection.
    shims:
    - agent: false
      code_node_type: virtual-stub
      description: Validates the insights and emotional response inputs for the concludeprayer
        node.
      implementation: "def validate_inputs(insights: str, emotional_response: str)\
        \ -> str:\n    \"\"\"\n    Validates the insights and emotional response inputs\
        \ for concludeprayer\n    node.\n\n    Parameters\n    ----------\n    insights\
        \ : List[str]\n        List of insights gained from the prayer\n    emotional_response\
        \ : str\n        Emotional response after the prayer\n\n    Returns\n    -------\n\
        \    str\n        Output indicating the result of the validation process\n\
        \n    Raises\n    ------\n    ValueError\n        If the insights or emotional\
        \ response are invalid or improperly\n        formatted\n    TypeError\n \
        \       If the input types are incorrect\n\n    Examples\n    --------\n \
        \   >>> validate_inputs(insights=['insight1', 'insight2'],\n    emotional_response='grateful')\n\
        \    'Validation successful'\n\n    >>> validate_inputs(insights=[], emotional_response='')\n\
        \    'Validation failed: Insights cannot be empty'\n\n    \"\"\"\n    raise\
        \ NotImplementedError(\"This is a virtual stub node that needs to be implemented\"\
        )"
      name: validate_inputs
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type Any
        key: output
        type: str
      - description: Input parameter of type str
        key: insights
        type: str
      - description: Input parameter of type str
        key: emotional_response
        type: str
      prd:
        conceptual_info: This shim node validates the inputs for the concludeprayer
          node, ensuring that the insights gained and emotional response are properly
          formatted and valid.
        docstring:
          examples:
          - lines:
            - validate_inputs(insights=['insight1', 'insight2'], emotional_response='grateful')
            output: '''Validation successful'''
          - lines:
            - validate_inputs(insights=[], emotional_response='')
            output: '''Validation failed: Insights cannot be empty'''
          parameters:
          - description: List of insights gained from the prayer
            name: insights
            type: List[str]
          - description: Emotional response after the prayer
            name: emotional_response
            type: str
          raises:
          - description: If the insights or emotional response are invalid or improperly
              formatted
            type: ValueError
          - description: If the input types are incorrect
            type: TypeError
          returns:
            description: Output indicating the result of the validation process
            type: str
          summary: Validates the insights and emotional response inputs for concludeprayer
            node.
      prompt: Validate the inputs for concludeprayer node
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Generates a gratitude expression based on insights gained and emotional
        state.
      implementation: "def generate_gratitude_expression(insights: str, emotional_state:\
        \ str) -> str:\n    \"\"\"\n    Generates a gratitude expression based on\
        \ the provided insights and\n    emotional state.\n\n    Parameters\n    ----------\n\
        \    insights : List[str]\n        A list of insights or understandings gained\
        \ from the prayer.\n    emotional_state : str\n        The emotional response\
        \ or feeling after the prayer.\n\n    Returns\n    -------\n    str\n    \
        \    A gratitude expression that reflects the insights gained and the\n  \
        \      emotional state.\n\n    Raises\n    ------\n    ValueError\n      \
        \  If the insights list is empty or the emotional state is not a valid\n \
        \       string.\n    TypeError\n        If the input types are incorrect (e.g.,\
        \ insights is not a list of\n        strings or emotional_state is not a string).\n\
        \n    Examples\n    --------\n    >>> generate_gratitude_expression(insights=['I\
        \ felt peace', 'I understood\n    the importance of kindness'], emotional_state='grateful')\n\
        \    'I am grateful for the peace I felt and the understanding I gained about\n\
        \    kindness.'\n\n    >>> generate_gratitude_expression(insights=['I felt\
        \ comforted'],\n    emotional_state='relieved')\n    'I am relieved and grateful\
        \ for the comfort I received.'\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: generate_gratitude_expression
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type str
        key: output
        type: str
      - description: Input parameter of type str
        key: insights
        type: str
      - description: Input parameter of type str
        key: emotional_state
        type: str
      prd:
        conceptual_info: This shim node generates a gratitude expression based on
          the insights gained and the emotional state after a prayer, serving as a
          crucial step in concluding the prayer process.
        docstring:
          examples:
          - lines:
            - generate_gratitude_expression(insights=['I felt peace', 'I understood
              the importance of kindness'], emotional_state='grateful')
            output: '''I am grateful for the peace I felt and the understanding I
              gained about kindness.'''
          - lines:
            - generate_gratitude_expression(insights=['I felt comforted'], emotional_state='relieved')
            output: '''I am relieved and grateful for the comfort I received.'''
          parameters:
          - description: A list of insights or understandings gained from the prayer.
            name: insights
            type: List[str]
          - description: The emotional response or feeling after the prayer.
            name: emotional_state
            type: str
          raises:
          - description: If the insights list is empty or the emotional state is not
              a valid string.
            type: ValueError
          - description: If the input types are incorrect (e.g., insights is not a
              list of strings or emotional_state is not a string).
            type: TypeError
          returns:
            description: A gratitude expression that reflects the insights gained
              and the emotional state.
            type: str
          summary: Generates a gratitude expression based on the provided insights
            and emotional state.
      prompt: Create a gratitude expression based on the insights gained and emotional
        state after a prayer.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Evaluates whether a prayer was concluded satisfactorily based on
        the insights gained and emotional response.
      implementation: "def assess_prayer_closure(insights: str, emotional_response:\
        \ str) -> bool:\n    \"\"\"\n    Evaluates the closure status of a prayer\
        \ based on insights and emotional\n    response.\n\n    Parameters\n    ----------\n\
        \    insights : List[str]\n        List of insights or understandings gained\
        \ from the prayer.\n    emotional_response : str\n        The emotional response\
        \ or feeling after the prayer.\n\n    Returns\n    -------\n    bool\n   \
        \     True if the prayer was concluded satisfactorily, False otherwise.\n\n\
        \    Raises\n    ------\n    ValueError\n        If the insights gained are\
        \ not a list of strings or if emotional\n        response is not a string.\n\
        \    TypeError\n        If the input types are incorrect.\n\n    Examples\n\
        \    --------\n    >>> insights_gained = ['peace', 'understanding', 'closure']\n\
        \    >>> emotional_response = 'grateful'\n    >>> assess_prayer_closure(insights=insights_gained,\n\
        \    emotional_response=emotional_response)\n    True\n\n    >>> insights_gained\
        \ = []\n    >>> emotional_response = 'unsettled'\n    >>> assess_prayer_closure(insights=insights_gained,\n\
        \    emotional_response=emotional_response)\n    False\n\n    \"\"\"\n   \
        \ raise NotImplementedError(\"This is a virtual stub node that needs to be\
        \ implemented\")"
      name: assess_prayer_closure
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type bool
        key: output
        type: bool
      - description: Input parameter of type str
        key: insights
        type: str
      - description: Input parameter of type str
        key: emotional_response
        type: str
      prd:
        conceptual_info: This shim assesses the closure status of a prayer based on
          the insights gained and the emotional response felt during or after the
          prayer.
        docstring:
          examples:
          - lines:
            - insights_gained = ['peace', 'understanding', 'closure']
            - emotional_response = 'grateful'
            - assess_prayer_closure(insights=insights_gained, emotional_response=emotional_response)
            output: 'True'
          - lines:
            - insights_gained = []
            - emotional_response = 'unsettled'
            - assess_prayer_closure(insights=insights_gained, emotional_response=emotional_response)
            output: 'False'
          parameters:
          - description: List of insights or understandings gained from the prayer.
            name: insights
            type: List[str]
          - description: The emotional response or feeling after the prayer.
            name: emotional_response
            type: str
          raises:
          - description: If the insights gained are not a list of strings or if emotional
              response is not a string.
            type: ValueError
          - description: If the input types are incorrect.
            type: TypeError
          returns:
            description: True if the prayer was concluded satisfactorily, False otherwise.
            type: bool
          summary: Evaluates the closure status of a prayer based on insights and
            emotional response.
      prompt: Assess whether the prayer was concluded satisfactorily based on the
        insights gained and emotional response.
      shims: []
  invokeprayer:
    agent: false
    code_node_type: shim
    description: Step to invoke the prayer based on the prepared intention.
    implementation: "from ._invokeprayer.prepare_intention_text import prepare_intention_text\n\
      from ._invokeprayer.generate_prayer_invocation import generate_prayer_invocation\n\
      from ._invokeprayer.assess_prayer_connection import assess_prayer_connection\n\
      \nfrom pydantic import BaseModel, Field\n\n\nclass PrepareforprayerOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for prepareforprayer node outputs.\"\"\"\n    prayer_intention:\
      \ str = (\n        Field(..., description=\"The intention or focus of the prayer.\"\
      )\n    )\n    is_ready: bool = (\n        Field(..., description=\"Whether the\
      \ person is ready to pray.\")\n    )\n\n\nclass InvokeprayerOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for invokeprayer node outputs.\"\"\"\n    prayer_invocation:\
      \ str = (\n        Field(..., description=\"The actual invocation or words used\
      \ in the prayer.\")\n    )\n    connection_status: str = (\n        Field(...,\
      \ description=\"The status or feeling of connection during the prayer.\")\n\
      \    )\n\n\ndef invokeprayer(prepareforprayer_input: PrepareforprayerOutput,\
      \ **kwargs) -> InvokeprayerOutput:\n    \"\"\"\n    Invokes a prayer based on\
      \ the prepared intention and returns the prayer\n    invocation and connection\
      \ status.\n\n    Parameters\n    ----------\n    prayer_intention : str\n  \
      \      The intention or focus of the prayer, as prepared in the previous\n \
      \       step.\n    is_ready : bool\n        Whether the person is ready to pray,\
      \ indicating their preparedness.\n\n    Returns\n    -------\n    Tuple[str,\
      \ str]\n        A tuple containing the prayer invocation (str) and the connection\n\
      \        status (str).\n\n    Raises\n    ------\n    ValueError\n        If\
      \ the prayer intention is empty or if the person is not ready to\n        pray.\n\
      \n    Examples\n    --------\n    >>> invokeprayer(prayer_intention='Seeking\
      \ guidance', is_ready=True)\n    ('Dear higher power, guide me...', 'Connected')\n\
      \n    >>> invokeprayer(prayer_intention='', is_ready=False)\n    ValueError:\
      \ Prayer intention cannot be empty and person must be ready to\n    pray.\n\n\
      \    \"\"\"\n    if not prepareforprayer_input.prayer_intention or not prepareforprayer_input.is_ready:\n\
      \        raise ValueError(\"Prayer intention cannot be empty and person must\
      \ be ready to pray.\")\n    \n    prepared_intention: str = prepare_intention_text(intention=prepareforprayer_input.prayer_intention)\n\
      \    prayer_words: str = generate_prayer_invocation(intention=prepared_intention)\n\
      \    connection_feeling: str = assess_prayer_connection(invocation=prayer_words,\
      \ readiness=prepareforprayer_input.is_ready)\n    \n    return InvokeprayerOutput(\n\
      \        prayer_invocation=prayer_words,\n        connection_status=connection_feeling,\n\
      \    )"
    name: invokeprayer
    nodes_depended_on:
    - prepareforprayer
    nodes_dependent_on:
    - reflectonprayer
    output_structure:
    - description: The actual invocation or words used in the prayer.
      key: prayer_invocation
      type: str
    - description: The status or feeling of connection during the prayer.
      key: connection_status
      type: str
    prd:
      conceptual_info: This node invokes a prayer based on a prepared intention, generating
        the actual prayer invocation and assessing the connection status during the
        prayer.
      docstring:
        examples:
        - lines:
          - invokeprayer(prayer_intention='Seeking guidance', is_ready=True)
          output: ('Dear higher power, guide me...', 'Connected')
        - lines:
          - invokeprayer(prayer_intention='', is_ready=False)
          output: 'ValueError: Prayer intention cannot be empty and person must be
            ready to pray.'
        parameters:
        - description: The intention or focus of the prayer, as prepared in the previous
            step.
          name: prayer_intention
          type: str
        - description: Whether the person is ready to pray, indicating their preparedness.
          name: is_ready
          type: bool
        raises:
        - description: If the prayer intention is empty or if the person is not ready
            to pray.
          type: ValueError
        returns:
          description: A tuple containing the prayer invocation (str) and the connection
            status (str).
          type: Tuple[str, str]
        summary: Invokes a prayer based on the prepared intention and returns the
          prayer invocation and connection status.
    prompt: Invoke the prayer by expressing your intention and connecting with a higher
      power.
    shims:
    - agent: false
      code_node_type: virtual-stub
      description: This shim node prepares the intention text for prayer by processing
        the given intention string.
      implementation: "def prepare_intention_text(intention: str) -> str:\n    \"\"\
        \"\n    Processes the given intention string to produce a formatted intention\
        \ text\n    for prayer.\n\n    Parameters\n    ----------\n    intention :\
        \ str\n        The raw intention string that needs to be processed for prayer.\n\
        \n    Returns\n    -------\n    str\n        The processed intention text\
        \ that is ready for use in prayer.\n\n    Raises\n    ------\n    ValueError\n\
        \        If the input intention is empty or cannot be processed.\n    TypeError\n\
        \        If the input intention is not a string.\n\n    Examples\n    --------\n\
        \    >>> prepare_intention_text('peace and harmony')\n    'May our hearts\
        \ be filled with peace and harmony.'\n\n    >>> prepare_intention_text('guidance\
        \ for our journey')\n    'May we receive guidance for our journey.'\n\n  \
        \  \"\"\"\n    raise NotImplementedError(\"This is a virtual stub node that\
        \ needs to be implemented\")"
      name: prepare_intention_text
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type str
        key: output
        type: str
      - description: Input parameter of type str
        key: intention
        type: str
      prd:
        conceptual_info: The prepare_intention_text shim plays a crucial role in the
          prayer invocation process by transforming the raw intention into a formatted
          text suitable for prayer.
        docstring:
          examples:
          - lines:
            - prepare_intention_text('peace and harmony')
            output: '''May our hearts be filled with peace and harmony.'''
          - lines:
            - prepare_intention_text('guidance for our journey')
            output: '''May we receive guidance for our journey.'''
          parameters:
          - description: The raw intention string that needs to be processed for prayer.
            name: intention
            type: str
          raises:
          - description: If the input intention is empty or cannot be processed.
            type: ValueError
          - description: If the input intention is not a string.
            type: TypeError
          returns:
            description: The processed intention text that is ready for use in prayer.
            type: str
          summary: Processes the given intention string to produce a formatted intention
            text for prayer.
      prompt: Prepare the intention text for prayer based on the given intention.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Generates a prayer invocation based on a given intention.
      implementation: "def generate_prayer_invocation(intention: str) -> str:\n  \
        \  \"\"\"\n    Generates a prayer invocation text based on the given intention.\n\
        \n    Parameters\n    ----------\n    intention : str\n        The prepared\
        \ intention or focus for the prayer.\n\n    Returns\n    -------\n    str\n\
        \        The generated prayer invocation text.\n\n    Raises\n    ------\n\
        \    ValueError\n        If the input intention is empty or not a string.\n\
        \    TypeError\n        If the input intention is not of type string.\n\n\
        \    Examples\n    --------\n    >>> generate_prayer_invocation(intention='peace\
        \ and harmony')\n    'May we be blessed with peace and harmony.'\n\n    >>>\
        \ generate_prayer_invocation(intention='strength in times of need')\n    'May\
        \ we find strength in times of need.'\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: generate_prayer_invocation
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type str
        key: output
        type: str
      - description: Input parameter of type str
        key: intention
        type: str
      prd:
        conceptual_info: This shim generates the actual words or invocation used in
          a prayer based on a prepared intention.
        docstring:
          examples:
          - lines:
            - generate_prayer_invocation(intention='peace and harmony')
            output: '''May we be blessed with peace and harmony.'''
          - lines:
            - generate_prayer_invocation(intention='strength in times of need')
            output: '''May we find strength in times of need.'''
          parameters:
          - description: The prepared intention or focus for the prayer.
            name: intention
            type: str
          raises:
          - description: If the input intention is empty or not a string.
            type: ValueError
          - description: If the input intention is not of type string.
            type: TypeError
          returns:
            description: The generated prayer invocation text.
            type: str
          summary: Generates a prayer invocation text based on the given intention.
      prompt: 'Create a prayer invocation for the given intention: {intention}'
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Evaluates the connection status or feeling during a prayer based
        on the invocation and readiness.
      implementation: "def assess_prayer_connection(invocation: str, readiness: str)\
        \ -> str:\n    \"\"\"\n    Assesses the connection status during a prayer\
        \ based on the invocation and\n    readiness state.\n\n    Parameters\n  \
        \  ----------\n    invocation : str\n        The actual words or invocation\
        \ used during the prayer.\n    readiness : str\n        The readiness state\
        \ of the person to pray, represented as a string\n        ('True' or 'False').\n\
        \n    Returns\n    -------\n    str\n        The assessed connection status\
        \ or feeling during the prayer,\n        represented as a descriptive string.\n\
        \n    Raises\n    ------\n    ValueError\n        If the readiness state is\
        \ not 'True' or 'False'.\n    TypeError\n        If the invocation is not\
        \ a string or if the readiness is not a\n        boolean value represented\
        \ as a string.\n\n    Examples\n    --------\n    >>> assess_prayer_connection(invocation='Dear\
        \ God, guide us.',\n    readiness='True')\n    'A deep sense of connection.'\n\
        \n    >>> assess_prayer_connection(invocation='Hello, world!', readiness='False')\n\
        \    'No connection felt.'\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: assess_prayer_connection
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type str
        key: output
        type: str
      - description: Input parameter of type str
        key: invocation
        type: str
      - description: Input parameter of type str
        key: readiness
        type: str
      prd:
        conceptual_info: This shim node assesses the connection status or feeling
          during a prayer based on the invocation and the readiness state of the person
          praying.
        docstring:
          examples:
          - lines:
            - assess_prayer_connection(invocation='Dear God, guide us.', readiness='True')
            output: '''A deep sense of connection.'''
          - lines:
            - assess_prayer_connection(invocation='Hello, world!', readiness='False')
            output: '''No connection felt.'''
          parameters:
          - description: The actual words or invocation used during the prayer.
            name: invocation
            type: str
          - description: The readiness state of the person to pray, represented as
              a string ('True' or 'False').
            name: readiness
            type: str
          raises:
          - description: If the readiness state is not 'True' or 'False'.
            type: ValueError
          - description: If the invocation is not a string or if the readiness is
              not a boolean value represented as a string.
            type: TypeError
