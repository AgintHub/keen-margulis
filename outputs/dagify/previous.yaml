          - lines:
            - analyze_volume_indicators(trading_volumes='500,400,600', price_data='5.0,4.0,6.0')
            output: '[''Increasing'', ''Decreasing'', ''Stable'']'
          parameters:
          - description: A string representation of trading volumes, expected to be
