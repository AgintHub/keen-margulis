      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: trading_volumes
        type: str
      - description: Input parameter of type str
        key: price_data
        type: str
      prd:
        conceptual_info: This shim analyzes trading volume indicators in the context
