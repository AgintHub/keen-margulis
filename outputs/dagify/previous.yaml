  measure_code_complexity:
    agent: false
    code_node_type: shim
    description: Calculate code complexity metrics such as cyclomatic complexity.
    implementation: "from ._measure_code_complexity.validate_input_files import validate_input_files\n\
      from ._measure_code_complexity.read_source_file import read_source_file\nfrom\
      \ ._measure_code_complexity.parse_source_code import parse_source_code\nfrom\
      \ ._measure_code_complexity.calculate_complexity_metric import calculate_complexity_metric\n\
      from ._measure_code_complexity.calculate_cyclomatic_complexity import calculate_cyclomatic_complexity\n\
      \nfrom pydantic import BaseModel, Field\nfrom typing import List\n\n\nclass\
      \ CollectSourceCodeOutput(BaseModel):\n    \"\"\"Pydantic model for collect_source_code\
