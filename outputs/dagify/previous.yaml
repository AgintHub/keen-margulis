dag_type: shim
description: Perform a comprehensive code quality analysis including static code analysis,
  code complexity measurement, and code style checking.
name: codequalityanalysisworkflow
nodes:
  check_code_style:
    agent: false
    code_node_type: shim
    description: Analyze code style and formatting consistency.
    implementation: "from ._check_code_style.validate_source_files_exist import validate_source_files_exist\n\
      from ._check_code_style.run_style_linter import run_style_linter\nfrom ._check_code_style.run_formatting_checker\
      \ import run_formatting_checker\n\nfrom pydantic import BaseModel, Field\nfrom\
      \ typing import List\n\n\nclass CollectSourceCodeOutput(BaseModel):\n    \"\"\
      \"Pydantic model for collect_source_code node outputs.\"\"\"\n    source_code_files:\
      \ List[str] = (\n        Field(..., description=\"List of paths to source code\
      \ files\")\n    )\n\n\nclass CheckCodeStyleOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for check_code_style node outputs.\"\"\"\n    style_issues: List[str]\
      \ = (\n        Field(..., description=\"List of style issues identified\")\n\
      \    )\n    formatting_errors: List[str] = (\n        Field(..., description=\"\
      List of formatting errors detected\")\n    )\n\n\ndef check_code_style(collect_source_code_input:\
      \ CollectSourceCodeOutput, **kwargs) -> CheckCodeStyleOutput:\n    \"\"\"\n\
      \    Analyze code style and formatting consistency using linters or style\n\
      \    checkers.\n\n    Parameters\n    ----------\n    source_code_files : List[str]\n\
      \        List of paths to source code files collected by the\n        'collect_source_code'\
      \ node.\n\n    Returns\n    -------\n    Tuple[List[str], List[str]]\n     \
      \   A tuple containing a list of style issues identified and a list of\n   \
      \     formatting errors detected.\n\n    Raises\n    ------\n    FileNotFoundError\n\
      \        If any of the source code files are not found.\n    Exception\n   \
      \     If there is an error during the analysis process.\n\n    Examples\n  \
      \  --------\n    >>> source_code_files = ['/path/to/file1.py', '/path/to/file2.py']\n\
      \    >>> style_issues, formatting_errors = check_code_style(source_code_files)\n\
      \    (['unused import', 'invalid indentation'], [' trailing whitespace', '\n\
      \    inconsistent spacing'])\n\n    >>> source_code_files = ['/path/to/file3.py']\n\
      \    >>> style_issues, formatting_errors = check_code_style(source_code_files)\n\
      \    (['missing docstring'], [])\n\n    \"\"\"\n    validated_files: List[str]\
      \ = validate_source_files_exist(file_paths=collect_source_code_input.source_code_files)\n\
      \    \n    style_issues: List[str] = run_style_linter(file_paths=validated_files)\n\
      \    \n    formatting_errors: List[str] = run_formatting_checker(file_paths=validated_files)\n\
      \    \n    return CheckCodeStyleOutput(\n        style_issues=style_issues,\n\
      \        formatting_errors=formatting_errors\n    )"
    name: check_code_style
    nodes_depended_on:
    - collect_source_code
    nodes_dependent_on: []
    output_structure:
    - description: List of style issues identified
      key: style_issues
      type: List[str]
    - description: List of formatting errors detected
      key: formatting_errors
      type: List[str]
    prd:
      conceptual_info: This node analyzes the style and formatting consistency of
        the source code files collected by the 'collect_source_code' node.
      docstring:
        examples:
        - lines:
          - source_code_files = ['/path/to/file1.py', '/path/to/file2.py']
          - style_issues, formatting_errors = check_code_style(source_code_files)
          output: (['unused import', 'invalid indentation'], [' trailing whitespace',
            ' inconsistent spacing'])
        - lines:
          - source_code_files = ['/path/to/file3.py']
          - style_issues, formatting_errors = check_code_style(source_code_files)
          output: (['missing docstring'], [])
        parameters:
        - description: List of paths to source code files collected by the 'collect_source_code'
            node.
          name: source_code_files
          type: List[str]
        raises:
        - description: If any of the source code files are not found.
          type: FileNotFoundError
        - description: If there is an error during the analysis process.
          type: Exception
        returns:
          description: A tuple containing a list of style issues identified and a
            list of formatting errors detected.
          type: Tuple[List[str], List[str]]
        summary: Analyze code style and formatting consistency using linters or style
          checkers.
    prompt: Use linters or style checkers to analyze code style and formatting.
    shims:
    - agent: false
      code_node_type: virtual-stub
      description: Validates the existence of given source files.
      implementation: "from typing import List\n\n\ndef validate_source_files_exist(file_paths:\
        \ str) -> List[str]:\n    \"\"\"\n    Validates a list of source file paths\
        \ and returns those that exist.\n\n    Parameters\n    ----------\n    file_paths\
        \ : str\n        A string containing a list of file paths to validate, separated\
        \ by\n        commas or other delimiters as needed.\n\n    Returns\n    -------\n\
        \    List[str]\n        A list of file paths that were found to exist.\n\n\
        \    Raises\n    ------\n    ValueError\n        If the input string is malformed\
        \ or empty.\n    TypeError\n        If the input is not a string.\n\n    Examples\n\
        \    --------\n    >>> file_paths = 'path/to/file1.py,path/to/file2.py'\n\
        \    >>> validate_source_files_exist(file_paths=file_paths)\n    ['path/to/file1.py',\
        \ 'path/to/file2.py']\n\n    >>> file_paths = 'path/to/nonexistent_file.py,path/to/file2.py'\n\
        \    >>> validate_source_files_exist(file_paths=file_paths)\n    ['path/to/file2.py']\n\
        \n    \"\"\"\n    raise NotImplementedError(\"This is a virtual stub node\
        \ that needs to be implemented\")"
      name: validate_source_files_exist
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: file_paths
        type: str
      prd:
        conceptual_info: This shim function is responsible for validating the existence
          of source code files provided as input. It plays a crucial role in ensuring
          that subsequent operations are performed on valid files.
        docstring:
          examples:
          - lines:
            - file_paths = 'path/to/file1.py,path/to/file2.py'
            - validate_source_files_exist(file_paths=file_paths)
            output: '[''path/to/file1.py'', ''path/to/file2.py'']'
          - lines:
            - file_paths = 'path/to/nonexistent_file.py,path/to/file2.py'
            - validate_source_files_exist(file_paths=file_paths)
            output: '[''path/to/file2.py'']'
          parameters:
          - description: A string containing a list of file paths to validate, separated
              by commas or other delimiters as needed.
            name: file_paths
            type: str
          raises:
          - description: If the input string is malformed or empty.
            type: ValueError
          - description: If the input is not a string.
            type: TypeError
          returns:
            description: A list of file paths that were found to exist.
            type: List[str]
          summary: Validates a list of source file paths and returns those that exist.
      prompt: Validate the existence of source files provided in the input.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Runs a style linter on the given file paths and returns a list
        of style issues identified.
      implementation: "from typing import List\n\n\ndef run_style_linter(file_paths:\
        \ str) -> List[str]:\n    \"\"\"\n    Runs a style linter on the provided\
        \ file paths and returns a list of style\n    issues.\n\n    Parameters\n\
        \    ----------\n    file_paths : str\n        A string containing file paths\
        \ to be checked by the linter,\n        separated by commas or a specific\
        \ delimiter.\n\n    Returns\n    -------\n    List[str]\n        A list of\
        \ strings where each string represents a style issue\n        identified by\
        \ the linter.\n\n    Raises\n    ------\n    ValueError\n        If the input\
        \ file paths are invalid or if the linter encounters an\n        internal\
        \ error.\n    TypeError\n        If the input type is not a string.\n\n  \
        \  Examples\n    --------\n    >>> run_style_linter(file_paths='path/to/file1.py,path/to/file2.py')\n\
        \    ['style_issue1', 'style_issue2']\n\n    >>> run_style_linter(file_paths='path/to/file3.py')\n\
        \    ['style_issue3']\n\n    \"\"\"\n    raise NotImplementedError(\"This\
        \ is a virtual stub node that needs to be implemented\")"
      name: run_style_linter
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: file_paths
        type: str
      prd:
        conceptual_info: This shim function represents a style linter that checks
          the given source code files for style issues and returns a list of problems
          found.
        docstring:
          examples:
          - lines:
            - run_style_linter(file_paths='path/to/file1.py,path/to/file2.py')
            output: '[''style_issue1'', ''style_issue2'']'
          - lines:
            - run_style_linter(file_paths='path/to/file3.py')
            output: '[''style_issue3'']'
          parameters:
          - description: A string containing file paths to be checked by the linter,
              separated by commas or a specific delimiter.
            name: file_paths
            type: str
          raises:
          - description: If the input file paths are invalid or if the linter encounters
              an internal error.
            type: ValueError
          - description: If the input type is not a string.
            type: TypeError
          returns:
            description: A list of strings where each string represents a style issue
              identified by the linter.
            type: List[str]
          summary: Runs a style linter on the provided file paths and returns a list
            of style issues.
      prompt: Typed node for shim run_style_linter
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Checks code formatting for the given file paths and returns a list
        of formatting errors
      implementation: "from typing import List\n\n\ndef run_formatting_checker(file_paths:\
        \ str) -> List[str]:\n    \"\"\"\n    Checks code formatting for the given\
        \ file paths and returns a list of\n    formatting errors\n\n    Parameters\n\
        \    ----------\n    file_paths : str\n        A string containing the paths\
        \ to the files to be checked, separated\n        by commas or a single path\n\
        \n    Returns\n    -------\n    List[str]\n        A list of strings where\
        \ each string represents a formatting error\n        detected in the code\
        \ files\n\n    Raises\n    ------\n    ValueError\n        If the input file\
        \ paths are invalid or if no files are found at the\n        given paths\n\
        \    TypeError\n        If the input type is not a string\n\n    Examples\n\
        \    --------\n    >>> run_formatting_checker(file_paths='path/to/file1.py,path/to/file2.py')\n\
        \    ['file1.py:1:1: error: missing whitespace around operator']\n\n    >>>\
        \ run_formatting_checker(file_paths='path/to/single_file.py')\n    ['single_file.py:5:5:\
        \ error: inconsistent indentation']\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: run_formatting_checker
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: file_paths
        type: str
      prd:
        conceptual_info: This shim node is responsible for checking the code formatting
          of given source code files and returning any formatting errors found.
        docstring:
          examples:
          - lines:
            - run_formatting_checker(file_paths='path/to/file1.py,path/to/file2.py')
            output: '[''file1.py:1:1: error: missing whitespace around operator'']'
          - lines:
            - run_formatting_checker(file_paths='path/to/single_file.py')
            output: '[''single_file.py:5:5: error: inconsistent indentation'']'
          parameters:
          - description: A string containing the paths to the files to be checked,
              separated by commas or a single path
            name: file_paths
            type: str
          raises:
          - description: If the input file paths are invalid or if no files are found
              at the given paths
            type: ValueError
          - description: If the input type is not a string
            type: TypeError
          returns:
            description: A list of strings where each string represents a formatting
              error detected in the code files
            type: List[str]
          summary: Checks code formatting for the given file paths and returns a list
            of formatting errors
      prompt: Implement the run_formatting_checker shim to check code formatting for
        given file paths
      shims: []
  collect_source_code:
    agent: false
    code_node_type: shim
    description: Gather the source code files to be analyzed.
    implementation: "from ._collect_source_code.extract_repository_path import extract_repository_path\n\
      from ._collect_source_code.validate_path_exists import validate_path_exists\n\
      from ._collect_source_code.check_path_permissions import check_path_permissions\n\
      from ._collect_source_code.scan_directory_for_source_files import scan_directory_for_source_files\n\
      from ._collect_source_code.filter_source_code_files import filter_source_code_files\n\
      \nfrom pydantic import BaseModel, Field\nfrom typing import List\n\n\nclass\
      \ CollectSourceCodeOutput(BaseModel):\n    \"\"\"Pydantic model for collect_source_code\
      \ node outputs.\"\"\"\n    source_code_files: List[str] = (\n        Field(...,\
      \ description=\"List of paths to source code files\")\n    )\n\n\ndef collect_source_code(general_input:\
      \ str, **kwargs) -> CollectSourceCodeOutput:\n    \"\"\"\n    Collects source\
      \ code files from a specified directory or repository.\n\n    Parameters\n \
      \   ----------\n    repository_path : str\n        Path to the repository or\
      \ project directory to search for source\n        code files.\n\n    Returns\n\
      \    -------\n    List[str]\n        A list of paths to the collected source\
      \ code files.\n\n    Raises\n    ------\n    FileNotFoundError\n        If the\
      \ specified repository_path does not exist.\n    PermissionError\n        If\
      \ there is no permission to access the repository_path or any of\n        its\
      \ contents.\n\n    Examples\n    --------\n    >>> collect_source_code(repository_path='/home/user/project')\n\
      \    ['/home/user/project/file1.py', '/home/user/project/file2.py']\n\n    >>>\
      \ collect_source_code(repository_path='/home/user/non_existent_project')\n \
      \   FileNotFoundError: /home/user/non_existent_project does not exist.\n\n \
      \   \"\"\"\n    repository_path: str = extract_repository_path(general_input=general_input,\
      \ kwargs=kwargs)\n    validate_path_exists(path=repository_path)\n    check_path_permissions(path=repository_path)\n\
      \    file_paths: List[str] = scan_directory_for_source_files(directory_path=repository_path)\n\
      \    filtered_files: List[str] = filter_source_code_files(file_paths=file_paths)\n\
      \    return CollectSourceCodeOutput(source_code_files=filtered_files)"
    name: collect_source_code
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of paths to source code files
      key: source_code_files
      type: List[str]
    prd:
      conceptual_info: This node is responsible for collecting all relevant source
        code files from a given repository or project directory, making them available
        for subsequent analysis tasks.
      docstring:
        examples:
        - lines:
          - collect_source_code(repository_path='/home/user/project')
          output: '[''/home/user/project/file1.py'', ''/home/user/project/file2.py'']'
        - lines:
          - collect_source_code(repository_path='/home/user/non_existent_project')
          output: 'FileNotFoundError: /home/user/non_existent_project does not exist.'
        parameters:
        - description: Path to the repository or project directory to search for source
            code files.
          name: repository_path
          type: str
        raises:
        - description: If the specified repository_path does not exist.
          type: FileNotFoundError
        - description: If there is no permission to access the repository_path or
            any of its contents.
          type: PermissionError
        returns:
          description: A list of paths to the collected source code files.
          type: List[str]
        summary: Collects source code files from a specified directory or repository.
    prompt: Collect all relevant source code files from the repository or project
      directory.
    shims:
    - agent: false
      code_node_type: virtual-stub
      description: Extracts the repository path from the given input parameters.
      implementation: "def extract_repository_path(general_input: str, kwargs: str)\
        \ -> str:\n    \"\"\"\n    Extracts the repository path based on the provided\
        \ general input and\n    additional keyword arguments.\n\n    Parameters\n\
        \    ----------\n    general_input : str\n        The primary input from which\
        \ the repository path will be extracted.\n    kwargs : str\n        Additional\
        \ keyword arguments that may contain relevant information\n        for extracting\
        \ the repository path.\n\n    Returns\n    -------\n    str\n        The extracted\
        \ repository path as a string.\n\n    Raises\n    ------\n    ValueError\n\
        \        If the general input or kwargs do not contain sufficient information\n\
        \        to extract the repository path.\n    TypeError\n        If the input\
        \ types are not as expected, such as general_input not\n        being a string.\n\
        \n    Examples\n    --------\n    >>> extract_repository_path(general_input='path/to/repo',\
        \ kwargs='{}')\n    'path/to/repo'\n\n    >>> extract_repository_path(general_input='invalid\
        \ input', kwargs='{}')\n    ValueError: Invalid input format\n\n    \"\"\"\
        \n    raise NotImplementedError(\"This is a virtual stub node that needs to\
        \ be implemented\")"
      name: extract_repository_path
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type str
        key: output
        type: str
      - description: Input parameter of type str
        key: general_input
        type: str
      - description: Input parameter of type str
        key: kwargs
        type: str
      prd:
        conceptual_info: This shim function is responsible for extracting the repository
          path from the provided input parameters, playing a crucial role in the source
          code collection process.
        docstring:
          examples:
          - lines:
            - extract_repository_path(general_input='path/to/repo', kwargs='{}')
            output: '''path/to/repo'''
          - lines:
            - extract_repository_path(general_input='invalid input', kwargs='{}')
            output: 'ValueError: Invalid input format'
          parameters:
          - description: The primary input from which the repository path will be
              extracted.
            name: general_input
            type: str
          - description: Additional keyword arguments that may contain relevant information
              for extracting the repository path.
            name: kwargs
            type: str
          raises:
          - description: If the general input or kwargs do not contain sufficient
              information to extract the repository path.
            type: ValueError
          - description: If the input types are not as expected, such as general_input
              not being a string.
            type: TypeError
          returns:
            description: The extracted repository path as a string.
            type: str
          summary: Extracts the repository path based on the provided general input
            and additional keyword arguments.
      prompt: Extract the repository path from the provided input.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Validates whether a given file system path exists.
      implementation: "def validate_path_exists(path: str) -> str:\n    \"\"\"\n \
        \   Checks if a given file system path exists and returns an appropriate output.\n\
        \n    Parameters\n    ----------\n    path : str\n        The file system\
        \ path to be validated.\n\n    Returns\n    -------\n    str\n        A string\
        \ indicating the result of the path existence check.\n\n    Raises\n    ------\n\
        \    TypeError\n        If the input 'path' is not a string.\n    ValueError\n\
        \        If the input 'path' is an empty string or contains invalid\n    \
        \    characters.\n\n    Examples\n    --------\n    >>> validate_path_exists(path='/home/user/valid_path')\n\
        \    'Path exists'\n\n    >>> validate_path_exists(path='/home/user/non_existent_path')\n\
        \    'Path does not exist'\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: validate_path_exists
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type Any
        key: output
        type: str
      - description: Input parameter of type str
        key: path
        type: str
      prd:
        conceptual_info: This shim function is designed to check if a specified file
          system path exists, playing a crucial role in ensuring that subsequent operations
          are performed on valid paths.
        docstring:
          examples:
          - lines:
            - validate_path_exists(path='/home/user/valid_path')
            output: '''Path exists'''
          - lines:
            - validate_path_exists(path='/home/user/non_existent_path')
            output: '''Path does not exist'''
          parameters:
          - description: The file system path to be validated.
            name: path
            type: str
          raises:
          - description: If the input 'path' is not a string.
            type: TypeError
          - description: If the input 'path' is an empty string or contains invalid
              characters.
            type: ValueError
          returns:
            description: A string indicating the result of the path existence check.
            type: str
          summary: Checks if a given file system path exists and returns an appropriate
            output.
      prompt: Validate if the path exists.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Checks if the specified path has appropriate permissions.
      implementation: "def check_path_permissions(path: str) -> str:\n    \"\"\"\n\
        \    Checks the permissions of a specified path and returns the result.\n\n\
        \    Parameters\n    ----------\n    path : str\n        The file system path\
        \ to check for permissions.\n\n    Returns\n    -------\n    str\n       \
        \ A string indicating the result of the permission check.\n\n    Raises\n\
        \    ------\n    PermissionError\n        If the path does not have the required\
        \ permissions.\n    FileNotFoundError\n        If the specified path does\
        \ not exist.\n    TypeError\n        If the input path is not a string.\n\n\
        \    Examples\n    --------\n    >>> check_path_permissions(path='/home/user/repository')\n\
        \    'Path /home/user/repository is accessible.'\n\n    >>> check_path_permissions(path='/restricted/access')\n\
        \    'Permission denied for path /restricted/access.'\n\n    \"\"\"\n    raise\
        \ NotImplementedError(\"This is a virtual stub node that needs to be implemented\"\
        )"
      name: check_path_permissions
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type Any
        key: output
        type: str
      - description: Input parameter of type str
        key: path
        type: str
      prd:
        conceptual_info: This shim function is responsible for verifying that a given
          path has the necessary permissions for the application to access or manipulate
          it.
        docstring:
          examples:
          - lines:
            - check_path_permissions(path='/home/user/repository')
            output: '''Path /home/user/repository is accessible.'''
          - lines:
            - check_path_permissions(path='/restricted/access')
            output: '''Permission denied for path /restricted/access.'''
          parameters:
          - description: The file system path to check for permissions.
            name: path
            type: str
          raises:
          - description: If the path does not have the required permissions.
            type: PermissionError
          - description: If the specified path does not exist.
            type: FileNotFoundError
          - description: If the input path is not a string.
            type: TypeError
          returns:
            description: A string indicating the result of the permission check.
            type: str
          summary: Checks the permissions of a specified path and returns the result.
      prompt: Check if the path has the required permissions
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Scans a specified directory for source code files and returns their
        paths
      implementation: "from typing import List\n\n\ndef scan_directory_for_source_files(directory_path:\
        \ str) -> List[str]:\n    \"\"\"\n    Scans a directory for source code files\
        \ and returns their paths\n\n    Parameters\n    ----------\n    directory_path\
        \ : str\n        The path to the directory that needs to be scanned for source\
        \ code\n        files\n\n    Returns\n    -------\n    List[str]\n       \
        \ A list containing the paths to all source code files found in the\n    \
        \    specified directory\n\n    Raises\n    ------\n    FileNotFoundError\n\
        \        If the specified directory does not exist\n    PermissionError\n\
        \        If there are insufficient permissions to access the directory\n \
        \   NotADirectoryError\n        If the provided path is not a directory\n\n\
        \    Examples\n    --------\n    >>> scan_directory_for_source_files(directory_path='/path/to/project')\n\
        \    >>> # Assuming /path/to/project contains source code files\n    ['/path/to/project/file1.py',\
