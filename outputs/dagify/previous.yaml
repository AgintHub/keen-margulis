      \ quality\")\n    )\n    quality_score: float = Field(..., description=\"Overall\
      \ code quality score\")\n\n\ndef compile_analysis_report(perform_static_code_analysis_input:\
      \ PerformStaticCodeAnalysisOutput, measure_code_complexity_input: MeasureCodeComplexityOutput,\
      \ check_code_style_input: CheckCodeStyleOutput, **kwargs) -> CompileAnalysisReportOutput:\n\
