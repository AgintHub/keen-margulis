dag_type: shim
description: A comprehensive trading workflow that includes data gathering, analysis,
  and decision-making
name: trading_workflow
nodes:
  analyze_market_trends:
    agent: false
    code_node_type: shim
    description: Analyze market trends based on the gathered data
    implementation: "from ._analyze_market_trends.validate_input_data import validate_input_data\n\
      from ._analyze_market_trends.normalize_market_data import normalize_market_data\n\
      from ._analyze_market_trends.analyze_price_trends import analyze_price_trends\n\
      from ._analyze_market_trends.analyze_volume_indicators import analyze_volume_indicators\n\
      from ._analyze_market_trends.combine_trend_indicators import combine_trend_indicators\n\
      from ._analyze_market_trends.identify_chart_patterns import identify_chart_patterns\n\
      \nfrom pydantic import BaseModel, Field\nfrom typing import List\n\n\nclass\
      \ GatherMarketDataOutput(BaseModel):\n    \"\"\"Pydantic model for gather_market_data\
      \ node outputs.\"\"\"\n    current_prices: List[float] = (\n        Field(...,\
      \ description=\"Current prices of the assets\")\n    )\n    historical_prices:\
      \ List[float] = (\n        Field(..., description=\"Historical price data for\
      \ the assets over a specified period\")\n    )\n    trading_volumes: List[float]\
      \ = (\n        Field(..., description=\"Trading volumes for the assets\")\n\
      \    )\n\n\nclass AnalyzeMarketTrendsOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for analyze_market_trends node outputs.\"\"\"\n    trend_indicators:\
      \ List[str] = (\n        Field(..., description=\"Indicators of market trends\
      \ (e.g., bullish, bearish)\")\n    )\n    pattern_recognition: List[str] = (\n\
      \        Field(..., description=\"Patterns recognized in the market data\")\n\
      \    )\n\n\ndef analyze_market_trends(gather_market_data_input: GatherMarketDataOutput,\
      \ **kwargs) -> AnalyzeMarketTrendsOutput:\n    \"\"\"\n    Analyzes market trends\
      \ based on gathered data.\n\n    Parameters\n    ----------\n    current_prices\
      \ : List[float]\n        Current prices of the assets gathered by the gather_market_data\n\
      \        node.\n    historical_prices : List[float]\n        Historical price\
      \ data for the assets over a specified period\n        gathered by the gather_market_data\
      \ node.\n    trading_volumes : List[float]\n        Trading volumes for the\
      \ assets gathered by the gather_market_data\n        node.\n\n    Returns\n\
      \    -------\n    Tuple[List[str], List[str]]\n        A tuple containing a\
      \ list of trend indicators and a list of\n        recognized patterns in the\
      \ market data.\n\n    Raises\n    ------\n    ValueError\n        If any of\
      \ the input lists (current_prices, historical_prices,\n        trading_volumes)\
      \ are empty or of different lengths.\n\n    Examples\n    --------\n    >>>\
      \ current_prices = [100.0, 120.0, 110.0]\n    >>> historical_prices = [90.0,\
      \ 100.0, 110.0, 120.0]\n    >>> trading_volumes = [1000.0, 1200.0, 1100.0]\n\
      \    >>> trend_indicators, pattern_recognition =\n    analyze_market_trends(current_prices,\
      \ historical_prices, trading_volumes)\n    (['bullish'], ['ascending triangle'])\n\
      \n    >>> current_prices = [100.0, 80.0, 90.0]\n    >>> historical_prices =\
      \ [110.0, 100.0, 90.0, 80.0]\n    >>> trading_volumes = [1000.0, 800.0, 900.0]\n\
      \    >>> trend_indicators, pattern_recognition =\n    analyze_market_trends(current_prices,\
      \ historical_prices, trading_volumes)\n    (['bearish'], ['descending triangle'])\n\
      \n    \"\"\"\n    validate_input_data(current_prices=gather_market_data_input.current_prices,\
      \ \n                         historical_prices=gather_market_data_input.historical_prices,\
      \ \n                         trading_volumes=gather_market_data_input.trading_volumes)\n\
      \    \n    normalized_data: dict = normalize_market_data(current_prices=gather_market_data_input.current_prices,\n\
      \                                                   historical_prices=gather_market_data_input.historical_prices,\n\
      \                                                   trading_volumes=gather_market_data_input.trading_volumes)\n\
      \    \n    price_trends: List[str] = analyze_price_trends(current_prices=gather_market_data_input.current_prices,\n\
      \                                                     historical_prices=gather_market_data_input.historical_prices)\n\
      \    \n    volume_indicators: List[str] = analyze_volume_indicators(trading_volumes=gather_market_data_input.trading_volumes,\n\
      \                                                              price_data=gather_market_data_input.current_prices)\n\
      \    \n    combined_indicators: List[str] = combine_trend_indicators(price_trends=price_trends,\
      \ \n                                                               volume_trends=volume_indicators)\n\
      \    \n    chart_patterns: List[str] = identify_chart_patterns(current_prices=gather_market_data_input.current_prices,\n\
      \                                                          historical_prices=gather_market_data_input.historical_prices,\n\
      \                                                          volumes=gather_market_data_input.trading_volumes)\n\
      \    \n    return AnalyzeMarketTrendsOutput(trend_indicators=combined_indicators,\
      \ pattern_recognition=chart_patterns)"
    name: analyze_market_trends
    nodes_depended_on:
    - gather_market_data
    nodes_dependent_on: []
    output_structure:
    - description: Indicators of market trends (e.g., bullish, bearish)
      key: trend_indicators
      type: List[str]
    - description: Patterns recognized in the market data
      key: pattern_recognition
      type: List[str]
    prd:
      conceptual_info: This node analyzes market trends by processing the gathered
        market data, including current prices, historical prices, and trading volumes,
        to identify trend indicators and recognize patterns.
      docstring:
        examples:
        - lines:
          - current_prices = [100.0, 120.0, 110.0]
          - historical_prices = [90.0, 100.0, 110.0, 120.0]
          - trading_volumes = [1000.0, 1200.0, 1100.0]
          - trend_indicators, pattern_recognition = analyze_market_trends(current_prices,
            historical_prices, trading_volumes)
          output: (['bullish'], ['ascending triangle'])
        - lines:
          - current_prices = [100.0, 80.0, 90.0]
          - historical_prices = [110.0, 100.0, 90.0, 80.0]
          - trading_volumes = [1000.0, 800.0, 900.0]
          - trend_indicators, pattern_recognition = analyze_market_trends(current_prices,
            historical_prices, trading_volumes)
          output: (['bearish'], ['descending triangle'])
        parameters:
        - description: Current prices of the assets gathered by the gather_market_data
            node.
          name: current_prices
          type: List[float]
        - description: Historical price data for the assets over a specified period
            gathered by the gather_market_data node.
          name: historical_prices
          type: List[float]
        - description: Trading volumes for the assets gathered by the gather_market_data
            node.
          name: trading_volumes
          type: List[float]
        raises:
        - description: If any of the input lists (current_prices, historical_prices,
            trading_volumes) are empty or of different lengths.
          type: ValueError
        returns:
          description: A tuple containing a list of trend indicators and a list of
            recognized patterns in the market data.
          type: Tuple[List[str], List[str]]
        summary: Analyzes market trends based on gathered data.
    prompt: Analyze the gathered market data to identify trends and patterns.
    shims:
    - agent: false
      code_node_type: virtual-stub
      description: Validates input data for market analysis to ensure it conforms
        to expected formats and ranges.
      implementation: "def validate_input_data(current_prices: str, historical_prices:\
        \ str, trading_volumes: str) -> str:\n    \"\"\"\n    Validates input market\
        \ data including current prices, historical prices, and\n    trading volumes.\n\
        \n    Parameters\n    ----------\n    current_prices : str\n        Current\
        \ prices of the assets in string format, expected to be\n        convertible\
        \ to a list of floats.\n    historical_prices : str\n        Historical price\
        \ data for the assets over a specified period in\n        string format, expected\
        \ to be convertible to a list of floats.\n    trading_volumes : str\n    \
        \    Trading volumes for the assets in string format, expected to be\n   \
        \     convertible to a list of floats.\n\n    Returns\n    -------\n    str\n\
        \        A string indicating whether the input data is valid ('valid') or\
        \ not\n        ('invalid').\n\n    Raises\n    ------\n    ValueError\n  \
        \      Raised when the input strings cannot be converted to the expected\n\
        \        numerical formats or are out of expected ranges.\n    TypeError\n\
        \        Raised when the input parameters are not strings.\n\n    Examples\n\
        \    --------\n    >>> validate_input_data(current_prices='[1.0, 2.0, 3.0]',\n\
        \    historical_prices='[4.0, 5.0, 6.0]', trading_volumes='[7.0, 8.0, 9.0]')\n\
        \    'valid'\n\n    >>> validate_input_data(current_prices='invalid', historical_prices='[4.0,\n\
        \    5.0, 6.0]', trading_volumes='[7.0, 8.0, 9.0]')\n    'invalid'\n\n   \
        \ \"\"\"\n    raise NotImplementedError(\"This is a virtual stub node that\
        \ needs to be implemented\")"
      name: validate_input_data
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type Any
        key: output
        type: str
      - description: Input parameter of type str
        key: current_prices
        type: str
      - description: Input parameter of type str
        key: historical_prices
        type: str
      - description: Input parameter of type str
        key: trading_volumes
        type: str
      prd:
        conceptual_info: This shim node is responsible for validating the input market
          data to ensure it meets the necessary criteria for further analysis.
        docstring:
          examples:
          - lines:
            - validate_input_data(current_prices='[1.0, 2.0, 3.0]', historical_prices='[4.0,
              5.0, 6.0]', trading_volumes='[7.0, 8.0, 9.0]')
            output: '''valid'''
          - lines:
            - validate_input_data(current_prices='invalid', historical_prices='[4.0,
              5.0, 6.0]', trading_volumes='[7.0, 8.0, 9.0]')
            output: '''invalid'''
          parameters:
          - description: Current prices of the assets in string format, expected to
              be convertible to a list of floats.
            name: current_prices
            type: str
          - description: Historical price data for the assets over a specified period
              in string format, expected to be convertible to a list of floats.
            name: historical_prices
            type: str
          - description: Trading volumes for the assets in string format, expected
              to be convertible to a list of floats.
            name: trading_volumes
            type: str
          raises:
          - description: Raised when the input strings cannot be converted to the
              expected numerical formats or are out of expected ranges.
            type: ValueError
          - description: Raised when the input parameters are not strings.
            type: TypeError
          returns:
            description: A string indicating whether the input data is valid ('valid')
              or not ('invalid').
            type: str
          summary: Validates input market data including current prices, historical
            prices, and trading volumes.
      prompt: Validate the input market data to ensure it is correctly formatted and
        within expected ranges.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Normalizes market data by processing current prices, historical
        prices, and trading volumes into a standardized format.
      implementation: "def normalize_market_data(current_prices: str, historical_prices:\
        \ str, trading_volumes: str) -> str:\n    \"\"\"\n    Normalizes market data\
        \ inputs into a standardized dictionary format.\n\n    Parameters\n    ----------\n\
        \    current_prices : str\n        A string representation of a list of current\
        \ prices of assets.\n    historical_prices : str\n        A string representation\
        \ of a list of historical prices of assets.\n    trading_volumes : str\n \
        \       A string representation of a list of trading volumes of assets.\n\n\
        \    Returns\n    -------\n    str\n        A string representation of a dictionary\
        \ containing the normalized\n        market data.\n\n    Raises\n    ------\n\
        \    ValueError\n        If the input strings cannot be parsed into lists\
        \ of floats.\n    TypeError\n        If the input parameters are not strings.\n\
        \n    Examples\n    --------\n    >>> normalize_market_data('[100.0, 200.0]',\
        \ '[50.0, 150.0, 250.0]',\n    '[1000.0, 2000.0]')\n    '{\"current_prices\"\
        : [100.0, 200.0], \"historical_prices\": [50.0, 150.0,\n    250.0], \"trading_volumes\"\
        : [1000.0, 2000.0]}'\n\n    >>> normalize_market_data('[150.0, 250.0]', '[75.0,\
        \ 175.0, 275.0]',\n    '[1500.0, 2500.0]')\n    '{\"current_prices\": [150.0,\
        \ 250.0], \"historical_prices\": [75.0, 175.0,\n    275.0], \"trading_volumes\"\
        : [1500.0, 2500.0]}'\n\n    \"\"\"\n    raise NotImplementedError(\"This is\
        \ a virtual stub node that needs to be implemented\")"
      name: normalize_market_data
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type dict
        key: output
        type: str
      - description: Input parameter of type str
        key: current_prices
        type: str
      - description: Input parameter of type str
        key: historical_prices
        type: str
      - description: Input parameter of type str
        key: trading_volumes
        type: str
      prd:
        conceptual_info: This shim node is responsible for normalizing market data,
          which includes current prices, historical prices, and trading volumes, into
          a standardized format that can be used for further analysis.
        docstring:
          examples:
          - lines:
            - normalize_market_data('[100.0, 200.0]', '[50.0, 150.0, 250.0]', '[1000.0,
              2000.0]')
            output: '''{"current_prices": [100.0, 200.0], "historical_prices": [50.0,
              150.0, 250.0], "trading_volumes": [1000.0, 2000.0]}'''
          - lines:
            - normalize_market_data('[150.0, 250.0]', '[75.0, 175.0, 275.0]', '[1500.0,
              2500.0]')
            output: '''{"current_prices": [150.0, 250.0], "historical_prices": [75.0,
              175.0, 275.0], "trading_volumes": [1500.0, 2500.0]}'''
          parameters:
          - description: A string representation of a list of current prices of assets.
            name: current_prices
            type: str
          - description: A string representation of a list of historical prices of
              assets.
            name: historical_prices
            type: str
          - description: A string representation of a list of trading volumes of assets.
            name: trading_volumes
            type: str
          raises:
          - description: If the input strings cannot be parsed into lists of floats.
            type: ValueError
          - description: If the input parameters are not strings.
            type: TypeError
          returns:
            description: A string representation of a dictionary containing the normalized
              market data.
            type: str
          summary: Normalizes market data inputs into a standardized dictionary format.
      prompt: Implement the normalize_market_data function to normalize market data
        inputs.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Analyzes current and historical price data to identify trends and
        patterns.
      implementation: "from typing import List\n\n\ndef analyze_price_trends(current_prices:\
        \ str, historical_prices: str) -> List[str]:\n    \"\"\"\n    Analyzes current\
        \ and historical price data to identify market trends and\n    patterns.\n\
        \n    Parameters\n    ----------\n    current_prices : str\n        Current\
        \ prices of the assets in a string format, expected to be a\n        comma-separated\
        \ list of float values.\n    historical_prices : str\n        Historical price\
        \ data for the assets over a specified period in a\n        string format,\
        \ expected to be a comma-separated list of float\n        values.\n\n    Returns\n\
        \    -------\n    List[str]\n        List of identified price trends and patterns,\
        \ such as 'bullish',\n        'bearish', or other trend indicators.\n\n  \
        \  Raises\n    ------\n    ValueError\n        If the input strings for current_prices\
        \ or historical_prices are not\n        properly formatted or contain invalid\
        \ data.\n    TypeError\n        If the input parameters are not strings.\n\
        \n    Examples\n    --------\n    >>> analyze_price_trends(current_prices='100.0,120.0,110.0',\n\
        \    historical_prices='90.0,100.0,110.0,120.0,130.0')\n    >>> output = ['bullish']\n\
        \    ['bullish']\n\n    >>> analyze_price_trends(current_prices='80.0,70.0,60.0',\n\
        \    historical_prices='100.0,90.0,80.0,70.0,60.0')\n    >>> output = ['bearish']\n\
        \    ['bearish']\n\n    \"\"\"\n    raise NotImplementedError(\"This is a\
        \ virtual stub node that needs to be implemented\")"
      name: analyze_price_trends
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: current_prices
        type: str
      - description: Input parameter of type str
        key: historical_prices
        type: str
      prd:
        conceptual_info: This shim analyzes price trends by comparing current and
          historical prices, identifying patterns and trends that could inform market
          analysis.
        docstring:
          examples:
          - lines:
            - analyze_price_trends(current_prices='100.0,120.0,110.0', historical_prices='90.0,100.0,110.0,120.0,130.0')
            - output = ['bullish']
            output: '[''bullish'']'
          - lines:
            - analyze_price_trends(current_prices='80.0,70.0,60.0', historical_prices='100.0,90.0,80.0,70.0,60.0')
            - output = ['bearish']
            output: '[''bearish'']'
          parameters:
          - description: Current prices of the assets in a string format, expected
              to be a comma-separated list of float values.
            name: current_prices
            type: str
          - description: Historical price data for the assets over a specified period
              in a string format, expected to be a comma-separated list of float values.
            name: historical_prices
            type: str
          raises:
          - description: If the input strings for current_prices or historical_prices
              are not properly formatted or contain invalid data.
            type: ValueError
          - description: If the input parameters are not strings.
            type: TypeError
          returns:
            description: List of identified price trends and patterns, such as 'bullish',
              'bearish', or other trend indicators.
            type: List[str]
          summary: Analyzes current and historical price data to identify market trends
            and patterns.
      prompt: Analyze the given current and historical price data to determine market
        trends.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Analyzes trading volume indicators in relation to price data to
