    - agent: false
      code_node_type: virtual-pure
      description: Analyzes current and historical price data to identify trends and
        patterns.
      implementation: "from typing import List\n\n\ndef analyze_price_trends(current_prices:\
        \ str, historical_prices: str) -> List[str]:\n    \"\"\"\n    Analyzes current\
        \ and historical price data to identify market trends and\n    patterns.\n\
        \n    Parameters\n    ----------\n    current_prices : str\n        Current\
        \ prices of the assets in a string format, expected to be a\n        comma-separated\
        \ list of float values.\n    historical_prices : str\n        Historical price\
        \ data for the assets over a specified period in a\n        string format,\
        \ expected to be a comma-separated list of float\n        values.\n\n    Returns\n\
        \    -------\n    List[str]\n        List of identified price trends and patterns,\
        \ such as 'bullish',\n        'bearish', or other trend indicators.\n\n  \
        \  Raises\n    ------\n    ValueError\n        If the input strings for current_prices\
        \ or historical_prices are not\n        properly formatted or contain invalid\
        \ data.\n    TypeError\n        If the input parameters are not strings.\n\
        \n    Examples\n    --------\n    >>> analyze_price_trends(current_prices='100.0,120.0,110.0',\n\
        \    historical_prices='90.0,100.0,110.0,120.0,130.0')\n    >>> output = ['bullish']\n\
        \    ['bullish']\n\n    >>> analyze_price_trends(current_prices='80.0,70.0,60.0',\n\
        \    historical_prices='100.0,90.0,80.0,70.0,60.0')\n    >>> output = ['bearish']\n\
        \    ['bearish']\n\n    \"\"\"\n    if not isinstance(current_prices, str):\n\
        \        raise TypeError(\"current_prices must be a string\")\n    if not\
        \ isinstance(historical_prices, str):\n        raise TypeError(\"historical_prices\
        \ must be a string\")\n    \n    try:\n        current_price_list = [float(price.strip())\
        \ for price in current_prices.split(',') if price.strip()]\n        historical_price_list\
        \ = [float(price.strip()) for price in historical_prices.split(',') if price.strip()]\n\
        \    except ValueError:\n        raise ValueError(\"Input strings contain\
        \ invalid data that cannot be converted to float\")\n    \n    if not current_price_list\
        \ or not historical_price_list:\n        raise ValueError(\"Input strings\
        \ are not properly formatted or are empty\")\n    \n    trends = []\n    \n\
        \    if len(current_price_list) > 1:\n        current_trend = 0\n        for\
        \ i in range(1, len(current_price_list)):\n            if current_price_list[i]\
        \ > current_price_list[i-1]:\n                current_trend += 1\n       \
        \     elif current_price_list[i] < current_price_list[i-1]:\n            \
        \    current_trend -= 1\n        \n        if current_trend > 0:\n       \
        \     trends.append('bullish')\n        elif current_trend < 0:\n        \
        \    trends.append('bearish')\n    \n    if len(historical_price_list) > 1:\n\
        \        historical_trend = 0\n        for i in range(1, len(historical_price_list)):\n\
        \            if historical_price_list[i] > historical_price_list[i-1]:\n \
        \               historical_trend += 1\n            elif historical_price_list[i]\
        \ < historical_price_list[i-1]:\n                historical_trend -= 1\n \
        \       \n        if historical_trend > 0 and 'bullish' not in trends:\n \
        \           trends.append('bullish')\n        elif historical_trend < 0 and\
        \ 'bearish' not in trends:\n            trends.append('bearish')\n    \n \
        \   current_avg = sum(current_price_list) / len(current_price_list)\n    historical_avg\
        \ = sum(historical_price_list) / len(historical_price_list)\n    \n    if\
        \ current_avg > historical_avg and 'bullish' not in trends:\n        trends.append('bullish')\n\
        \    elif current_avg < historical_avg and 'bearish' not in trends:\n    \
        \    trends.append('bearish')\n    \n    if not trends:\n        trends.append('sideways')\n\
        \    \n    return trends"
      name: analyze_price_trends
