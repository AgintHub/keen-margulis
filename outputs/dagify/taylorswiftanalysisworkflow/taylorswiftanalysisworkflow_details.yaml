      \ the albums\")\n    song_lyrics: List[str] = Field(..., description=\"List\
      \ of song lyrics from Taylor Swift's discography\")\n    chart_performance:\
      \ List[int] = Field(..., description=\"List of chart performance metrics for\
      \ Taylor Swift's songs\")\n\n\nclass AnalyzeChartPerformanceOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for analyze_chart_performance node outputs.\"\"\"\n\
      \    chart_trends: List[str] = Field(..., description=\"List of trends observed\
      \ in chart performance\")\n    peak_positions: List[int] = Field(..., description=\"\
      List of peak chart positions for each song\")\n\n\ndef analyze_chart_performance(gather_taylor_swift_data_input:\
      \ GatherTaylorSwiftDataOutput, **kwargs) -> AnalyzeChartPerformanceOutput:\n\
      \    chart_data: List[int] = gather_taylor_swift_data_input.chart_performance\n\
      \    \n    validated_data: List[int] = validate_chart_data(data=chart_data)\n\
      \    \n    trend_analysis: List[str] = analyze_performance_trends(chart_positions=validated_data)\n\
      \    \n    peak_positions: List[int] = extract_peak_positions(chart_positions=validated_data)\n\
      \    \n    return AnalyzeChartPerformanceOutput(\n        chart_trends=trend_analysis,\n\
      \        peak_positions=peak_positions\n    )"
    name: analyze_chart_performance
    nodes_depended_on:
    - gather_taylor_swift_data
    nodes_dependent_on: []
    output_structure:
    - description: List of trends observed in chart performance
      key: chart_trends
      type: List[str]
    - description: List of peak chart positions for each song
      key: peak_positions
      type: List[int]
    prd:
      conceptual_info: This node analyzes the chart performance data of Taylor Swift's
        songs to identify trends and patterns.
      docstring:
        examples:
        - lines:
          - chart_performance_data = [10, 5, 1, 8, 3]
          - result = analyze_chart_performance(chart_performance_data)
          - print(result)
          output: '{''chart_trends'': [''Increasing trend'', ''Decreasing trend''],
            ''peak_positions'': [1, 3, 5, 8, 10]}'
        - lines:
          - chart_performance_data = [20, 15, 10, 5]
          - result = analyze_chart_performance(chart_performance_data)
          - print(result)
          output: '{''chart_trends'': [''Decreasing trend''], ''peak_positions'':
            [5, 10, 15, 20]}'
        parameters:
        - description: List of chart performance metrics for Taylor Swift's songs,
            obtained from the 'gather_taylor_swift_data' node.
          name: chart_performance_data
          type: List[int]
        raises:
        - description: If the input chart performance data is empty or malformed.
          type: ValueError
        returns:
          description: A dictionary containing a list of trends observed in chart
            performance and a list of peak chart positions for each song.
          type: '{''chart_trends'': List[str], ''peak_positions'': List[int]}'
        summary: Analyze chart performance data to identify trends and peak positions.
    prompt: Examine the chart performance data to identify trends or patterns.
