      \ List[int] = Field(..., description=\"List of chart performance metrics for\
      \ Taylor Swift's songs\")\n\n\ndef gather_taylor_swift_data(general_input: str,\
      \ **kwargs) -> GatherTaylorSwiftDataOutput:\n    discography_data: dict = fetch_discography_metadata(artist=\"\
      Taylor Swift\")\n    album_names: List[str] = extract_album_names(discography_data=discography_data)\n\
      \    release_dates: List[str] = extract_release_dates(discography_data=discography_data)\n\
      \    \n    song_list: List[str] = get_song_titles_from_albums(albums=album_names)\n\
      \    song_lyrics: List[str] = fetch_lyrics_batch(song_titles=song_list, artist=\"\
