dag_type: shim
description: Generated workflow from UI.
name: create_simple_workflow
nodes:
  create_task_dag:
    agent: false
    code_node_type: shim
    description: Create a DAG representing the tasks and their dependencies
    implementation: "from ._create_task_dag.parse_dependency_strings import parse_dependency_strings\n\
      from ._create_task_dag.validate_task_references import validate_task_references\n\
      from ._create_task_dag.extract_edge_sources import extract_edge_sources\nfrom\
      \ ._create_task_dag.extract_edge_destinations import extract_edge_destinations\n\
      from ._create_task_dag.check_dag_acyclicity import check_dag_acyclicity\nfrom\
      \ ._create_task_dag.format_task_list import format_task_list\nfrom ._create_task_dag.format_edge_list\
      \ import format_edge_list\n\nfrom pydantic import BaseModel, Field\nfrom typing\
      \ import List\n\n\nclass IdentifyTaskDependenciesOutput(BaseModel):\n    \"\"\
      \"Pydantic model for identify_task_dependencies node outputs.\"\"\"\n    tasks:\
      \ List[str] = Field(..., description=\"List of identified task names.\")\n \
      \   dependencies: List[str] = (\n        Field(..., description = (\n      \
      \      \"List of dependency relationships in the format 'TaskA depends on TaskB'.\"\
      )\n        )\n    )\n    dependency_exists: bool = (\n        Field(..., description\
      \ = (\n            \"Indicates whether any dependencies were identified.\")\n\
      \        )\n    )\n\n\nclass CreateTaskDagOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for create_task_dag node outputs.\"\"\"\n    task_ids: str = (\n   \
      \     Field(..., description = (\n            \"List of unique task identifiers\
      \ used in the DAG\")\n        )\n    )\n    edge_sources: str = (\n        Field(...,\
      \ description = (\n            \"List of source task identifiers for each directed\
      \ edge in the DAG\")\n        )\n    )\n    edge_destinations: str = (\n   \
      \     Field(..., description = (\n            \"List of destination task identifiers\
      \ for each directed edge in the DAG\")\n        )\n    )\n    is_valid: bool\
      \ = (\n        Field(..., description = (\n            \"Indicates whether the\
      \ constructed DAG is acyclic and complete\")\n        )\n    )\n\n\ndef create_task_dag(identify_task_dependencies_input:\
      \ IdentifyTaskDependenciesOutput, **kwargs) -> CreateTaskDagOutput:\n    \"\"\
      \"\n    Constructs a DAG from given tasks and dependency relations.\n\n    Parameters\n\
      \    ----------\n    tasks : List[str]\n        A list of task identifiers that\
      \ will become the DAG nodes.\n    dependencies : List[str]\n        Each string\
      \ represents a dependency in the format 'TaskA depends on\n        TaskB'.\n\
      \n    Returns\n    -------\n    dict\n        A dictionary with four keys: task_ids\
      \ (List[str]), edge_sources\n        (List[str]), edge_destinations (List[str]),\
      \ and is_valid (bool).\n\n    Raises\n    ------\n    ValueError\n        Raised\
      \ when a dependency refers to a task not present in the `tasks`\n        list.\n\
      \    ValueError\n        Raised when a dependency string does not match the\
      \ expected 'TaskA\n        depends on TaskB' pattern.\n\n    Examples\n    --------\n\
      \    >>> tasks = ['A', 'B', 'C']\n    >>> dependencies = ['B depends on A',\
      \ 'C depends on B']\n    >>> result = create_task_dag(tasks, dependencies)\n\
      \    >>> print(result)\n    {'task_ids': ['A', 'B', 'C'], 'edge_sources': ['A',\
      \ 'B'],\n    'edge_destinations': ['B', 'C'], 'is_valid': True}\n\n    >>> tasks\
      \ = ['A', 'B']\n    >>> dependencies = ['A depends on B', 'B depends on A']\n\
      \    >>> result = create_task_dag(tasks, dependencies)\n    >>> print(result)\n\
      \    {'task_ids': ['A', 'B'], 'edge_sources': ['B', 'A'], 'edge_destinations':\n\
      \    ['A', 'B'], 'is_valid': False}\n\n    \"\"\"\n    tasks = identify_task_dependencies_input.tasks\n\
      \    dependencies = identify_task_dependencies_input.dependencies\n    \n  \
      \  parsed_dependencies: List[tuple] = parse_dependency_strings(dependencies=dependencies)\n\
      \    \n    validate_task_references(tasks=tasks, parsed_dependencies=parsed_dependencies)\n\
      \    \n    edge_sources: List[str] = extract_edge_sources(parsed_dependencies=parsed_dependencies)\n\
      \    edge_destinations: List[str] = extract_edge_destinations(parsed_dependencies=parsed_dependencies)\n\
      \    \n    is_acyclic: bool = check_dag_acyclicity(tasks=tasks, edge_sources=edge_sources,\
      \ edge_destinations=edge_destinations)\n    \n    task_ids_str: str = format_task_list(tasks=tasks)\n\
      \    edge_sources_str: str = format_edge_list(edges=edge_sources)\n    edge_destinations_str:\
      \ str = format_edge_list(edges=edge_destinations)\n    \n    return CreateTaskDagOutput(\n\
      \        task_ids=task_ids_str,\n        edge_sources=edge_sources_str,\n  \
      \      edge_destinations=edge_destinations_str,\n        is_valid=is_acyclic\n\
      \    )"
    name: create_task_dag
    nodes_depended_on:
    - identify_task_dependencies
    nodes_dependent_on: []
    output_structure:
    - description: List of unique task identifiers used in the DAG
      key: task_ids
      type: str
    - description: List of source task identifiers for each directed edge in the DAG
      key: edge_sources
      type: str
    - description: List of destination task identifiers for each directed edge in
        the DAG
      key: edge_destinations
      type: str
    - description: Indicates whether the constructed DAG is acyclic and complete
      key: is_valid
      type: bool
    prd:
      conceptual_info: Builds a directed acyclic graph (DAG) from a list of task identifiers
        and dependency relations, producing node identifiers, edge lists, and a validity
        flag.
      docstring:
        examples:
        - lines:
          - tasks = ['A', 'B', 'C']
          - dependencies = ['B depends on A', 'C depends on B']
          - result = create_task_dag(tasks, dependencies)
          - print(result)
          output: '{''task_ids'': [''A'', ''B'', ''C''], ''edge_sources'': [''A'',
            ''B''], ''edge_destinations'': [''B'', ''C''], ''is_valid'': True}'
        - lines:
          - tasks = ['A', 'B']
          - dependencies = ['A depends on B', 'B depends on A']
          - result = create_task_dag(tasks, dependencies)
          - print(result)
          output: '{''task_ids'': [''A'', ''B''], ''edge_sources'': [''B'', ''A''],
            ''edge_destinations'': [''A'', ''B''], ''is_valid'': False}'
        parameters:
        - description: A list of task identifiers that will become the DAG nodes.
          name: tasks
          type: List[str]
        - description: Each string represents a dependency in the format 'TaskA depends
            on TaskB'.
          name: dependencies
          type: List[str]
        raises:
        - description: Raised when a dependency refers to a task not present in the
            `tasks` list.
          type: ValueError
        - description: Raised when a dependency string does not match the expected
            'TaskA depends on TaskB' pattern.
          type: ValueError
        returns:
          description: 'A dictionary with four keys: task_ids (List[str]), edge_sources
            (List[str]), edge_destinations (List[str]), and is_valid (bool).'
          type: dict
        summary: Constructs a DAG from given tasks and dependency relations.
    prompt: Using the tasks and their dependencies, construct a Directed Acyclic Graph
      (DAG) that represents the workflow.
    shims:
    - agent: false
      code_node_type: virtual-stub
      description: Parses a string of dependency relationships into a list of task
        source‑destination pairs.
      implementation: "from typing import List\n\n\ndef parse_dependency_strings(dependencies:\
        \ str) -> List[str]:\n    \"\"\"\n    Parse a multiline string of dependency\
        \ relationships and return them as a\n    list of tuples.\n\n    Parameters\n\
        \    ----------\n    dependencies : str\n        A string containing dependency\
        \ descriptions, one per line. Each line\n        must follow the format \"\
        SourceTask depends on TargetTask\" or\n        \"SourceTask,TargetTask\".\n\
        \n    Returns\n    -------\n    List[Tuple[str, str]]\n        A list of tuples\
        \ where each tuple contains the source task name and\n        the target task\
        \ name.\n\n    Raises\n    ------\n    ValueError\n        Raised if a line\
        \ in the input string does not conform to an expected\n        dependency\
        \ format.\n    TypeError\n        Raised if the input `dependencies` is not\
        \ of type `str`.\n\n    Examples\n    --------\n    >>> parse_dependency_strings('TaskA\
        \ depends on TaskB\\nTaskB depends on\n    TaskC')\n    [('TaskA', 'TaskB'),\
        \ ('TaskB', 'TaskC')]\n\n    >>> parse_dependency_strings('Task1,Task2\\nTask3,Task4')\n\
        \    [('Task1', 'Task2'), ('Task3', 'Task4')]\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: parse_dependency_strings
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[tuple]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: dependencies
        type: str
      prd:
        conceptual_info: The shim extracts structured dependency pairs from a plain
          text description, enabling downstream DAG construction and validation.
        docstring:
          examples:
          - lines:
            - parse_dependency_strings('TaskA depends on TaskB\nTaskB depends on TaskC')
            output: '[(''TaskA'', ''TaskB''), (''TaskB'', ''TaskC'')]'
          - lines:
            - parse_dependency_strings('Task1,Task2\nTask3,Task4')
            output: '[(''Task1'', ''Task2''), (''Task3'', ''Task4'')]'
          parameters:
          - description: A string containing dependency descriptions, one per line.
              Each line must follow the format "SourceTask depends on TargetTask"
              or "SourceTask,TargetTask".
            name: dependencies
            type: str
          raises:
          - description: Raised if a line in the input string does not conform to
              an expected dependency format.
            type: ValueError
          - description: Raised if the input `dependencies` is not of type `str`.
            type: TypeError
          returns:
            description: A list of tuples where each tuple contains the source task
              name and the target task name.
            type: List[Tuple[str, str]]
          summary: Parse a multiline string of dependency relationships and return
            them as a list of tuples.
      prompt: "def parse_dependency_strings(dependencies: str) -> List[Tuple[str,\
        \ str]]:\n    \"\"\"\n    # Implementation here\n    \"\"\"\n"
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Checks that every task referenced in the parsed dependencies exists
        in the provided task list and reports any missing references.
      implementation: "def validate_task_references(tasks: str, parsed_dependencies:\
        \ str) -> str:\n    \"\"\"\n    Validate that every task in `parsed_dependencies`\
        \ exists in `tasks`. If any\n    reference is missing, a `ValueError` is raised.\n\
        \n    Parameters\n    ----------\n    tasks : List[str]\n        A list of\
        \ all task identifiers that are considered valid.\n    parsed_dependencies\
        \ : List[Tuple[str, str]]\n        A list of dependency tuples in the form\
        \ (source_task, target_task).\n\n    Returns\n    -------\n    str\n     \
        \   A message stating that all references are valid, or a list of\n      \
        \  missing task identifiers.\n\n    Raises\n    ------\n    ValueError\n \
        \       If any task in a dependency tuple is not present in `tasks`.\n   \
        \ TypeError\n        If the input arguments are not of the expected types\
        \ (`list` of\n        `str` and `list` of `tuple`).\n\n    Examples\n    --------\n\
        \    >>> validate_task_references(     tasks=['TaskA', 'TaskB', 'TaskC'],\n\
        \    parsed_dependencies=[('TaskA', 'TaskB'), ('TaskB', 'TaskC')] )\n    'All\
        \ task references are valid.'\n\n    >>> try:\n    ...     validate_task_references(\
        \         tasks=['TaskA', 'TaskB'],\n    parsed_dependencies=[('TaskA', 'TaskC')]\
        \     )\n    >>> except ValueError as e:\n    ...     print(e)\n    \"Missing\
        \ task reference(s) found: TaskC\"\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: validate_task_references
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type Any
        key: output
        type: str
      - description: Input parameter of type str
        key: tasks
        type: str
      - description: Input parameter of type str
        key: parsed_dependencies
        type: str
      prd:
        conceptual_info: Validates that all tasks referenced in dependency tuples
          are defined in the task list, preventing dangling references before DAG
          construction.
        docstring:
          examples:
          - lines:
            - "validate_task_references(\n    tasks=['TaskA', 'TaskB', 'TaskC'],\n\
              \    parsed_dependencies=[('TaskA', 'TaskB'), ('TaskB', 'TaskC')]\n)"
            output: '''All task references are valid.'''
          - lines:
            - 'try:'
            - "    validate_task_references(\n    \ttasks=['TaskA', 'TaskB'],\n  \
              \  \tparsed_dependencies=[('TaskA', 'TaskC')]\n    )"
            - 'except ValueError as e:'
            - '    print(e)'
            output: '"Missing task reference(s) found: TaskC"'
          parameters:
          - description: A list of all task identifiers that are considered valid.
            name: tasks
            type: List[str]
          - description: A list of dependency tuples in the form (source_task, target_task).
            name: parsed_dependencies
            type: List[Tuple[str, str]]
          raises:
          - description: If any task in a dependency tuple is not present in `tasks`.
            type: ValueError
          - description: If the input arguments are not of the expected types (`list`
              of `str` and `list` of `tuple`).
            type: TypeError
          returns:
            description: A message stating that all references are valid, or a list
              of missing task identifiers.
            type: str
          summary: Validate that every task in `parsed_dependencies` exists in `tasks`.
            If any reference is missing, a `ValueError` is raised.
      prompt: 'Validate task references: ensure each dependency tuple contains only
        tasks from the supplied task list.'
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Extracts a list of source task identifiers from a string representation
        of parsed dependency pairs.
      implementation: "from typing import List\n\n\ndef extract_edge_sources(parsed_dependencies:\
        \ str) -> List[str]:\n    \"\"\"\n    Parse a string of dependency tuples\
        \ and return the list of source task\n    identifiers.\n\n    Parameters\n\
        \    ----------\n    parsed_dependencies : str\n        A string containing\
        \ comma‑separated tuples in the form \"('TaskA',\n        'TaskB'), ('TaskC',\
        \ 'TaskD')\" or a similar format where each tuple\n        represents a dependency\
        \ \"source\" → \"destination\".\n\n    Returns\n    -------\n    List[str]\n\
        \        A list of the source task identifiers extracted from each dependency\n\
        \        tuple.\n\n    Raises\n    ------\n    TypeError\n        If `parsed_dependencies`\
        \ is not a string.\n    ValueError\n        If the input string cannot be\
        \ parsed into a sequence of valid\n        two‑element tuples or if any tuple\
        \ is malformed.\n\n    Examples\n    --------\n    >>> output = extract_edge_sources(\"\
        ('TaskA', 'TaskB'), ('TaskC', 'TaskD')\")\n    ['TaskA', 'TaskC']\n\n    >>>\
        \ output = extract_edge_sources(\"('Deploy', 'Test'), ('Build', 'Deploy')\"\
        )\n    ['Deploy', 'Build']\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: extract_edge_sources
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: parsed_dependencies
        type: str
      prd:
        conceptual_info: The shim isolates the logic for extracting source task names
          from a dependency string, enabling reuse in DAG construction and simplifying
          unit tests.
        docstring:
          examples:
          - lines:
            - output = extract_edge_sources("('TaskA', 'TaskB'), ('TaskC', 'TaskD')")
            output: '[''TaskA'', ''TaskC'']'
          - lines:
            - output = extract_edge_sources("('Deploy', 'Test'), ('Build', 'Deploy')")
            output: '[''Deploy'', ''Build'']'
          parameters:
          - description: A string containing comma‑separated tuples in the form "('TaskA',
              'TaskB'), ('TaskC', 'TaskD')" or a similar format where each tuple represents
              a dependency "source" → "destination".
            name: parsed_dependencies
            type: str
          raises:
          - description: If `parsed_dependencies` is not a string.
            type: TypeError
          - description: If the input string cannot be parsed into a sequence of valid
              two‑element tuples or if any tuple is malformed.
            type: ValueError
          returns:
            description: A list of the source task identifiers extracted from each
              dependency tuple.
            type: List[str]
          summary: Parse a string of dependency tuples and return the list of source
            task identifiers.
      prompt: '## Shim implementation prompt


        Implement a function `extract_edge_sources(parsed_dependencies: str) -> List[str]`
        that parses the provided string of dependency tuples and returns a list of
        the first element (source task) of each tuple. The function should validate
        input format, raise appropriate errors, and follow the style guidelines of
        the project.'
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Extracts the destination task identifiers from a string representation
        of parsed dependency tuples.
      implementation: "from typing import List\n\n\ndef extract_edge_destinations(parsed_dependencies:\
        \ str) -> List[str]:\n    \"\"\"\n    Extracts destination task identifiers\
        \ from a string representation of parsed\n    dependency tuples.\n\n    Parameters\n\
        \    ----------\n    parsed_dependencies : str\n        String representation\
        \ of parsed dependency tuples, each tuple\n        containing a source and\
        \ destination task identifier.\n\n    Returns\n    -------\n    LIST_STR\n\
        \        A list of destination task identifiers (e.g., ['TaskB', 'TaskC'])\n\
        \        extracted from the parsed dependencies.\n\n    Raises\n    ------\n\
        \    ValueError\n        Raised when the input string cannot be parsed into\
        \ a list of tuple\n        pairs.\n    TypeError\n        Raised when the\
        \ input is not a string.\n\n    Examples\n    --------\n    >>> deps = \"\
        [(\\'TaskA\\', \\'TaskB\\'), (\\'TaskB\\', \\'TaskC\\')]\"\n    >>> print(extract_edge_destinations(deps))\n\
        \    ['TaskB', 'TaskC']\n\n    >>> deps = \"[]\"\n    >>> print(extract_edge_destinations(deps))\n\
        \    []\n\n    \"\"\"\n    raise NotImplementedError(\"This is a virtual stub\
        \ node that needs to be implemented\")"
      name: extract_edge_destinations
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: parsed_dependencies
        type: str
      prd:
        conceptual_info: This shim serves as the bridge between parsed dependency
          data and the DAG construction logic by isolating the extraction of destination
          nodes from dependency tuples.
        docstring:
          examples:
          - lines:
            - deps = "[(\'TaskA\', \'TaskB\'), (\'TaskB\', \'TaskC\')]"
            - print(extract_edge_destinations(deps))
            output: '[''TaskB'', ''TaskC'']'
          - lines:
            - deps = "[]"
            - print(extract_edge_destinations(deps))
            output: '[]'
          parameters:
          - description: String representation of parsed dependency tuples, each tuple
              containing a source and destination task identifier.
            name: parsed_dependencies
            type: str
          raises:
          - description: Raised when the input string cannot be parsed into a list
              of tuple pairs.
            type: ValueError
          - description: Raised when the input is not a string.
            type: TypeError
          returns:
            description: A list of destination task identifiers (e.g., ['TaskB', 'TaskC'])
              extracted from the parsed dependencies.
            type: LIST_STR
          summary: Extracts destination task identifiers from a string representation
            of parsed dependency tuples.
      prompt: 'def extract_edge_destinations(parsed_dependencies: str) -> List[str]:'
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Checks whether a directed graph defined by tasks and edge lists
        contains any cycles, returning a boolean result.
      implementation: "def check_dag_acyclicity(tasks: str, edge_sources: str, edge_destinations:\
        \ str) -> bool:\n    \"\"\"\n    Determine if a directed graph, specified\
        \ by tasks and edge lists, contains a\n    cycle.\n\n    Parameters\n    ----------\n\
        \    tasks : List[str]\n        A list of unique task identifiers that form\
        \ the nodes of the graph.\n    edge_sources : List[str]\n        A list of\
        \ source task identifiers for each directed edge in the\n        graph.\n\
        \    edge_destinations : List[str]\n        A list of destination task identifiers\
        \ for each directed edge in the\n        graph.\n\n    Returns\n    -------\n\
        \    bool\n        Returns True if the graph contains no cycles (is acyclic);\
        \ otherwise\n        returns False.\n\n    Raises\n    ------\n    TypeError\n\
        \        Raised when any of the arguments is not a list of strings.\n    ValueError\n\
        \        Raised when the lengths of edge_sources and edge_destinations\n \
        \       differ, or when a source/destination is not present in tasks.\n\n\
        \    Examples\n    --------\n    >>> check_dag_acyclicity([\n    ...     \"\
        A\", \"B\", \"C\"\n    >>> ], [\n    ...     \"A\", \"B\"\n    >>> ], [\n\
        \    ...     \"B\", \"C\"\n    >>> ])\n    True\n\n    >>> check_dag_acyclicity([\n\
        \    ...     \"A\", \"B\", \"C\"\n    >>> ], [\n    ...     \"A\", \"B\",\
        \ \"C\"\n    >>> ], [\n    ...     \"B\", \"C\", \"A\"\n    >>> ])\n    False\n\
        \n    \"\"\"\n    raise NotImplementedError(\"This is a virtual stub node\
        \ that needs to be implemented\")"
      name: check_dag_acyclicity
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type bool
        key: output
        type: bool
      - description: Input parameter of type str
        key: tasks
        type: str
      - description: Input parameter of type str
        key: edge_sources
        type: str
      - description: Input parameter of type str
        key: edge_destinations
        type: str
      prd:
        conceptual_info: This shim determines the acyclicity of a task dependency
          DAG by examining the list of tasks and the corresponding source–destination
          edge pairs.
        docstring:
          examples:
          - lines:
            - check_dag_acyclicity([
            - '    "A", "B", "C"'
            - '], ['
            - '    "A", "B"'
            - '], ['
            - '    "B", "C"'
            - '])'
            output: 'True'
          - lines:
            - check_dag_acyclicity([
            - '    "A", "B", "C"'
            - '], ['
            - '    "A", "B", "C"'
            - '], ['
            - '    "B", "C", "A"'
            - '])'
            output: 'False'
          parameters:
          - description: A list of unique task identifiers that form the nodes of
              the graph.
            name: tasks
            type: List[str]
          - description: A list of source task identifiers for each directed edge
              in the graph.
            name: edge_sources
            type: List[str]
          - description: A list of destination task identifiers for each directed
              edge in the graph.
            name: edge_destinations
            type: List[str]
          raises:
          - description: Raised when any of the arguments is not a list of strings.
            type: TypeError
          - description: Raised when the lengths of edge_sources and edge_destinations
              differ, or when a source/destination is not present in tasks.
            type: ValueError
          returns:
            description: Returns True if the graph contains no cycles (is acyclic);
              otherwise returns False.
            type: bool
          summary: Determine if a directed graph, specified by tasks and edge lists,
            contains a cycle.
      prompt: 'check_dag_acyclicity(tasks: List[str], edge_sources: List[str], edge_destinations:
        List[str]) -> bool'
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Converts a list of task names into a formatted string representation.
      implementation: "def format_task_list(tasks: str) -> str:\n    \"\"\"\n    Formats\
        \ a list of task names into a standardized string for downstream DAG\n   \
        \ processing.\n\n    Parameters\n    ----------\n    tasks : list\n      \
        \  A list of task names to format.\n\n    Returns\n    -------\n    str\n\
        \        A string containing the task names formatted as a list.\n\n    Raises\n\
        \    ------\n    ValueError\n        Raised when the input list is empty or\
        \ contains non-string elements.\n    TypeError\n        Raised when the input\
        \ is not a list or iterable.\n\n    Examples\n    --------\n    >>> result\
        \ = format_task_list(['TaskA', 'TaskB', 'TaskC'])\n    >>> print(result)\n\
        \    ['TaskA', 'TaskB', 'TaskC']\n\n    >>> format_task_list([])\n    ValueError:\
        \ Input list cannot be empty.\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: format_task_list
