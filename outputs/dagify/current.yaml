  finalize_dag_workflow:
    agent: false
    code_node_type: shim
    description: Finalize the DAG workflow, verifying its correctness and effectiveness.
    implementation: "from ._finalize_dag_workflow.validate_input_consistency import\
      \ validate_input_consistency\nfrom ._finalize_dag_workflow.raise_value_error\
      \ import raise_value_error\nfrom ._finalize_dag_workflow.validate_dag_structure\
      \ import validate_dag_structure\nfrom ._finalize_dag_workflow.evaluate_prompt_quality\
      \ import evaluate_prompt_quality\nfrom ._finalize_dag_workflow.evaluate_description_completeness\
      \ import evaluate_description_completeness\nfrom ._finalize_dag_workflow.calculate_workflow_efficiency\
      \ import calculate_workflow_efficiency\nfrom ._finalize_dag_workflow.identify_validation_issues\
      \ import identify_validation_issues\nfrom ._finalize_dag_workflow.determine_overall_validity\
      \ import determine_overall_validity\nfrom ._finalize_dag_workflow.format_validation_details\
      \ import format_validation_details\n\nfrom pydantic import BaseModel, Field\n\
      from typing import List\n\n\nclass DefineNodePromptsAndDescriptionsOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for define_node_prompts_and_descriptions node outputs.\"\
      \"\"\n    node_names: List[str] = (\n        Field(..., description=\"List of\
      \ all node names in the DAG.\")\n    )\n    node_prompts: List[str] = (\n  \
      \      Field(..., description = (\n            \"List of prompts corresponding\
      \ to each node name.\")\n        )\n    )\n    node_descriptions: List[str]\
      \ = (\n        Field(..., description = (\n            \"List of descriptions\
      \ corresponding to each node name.\")\n        )\n    )\n\n\nclass FinalizeDagWorkflowOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for finalize_dag_workflow node outputs.\"\"\"\n  \
      \  is_valid: bool = (\n        Field(..., description = (\n            \"Whether\
      \ the DAG workflow is valid and effective\")\n        )\n    )\n    validation_details:\
      \ str = (\n        Field(..., description = (\n            \"List of details\
      \ or issues found during validation\")\n        )\n    )\n    efficiency_score:\
      \ float = (\n        Field(..., description = (\n            \"A score indicating\
      \ the efficiency of the workflow, ranging from 0 to 1\")\n        )\n    )\n\
      \n\ndef finalize_dag_workflow(define_node_prompts_and_descriptions_input: DefineNodePromptsAndDescriptionsOutput,\
      \ **kwargs) -> FinalizeDagWorkflowOutput:\n    \"\"\"\n    Finalize the DAG\
      \ workflow by validating its correctness and effectiveness.\n\n    Parameters\n\
      \    ----------\n    node_names : List[str]\n        List of node names in the\
      \ DAG\n    node_prompts : List[str]\n        List of prompts corresponding to\
      \ each node name\n    node_descriptions : List[str]\n        List of descriptions\
      \ corresponding to each node name\n\n    Returns\n    -------\n    Dict[str,\
      \ Any]\n        A dictionary containing the validation result, details, and\n\
      \        efficiency score\n\n    Raises\n    ------\n    ValueError\n      \
      \  If the input node names, prompts, or descriptions are invalid or\n      \
      \  inconsistent\n\n    Examples\n    --------\n    >>> node_names = ['node1',\
      \ 'node2', 'node3']\n    >>> node_prompts = ['prompt1', 'prompt2', 'prompt3']\n\
      \    >>> node_descriptions = ['description1', 'description2', 'description3']\n\
      \    >>> result = finalize_dag_workflow(node_names, node_prompts,\n    node_descriptions)\n\
      \    {'is_valid': True, 'validation_details': [], 'efficiency_score': 0.8}\n\
      \n    \"\"\"\n    input_validation_result: bool = validate_input_consistency(\n\
      \        node_names=define_node_prompts_and_descriptions_input.node_names,\n\
      \        node_prompts=define_node_prompts_and_descriptions_input.node_prompts,\n\
      \        node_descriptions=define_node_prompts_and_descriptions_input.node_descriptions\n\
      \    )\n    \n    if not input_validation_result:\n        raise_value_error(message=\"\
      Input node names, prompts, or descriptions are invalid or inconsistent\")\n\
      \    \n    dag_structure_validation: bool = validate_dag_structure(\n      \
      \  node_names=define_node_prompts_and_descriptions_input.node_names\n    )\n\
      \    \n    prompt_quality_score: float = evaluate_prompt_quality(\n        node_prompts=define_node_prompts_and_descriptions_input.node_prompts\n\
      \    )\n    \n    description_completeness_score: float = evaluate_description_completeness(\n\
      \        node_descriptions=define_node_prompts_and_descriptions_input.node_descriptions\n\
      \    )\n    \n    workflow_efficiency_score: float = calculate_workflow_efficiency(\n\
      \        node_names=define_node_prompts_and_descriptions_input.node_names,\n\
      \        node_prompts=define_node_prompts_and_descriptions_input.node_prompts,\n\
      \        node_descriptions=define_node_prompts_and_descriptions_input.node_descriptions\n\
      \    )\n    \n    validation_issues: List[str] = identify_validation_issues(\n\
      \        dag_valid=dag_structure_validation,\n        prompt_score=prompt_quality_score,\n\
      \        description_score=description_completeness_score\n    )\n    \n   \
      \ is_workflow_valid: bool = determine_overall_validity(\n        dag_valid=dag_structure_validation,\n\
      \        validation_issues=validation_issues\n    )\n    \n    validation_details_str:\
      \ str = format_validation_details(validation_issues=validation_issues)\n   \
      \ \n    return FinalizeDagWorkflowOutput(\n        is_valid=is_workflow_valid,\n\
      \        validation_details=validation_details_str,\n        efficiency_score=workflow_efficiency_score\n\
      \    )"
    name: finalize_dag_workflow
    nodes_depended_on:
    - define_node_prompts_and_descriptions
