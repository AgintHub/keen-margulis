      implementation: "def extract_volume(general_input: str, kwargs: str) -> float:\n\
        \    \"\"\"\n    Extracts a numeric volume value from a string or keyword\
        \ arguments.\n\n    Parameters\n    ----------\n    general_input : str\n\
        \        A string containing the volume information, e.g., '2L of water' or\n\
        \        '1.5 liters'.\n    kwargs : dict\n        Optional keyword arguments\
        \ that may supply the unit or override\n        default parsing behaviour\
        \ (e.g., unit='liters').\n\n    Returns\n    -------\n    float\n        The\
        \ numeric volume value expressed in liters.\n\n    Raises\n    ------\n  \
        \  ValueError\n        Raised when no numeric volume can be extracted or when\
        \ the unit is\n        unsupported.\n    TypeError\n        Raised when general_input\
        \ is not a string or kwargs is not a\n        dictionary.\n\n    Examples\n\
        \    --------\n    >>> extract_volume('water 2L')\n    2.0\n\n    >>> extract_volume('1.5\
