      )\n        )\n    )\n\n\ndef brew_coffee(boil_water_input: BoilWaterOutput,\
      \ prepare_coffee_maker_input: PrepareCoffeeMakerOutput, **kwargs) -> BrewCoffeeOutput:\n\
      \    \"\"\"\n    Boil the specified liquid to its target boiling temperature\
