        \ = validate_liquid_type('water')\n    >>> print(result)\n    True\n\n   \
        \ >>> result = validate_liquid_type('coffee')\n    >>> print(result)\n   \
        \ False\n\n    >>> validate_liquid_type(123)\n    >>> print('This line will\
