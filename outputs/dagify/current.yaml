            type: str
          summary: Extracts the liquid type from a general input string, returning
            a standardized lowercase string.
      prompt: 'Implement a function `extract_liquid_type(general_input: str, kwargs:
        str) -> str` that parses the liquid type from an arbitrary input string. The
