dag_type: stub
description: Generated workflow from UI.
name: create_simple_workflow
nodes:
  create_task_dag:
    agent: false
    code_node_type: stub
    description: Create a DAG representing the tasks and their dependencies
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass IdentifyTaskDependenciesOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for identify_task_dependencies node outputs.\"\"\"\n    tasks: List[str] =\
      \ Field(..., description=\"List of identified task names.\")\n    dependencies:\
      \ List[str] = (\n        Field(..., description=\"List of dependency relationships\
      \ in the format 'TaskA depends on TaskB'.\")\n    )\n    dependency_exists:\
      \ bool = (\n        Field(..., description=\"Indicates whether any dependencies\
      \ were identified.\")\n    )\n\n\nclass CreateTaskDagOutput(BaseModel):\n  \
      \  \"\"\"Pydantic model for create_task_dag node outputs.\"\"\"\n    task_ids:\
      \ str = (\n        Field(..., description=\"List of unique task identifiers\
      \ used in the DAG\")\n    )\n    edge_sources: str = (\n        Field(..., description=\"\
      List of source task identifiers for each directed edge in the DAG\")\n    )\n\
      \    edge_destinations: str = (\n        Field(..., description=\"List of destination\
      \ task identifiers for each directed edge in the DAG\")\n    )\n    is_valid:\
      \ bool = (\n        Field(..., description=\"Indicates whether the constructed\
      \ DAG is acyclic and complete\")\n    )\n\n\ndef create_task_dag(identify_task_dependencies_input:\
      \ IdentifyTaskDependenciesOutput, **kwargs) -> CreateTaskDagOutput:\n    \"\"\
      \"\n    Constructs a DAG from given tasks and dependency relations.\n\n    Parameters\n\
      \    ----------\n    tasks : List[str]\n        A list of task identifiers that\
      \ will become the DAG nodes.\n    dependencies : List[str]\n        Each string\
      \ represents a dependency in the format 'TaskA depends on\n        TaskB'.\n\
      \n    Returns\n    -------\n    dict\n        A dictionary with four keys: task_ids\
      \ (List[str]), edge_sources\n        (List[str]), edge_destinations (List[str]),\
      \ and is_valid (bool).\n\n    Raises\n    ------\n    ValueError\n        Raised\
      \ when a dependency refers to a task not present in the `tasks`\n        list.\n\
      \    ValueError\n        Raised when a dependency string does not match the\
      \ expected 'TaskA\n        depends on TaskB' pattern.\n\n    Examples\n    --------\n\
      \    >>> tasks = ['A', 'B', 'C']\n    >>> dependencies = ['B depends on A',\
      \ 'C depends on B']\n    >>> result = create_task_dag(tasks, dependencies)\n\
      \    >>> print(result)\n    {'task_ids': ['A', 'B', 'C'], 'edge_sources': ['A',\
      \ 'B'],\n    'edge_destinations': ['B', 'C'], 'is_valid': True}\n\n    >>> tasks\
      \ = ['A', 'B']\n    >>> dependencies = ['A depends on B', 'B depends on A']\n\
      \    >>> result = create_task_dag(tasks, dependencies)\n    >>> print(result)\n\
      \    {'task_ids': ['A', 'B'], 'edge_sources': ['B', 'A'], 'edge_destinations':\n\
      \    ['A', 'B'], 'is_valid': False}\n\n    \"\"\"\n    return CreateTaskDagOutput(\n\
      \        task_ids=\"\",\n        edge_sources=\"\",\n        edge_destinations=\"\
      \",\n        is_valid=False,\n    )"
    name: create_task_dag
    nodes_depended_on:
    - identify_task_dependencies
    nodes_dependent_on: []
    output_structure:
    - description: List of unique task identifiers used in the DAG
      key: task_ids
      type: str
    - description: List of source task identifiers for each directed edge in the DAG
      key: edge_sources
      type: str
    - description: List of destination task identifiers for each directed edge in
        the DAG
      key: edge_destinations
      type: str
    - description: Indicates whether the constructed DAG is acyclic and complete
      key: is_valid
      type: bool
    prd:
      conceptual_info: Builds a directed acyclic graph (DAG) from a list of task identifiers
        and dependency relations, producing node identifiers, edge lists, and a validity
        flag.
      docstring:
        examples:
        - lines:
          - tasks = ['A', 'B', 'C']
          - dependencies = ['B depends on A', 'C depends on B']
          - result = create_task_dag(tasks, dependencies)
          - print(result)
          output: '{''task_ids'': [''A'', ''B'', ''C''], ''edge_sources'': [''A'',
            ''B''], ''edge_destinations'': [''B'', ''C''], ''is_valid'': True}'
        - lines:
          - tasks = ['A', 'B']
          - dependencies = ['A depends on B', 'B depends on A']
          - result = create_task_dag(tasks, dependencies)
          - print(result)
          output: '{''task_ids'': [''A'', ''B''], ''edge_sources'': [''B'', ''A''],
            ''edge_destinations'': [''A'', ''B''], ''is_valid'': False}'
        parameters:
        - description: A list of task identifiers that will become the DAG nodes.
          name: tasks
          type: List[str]
        - description: Each string represents a dependency in the format 'TaskA depends
            on TaskB'.
          name: dependencies
          type: List[str]
        raises:
        - description: Raised when a dependency refers to a task not present in the
            `tasks` list.
          type: ValueError
        - description: Raised when a dependency string does not match the expected
            'TaskA depends on TaskB' pattern.
          type: ValueError
        returns:
          description: 'A dictionary with four keys: task_ids (List[str]), edge_sources
            (List[str]), edge_destinations (List[str]), and is_valid (bool).'
          type: dict
        summary: Constructs a DAG from given tasks and dependency relations.
    prompt: Using the tasks and their dependencies, construct a Directed Acyclic Graph
      (DAG) that represents the workflow.
    shims: []
  decompose_objective_into_tasks:
    agent: false
    code_node_type: stub
    description: Break down the workflow objective into individual tasks
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass DefineWorkflowObjectiveOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for define_workflow_objective node outputs.\"\"\"\n    workflow_objective:\
      \ str = (\n        Field(..., description=\"The primary goal of the workflow\
      \ expressed as a concise statement.\")\n    )\n\n\nclass DecomposeObjectiveIntoTasksOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for decompose_objective_into_tasks node outputs.\"\
      \"\"\n    tasks: List[str] = (\n        Field(..., description=\"List of task\
      \ descriptions that represent the decomposed workflow objective\")\n    )\n\
      \    task_count: int = (\n        Field(..., description=\"Number of tasks identified\
      \ in the decomposition\")\n    )\n\n\ndef decompose_objective_into_tasks(define_workflow_objective_input:\
      \ DefineWorkflowObjectiveOutput, **kwargs) -> DecomposeObjectiveIntoTasksOutput:\n\
      \    \"\"\"\n    Breaks down a workflow objective into discrete tasks.\n\n \
      \   Parameters\n    ----------\n    workflow_objective : str\n        A concise\
      \ statement describing the primary goal of the workflow.\n\n    Returns\n  \
      \  -------\n    Tuple[List[str], int]\n        A tuple containing (1) a list\
      \ of task descriptions and (2) the count\n        of tasks.\n\n    Raises\n\
      \    ------\n    ValueError\n        Raised when `workflow_objective` is empty\
      \ or consists only of\n        whitespace.\n\n    Examples\n    --------\n \
      \   >>> tasks, count = decompose_objective_into_tasks('Build a machine learning\n\
      \    pipeline for predicting house prices')\n    (['Collect and clean data',\
      \ 'Split dataset', 'Select model', 'Train model',\n    'Evaluate model', 'Deploy\
      \ model'], 6)\n\n    >>> tasks, count = decompose_objective_into_tasks('Write\
      \ a report')\n    (['Plan report structure', 'Collect data', 'Write draft',\
      \ 'Revise',\n    'Finalize'], 5)\n\n    \"\"\"\n    return DecomposeObjectiveIntoTasksOutput(\n\
      \        tasks=[],\n        task_count=0,\n    )"
    name: decompose_objective_into_tasks
    nodes_depended_on:
    - define_workflow_objective
    nodes_dependent_on: []
    output_structure:
    - description: List of task descriptions that represent the decomposed workflow
        objective
      key: tasks
      type: List[str]
    - description: Number of tasks identified in the decomposition
      key: task_count
      type: int
    prd:
      conceptual_info: Transforms a high‑level workflow goal into a concrete sequence
        of actionable tasks, enabling downstream dependency analysis and DAG construction.
      docstring:
        examples:
        - lines:
          - tasks, count = decompose_objective_into_tasks('Build a machine learning
            pipeline for predicting house prices')
          output: (['Collect and clean data', 'Split dataset', 'Select model', 'Train
            model', 'Evaluate model', 'Deploy model'], 6)
        - lines:
          - tasks, count = decompose_objective_into_tasks('Write a report')
          output: (['Plan report structure', 'Collect data', 'Write draft', 'Revise',
            'Finalize'], 5)
        parameters:
        - description: A concise statement describing the primary goal of the workflow.
          name: workflow_objective
          type: str
        raises:
        - description: Raised when `workflow_objective` is empty or consists only
            of whitespace.
          type: ValueError
        returns:
          description: A tuple containing (1) a list of task descriptions and (2)
            the count of tasks.
          type: Tuple[List[str], int]
        summary: Breaks down a workflow objective into discrete tasks.
    prompt: Decompose the workflow objective into smaller, manageable tasks. List
      them out.
    shims: []
  define_workflow_objective:
    agent: false
    code_node_type: stub
    description: Define the objective of the workflow
    implementation: "from pydantic import BaseModel, Field\n\n\nclass DefineWorkflowObjectiveOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for define_workflow_objective node outputs.\"\"\"\n\
      \    workflow_objective: str = (\n        Field(..., description=\"The primary\
      \ goal of the workflow expressed as a concise statement.\")\n    )\n\n\ndef\
      \ define_workflow_objective(general_input: str, **kwargs) -> DefineWorkflowObjectiveOutput:\n\
      \    \"\"\"\n    Generate a concise objective statement for the workflow based\
      \ on the user’s\n    intent.\n\n    Returns\n    -------\n    str\n        Concise\
      \ objective of the workflow.\n\n    Raises\n    ------\n    ValueError\n   \
      \     If the generated objective is empty or exceeds an acceptable length.\n\
      \n    Examples\n    --------\n    >>> objective = define_workflow_objective()\n\
      \    'Implement an automated data ingestion pipeline for real‑time analytics'\n\
      \n    >>> objective = define_workflow_objective()\n    'Develop a user‑friendly\
      \ mobile application for inventory management'\n\n    \"\"\"\n    return DefineWorkflowObjectiveOutput(\n\
      \        workflow_objective=\"\",\n    )"
    name: define_workflow_objective
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: The primary goal of the workflow expressed as a concise statement.
      key: workflow_objective
      type: str
    prd:
      conceptual_info: Captures the high‑level purpose of the workflow, providing
        a clear goal that drives the subsequent task decomposition, dependency analysis,
        and DAG construction.
      docstring:
        examples:
        - lines:
          - objective = define_workflow_objective()
          output: '''Implement an automated data ingestion pipeline for real‑time
            analytics'''
        - lines:
          - objective = define_workflow_objective()
          output: '''Develop a user‑friendly mobile application for inventory management'''
        parameters: []
        raises:
        - description: If the generated objective is empty or exceeds an acceptable
            length.
          type: ValueError
        returns:
          description: Concise objective of the workflow.
          type: str
        summary: Generate a concise objective statement for the workflow based on
          the user’s intent.
    prompt: Clearly articulate the primary goal of the workflow. What is it intended
      to achieve?
    shims: []
  finalize_workflow:
    agent: false
    code_node_type: stub
    description: Finalize the workflow DAG
    implementation: "from pydantic import BaseModel, Field\n\n\nclass ValidateDagOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for validate_dag node outputs.\"\"\"\n    is_valid:\
      \ bool = (\n        Field(..., description=\"Indicates whether the DAG passes\
      \ all validation checks.\")\n    )\n    node_count: int = (\n        Field(...,\
      \ description=\"Total number of nodes present in the DAG.\")\n    )\n    edge_count:\
      \ int = (\n        Field(..., description=\"Total number of directed edges in\
      \ the DAG.\")\n    )\n    cycles_detected: str = (\n        Field(..., description=\"\
      List of cycle identifiers or descriptions found in the DAG (empty if none).\"\
      )\n    )\n    missing_dependencies: str = (\n        Field(..., description=\"\
      List of node names that reference non\\u2011existent dependencies (empty if\
      \ none).\")\n    )\n    errors: str = (\n        Field(..., description=\"Detailed\
      \ error messages for any validation failures.\")\n    )\n\n\nclass FinalizeWorkflowOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for finalize_workflow node outputs.\"\"\"\n    dag_representation:\
      \ str = (\n        Field(..., description=\"String representation of the finalized\
      \ DAG, e.g., serialized adjacency list or other format.\")\n    )\n    is_valid:\
      \ bool = (\n        Field(..., description=\"Whether the finalized DAG is valid\
      \ and acyclic.\")\n    )\n    adjustments_made: bool = (\n        Field(...,\
      \ description=\"Whether any adjustments were made to the DAG during finalization.\"\
      )\n    )\n    adjusted_task_order: str = (\n        Field(..., description=\"\
      Ordered list of task identifiers in the finalized DAG.\")\n    )\n    missing_dependencies:\
      \ str = (\n        Field(..., description=\"List of task identifiers that have\
      \ missing or unresolved dependencies.\")\n    )\n    cycles_detected: str =\
      \ (\n        Field(..., description=\"List of detected cycles in the DAG, if\
      \ any.\")\n    )\n    warnings: str = (\n        Field(..., description=\"Any\
      \ warnings or notes about potential issues.\")\n    )\n    summary: str = (\n\
      \        Field(..., description=\"Short textual summary of the finalized workflow.\"\
      )\n    )\n\n\ndef finalize_workflow(validate_dag_input: ValidateDagOutput, **kwargs)\
      \ -> FinalizeWorkflowOutput:\n    \"\"\"\n    Finalize a workflow DAG by validating\
      \ its structure, resolving missing\n    dependencies, removing cycles, and ordering\
      \ tasks.\n\n    Parameters\n    ----------\n    task_ids : List[str]\n     \
      \   Unique identifiers of all tasks in the DAG.\n    edge_sources : List[str]\n\
      \        Source task identifiers for each directed edge.\n    edge_destinations\
      \ : List[str]\n        Destination task identifiers for each directed edge.\n\
      \    is_valid : bool\n        Result of the validation step (True if the DAG\
      \ passed all checks).\n    node_count : int\n        Total number of nodes in\
      \ the DAG.\n    edge_count : int\n        Total number of directed edges in\
      \ the DAG.\n    cycles_detected : List[str]\n        List of cycle identifiers\
      \ found during validation.\n    missing_dependencies : List[str]\n        List\
      \ of node names that reference non‑existent dependencies.\n    errors : List[str]\n\
      \        Detailed error messages from the validation step.\n\n    Returns\n\
      \    -------\n    Dict[str, Any]\n        A dictionary containing the finalized\
      \ DAG representation and\n        metadata: dag_representation (str), is_valid\
      \ (bool),\n        adjustments_made (bool), adjusted_task_order (List[str]),\n\
      \        missing_dependencies (List[str]), cycles_detected (List[str]),\n  \
      \      warnings (List[str]), and summary (str).\n\n    Raises\n    ------\n\
      \    ValueError\n        If any required input lists are empty or lengths of\
      \ edge_sources and\n        edge_destinations mismatch.\n\n    Examples\n  \
      \  --------\n    >>> dag = finalize_workflow(\n\n    ...     task_ids=['A',\
      \ 'B', 'C'],\n\n    ...     edge_sources=['A', 'B'],\n\n    ...     edge_destinations=['B',\
      \ 'C'],\n\n    ...     is_valid=True,\n\n    ...     node_count=3,\n\n    ...\
      \     edge_count=2,\n\n    ...     cycles_detected=[],\n\n    ...     missing_dependencies=[],\n\
      \n    ...     errors=[]\n\n    >>> )\n    {'dag_representation': 'A -> B ->\
      \ C', 'is_valid': True, 'adjustments_made':\n    False, 'adjusted_task_order':\
      \ ['A', 'B', 'C'], 'missing_dependencies': [],\n    'cycles_detected': [], 'warnings':\
      \ [], 'summary': 'DAG finalized\n    successfully.'}\n\n    >>> dag = finalize_workflow(\n\
      \n    ...     task_ids=['A', 'B', 'C'],\n\n    ...     edge_sources=['A', 'B',\
      \ 'C'],\n\n    ...     edge_destinations=['B', 'C', 'A'],\n\n    ...     is_valid=False,\n\
      \n    ...     node_count=3,\n\n    ...     edge_count=3,\n\n    ...     cycles_detected=['A->B->C->A'],\n\
      \n    ...     missing_dependencies=[],\n\n    ...     errors=['Cycle detected']\n\
      \n    >>> )\n    {'dag_representation': 'A -> B -> C', 'is_valid': False, 'adjustments_made':\n\
      \    True, 'adjusted_task_order': ['A', 'B', 'C'], 'missing_dependencies': [],\n\
      \    'cycles_detected': ['A->B->C->A'], 'warnings': ['Cycle removed:\n    A->B->C->A'],\
      \ 'summary': 'DAG finalized with cycle removal.'}\n\n    \"\"\"\n    return\
      \ FinalizeWorkflowOutput(\n        dag_representation=\"\",\n        is_valid=False,\n\
      \        adjustments_made=False,\n        adjusted_task_order=\"\",\n      \
      \  missing_dependencies=\"\",\n        cycles_detected=\"\",\n        warnings=\"\
      \",\n        summary=\"\",\n    )"
    name: finalize_workflow
    nodes_depended_on:
    - validate_dag
    nodes_dependent_on: []
    output_structure:
    - description: String representation of the finalized DAG, e.g., serialized adjacency
        list or other format.
      key: dag_representation
      type: str
    - description: Whether the finalized DAG is valid and acyclic.
      key: is_valid
      type: bool
    - description: Whether any adjustments were made to the DAG during finalization.
      key: adjustments_made
      type: bool
    - description: Ordered list of task identifiers in the finalized DAG.
      key: adjusted_task_order
      type: str
    - description: List of task identifiers that have missing or unresolved dependencies.
      key: missing_dependencies
      type: str
    - description: List of detected cycles in the DAG, if any.
      key: cycles_detected
      type: str
    - description: Any warnings or notes about potential issues.
      key: warnings
      type: str
    - description: Short textual summary of the finalized workflow.
      key: summary
      type: str
    prd:
      conceptual_info: The finalize_workflow node takes a validated DAG, checks for
        any remaining inconsistencies such as missing dependencies or cycles, applies
        necessary adjustments, and produces a clean, ordered representation ready
        for execution.
      docstring:
        examples:
        - lines:
          - 'dag = finalize_workflow(

            '
          - '    task_ids=[''A'', ''B'', ''C''],

            '
          - '    edge_sources=[''A'', ''B''],

            '
          - '    edge_destinations=[''B'', ''C''],

            '
          - '    is_valid=True,

            '
          - '    node_count=3,

            '
          - '    edge_count=2,

            '
          - '    cycles_detected=[],

            '
          - '    missing_dependencies=[],

            '
          - '    errors=[]

            '
          - )
          output: '{''dag_representation'': ''A -> B -> C'', ''is_valid'': True, ''adjustments_made'':
            False, ''adjusted_task_order'': [''A'', ''B'', ''C''], ''missing_dependencies'':
            [], ''cycles_detected'': [], ''warnings'': [], ''summary'': ''DAG finalized
            successfully.''}'
        - lines:
          - 'dag = finalize_workflow(

            '
          - '    task_ids=[''A'', ''B'', ''C''],

            '
          - '    edge_sources=[''A'', ''B'', ''C''],

            '
          - '    edge_destinations=[''B'', ''C'', ''A''],

            '
          - '    is_valid=False,

            '
          - '    node_count=3,

            '
          - '    edge_count=3,

            '
          - '    cycles_detected=[''A->B->C->A''],

            '
          - '    missing_dependencies=[],

            '
          - '    errors=[''Cycle detected'']

            '
          - )
          output: '{''dag_representation'': ''A -> B -> C'', ''is_valid'': False,
            ''adjustments_made'': True, ''adjusted_task_order'': [''A'', ''B'', ''C''],
            ''missing_dependencies'': [], ''cycles_detected'': [''A->B->C->A''], ''warnings'':
            [''Cycle removed: A->B->C->A''], ''summary'': ''DAG finalized with cycle
            removal.''}'
        parameters:
        - description: Unique identifiers of all tasks in the DAG.
          name: task_ids
          type: List[str]
        - description: Source task identifiers for each directed edge.
          name: edge_sources
          type: List[str]
        - description: Destination task identifiers for each directed edge.
          name: edge_destinations
          type: List[str]
        - description: Result of the validation step (True if the DAG passed all checks).
          name: is_valid
          type: bool
        - description: Total number of nodes in the DAG.
          name: node_count
          type: int
        - description: Total number of directed edges in the DAG.
          name: edge_count
          type: int
        - description: List of cycle identifiers found during validation.
          name: cycles_detected
          type: List[str]
        - description: List of node names that reference non‑existent dependencies.
          name: missing_dependencies
          type: List[str]
        - description: Detailed error messages from the validation step.
          name: errors
          type: List[str]
        raises:
        - description: If any required input lists are empty or lengths of edge_sources
            and edge_destinations mismatch.
          type: ValueError
        returns:
          description: 'A dictionary containing the finalized DAG representation and
            metadata: dag_representation (str), is_valid (bool), adjustments_made
            (bool), adjusted_task_order (List[str]), missing_dependencies (List[str]),
            cycles_detected (List[str]), warnings (List[str]), and summary (str).'
          type: Dict[str, Any]
        summary: Finalize a workflow DAG by validating its structure, resolving missing
          dependencies, removing cycles, and ordering tasks.
    prompt: Review the workflow DAG for completeness and make any necessary adjustments.
    shims: []
  identify_task_dependencies:
    agent: false
    code_node_type: stub
    description: Identify dependencies between tasks
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass DecomposeObjectiveIntoTasksOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for decompose_objective_into_tasks node outputs.\"\"\"\n    tasks: List[str]\
      \ = (\n        Field(..., description=\"List of task descriptions that represent\
      \ the decomposed workflow objective\")\n    )\n    task_count: int = (\n   \
      \     Field(..., description=\"Number of tasks identified in the decomposition\"\
      )\n    )\n\n\nclass IdentifyTaskDependenciesOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for identify_task_dependencies node outputs.\"\"\"\n    tasks: List[str]\
      \ = Field(..., description=\"List of identified task names.\")\n    dependencies:\
      \ List[str] = (\n        Field(..., description=\"List of dependency relationships\
      \ in the format 'TaskA depends on TaskB'.\")\n    )\n    dependency_exists:\
      \ bool = (\n        Field(..., description=\"Indicates whether any dependencies\
      \ were identified.\")\n    )\n\n\ndef identify_task_dependencies(decompose_objective_into_tasks_input:\
      \ DecomposeObjectiveIntoTasksOutput, **kwargs) -> IdentifyTaskDependenciesOutput:\n\
      \    \"\"\"\n    Infers direct dependencies between tasks from a list of task\
      \ descriptions.\n\n    Parameters\n    ----------\n    tasks : List[str]\n \
      \       Task descriptions generated by decompose_objective_into_tasks.\n\n \
      \   Returns\n    -------\n    Dict[str, Any]\n        A dictionary with keys\
      \ 'tasks', 'dependencies', and\n        'dependency_exists' matching the node's\
      \ output structure.\n\n    Raises\n    ------\n    ValueError\n        If the\
      \ input `tasks` is not a list of strings or is empty.\n\n    Examples\n    --------\n\
      \    >>> tasks_input = [\"Collect data\", \"Preprocess data\", \"Train model\"\
      ,\n    \"Evaluate model\"]\n    >>> # Assuming the following simple dependency\
      \ logic:\n    >>> # 'Preprocess data' depends on 'Collect data'\n    >>> # 'Train\
      \ model' depends on 'Preprocess data'\n    >>> # 'Evaluate model' depends on\
      \ 'Train model'\n    >>> result = identify_task_dependencies(tasks_input)\n\
      \    >>> print(result)\n    {'tasks': ['Collect data', 'Preprocess data', 'Train\
      \ model', 'Evaluate\n    model'], 'dependencies': ['Preprocess data depends\
      \ on Collect data', 'Train\n    model depends on Preprocess data', 'Evaluate\
      \ model depends on Train model'],\n    'dependency_exists': True}\n\n    >>>\
      \ tasks_input = [\"Generate report\", \"Publish report\"]\n    >>> # No explicit\
      \ dependencies specified\n    >>> result = identify_task_dependencies(tasks_input)\n\
      \    >>> print(result)\n    {'tasks': ['Generate report', 'Publish report'],\
      \ 'dependencies': [],\n    'dependency_exists': False}\n\n    \"\"\"\n    return\
      \ IdentifyTaskDependenciesOutput(\n        tasks=[],\n        dependencies=[],\n\
      \        dependency_exists=False,\n    )"
    name: identify_task_dependencies
    nodes_depended_on:
    - decompose_objective_into_tasks
    nodes_dependent_on: []
    output_structure:
    - description: List of identified task names.
      key: tasks
      type: List[str]
    - description: List of dependency relationships in the format 'TaskA depends on
        TaskB'.
