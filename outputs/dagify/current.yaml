dag_type: typed
description: Generated workflow from UI.
name: create_workflow_on_iphones
nodes:
  configure_app_settings:
    agent: false
    description: Configure the settings of the identified apps
    name: configure_app_settings
    nodes_depended_on:
    - identify_required_apps
    nodes_dependent_on: []
    output_structure:
    - description: List of apps for which settings were successfully applied.
      key: configured_apps
      type: List[str]
    - description: Whether all requested settings were applied successfully.
      key: settings_application_success
      type: bool
    - description: List of apps for which settings could not be applied.
      key: failed_apps
      type: List[str]
    prompt: Adjust the settings of the required apps to align with the workflow objective.
  create_automation_rules:
    agent: false
    description: Create automation rules for the workflow
    name: create_automation_rules
    nodes_depended_on:
    - design_workflow_layout
    - configure_app_settings
    nodes_dependent_on: []
    output_structure:
    - description: Human‑readable descriptions of each automation rule.
      key: rule_descriptions
      type: List[str]
    - description: Textual representation of the trigger condition for each rule.
      key: trigger_conditions
      type: List[str]
    - description: Textual representation of the action sequence performed by each
        rule.
      key: action_sequences
      type: List[str]
    - description: Total number of automation rules created.
      key: rule_count
      type: int
    - description: Whether all rules were generated without errors.
      key: is_successful
      type: bool
    prompt: Develop rules that automate the workflow based on specific triggers and
      actions.
  define_workflow_objective:
    agent: false
    description: Define the objective of the workflow to be created on iPhones
    name: define_workflow_objective
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: A concise statement summarizing the overall purpose of the workflow.
      key: objective
      type: str
    - description: A list of the primary goals that the workflow should achieve.
      key: key_goals
      type: List[str]
    - description: A list of measurable criteria to determine if the workflow is successful.
      key: success_criteria
      type: List[str]
    prompt: Clearly articulate the purpose and goals of the workflow to be developed
      on iPhones.
  deploy_workflow:
    agent: false
    description: Deploy the workflow on iPhones
    name: deploy_workflow
    nodes_depended_on:
    - refine_workflow
    nodes_dependent_on: []
    output_structure:
    - description: Indicates whether the workflow was deployed successfully.
      key: deployment_success
      type: bool
    - description: Identifiers of iPhones where the workflow was deployed.
      key: deployed_device_ids
      type: List[str]
    - description: ISO 8601 timestamp of when deployment occurred.
      key: deployment_timestamp
      type: str
    - description: Log output detailing the deployment process.
      key: deployment_log
      type: str
    - description: Version identifier of the deployed workflow.
      key: workflow_version
      type: str
    prompt: Implement the finalized workflow on the target iPhones.
  design_workflow_layout:
    agent: false
    description: Design the layout of the workflow on iPhones
    name: design_workflow_layout
    nodes_depended_on:
    - define_workflow_objective
    nodes_dependent_on: []
    output_structure:
    - description: Names or identifiers of each screen in the workflow
      key: screen_names
      type: List[str]
    - description: Ordered list of screen names representing the navigation sequence
      key: navigation_flow
      type: List[str]
    - description: A concise description of the overall visual layout and key UI elements
      key: layout_description
      type: str
    - description: Preferred UI theme for the workflow (e.g., light, dark, custom)
      key: theme
      type: str
    - description: Total count of primary UI elements across all screens
      key: element_count
      type: int
    prompt: Sketch the visual arrangement and user interface for the workflow on iPhones.
  identify_required_apps:
    agent: false
    description: Identify the apps required for the workflow on iPhones
    name: identify_required_apps
    nodes_depended_on:
    - define_workflow_objective
    nodes_dependent_on: []
    output_structure:
    - description: List of iPhone app names that are necessary to implement the workflow
      key: required_apps
      type: List[str]
    prompt: List the specific iPhone apps needed to achieve the workflow objective.
  refine_workflow:
    agent: false
    description: Refine the workflow based on test results
    name: refine_workflow
    nodes_depended_on:
    - test_workflow
    nodes_dependent_on: []
    output_structure:
    - description: Identifier of the refined workflow.
      key: workflow_id
      type: str
    - description: List of issue descriptions that were addressed during refinement.
      key: issues_addressed
      type: List[str]
    - description: List of efficiency improvements applied to the workflow.
      key: efficiency_improvements
      type: List[str]
    - description: Indicates whether the refined workflow passed all tests.
      key: test_passed
      type: bool
    prompt: Make adjustments to the workflow to address any issues or inefficiencies
      identified during testing.
  test_workflow:
    agent: false
    description: Test the workflow on iPhones
    name: test_workflow
    nodes_depended_on:
    - create_automation_rules
    nodes_dependent_on: []
    output_structure:
    - description: Whether the workflow executed successfully without errors.
      key: test_passed
      type: bool
    - description: List of error messages encountered during testing.
      key: error_messages
      type: List[str]
    - description: List of workflow step identifiers executed during testing.
      key: steps_executed
      type: List[str]
    - description: Total duration of the test run in seconds.
      key: test_duration_seconds
      type: float
    - description: Brief summary of test results.
      key: test_summary
      type: str
    prompt: Execute the workflow and verify that it functions as intended on iPhones.
