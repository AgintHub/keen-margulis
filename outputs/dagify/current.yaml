dag_type: shim
description: Generated workflow from UI.
name: simple_coffee_workflow
nodes:
  boil_water:
    agent: false
    code_node_type: shim
    description: Simulates heating a supplied liquid (water, milk, tea, etc.) to its
      boiling point, recording the temperature reached, the duration of heating, and
      whether the liquid is ready for use in downstream processes.
    implementation: "from ._boil_water.extract_liquid_type import extract_liquid_type\n\
      from ._boil_water.extract_volume import extract_volume\nfrom ._boil_water.validate_liquid_type\
      \ import validate_liquid_type\nfrom ._boil_water.get_boiling_point import get_boiling_point\n\
      from ._boil_water.get_heat_capacity import get_heat_capacity\nfrom ._boil_water.simulate_heating_process\
      \ import simulate_heating_process\nfrom ._boil_water.check_boiling_status import\
      \ check_boiling_status\n\nfrom pydantic import BaseModel, Field\n\n\nclass BoilWaterOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for boil_water node outputs.\"\"\"\n    boiled: bool\
      \ = (\n        Field(..., description = (\n            \"Whether the water has\
      \ reached the boiling point and is ready for brewing.\")\n        )\n    )\n\
      \    temperature_celsius: float = (\n        Field(..., description = (\n  \
      \          \"Current temperature of the water in degrees Celsius after boiling.\"\
      )\n        )\n    )\n    boil_time_seconds: int = (\n        Field(..., description\
      \ = (\n            \"Duration taken to bring the water to boiling temperature,\
      \ measured in seconds.\")\n        )\n    )\n\n\ndef boil_water(general_input:\
      \ str, **kwargs) -> BoilWaterOutput:\n    \"\"\"\n    Heats a liquid to its\
      \ boiling point and returns the readiness status, final\n    temperature, and\
      \ heating duration.\n\n    Parameters\n    ----------\n    liquid_type : str\n\
      \        Name of the liquid to be boiled (e.g., \"water\", \"milk\", \"tea\"\
      ).\n    volume : float\n        Volume of the liquid in liters.\n\n    Returns\n\
      \    -------\n    dict\n        Dictionary containing `boiled` (bool), `temperature_celsius`\n\
      \        (float), and `boil_time_seconds` (int).\n\n    Raises\n    ------\n\
      \    ValueError\n        Raised if an unsupported liquid type is provided.\n\
      \    RuntimeError\n        Raised if the heating simulation fails to converge\
      \ within realistic\n        limits.\n\n    Examples\n    --------\n    >>> result\
      \ = boil_liquid(liquid_type='water', volume=0.5)\n    >>> print(result)\n  \
      \  {'boiled': True, 'temperature_celsius': 100.0, 'boil_time_seconds': 90}\n\
      \n    \"\"\"\n    liquid_type: str = extract_liquid_type(general_input=general_input,\
      \ kwargs=kwargs)\n    volume: float = extract_volume(general_input=general_input,\
      \ kwargs=kwargs)\n    \n    is_supported: bool = validate_liquid_type(liquid_type=liquid_type)\n\
      \    if not is_supported:\n        raise ValueError(f\"Unsupported liquid type:\
      \ {liquid_type}\")\n    \n    boiling_point: float = get_boiling_point(liquid_type=liquid_type)\n\
      \    heat_capacity: float = get_heat_capacity(liquid_type=liquid_type)\n   \
      \ \n    heating_simulation: dict = simulate_heating_process(\n        volume=volume,\n\
      \        target_temperature=boiling_point,\n        heat_capacity=heat_capacity\n\
      \    )\n    \n    if not heating_simulation.get(\"converged\", False):\n   \
      \     raise RuntimeError(\"Heating simulation failed to converge within realistic\
      \ limits\")\n    \n    final_temperature: float = heating_simulation[\"final_temperature\"\
      ]\n    boil_time: int = heating_simulation[\"time_seconds\"]\n    is_boiled:\
      \ bool = check_boiling_status(temperature=final_temperature, boiling_point=boiling_point)\n\
      \    \n    return BoilWaterOutput(\n        boiled=is_boiled,\n        temperature_celsius=final_temperature,\n\
      \        boil_time_seconds=boil_time\n    )"
    name: boil_water
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Whether the water has reached the boiling point and is ready for
        brewing.
      key: boiled
      type: bool
    - description: Current temperature of the water in degrees Celsius after boiling.
      key: temperature_celsius
      type: float
    - description: Duration taken to bring the water to boiling temperature, measured
        in seconds.
      key: boil_time_seconds
      type: int
    prd:
      conceptual_info: The boil_liquid node is a core thermodynamic simulation step
        that transforms any input liquid into a ready‑to‑use state for brewing, cooking,
        or analytical processes. It abstracts the physics of heating while providing
        measurable metrics that downstream nodes can leverage for timing, quality
        control, and safety checks.
      docstring:
        examples:
        - lines:
          - result = boil_liquid(liquid_type='water', volume=0.5)
          - print(result)
          output: '{''boiled'': True, ''temperature_celsius'': 100.0, ''boil_time_seconds'':
            90}'
        parameters:
        - description: Name of the liquid to be boiled (e.g., "water", "milk", "tea").
          name: liquid_type
          type: str
        - description: Volume of the liquid in liters.
          name: volume
          type: float
        raises:
        - description: Raised if an unsupported liquid type is provided.
          type: ValueError
        - description: Raised if the heating simulation fails to converge within realistic
            limits.
          type: RuntimeError
        returns:
          description: Dictionary containing `boiled` (bool), `temperature_celsius`
            (float), and `boil_time_seconds` (int).
          type: dict
        summary: Heats a liquid to its boiling point and returns the readiness status,
          final temperature, and heating duration.
    prompt: 'Heat the supplied liquid to its boiling point using realistic physical
      properties. The node receives the liquid type and volume via context (e.g.,
      parent nodes provide `liquid_type: str` and `volume: float` in liters). Your
      task is:


      1. Determine the boiling point of the specified liquid.

      2. Simulate the heating process, tracking temperature rise over time.

      3. Record the total time taken to reach boiling, expressed in whole seconds.

      4. Return a Boolean flag indicating the liquid has successfully reached its
      boiling temperature.

      5. Output the final temperature (in °C) and the boiling duration.


      Return only the fields listed in `output_structure`.

      '
    shims:
    - agent: false
      code_node_type: virtual-stub
      description: Extracts the liquid type from a given input string, ignoring any
