dag_type: shim
description: Generated workflow from UI.
name: create_workflow_dag
nodes:
  create_dag_structure:
    agent: false
    code_node_type: shim
    description: Create the DAG structure based on the subtasks and their dependencies.
    implementation: "from ._create_dag_structure.parse_dependency_string import parse_dependency_string\n\
      from ._create_dag_structure.extract_unique_nodes import extract_unique_nodes\n\
      from ._create_dag_structure.format_edges_for_output import format_edges_for_output\n\
      from ._create_dag_structure.detect_cycles_in_graph import detect_cycles_in_graph\n\
      from ._create_dag_structure.find_root_nodes import find_root_nodes\nfrom ._create_dag_structure.validate_dag_structure\
      \ import validate_dag_structure\n\nfrom pydantic import BaseModel, Field\nfrom\
      \ typing import List\n\n\nclass IdentifyDependenciesBetweenSubtasksOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for identify_dependencies_between_subtasks node outputs.\"\
      \"\"\n    dependencies_exist: bool = (\n        Field(..., description=\"Whether\
      \ dependencies exist between subtasks\")\n    )\n    dependency_list: str =\
      \ (\n        Field(..., description = (\n            \"List of dependencies\
      \ between subtasks, where each dependency is represented as 'subtask_id_1 ->\
      \ subtask_id_2'\")\n        )\n    )\n\n\nclass CreateDagStructureOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for create_dag_structure node outputs.\"\"\"\n   \
      \ dag_nodes: List[str] = (\n        Field(..., description=\"List of node names\
      \ in the DAG\")\n    )\n    dag_edges: List[str] = (\n        Field(..., description\
      \ = (\n            \"List of edges in the DAG, represented as 'node1->node2'\"\
      )\n        )\n    )\n    root_nodes: List[str] = (\n        Field(..., description=\"\
      List of root node names in the DAG\")\n    )\n    is_valid_dag: bool = (\n \
      \       Field(..., description=\"Whether the constructed DAG is valid\")\n \
      \   )\n\n\ndef create_dag_structure(identify_dependencies_between_subtasks_input:\
      \ IdentifyDependenciesBetweenSubtasksOutput, **kwargs) -> CreateDagStructureOutput:\n\
      \    \"\"\"\n    Creates a DAG structure based on subtasks and their dependencies.\n\
      \n    Parameters\n    ----------\n    subtasks : List[str]\n        List of\
      \ subtask names.\n    dependencies : List[str]\n        List of dependencies\
      \ between subtasks, where each dependency is\n        represented as 'subtask_id_1\
      \ -> subtask_id_2'.\n\n    Returns\n    -------\n    {dag_nodes: List[str],\
      \ dag_edges: List[str], root_nodes: List[str], is_valid_dag: bool}\n       \
      \ A dictionary containing the DAG nodes, edges, root nodes, and a flag\n   \
      \     indicating whether the DAG is valid.\n\n    Raises\n    ------\n    ValueError\n\
      \        If the dependencies form a cycle, making it impossible to create a\n\
      \        valid DAG.\n\n    Examples\n    --------\n    >>> subtasks = ['A',\
      \ 'B', 'C']\n    >>> dependencies = ['A -> B', 'B -> C']\n    >>> create_dag_structure(subtasks,\
      \ dependencies)\n    {'dag_nodes': ['A', 'B', 'C'], 'dag_edges': ['A->B', 'B->C'],\
      \ 'root_nodes':\n    ['A'], 'is_valid_dag': True}\n\n    \"\"\"\n    parsed_dependencies:\
      \ List[tuple] = parse_dependency_string(dependency_string=identify_dependencies_between_subtasks_input.dependency_list)\n\
      \    \n    all_nodes: List[str] = extract_unique_nodes(dependencies=parsed_dependencies)\n\
      \    \n    formatted_edges: List[str] = format_edges_for_output(dependencies=parsed_dependencies)\n\
      \    \n    has_cycle: bool = detect_cycles_in_graph(nodes=all_nodes, dependencies=parsed_dependencies)\n\
      \    \n    if has_cycle:\n        raise ValueError(\"Dependencies form a cycle,\
      \ making it impossible to create a valid DAG\")\n    \n    root_node_list: List[str]\
      \ = find_root_nodes(nodes=all_nodes, dependencies=parsed_dependencies)\n   \
      \ \n    is_valid: bool = validate_dag_structure(nodes=all_nodes, edges=formatted_edges,\
      \ roots=root_node_list)\n    \n    return CreateDagStructureOutput(\n      \
      \  dag_nodes=all_nodes,\n        dag_edges=formatted_edges,\n        root_nodes=root_node_list,\n\
      \        is_valid_dag=is_valid\n    )"
    name: create_dag_structure
    nodes_depended_on:
    - identify_dependencies_between_subtasks
    nodes_dependent_on: []
    output_structure:
    - description: List of node names in the DAG
      key: dag_nodes
      type: List[str]
    - description: List of edges in the DAG, represented as 'node1->node2'
      key: dag_edges
      type: List[str]
    - description: List of root node names in the DAG
      key: root_nodes
      type: List[str]
    - description: Whether the constructed DAG is valid
      key: is_valid_dag
      type: bool
    prd:
      conceptual_info: Constructs a Directed Acyclic Graph (DAG) from given subtasks
        and their dependencies.
      docstring:
        examples:
        - lines:
          - subtasks = ['A', 'B', 'C']
          - dependencies = ['A -> B', 'B -> C']
          - create_dag_structure(subtasks, dependencies)
          output: '{''dag_nodes'': [''A'', ''B'', ''C''], ''dag_edges'': [''A->B'',
            ''B->C''], ''root_nodes'': [''A''], ''is_valid_dag'': True}'
        parameters:
        - description: List of subtask names.
          name: subtasks
          type: List[str]
        - description: List of dependencies between subtasks, where each dependency
            is represented as 'subtask_id_1 -> subtask_id_2'.
          name: dependencies
          type: List[str]
        raises:
        - description: If the dependencies form a cycle, making it impossible to create
            a valid DAG.
          type: ValueError
        returns:
          description: A dictionary containing the DAG nodes, edges, root nodes, and
            a flag indicating whether the DAG is valid.
          type: '{dag_nodes: List[str], dag_edges: List[str], root_nodes: List[str],
            is_valid_dag: bool}'
        summary: Creates a DAG structure based on subtasks and their dependencies.
    prompt: Using the subtasks and their dependencies, construct a Directed Acyclic
      Graph (DAG) that represents the workflow.
    shims:
    - agent: false
      code_node_type: virtual-stub
      description: Parses a dependency string into a list of tuples representing the
        dependencies.
      implementation: "from typing import List\n\n\ndef parse_dependency_string(dependency_string:\
        \ str) -> List[str]:\n    \"\"\"\n    Parses a dependency string into a list\
        \ of tuples representing the\n    dependencies.\n\n    Parameters\n    ----------\n\
        \    dependency_string : str\n        Input string representing the dependencies,\
        \ where each dependency is\n        represented as 'subtask_id_1 -> subtask_id_2'.\n\
        \n    Returns\n    -------\n    List[tuple]\n        List of tuples representing\
        \ the dependencies, where each tuple\n        contains two strings representing\
        \ the dependent and independent\n        tasks.\n\n    Raises\n    ------\n\
        \    ValueError\n        When the input string is not in the correct format.\n\
        \    TypeError\n        When the input is not a string.\n\n    Examples\n\
        \    --------\n    >>> parse_dependency_string('A -> B, C -> D')\n    [('A',\
        \ 'B'), ('C', 'D')]\n\n    >>> parse_dependency_string('E -> F, G -> H, I\
        \ -> J')\n    [('E', 'F'), ('G', 'H'), ('I', 'J')]\n\n    \"\"\"\n    raise\
        \ NotImplementedError(\"This is a virtual stub node that needs to be implemented\"\
        )"
      name: parse_dependency_string
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[tuple]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: dependency_string
        type: str
      prd:
        conceptual_info: The parse_dependency_string shim function takes a string
          representing dependencies between tasks and parses it into a structured
          format that can be used for further processing.
        docstring:
          examples:
          - lines:
            - parse_dependency_string('A -> B, C -> D')
            output: '[(''A'', ''B''), (''C'', ''D'')]'
          - lines:
            - parse_dependency_string('E -> F, G -> H, I -> J')
            output: '[(''E'', ''F''), (''G'', ''H''), (''I'', ''J'')]'
          parameters:
          - description: Input string representing the dependencies, where each dependency
              is represented as 'subtask_id_1 -> subtask_id_2'.
            name: dependency_string
            type: str
          raises:
          - description: When the input string is not in the correct format.
            type: ValueError
          - description: When the input is not a string.
            type: TypeError
          returns:
            description: List of tuples representing the dependencies, where each
              tuple contains two strings representing the dependent and independent
              tasks.
            type: List[tuple]
          summary: Parses a dependency string into a list of tuples representing the
            dependencies.
      prompt: Parse a dependency string into a list of tuples
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Extracts a list of unique nodes from a given set of dependencies.
      implementation: "from typing import List\n\n\ndef extract_unique_nodes(dependencies:\
        \ str) -> List[str]:\n    \"\"\"\n    Extracts a list of unique nodes from\
        \ a given set of dependencies.\n\n    Parameters\n    ----------\n    dependencies\
        \ : List[tuple]\n        A list of tuples, where each tuple represents a dependency\
        \ between\n        two nodes.\n\n    Returns\n    -------\n    List[str]\n\
        \        A list of unique node names extracted from the dependencies.\n\n\
        \    Raises\n    ------\n    TypeError\n        When the input dependencies\
        \ are not in the expected format.\n    ValueError\n        When the input\
        \ dependencies are invalid or malformed.\n\n    Examples\n    --------\n \
        \   >>> dependencies = [('A', 'B'), ('B', 'C'), ('A', 'C')]\n    >>> extract_unique_nodes(dependencies=dependencies)\n\
        \    ['A', 'B', 'C']\n\n    >>> dependencies = [('Node1', 'Node2'), ('Node2',\
        \ 'Node3'), ('Node1',\n    'Node3')]\n    >>> extract_unique_nodes(dependencies=dependencies)\n\
        \    ['Node1', 'Node2', 'Node3']\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: extract_unique_nodes
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: dependencies
        type: str
      prd:
        conceptual_info: The extract_unique_nodes shim function takes a set of dependencies
          as input and returns a list of unique nodes present in those dependencies.
        docstring:
          examples:
          - lines:
            - dependencies = [('A', 'B'), ('B', 'C'), ('A', 'C')]
            - extract_unique_nodes(dependencies=dependencies)
            output: '[''A'', ''B'', ''C'']'
          - lines:
            - dependencies = [('Node1', 'Node2'), ('Node2', 'Node3'), ('Node1', 'Node3')]
            - extract_unique_nodes(dependencies=dependencies)
            output: '[''Node1'', ''Node2'', ''Node3'']'
          parameters:
          - description: A list of tuples, where each tuple represents a dependency
              between two nodes.
            name: dependencies
            type: List[tuple]
          raises:
          - description: When the input dependencies are not in the expected format.
            type: TypeError
          - description: When the input dependencies are invalid or malformed.
            type: ValueError
          returns:
            description: A list of unique node names extracted from the dependencies.
            type: List[str]
          summary: Extracts a list of unique nodes from a given set of dependencies.
      prompt: Extract unique nodes from dependencies
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Formats a list of parsed dependencies into a list of strings representing
        edges in a DAG.
      implementation: "from typing import List\n\n\ndef format_edges_for_output(dependencies:\
        \ str) -> List[str]:\n    \"\"\"\n    Formats a list of parsed dependencies\
        \ into a list of strings representing\n    edges in a DAG.\n\n    Parameters\n\
        \    ----------\n    dependencies : str\n        A string representation of\
        \ a list of parsed dependencies, where each\n        dependency is a tuple\
        \ of two node names.\n\n    Returns\n    -------\n    List[str]\n        A\
        \ list of strings representing edges in a DAG, where each edge is in\n   \
        \     the format 'node1->node2'.\n\n    Raises\n    ------\n    ValueError\n\
        \        When the input dependencies are invalid or malformed.\n    TypeError\n\
        \        When the input dependencies are not of the correct type.\n\n    Examples\n\
        \    --------\n    >>> format_edges_for_output(dependencies=[('A', 'B'), ('B',\
        \ 'C')])\n    ['A->B', 'B->C']\n\n    >>> format_edges_for_output(dependencies=[('D',\
        \ 'E'), ('E', 'F')])\n    ['D->E', 'E->F']\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: format_edges_for_output
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: dependencies
        type: str
      prd:
        conceptual_info: The format_edges_for_output shim function takes a list of
          parsed dependencies and formats them into a list of strings representing
          edges in a DAG. This is necessary to provide a standardized output format
          for the create_dag_structure function.
        docstring:
          examples:
          - lines:
            - format_edges_for_output(dependencies=[('A', 'B'), ('B', 'C')])
            output: '[''A->B'', ''B->C'']'
          - lines:
            - format_edges_for_output(dependencies=[('D', 'E'), ('E', 'F')])
            output: '[''D->E'', ''E->F'']'
          parameters:
          - description: A string representation of a list of parsed dependencies,
              where each dependency is a tuple of two node names.
            name: dependencies
            type: str
          raises:
          - description: When the input dependencies are invalid or malformed.
            type: ValueError
          - description: When the input dependencies are not of the correct type.
            type: TypeError
          returns:
            description: A list of strings representing edges in a DAG, where each
              edge is in the format 'node1->node2'.
            type: List[str]
          summary: Formats a list of parsed dependencies into a list of strings representing
            edges in a DAG.
      prompt: Format edges for output
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: This shim detects whether a cycle exists in a graph represented
        by a list of nodes and their dependencies.
      implementation: "def detect_cycles_in_graph(nodes: str, dependencies: str) ->\
        \ bool:\n    \"\"\"\n    Detects whether a cycle exists in a graph given its\
        \ nodes and dependencies.\n\n    Parameters\n    ----------\n    nodes : List[str]\n\
        \        List of node names in the graph.\n    dependencies : List[tuple]\n\
        \        List of dependencies where each dependency is a tuple of two node\n\
        \        names (node1, node2) indicating node1 -> node2.\n\n    Returns\n\
        \    -------\n    bool\n        True if a cycle is detected in the graph,\
        \ False otherwise.\n\n    Raises\n    ------\n    ValueError\n        If the\
        \ input graph structure is invalid (e.g., a node references a\n        non-existent\
        \ node).\n    TypeError\n        If the input types do not match the expected\
        \ types (list of str for\n        nodes and list of tuples for dependencies).\n\
        \n    Examples\n    --------\n    >>> detect_cycles_in_graph(['A', 'B', 'C'],\
        \ [('A', 'B'), ('B', 'C')])\n    False\n\n    >>> detect_cycles_in_graph(['A',\
        \ 'B', 'C'], [('A', 'B'), ('B', 'C'), ('C',\n    'A')])\n    True\n\n    \"\
        \"\"\n    raise NotImplementedError(\"This is a virtual stub node that needs\
        \ to be implemented\")"
      name: detect_cycles_in_graph
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type bool
        key: output
        type: bool
      - description: Input parameter of type str
        key: nodes
        type: str
      - description: Input parameter of type str
        key: dependencies
        type: str
      prd:
        conceptual_info: The detect_cycles_in_graph shim is crucial for validating
          the structure of a Directed Acyclic Graph (DAG), ensuring it does not contain
          cycles which would prevent a valid topological sorting.
        docstring:
          examples:
          - lines:
            - detect_cycles_in_graph(['A', 'B', 'C'], [('A', 'B'), ('B', 'C')])
            output: 'False'
          - lines:
            - detect_cycles_in_graph(['A', 'B', 'C'], [('A', 'B'), ('B', 'C'), ('C',
              'A')])
            output: 'True'
          parameters:
          - description: List of node names in the graph.
            name: nodes
            type: List[str]
          - description: List of dependencies where each dependency is a tuple of
              two node names (node1, node2) indicating node1 -> node2.
            name: dependencies
            type: List[tuple]
          raises:
          - description: If the input graph structure is invalid (e.g., a node references
              a non-existent node).
            type: ValueError
          - description: If the input types do not match the expected types (list
              of str for nodes and list of tuples for dependencies).
            type: TypeError
          returns:
            description: True if a cycle is detected in the graph, False otherwise.
            type: bool
          summary: Detects whether a cycle exists in a graph given its nodes and dependencies.
      prompt: Implement a function to detect cycles in a graph given its nodes and
        dependencies.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: This shim identifies the root nodes in a directed acyclic graph
        (DAG) given its nodes and dependencies.
      implementation: "from typing import List\n\n\ndef find_root_nodes(nodes: str,\
        \ dependencies: str) -> List[str]:\n    \"\"\"\n    Finds the root nodes in\
        \ a DAG given its nodes and dependencies.\n\n    Parameters\n    ----------\n\
        \    nodes : List[str]\n        A list of node names in the DAG.\n    dependencies\
        \ : List[tuple]\n        A list of dependencies between nodes, where each\
        \ dependency is a\n        tuple of two node names.\n\n    Returns\n    -------\n\
        \    List[str]\n        A list of root node names in the DAG.\n\n    Raises\n\
        \    ------\n    ValueError\n        If the input nodes or dependencies are\
        \ invalid (e.g., a node has no\n        dependencies but is not a root node).\n\
        \    TypeError\n        If the input types are incorrect (e.g., nodes is not\
        \ a list of\n        strings, dependencies is not a list of tuples).\n\n \
        \   Examples\n    --------\n    >>> nodes = ['A', 'B', 'C']\n    >>> dependencies\
        \ = [('A', 'B'), ('B', 'C')]\n    >>> root_nodes = find_root_nodes(nodes,\
        \ dependencies)\n    ['A']\n\n    >>> nodes = ['X', 'Y', 'Z']\n    >>> dependencies\
        \ = [('X', 'Y'), ('Y', 'Z'), ('Z', 'X')]\n    >>> try:\n    ...     root_nodes\
        \ = find_root_nodes(nodes, dependencies)\n    >>> except ValueError as e:\n\
        \    ...     print(e)\n    Dependencies form a cycle, making it impossible\
        \ to create a valid DAG\n\n    \"\"\"\n    raise NotImplementedError(\"This\
        \ is a virtual stub node that needs to be implemented\")"
      name: find_root_nodes
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: nodes
        type: str
      - description: Input parameter of type str
        key: dependencies
        type: str
      prd:
        conceptual_info: The find_root_nodes shim is crucial for constructing a valid
          DAG by identifying nodes with no incoming edges, which are the starting
          points of the graph.
        docstring:
          examples:
          - lines:
            - nodes = ['A', 'B', 'C']
            - dependencies = [('A', 'B'), ('B', 'C')]
            - root_nodes = find_root_nodes(nodes, dependencies)
            output: '[''A'']'
          - lines:
            - nodes = ['X', 'Y', 'Z']
            - dependencies = [('X', 'Y'), ('Y', 'Z'), ('Z', 'X')]
            - 'try:'
            - '    root_nodes = find_root_nodes(nodes, dependencies)'
            - 'except ValueError as e:'
            - '    print(e)'
            output: Dependencies form a cycle, making it impossible to create a valid
              DAG
          parameters:
          - description: A list of node names in the DAG.
            name: nodes
            type: List[str]
          - description: A list of dependencies between nodes, where each dependency
              is a tuple of two node names.
            name: dependencies
            type: List[tuple]
          raises:
          - description: If the input nodes or dependencies are invalid (e.g., a node
              has no dependencies but is not a root node).
            type: ValueError
          - description: If the input types are incorrect (e.g., nodes is not a list
              of strings, dependencies is not a list of tuples).
            type: TypeError
          returns:
            description: A list of root node names in the DAG.
            type: List[str]
          summary: Finds the root nodes in a DAG given its nodes and dependencies.
      prompt: Implement a function to find the root nodes in a DAG.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Validates the structure of a Directed Acyclic Graph (DAG) given
        its nodes, edges, and root nodes.
      implementation: "def validate_dag_structure(nodes: str, edges: str, roots: str)\
        \ -> bool:\n    \"\"\"\n    Validates the structure of a Directed Acyclic\
        \ Graph (DAG) given its nodes,\n    edges, and root nodes.\n\n    Parameters\n\
        \    ----------\n    nodes : str\n        A string of comma-separated node\
        \ names in the DAG\n    edges : str\n        A string of comma-separated edges\
        \ in the DAG, represented as\n        'node1->node2'\n    roots : str\n  \
        \      A string of comma-separated root node names in the DAG\n\n    Returns\n\
        \    -------\n    bool\n        True if the DAG structure is valid, False\
        \ otherwise\n\n    Raises\n    ------\n    ValueError\n        When input\
        \ validation fails\n    TypeError\n        When input types are incorrect\n\
        \n    Examples\n    --------\n    >>> validate_dag_structure(nodes='A,B,C',\
        \ edges='A->B,B->C', roots='A')\n    True\n\n    >>> validate_dag_structure(nodes='A,B,C',\
        \ edges='A->B,B->C,A->C', roots='A')\n    False\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: validate_dag_structure
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type bool
        key: output
        type: bool
      - description: Input parameter of type str
        key: nodes
        type: str
      - description: Input parameter of type str
        key: edges
        type: str
      - description: Input parameter of type str
        key: roots
        type: str
      prd:
        conceptual_info: The validate_dag_structure shim function checks if a given
          DAG structure, represented by its nodes, edges, and root nodes, is valid.
          A valid DAG should not contain cycles and should have at least one root
          node.
        docstring:
          examples:
          - lines:
            - validate_dag_structure(nodes='A,B,C', edges='A->B,B->C', roots='A')
            output: 'True'
          - lines:
            - validate_dag_structure(nodes='A,B,C', edges='A->B,B->C,A->C', roots='A')
            output: 'False'
          parameters:
          - description: A string of comma-separated node names in the DAG
            name: nodes
            type: str
          - description: A string of comma-separated edges in the DAG, represented
              as 'node1->node2'
            name: edges
            type: str
          - description: A string of comma-separated root node names in the DAG
            name: roots
            type: str
          raises:
          - description: When input validation fails
            type: ValueError
          - description: When input types are incorrect
            type: TypeError
          returns:
            description: True if the DAG structure is valid, False otherwise
            type: bool
          summary: Validates the structure of a Directed Acyclic Graph (DAG) given
            its nodes, edges, and root nodes.
      prompt: Implement validate_dag_structure to verify if a given DAG structure
        is valid
      shims: []
  decompose_task_into_subtasks:
    agent: false
    code_node_type: shim
    description: Decompose the task into smaller components that can be executed concurrently
      or sequentially.
    implementation: "from ._decompose_task_into_subtasks.validate_input_not_empty\
      \ import validate_input_not_empty\nfrom ._decompose_task_into_subtasks.analyze_task_structure\
      \ import analyze_task_structure\nfrom ._decompose_task_into_subtasks.generate_subtask_list\
      \ import generate_subtask_list\nfrom ._decompose_task_into_subtasks.determine_sequencing_requirements\
      \ import determine_sequencing_requirements\n\nfrom pydantic import BaseModel,\
      \ Field\nfrom typing import List\n\n\nclass DefineTaskObjectiveOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for define_task_objective node outputs.\"\"\"\n  \
