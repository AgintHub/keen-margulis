    agent: false
    code_node_type: shim
    description: Finalize the workflow DAG
    implementation: "from ._finalize_workflow.parse_cycles_from_string import parse_cycles_from_string\n\
      from ._finalize_workflow.parse_missing_dependencies_from_string import parse_missing_dependencies_from_string\n\
      from ._finalize_workflow.remove_cycles_from_dag import remove_cycles_from_dag\n\
      from ._finalize_workflow.generate_cycle_removal_warnings import generate_cycle_removal_warnings\n\
      from ._finalize_workflow.resolve_missing_dependencies import resolve_missing_dependencies\n\
      from ._finalize_workflow.generate_dependency_warnings import generate_dependency_warnings\n\
      from ._finalize_workflow.topological_sort_tasks import topological_sort_tasks\n\
      from ._finalize_workflow.generate_dag_representation import generate_dag_representation\n\
      from ._finalize_workflow.check_final_dag_validity import check_final_dag_validity\n\
      from ._finalize_workflow.generate_summary import generate_summary\nfrom ._finalize_workflow.serialize_task_list\
      \ import serialize_task_list\nfrom ._finalize_workflow.serialize_dependencies_list\
      \ import serialize_dependencies_list\nfrom ._finalize_workflow.serialize_cycles_list\
      \ import serialize_cycles_list\nfrom ._finalize_workflow.serialize_warnings_list\
      \ import serialize_warnings_list\n\nfrom pydantic import BaseModel, Field\n\n\
      \nclass ValidateDagOutput(BaseModel):\n    \"\"\"Pydantic model for validate_dag\
      \ node outputs.\"\"\"\n    is_valid: bool = (\n        Field(..., description\
      \ = (\n            \"Indicates whether the DAG passes all validation checks.\"\
      )\n        )\n    )\n    node_count: int = (\n        Field(..., description=\"\
      Total number of nodes present in the DAG.\")\n    )\n    edge_count: int = (\n\
      \        Field(..., description=\"Total number of directed edges in the DAG.\"\
      )\n    )\n    cycles_detected: str = (\n        Field(..., description = (\n\
      \            \"List of cycle identifiers or descriptions found in the DAG (empty\
      \ if none).\")\n        )\n    )\n    missing_dependencies: str = (\n      \
      \  Field(..., description = (\n            \"List of node names that reference\
      \ non\\u2011existent dependencies (empty if none).\")\n        )\n    )\n  \
      \  errors: str = (\n        Field(..., description = (\n            \"Detailed\
      \ error messages for any validation failures.\")\n        )\n    )\n\n\nclass\
      \ FinalizeWorkflowOutput(BaseModel):\n    \"\"\"Pydantic model for finalize_workflow\
      \ node outputs.\"\"\"\n    dag_representation: str = (\n        Field(..., description\
      \ = (\n            \"String representation of the finalized DAG, e.g., serialized\
      \ adjacency list or other format.\")\n        )\n    )\n    is_valid: bool =\
      \ (\n        Field(..., description = (\n            \"Whether the finalized\
      \ DAG is valid and acyclic.\")\n        )\n    )\n    adjustments_made: bool\
      \ = (\n        Field(..., description = (\n            \"Whether any adjustments\
      \ were made to the DAG during finalization.\")\n        )\n    )\n    adjusted_task_order:\
      \ str = (\n        Field(..., description = (\n            \"Ordered list of\
      \ task identifiers in the finalized DAG.\")\n        )\n    )\n    missing_dependencies:\
      \ str = (\n        Field(..., description = (\n            \"List of task identifiers\
      \ that have missing or unresolved dependencies.\")\n        )\n    )\n    cycles_detected:\
      \ str = (\n        Field(..., description=\"List of detected cycles in the DAG,\
      \ if any.\")\n    )\n    warnings: str = (\n        Field(..., description=\"\
      Any warnings or notes about potential issues.\")\n    )\n    summary: str =\
      \ (\n        Field(..., description = (\n            \"Short textual summary\
      \ of the finalized workflow.\")\n        )\n    )\n\n\ndef finalize_workflow(validate_dag_input:\
      \ ValidateDagOutput, **kwargs) -> FinalizeWorkflowOutput:\n    \"\"\"\n    Finalize\
      \ a workflow DAG by validating its structure, resolving missing\n    dependencies,\
      \ removing cycles, and ordering tasks.\n\n    Parameters\n    ----------\n \
      \   task_ids : List[str]\n        Unique identifiers of all tasks in the DAG.\n\
      \    edge_sources : List[str]\n        Source task identifiers for each directed\
      \ edge.\n    edge_destinations : List[str]\n        Destination task identifiers\
      \ for each directed edge.\n    is_valid : bool\n        Result of the validation\
      \ step (True if the DAG passed all checks).\n    node_count : int\n        Total\
      \ number of nodes in the DAG.\n    edge_count : int\n        Total number of\
      \ directed edges in the DAG.\n    cycles_detected : List[str]\n        List\
      \ of cycle identifiers found during validation.\n    missing_dependencies :\
      \ List[str]\n        List of node names that reference non‑existent dependencies.\n\
      \    errors : List[str]\n        Detailed error messages from the validation\
      \ step.\n\n    Returns\n    -------\n    Dict[str, Any]\n        A dictionary\
      \ containing the finalized DAG representation and\n        metadata: dag_representation\
      \ (str), is_valid (bool),\n        adjustments_made (bool), adjusted_task_order\
      \ (List[str]),\n        missing_dependencies (List[str]), cycles_detected (List[str]),\n\
      \        warnings (List[str]), and summary (str).\n\n    Raises\n    ------\n\
      \    ValueError\n        If any required input lists are empty or lengths of\
      \ edge_sources and\n        edge_destinations mismatch.\n\n    Examples\n  \
      \  --------\n    >>> dag = finalize_workflow(\n\n    ...     task_ids=['A',\
      \ 'B', 'C'],\n\n    ...     edge_sources=['A', 'B'],\n\n    ...     edge_destinations=['B',\
      \ 'C'],\n\n    ...     is_valid=True,\n\n    ...     node_count=3,\n\n    ...\
      \     edge_count=2,\n\n    ...     cycles_detected=[],\n\n    ...     missing_dependencies=[],\n\
      \n    ...     errors=[]\n\n    >>> )\n    {'dag_representation': 'A -> B ->\
      \ C', 'is_valid': True, 'adjustments_made':\n    False, 'adjusted_task_order':\
      \ ['A', 'B', 'C'], 'missing_dependencies': [],\n    'cycles_detected': [], 'warnings':\
      \ [], 'summary': 'DAG finalized\n    successfully.'}\n\n    >>> dag = finalize_workflow(\n\
      \n    ...     task_ids=['A', 'B', 'C'],\n\n    ...     edge_sources=['A', 'B',\
      \ 'C'],\n\n    ...     edge_destinations=['B', 'C', 'A'],\n\n    ...     is_valid=False,\n\
      \n    ...     node_count=3,\n\n    ...     edge_count=3,\n\n    ...     cycles_detected=['A->B->C->A'],\n\
      \n    ...     missing_dependencies=[],\n\n    ...     errors=['Cycle detected']\n\
      \n    >>> )\n    {'dag_representation': 'A -> B -> C', 'is_valid': False, 'adjustments_made':\n\
      \    True, 'adjusted_task_order': ['A', 'B', 'C'], 'missing_dependencies': [],\n\
      \    'cycles_detected': ['A->B->C->A'], 'warnings': ['Cycle removed:\n    A->B->C->A'],\
      \ 'summary': 'DAG finalized with cycle removal.'}\n\n    \"\"\"\n    parsed_cycles:\
      \ list = parse_cycles_from_string(cycles_str=validate_dag_input.cycles_detected)\n\
      \    parsed_missing_deps: list = parse_missing_dependencies_from_string(deps_str=validate_dag_input.missing_dependencies)\n\
      \    \n    adjustments_made: bool = False\n    warnings: list = []\n    \n \
      \   if not validate_dag_input.is_valid:\n        if parsed_cycles:\n       \
      \     remove_cycles_from_dag(cycles=parsed_cycles)\n            warnings.extend(generate_cycle_removal_warnings(cycles=parsed_cycles))\n\
      \            adjustments_made = True\n        \n        if parsed_missing_deps:\n\
      \            resolve_missing_dependencies(missing_deps=parsed_missing_deps)\n\
      \            warnings.extend(generate_dependency_warnings(missing_deps=parsed_missing_deps))\n\
      \            adjustments_made = True\n    \n    ordered_tasks: list = topological_sort_tasks(node_count=validate_dag_input.node_count,\
      \ edge_count=validate_dag_input.edge_count)\n    dag_representation: str = generate_dag_representation(task_order=ordered_tasks)\n\
      \    final_validity: bool = check_final_dag_validity(is_originally_valid=validate_dag_input.is_valid,\
      \ adjustments_made=adjustments_made)\n    summary: str = generate_summary(is_valid=final_validity,\
      \ adjustments_made=adjustments_made, cycles_removed=bool(parsed_cycles))\n \
      \   \n    return FinalizeWorkflowOutput(\n        dag_representation=dag_representation,\n\
      \        is_valid=final_validity,\n        adjustments_made=adjustments_made,\n\
      \        adjusted_task_order=serialize_task_list(tasks=ordered_tasks),\n   \
      \     missing_dependencies=serialize_dependencies_list(deps=parsed_missing_deps),\n\
      \        cycles_detected=serialize_cycles_list(cycles=parsed_cycles),\n    \
      \    warnings=serialize_warnings_list(warnings=warnings),\n        summary=summary\n\
      \    )"
    name: finalize_workflow
    nodes_depended_on:
    - validate_dag
