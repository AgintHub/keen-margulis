dag_type: plain_text
description: Generated workflow from UI.
name: Generated Workflow from UI
nodes:
  define_rules_and_dynamics:
    agent: false
    description: Specify the rules and dynamics that govern the behavior of the world
      model.
    name: define_rules_and_dynamics
    nodes_depended_on:
    - establish_concept_relationships
    nodes_dependent_on: []
    prompt: Outline the laws, principles, or rules that dictate how the concepts and
      their relationships evolve over time.
  define_world_boundaries:
    agent: false
    description: Establish the spatial and temporal limits of the world model.
    name: define_world_boundaries
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Specify the geographical or spatial extent and the time period covered
      by the world model.
  establish_concept_relationships:
    agent: false
    description: Define how the identified concepts interact or relate to each other.
    name: establish_concept_relationships
    nodes_depended_on:
    - identify_basic_concepts
    nodes_dependent_on: []
    prompt: Describe the relationships between the concepts, including any hierarchies,
      associations, or causal links.
  identify_basic_concepts:
    agent: false
    description: Determine the fundamental entities and concepts that exist within
      the world model.
    name: identify_basic_concepts
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: List the primary objects, agents, or concepts that are present in the
      world model.
  initialize_model_state:
    agent: false
    description: Set the initial conditions or state of the world model.
    name: initialize_model_state
    nodes_depended_on:
    - define_rules_and_dynamics
    nodes_dependent_on: []
    prompt: Describe the initial state of the world model, including any relevant
      parameters or settings.
  refine_model_details:
    agent: false
    description: Add additional details or refine existing aspects of the world model.
    name: refine_model_details
    nodes_depended_on:
    - validate_model_consistency
    nodes_dependent_on: []
    prompt: Enhance the world model by adding more specific details, examples, or
      scenarios that illustrate its operation.
  validate_model_consistency:
    agent: false
    description: Check the world model for internal consistency and coherence.
    name: validate_model_consistency
    nodes_depended_on:
    - initialize_model_state
    nodes_dependent_on: []
    prompt: Verify that the world model's concepts, relationships, rules, and initial
      state are logically consistent and coherent.
