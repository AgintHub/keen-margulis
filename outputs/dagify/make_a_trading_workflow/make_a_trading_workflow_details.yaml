dag_type: spec
description: Generated workflow from UI.
name: make_a_trading_workflow
nodes:
  backtest_trading_system:
    agent: false
    description: Evaluate the trading system using historical data
    name: backtest_trading_system
    nodes_depended_on:
    - build_technical_indicators
    - determine_asset_class
    - select_market_data_source
    nodes_dependent_on: []
    output_structure:
    - description: Overall performance of the trading system based on historical data
      key: backtested_performance
      type: str
    - description: Value of the Sharpe ratio indicating the system's risk-reward profile
      key: sharpe_ratio
      type: float
    - description: Maximum value of the drawdown experienced by the system
      key: max_drawdown
      type: float
    - description: Average return on investment (ROI) for the trading system
      key: return_on_investment
      type: float
    prd:
      bullets:
      - complexity: MEDIUM
        impact: MEDIUM
        method: Use the API provided by the market data source to fetch historical
          data.
        reason: This data will be used for backtesting the trading system
        text: Retrieve historical market data for the trading system using the selected
          market data source.
      - complexity: HIGH
        impact: HIGH
        method: Use a Python library such as Pandas to calculate the technical indicators.
        reason: This will provide valuable insights into the market data.
        text: Calculate the technical indicators for the historical market data using
          the formulas specified in the technical indicators node.
      - complexity: HIGH
        impact: HIGH
        method: Use a Python library such as Backtrader to backtest the trading system.
        reason: This will help evaluate the trading system's performance and identify
          potential pitfalls.
        text: Backtest the trading system using the historical market data and calculate
          the backtested performance metrics such as Sharpe ratio, max drawdown, and
          return on investment.
    prompt: Backtest the trading system using historical data to evaluate its performance
      and identify potential pitfalls. Analyze metrics such as return on investment,
      Sharpe ratio, and drawdown.
  build_technical_indicators:
    agent: false
    description: Create technical indicators for analysis
    name: build_technical_indicators
    nodes_depended_on:
    - select_market_data_source
    nodes_dependent_on: []
    output_structure:
    - description: List of names of the technical indicators created
      key: indicator_names
      type: List[str]
    - description: List of formulas used to calculate the technical indicators
      key: indicator_formulas
      type: List[str]
    - description: List of values for each technical indicator
      key: indicator_values
      type: List[float]
    prd:
      bullets: []
    prompt: 'Develop a set of technical indicators to analyze market data and make
      informed trading decisions.

      Examples include moving averages, RSI, Bollinger Bands, and MACD.'
  create_trading_interface:
    agent: false
    description: Develop a user interface for trading
    name: create_trading_interface
    nodes_depended_on:
    - set_trading_rules
    nodes_dependent_on: []
    output_structure:
    - description: Name of the trading interface
      key: trading_interface_name
      type: str
    - description: List of features included in the trading interface
      key: interface_features
      type: str
    - description: Description of trade management capabilities
      key: trade_management_capabilities
      type: str
    - description: Description of market data visualization
      key: market_data_visualization
      type: str
    - description: Description of performance analysis tool
      key: performance_analysis_tool
      type: str
    prd:
      bullets:
      - complexity: LOW
        impact: MEDIUM
        method: Use the get_trading_rules() method from the set_trading_rules node
        reason: This will allow us to establish the trading rules for the system.
        text: Get the output from the parent node set_trading_rules by using the API
          call get_trading_rules().
      - complexity: LOW
        impact: MEDIUM
        method: Use the ExtractValuesFromDict() method from the utils library
        reason: This will allow us to use these values in subsequent steps.
        text: Extract the trading rules, stop_loss_levels, and take_profit_levels
          from the output and store them in a dictionary.
      - complexity: MEDIUM
        impact: HIGH
        method: Use the CreateOutputDict() method from the utils library
        reason: This will allow us to create the output structure for this node.
        text: Create a new dictionary with keys 'trading_interface_name', 'interface_features',
          'trade_management_capabilities', 'market_data_visualization', and 'performance_analysis_tool'.
      - complexity: MEDIUM
        impact: HIGH
        method: Use the PopulateOutputDict() method from the utils library
        reason: This will allow us to create the final output for this node.
        text: Populate the output dictionary with the extracted values from the parent
          node and the newly created values.
    prompt: Create a user interface for trading, including features for managing trades,
      viewing market data, and analyzing performance.
  create_trading_model:
    agent: false
    description: Develop a trading model to make predictions
    name: create_trading_model
    nodes_depended_on:
    - build_technical_indicators
    nodes_dependent_on: []
    output_structure:
    - description: Name of the trading model used
      key: trading_model
      type: str
    - description: Machine learning algorithm used in the trading model
      key: algorithm_used
      type: str
    - description: List of performance metrics for the trading model (e.g. accuracy,
        precision, recall)
      key: performance_metrics
      type: float
    - description: List of predictions made by the trading model
      key: predictions
      type: str
    prd:
      bullets: []
    prompt: Create a trading model using machine learning techniques to make predictions
      based on technical indicators and market data. Options include linear regression,
      decision trees, random forests, and neural networks.
  determine_asset_class:
    agent: false
    description: Choose the asset class to trade
    name: determine_asset_class
    nodes_depended_on:
    - identify_trading_strategy
    nodes_dependent_on: []
    output_structure:
    - description: The selected asset class (e.g. stocks, bonds, currencies, indices,
        or commodities)
      key: selected_asset_class
      type: str
    - description: A measure of the model's confidence in the selected asset class,
        ranging from 0 to 1
      key: confidence_level
      type: float
    - description: A brief explanation of why the selected asset class was chosen
      key: asset_class_rationale
      type: str
    prd:
      bullets: []
    prompt: Select the asset class to trade based on the chosen strategy and market
      conditions. Options include stocks, bonds, currencies, indices, and commodities.
  identify_trading_strategy:
    agent: false
    description: Choose a suitable trading strategy
    name: identify_trading_strategy
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Selected trading strategy (day trading, swing trading, position
        trading, or scalping)
      key: selected_strategy
      type: str
    - description: Description of the selected trading strategy
      key: strategy_description
      type: str
    - description: Recommended leverage level for the selected trading strategy
      key: recommended_leverage
      type: float
    - description: Risk tolerance rating for the selected trading strategy, ranging
        from 0 to 1
      key: risk_tolerance_rating
      type: float
    prd:
      bullets: []
    prompt: Select a trading strategy that aligns with the investment goals and risk
      tolerance. Options include day trading, swing trading, position trading, and
      scalping.
  launch_trading_system:
    agent: false
    description: Deploy the trading system in a live environment
    name: launch_trading_system
    nodes_depended_on:
    - test_trading_system
    nodes_dependent_on: []
    output_structure:
    - description: The status of the deployed trading system
      key: system_status
      type: str
    - description: List of URLs for exchange and market data connections
      key: connection_urls
      type: List[str]
    - description: Whether the trading interface is available for use
      key: trading_interface_availability
      type: bool
    - description: The time it took to deploy the trading system
      key: deployment_time
      type: float
    prd:
      bullets: []
    prompt: Deploy the trading system in a live environment, including connection
      to exchanges, market data sources, and trading interfaces.
  select_market_data_source:
    agent: false
    description: Choose a reliable market data source
    name: select_market_data_source
    nodes_depended_on:
    - determine_asset_class
    nodes_dependent_on: []
    output_structure:
    - description: The chosen market data source
      key: selected_source
      type: str
    - description: The estimated accuracy of the market data
      key: data_accuracy
      type: float
    - description: The estimated latency of the market data
      key: data_latency
      type: float
    - description: The estimated coverage of the market data
      key: data_coverage
      type: float
    prd:
      bullets: []
    prompt: Select a reliable market data source to obtain real-time prices and quotes.
  set_trading_rules:
    agent: false
    description: Establish trading rules for the system
    name: set_trading_rules
    nodes_depended_on:
    - create_trading_model
    - backtest_trading_system
    nodes_dependent_on: []
    output_structure:
    - description: Description of the trading rules established
      key: trading_rules
      type: str
    - description: List of stop-loss levels for each trade
      key: stop_loss_levels
      type: int
    - description: List of take-profit levels for each trade
      key: take_profit_levels
      type: int
    prd:
      bullets: []
    prompt: Establish trading rules for the system based on the trading model and
      backtesting results. Define conditions for buying and selling, including stop-loss
      and take-profit levels.
  test_trading_system:
    agent: false
    description: Test the trading system in a simulated environment
    name: test_trading_system
    nodes_depended_on:
    - create_trading_interface
    nodes_dependent_on: []
    output_structure:
    - description: The total profit or loss of the trading system
      key: trade_profit_and_loss
      type: float
    - description: The maximum drawdown of the trading system
      key: maximum_drawdown
      type: float
    - description: The Sharpe ratio of the trading system
      key: Sharpe_ratio
      type: float
    - description: A list of evaluation metrics such as return on investment, profit
        factor, and sortino ratio
      key: evaluation_metrics
      type: List[float]
    prompt: Test the trading system in a simulated environment to evaluate its performance
      and identify potential issues. Use metrics such as trade profit and loss, maximum
      drawdown, and Sharpe ratio.
