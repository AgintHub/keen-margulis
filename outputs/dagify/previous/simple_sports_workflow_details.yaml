dag_type: shim
description: Generated workflow from UI.
name: simple_sports_workflow
nodes:
  determine_sport_type:
    agent: false
    code_node_type: shim
    description: Determine if the sport is team-based or individual
    implementation: "from ._determine_sport_type.validate_sport_input import validate_sport_input\n\
      from ._determine_sport_type.analyze_sport_characteristics import analyze_sport_characteristics\n\
      from ._determine_sport_type.classify_sport_type import classify_sport_type\n\
      from ._determine_sport_type.generate_classification_rationale import generate_classification_rationale\n\
      \nfrom pydantic import BaseModel, Field\n\n\nclass IdentifySportOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for identify_sport node outputs.\"\"\"\n    selected_sport:\
      \ str = (\n        Field(..., description = (\n            \"The name of the\
      \ sport identified or specified by the user\")\n        )\n    )\n\n\nclass\
      \ DetermineSportTypeOutput(BaseModel):\n    \"\"\"Pydantic model for determine_sport_type\
      \ node outputs.\"\"\"\n    sport_type: str = (\n        Field(..., description=\"\
      Whether the sport is team-based or individual\")\n    )\n    rationale: str\
      \ = (\n        Field(..., description = (\n            \"One-sentence explanation\
      \ for the classification\")\n        )\n    )\n\n\ndef determine_sport_type(identify_sport_input:\
      \ IdentifySportOutput, **kwargs) -> DetermineSportTypeOutput:\n    \"\"\"\n\
      \    Determines whether a sport is team-based or individual.\n\n    Parameters\n\
      \    ----------\n    selected_sport : str\n        The name of the sport identified\
      \ by the parent node.\n\n    Returns\n    -------\n    Dict[str, str]\n    \
      \    A dictionary containing `sport_type` and `rationale` keys.\n\n    Raises\n\
      \    ------\n    ValueError\n        If `selected_sport` is empty or not recognized.\n\
      \n    Examples\n    --------\n    >>> result = determine_sport_type('soccer')\n\
      \    >>> print(result['sport_type'])\n    >>> print(result['rationale'])\n \
      \   'team-based'\n    'Soccer is a team sport because each side fields 11 players\
      \ who must\n    coordinate to score goals.'\n\n    >>> result = determine_sport_type('tennis')\n\
      \    >>> print(result['sport_type'])\n    >>> print(result['rationale'])\n \
      \   'individual'\n    'Tennis is played by one or two players competing against\
      \ each other, making\n    it an individual sport.'\n\n    \"\"\"\n    selected_sport:\
      \ str = identify_sport_input.selected_sport\n    \n    validated_sport: str\
      \ = validate_sport_input(sport_name=selected_sport)\n    sport_characteristics:\
      \ dict = analyze_sport_characteristics(sport=validated_sport)\n    classification:\
      \ str = classify_sport_type(characteristics=sport_characteristics)\n    explanation:\
      \ str = generate_classification_rationale(sport=validated_sport, sport_type=classification,\
      \ characteristics=sport_characteristics)\n    \n    return DetermineSportTypeOutput(\n\
      \        sport_type=classification,\n        rationale=explanation\n    )"
    name: determine_sport_type
    nodes_depended_on:
    - identify_sport
    nodes_dependent_on: []
    output_structure:
    - description: Whether the sport is team-based or individual
      key: sport_type
      type: str
    - description: One-sentence explanation for the classification
      key: rationale
      type: str
    prd:
      conceptual_info: Classifies a sport as team-based or individual using a concise
        rationale.
      docstring:
        examples:
        - lines:
          - result = determine_sport_type('soccer')
          - print(result['sport_type'])
          - print(result['rationale'])
          output: '''team-based''

            ''Soccer is a team sport because each side fields 11 players who must
            coordinate to score goals.'''
        - lines:
          - result = determine_sport_type('tennis')
          - print(result['sport_type'])
          - print(result['rationale'])
          output: '''individual''

            ''Tennis is played by one or two players competing against each other,
            making it an individual sport.'''
        parameters:
        - description: The name of the sport identified by the parent node.
          name: selected_sport
          type: str
        raises:
        - description: If `selected_sport` is empty or not recognized.
          type: ValueError
        returns:
          description: A dictionary containing `sport_type` and `rationale` keys.
          type: Dict[str, str]
        summary: Determines whether a sport is team-based or individual.
    prompt: Decide whether the identified sport is team-based or individual. Provide
      a one-sentence rationale.
    shims:
    - agent: false
      code_node_type: virtual-stub
      description: Validates a sport name against a predefined list of supported sports
        and returns the standardized sport name.
      implementation: "def validate_sport_input(sport_name: str) -> str:\n    \"\"\
        \"\n    Validates the input sport name against a list of supported sports\
        \ and\n    returns the canonical name.\n\n    Parameters\n    ----------\n\
        \    sport_name : str\n        The sport name to validate. Must be a non-empty\
        \ string.\n\n    Returns\n    -------\n    str\n        The validated sport\
        \ name in lowercase, matching one of the supported\n        sports.\n\n  \
        \  Raises\n    ------\n    TypeError\n        If sport_name is not of type\
        \ str.\n    ValueError\n        If sport_name is not found in the list of\
        \ supported sports.\n\n    Examples\n    --------\n    >>> result = validate_sport_input(\"\
        soccer\")\n    >>> print(result)\n    'soccer'\n\n    >>> validate_sport_input(\"\
        unknown_sport\")\n    ValueError: \"'unknown_sport' is not a supported sport\
        \ name.\"\n\n    \"\"\"\n    raise NotImplementedError(\"This is a virtual\
        \ stub node that needs to be implemented\")"
      name: validate_sport_input
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type str
        key: output
        type: str
      - description: Input parameter of type str
        key: sport_name
        type: str
      prd:
        conceptual_info: This shim ensures that only known sports are propagated through
          the system, preventing downstream errors and normalizing input for consistent
          processing.
        docstring:
          examples:
          - lines:
            - result = validate_sport_input("soccer")
            - print(result)
            output: '''soccer'''
          - lines:
            - validate_sport_input("unknown_sport")
            output: 'ValueError: "''unknown_sport'' is not a supported sport name."'
          parameters:
          - description: The sport name to validate. Must be a non-empty string.
            name: sport_name
            type: str
          raises:
          - description: If sport_name is not of type str.
            type: TypeError
          - description: If sport_name is not found in the list of supported sports.
            type: ValueError
          returns:
            description: The validated sport name in lowercase, matching one of the
              supported sports.
            type: str
          summary: Validates the input sport name against a list of supported sports
            and returns the canonical name.
      prompt: 'Implement the function validate_sport_input(sport_name: str) -> str:
        the function should verify that sport_name is in the supported sports list
        (e.g., ''basketball'', ''soccer'', ''tennis'', ''baseball'', ''cricket'',
        ''rugby'', ''hockey'', ''volleyball'', ''badminton'', ''golf'') and return
        it. If sport_name is not supported, raise a ValueError; if the input type
        is not a string, raise a TypeError.'
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Analyzes a validated sport name and returns a JSON string describing
        key characteristics used for classification.
      implementation: "def analyze_sport_characteristics(sport: str) -> str:\n   \
        \ \"\"\"\n    Analyzes a validated sport name and returns a JSON string of\
        \ its key\n    characteristics.\n\n    Parameters\n    ----------\n    sport\
        \ : str\n        A non-empty, validated string containing the name of the\
        \ sport to\n        analyze.\n\n    Returns\n    -------\n    str\n      \
        \  A JSON-formatted string representing a dictionary with keys such as\n \
        \       sport_name, team_based, players_per_side, field_type, equipment, and\n\
        \        governing_body.\n\n    Raises\n    ------\n    ValueError\n     \
        \   Raised if the provided sport name is empty or unrecognized.\n    TypeError\n\
        \        Raised if the input is not a string.\n\n    Examples\n    --------\n\
        \    >>> analyze_sport_characteristics('soccer')\n    \"{\\\"sport_name\\\"\
        : \\\"soccer\\\", \\\"team_based\\\": true, \\\"players_per_side\\\":\n  \
        \  11, \\\"field_type\\\": \\\"field\\\", \\\"equipment\\\": [\\\"ball\\\"\
        , \\\"goal\\\"],\n    \\\"governing_body\\\": \\\"FIFA\\\"}\"\n\n    >>> analyze_sport_characteristics('archery')\n\
        \    \"{\\\"sport_name\\\": \\\"archery\\\", \\\"team_based\\\": false, \\\
        \"players_per_side\\\":\n    1, \\\"field_type\\\": \\\"outdoor\\\", \\\"\
        equipment\\\": [\\\"bow\\\", \\\"arrow\\\"],\n    \\\"governing_body\\\":\
        \ \\\"World Archery Federation\\\"}\"\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: analyze_sport_characteristics
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type dict
        key: output
        type: str
      - description: Input parameter of type str
        key: sport
        type: str
      prd:
        conceptual_info: Provides structured sport data required for determining whether
          a sport is team-based or individual and for generating a rationale.
        docstring:
          examples:
          - lines:
            - analyze_sport_characteristics('soccer')
            output: '"{\"sport_name\": \"soccer\", \"team_based\": true, \"players_per_side\":
              11, \"field_type\": \"field\", \"equipment\": [\"ball\", \"goal\"],
              \"governing_body\": \"FIFA\"}"'
          - lines:
            - analyze_sport_characteristics('archery')
            output: '"{\"sport_name\": \"archery\", \"team_based\": false, \"players_per_side\":
              1, \"field_type\": \"outdoor\", \"equipment\": [\"bow\", \"arrow\"],
              \"governing_body\": \"World Archery Federation\"}"'
          parameters:
          - description: A non-empty, validated string containing the name of the
              sport to analyze.
            name: sport
            type: str
          raises:
          - description: Raised if the provided sport name is empty or unrecognized.
            type: ValueError
          - description: Raised if the input is not a string.
            type: TypeError
          returns:
            description: A JSON-formatted string representing a dictionary with keys
              such as sport_name, team_based, players_per_side, field_type, equipment,
              and governing_body.
            type: str
          summary: Analyzes a validated sport name and returns a JSON string of its
            key characteristics.
      prompt: 'You are an expert sports analyst. Given a sport name, return a JSON
        dictionary containing the following keys:

        - sport_name: the name of the sport

        - team_based: true if the sport is primarily team-based, false otherwise

        - players_per_side: approximate number of players per side (integer)

        - field_type: type of playing area (e.g., "field", "court", "track", "outdoor")

        - equipment: list of primary equipment items needed

        - governing_body: name of the main international governing organization

        Provide only the JSON dictionary without any additional explanation or markdown.

        Example: analyze_sport_characteristics(''soccer'') -> {"sport_name": "soccer",
        "team_based": true, "players_per_side": 11, "field_type": "field", "equipment":
        ["ball", "goal"], "governing_body": "FIFA"}.'
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Classifies a sport as team-based or individual based on its characteristics.
      implementation: "def classify_sport_type(characteristics: str) -> str:\n   \
        \ \"\"\"\n    Classifies a sport as either team-based or individual based\
        \ on provided\n    characteristics.\n\n    Parameters\n    ----------\n  \
        \  characteristics : dict\n        Dictionary containing sport characteristics\
        \ such as team_size,\n        individual_ranking, or other relevant attributes.\n\
        \n    Returns\n    -------\n    str\n        Either 'team' or 'individual'\
        \ indicating the sport type.\n\n    Raises\n    ------\n    ValueError\n \
        \       Raised when required characteristics are missing or contain invalid\n\
        \        values.\n    TypeError\n        Raised when the input is not a dictionary.\n\
        \n    Examples\n    --------\n    >>> classify_sport_type({'team_size': 'large',\
        \ 'individual_ranking': False})\n    'team'\n\n    >>> classify_sport_type({'team_size':\
        \ 'none', 'individual_ranking': True})\n    'individual'\n\n    \"\"\"\n \
        \   raise NotImplementedError(\"This is a virtual stub node that needs to\
        \ be implemented\")"
      name: classify_sport_type
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type str
        key: output
        type: str
      - description: Input parameter of type str
        key: characteristics
        type: str
      prd:
        conceptual_info: Shim to determine sport type classification based on extracted
          characteristics.
        docstring:
          examples:
          - lines:
            - 'classify_sport_type({''team_size'': ''large'', ''individual_ranking'':
              False})'
            output: '''team'''
          - lines:
            - 'classify_sport_type({''team_size'': ''none'', ''individual_ranking'':
              True})'
            output: '''individual'''
          parameters:
          - description: Dictionary containing sport characteristics such as team_size,
              individual_ranking, or other relevant attributes.
            name: characteristics
            type: dict
          raises:
          - description: Raised when required characteristics are missing or contain
              invalid values.
            type: ValueError
          - description: Raised when the input is not a dictionary.
            type: TypeError
          returns:
            description: Either 'team' or 'individual' indicating the sport type.
            type: str
          summary: Classifies a sport as either team-based or individual based on
            provided characteristics.
      prompt: Given a dictionary of sport characteristics, return 'team' if the sport
        is team-based and 'individual' if it is individual.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Generates a concise one‑sentence rationale explaining why a given
        sport is classified as team‑based or individual.
      implementation: "def generate_classification_rationale(sport: str, sport_type:\
        \ str, characteristics: str) -> str:\n    \"\"\"\n    Generate a concise justification\
        \ for classifying a sport as team-based or\n    individual.\n\n    Parameters\n\
        \    ----------\n    sport : str\n        The name of the sport (e.g., 'Soccer').\n\
        \    sport_type : str\n        The classification of the sport, expected values\
        \ are 'team-based' or\n        'individual'.\n    characteristics : dict\n\
        \        A dictionary of sport characteristics such as 'team',\n        'players_per_side',\
        \ etc.\n\n    Returns\n    -------\n    str\n        A single‑sentence rationale\
        \ explaining the classification.\n\n    Raises\n    ------\n    ValueError\n\
        \        If `sport_type` is not 'team-based' or 'individual', or if required\n\
        \        keys are missing from `characteristics`.\n    TypeError\n       \
        \ If any argument is not of the expected type.\n\n    Examples\n    --------\n\
        \    >>> rationale = generate_classification_rationale('Soccer', 'team-based',\
        \ {\n    ...     'team': True,\n    ...     'players_per_side': 11\n    >>>\
        \ })\n    >>> print(rationale)\n    'Soccer is a team-based sport because\
        \ it involves 11 players per side.'\n\n    >>> rationale = generate_classification_rationale('Tennis',\
        \ 'individual', {\n    ...     'team': False,\n    ...     'players_per_side':\
        \ 1\n    >>> })\n    >>> print(rationale)\n    'Tennis is an individual sport\
        \ because it is played by a single player.'\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: generate_classification_rationale
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type str
        key: output
        type: str
      - description: Input parameter of type str
        key: sport
        type: str
      - description: Input parameter of type str
        key: sport_type
        type: str
      - description: Input parameter of type str
        key: characteristics
        type: str
      prd:
        conceptual_info: In the larger system, this shim is responsible for converting
          structured sport data into an explanatory sentence that can be displayed
          to users or used for auditing the classification logic.
        docstring:
          examples:
          - lines:
            - rationale = generate_classification_rationale('Soccer', 'team-based',
              {
            - '    ''team'': True,'
            - '    ''players_per_side'': 11'
            - '})'
            - print(rationale)
            output: '''Soccer is a team-based sport because it involves 11 players
              per side.'''
          - lines:
            - rationale = generate_classification_rationale('Tennis', 'individual',
              {
            - '    ''team'': False,'
            - '    ''players_per_side'': 1'
            - '})'
            - print(rationale)
            output: '''Tennis is an individual sport because it is played by a single
              player.'''
          parameters:
          - description: The name of the sport (e.g., 'Soccer').
            name: sport
            type: str
          - description: The classification of the sport, expected values are 'team-based'
              or 'individual'.
            name: sport_type
            type: str
          - description: A dictionary of sport characteristics such as 'team', 'players_per_side',
              etc.
            name: characteristics
            type: dict
          raises:
          - description: If `sport_type` is not 'team-based' or 'individual', or if
              required keys are missing from `characteristics`.
            type: ValueError
          - description: If any argument is not of the expected type.
            type: TypeError
          returns:
            description: A single‑sentence rationale explaining the classification.
            type: str
          summary: Generate a concise justification for classifying a sport as team-based
            or individual.
      prompt: Implement `generate_classification_rationale(sport, sport_type, characteristics)`
        to return a brief justification for the sport's classification based on its
        characteristics.
      shims: []
  gather_sport_info:
    agent: false
    code_node_type: shim
    description: Gather general information about the identified sport
    implementation: "from ._gather_sport_info.validate_sport_name import validate_sport_name\n\
      from ._gather_sport_info.fetch_sport_rules import fetch_sport_rules\nfrom ._gather_sport_info.get_popular_leagues\
      \ import get_popular_leagues\nfrom ._gather_sport_info.get_major_tournaments\
      \ import get_major_tournaments\n\nfrom pydantic import BaseModel, Field\nfrom\
      \ typing import List\n\n\nclass IdentifySportOutput(BaseModel):\n    \"\"\"\
      Pydantic model for identify_sport node outputs.\"\"\"\n    selected_sport: str\
      \ = (\n        Field(..., description = (\n            \"The name of the sport\
      \ identified or specified by the user\")\n        )\n    )\n\n\nclass GatherSportInfoOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for gather_sport_info node outputs.\"\"\"\n    rules:\
      \ List[str] = (\n        Field(..., description=\"List of key rules governing\
      \ the sport\")\n    )\n    popular_leagues: List[str] = (\n        Field(...,\
      \ description = (\n            \"List of major professional leagues associated\
      \ with the sport\")\n        )\n    )\n    major_tournaments: List[str] = (\n\
      \        Field(..., description = (\n            \"List of major international\
      \ tournaments or competitions for the sport\")\n        )\n    )\n\n\ndef gather_sport_info(identify_sport_input:\
      \ IdentifySportOutput, **kwargs) -> GatherSportInfoOutput:\n    \"\"\"\n   \
      \ Gather general information about the identified sport.\n\n    Parameters\n\
      \    ----------\n    selected_sport : str\n        The name of the sport identified\
      \ by the user, e.g., 'soccer',\n        'basketball', 'tennis'.\n\n    Returns\n\
      \    -------\n    dict\n        A dictionary with three keys:   * rules (List[str])\
      \ – key rules\n        governing the sport.   * popular_leagues (List[str])\
      \ – major\n        professional leagues.   * major_tournaments (List[str]) –\
      \ major\n        international tournaments.\n\n    Raises\n    ------\n    ValueError\n\
      \        If `selected_sport` is empty or not recognized in the knowledge\n \
      \       base.\n\n    Examples\n    --------\n    >>> gather_sport_info('soccer')\n\
      \    {\n      'rules': [\n        'Players may not use their hands except the\
      \ goalkeeper.',\n        'Each team has 11 players on the field.',\n       \
      \ 'A match lasts 90 minutes with two 45‑minute halves.'\n      ],\n      'popular_leagues':\
      \ [\n        'Premier League',\n        'La Liga',\n        'Bundesliga',\n\
      \        'Serie A'\n      ],\n      'major_tournaments': [\n        'FIFA World\
      \ Cup',\n        'UEFA Champions League',\n        'Copa América'\n      ]\n\
      \    }\n\n    >>> gather_sport_info('basketball')\n    {\n      'rules': [\n\
      \        'Each team has five players on the court.',\n        'The game is played\
      \ in four 12‑minute quarters.',\n        'Players must advance the ball by dribbling\
      \ or passing.'\n      ],\n      'popular_leagues': [\n        'NBA',\n     \
      \   'EuroLeague',\n        'NBL'\n      ],\n      'major_tournaments': [\n \
      \       'NBA Finals',\n        'FIBA World Cup',\n        'Olympic Games Basketball'\
      \ \n      ]\n    }\n\n    \"\"\"\n    selected_sport: str = identify_sport_input.selected_sport\n\
      \    \n    validated_sport: str = validate_sport_name(sport_name=selected_sport)\n\
      \    \n    sport_rules: List[str] = fetch_sport_rules(sport=validated_sport)\n\
      \    \n    leagues_data: List[str] = get_popular_leagues(sport=validated_sport)\n\
      \    \n    tournaments_data: List[str] = get_major_tournaments(sport=validated_sport)\n\
      \    \n    return GatherSportInfoOutput(\n        rules=sport_rules,\n     \
      \   popular_leagues=leagues_data,\n        major_tournaments=tournaments_data\n\
      \    )"
    name: gather_sport_info
    nodes_depended_on:
    - identify_sport
    nodes_dependent_on: []
    output_structure:
    - description: List of key rules governing the sport
      key: rules
      type: List[str]
    - description: List of major professional leagues associated with the sport
      key: popular_leagues
      type: List[str]
    - description: List of major international tournaments or competitions for the
        sport
      key: major_tournaments
      type: List[str]
    prd:
      conceptual_info: This node compiles core facts about a sport once its name is
        known, providing a structured set of rules, leagues, and tournaments.
      docstring:
        examples:
        - lines:
          - gather_sport_info('soccer')
          output: "{\n  'rules': [\n    'Players may not use their hands except the\
            \ goalkeeper.',\n    'Each team has 11 players on the field.',\n    'A\
            \ match lasts 90 minutes with two 45‑minute halves.'\n  ],\n  'popular_leagues':\
            \ [\n    'Premier League',\n    'La Liga',\n    'Bundesliga',\n    'Serie\
            \ A'\n  ],\n  'major_tournaments': [\n    'FIFA World Cup',\n    'UEFA\
            \ Champions League',\n    'Copa América'\n  ]\n}"
        - lines:
          - gather_sport_info('basketball')
          output: "{\n  'rules': [\n    'Each team has five players on the court.',\n\
            \    'The game is played in four 12‑minute quarters.',\n    'Players must\
            \ advance the ball by dribbling or passing.'\n  ],\n  'popular_leagues':\
            \ [\n    'NBA',\n    'EuroLeague',\n    'NBL'\n  ],\n  'major_tournaments':\
            \ [\n    'NBA Finals',\n    'FIBA World Cup',\n    'Olympic Games Basketball'\
            \ \n  ]\n}"
        parameters:
        - description: The name of the sport identified by the user, e.g., 'soccer',
            'basketball', 'tennis'.
          name: selected_sport
          type: str
        raises:
        - description: If `selected_sport` is empty or not recognized in the knowledge
            base.
          type: ValueError
        returns:
          description: "A dictionary with three keys:\n  * rules (List[str]) – key\
            \ rules governing the sport.\n  * popular_leagues (List[str]) – major\
            \ professional leagues.\n  * major_tournaments (List[str]) – major international\
            \ tournaments."
          type: dict
        summary: Gather general information about the identified sport.
    prompt: Collect general information about the identified sport, including its
      rules, popular leagues, and major tournaments.
    shims:
    - agent: false
      code_node_type: virtual-stub
      description: Validates a given sport name against a predefined list and returns
        the canonical form.
      implementation: "def validate_sport_name(sport_name: str) -> str:\n    \"\"\"\
        \n    Validate a sport name against a known list and return its canonical\
        \ form.\n\n    Parameters\n    ----------\n    sport_name : str\n        The\
        \ sport name to be validated. Can be a full name or abbreviation.\n\n    Returns\n\
        \    -------\n    str\n        The canonical sport name that matches an entry\
