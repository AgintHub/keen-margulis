dag_type: shim
description: Create a super cool workflow by generating a series of connected and
  typed nodes that represent individual tasks or operations.
name: createsupercoolworkflow
nodes:
  connectnodes:
    agent: false
    code_node_type: shim
    description: Establish the connections between the nodes.
    implementation: "from ._connectnodes.validate_node_names import validate_node_names\n\
      from ._connectnodes.check_cyclic_dependency import check_cyclic_dependency\n\
      from ._connectnodes.establish_dag_connection import establish_dag_connection\n\
      \nfrom pydantic import BaseModel, Field\nfrom typing import List\n\n\nclass\
      \ Definenode1Output(BaseModel):\n    \"\"\"Pydantic model for definenode1 node\
      \ outputs.\"\"\"\n    node1_name: str = Field(..., description=\"Name of the\
      \ first node\")\n    node1_description: str = (\n        Field(..., description=\"\
      Description of the first node\")\n    )\n    node1_output_structure: List[str]\
      \ = (\n        Field(..., description=\"Output structure of the first node\"\
      )\n    )\n\n\nclass Definenode2Output(BaseModel):\n    \"\"\"Pydantic model\
      \ for definenode2 node outputs.\"\"\"\n    node2_name: str = Field(..., description=\"\
      Name of the second node\")\n    node2_description: str = (\n        Field(...,\
      \ description=\"Description of the second node\")\n    )\n    node2_output_structure:\
      \ List[str] = (\n        Field(..., description=\"Output structure of the second\
      \ node\")\n    )\n\n\nclass ConnectnodesOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for connectnodes node outputs.\"\"\"\n    connected_nodes: List[str]\
      \ = (\n        Field(..., description=\"List of connected node names\")\n  \
      \  )\n\n\ndef connectnodes(definenode1_input: Definenode1Output, definenode2_input:\
      \ Definenode2Output, **kwargs) -> ConnectnodesOutput:\n    \"\"\"\n    Connects\
      \ the defined nodes in the workflow.\n\n    Parameters\n    ----------\n   \
      \ node1_name : str\n        Name of the first node from definenode1 output.\n\
      \    node2_name : str\n        Name of the second node from definenode2 output.\n\
      \n    Returns\n    -------\n    List[str]\n        A list containing the names\
      \ of the connected nodes.\n\n    Raises\n    ------\n    ValueError\n      \
      \  If either node1_name or node2_name is empty or not a string.\n    ConnectionError\n\
      \        If the nodes cannot be connected due to a cyclic dependency.\n\n  \
      \  Examples\n    --------\n    >>> node1 = 'node_a'\n    >>> node2 = 'node_b'\n\
      \    >>> connect_nodes(node1, node2)\n    ['node_a', 'node_b']\n\n    >>> node1\
      \ = 'data_processing'\n    >>> node2 = 'data_analysis'\n    >>> connect_nodes(node1,\
      \ node2)\n    ['data_processing', 'data_analysis']\n\n    \"\"\"\n    node1_name:\
      \ str = definenode1_input.node1_name\n    node2_name: str = definenode2_input.node2_name\n\
      \    \n    validate_node_names(node1_name=node1_name, node2_name=node2_name)\n\
      \    \n    check_cyclic_dependency(node1_name=node1_name, node2_name=node2_name)\n\
      \    \n    connection_result: List[str] = establish_dag_connection(node1=node1_name,\
      \ node2=node2_name)\n    \n    return ConnectnodesOutput(connected_nodes=connection_result)"
    name: connectnodes
    nodes_depended_on:
    - definenode1
    - definenode2
    nodes_dependent_on: []
    output_structure:
    - description: List of connected node names
      key: connected_nodes
      type: List[str]
    prd:
      conceptual_info: This node establishes the connections between the defined nodes
        to create a workflow Directed Acyclic Graph (DAG).
      docstring:
        examples:
        - lines:
          - node1 = 'node_a'
          - node2 = 'node_b'
          - connect_nodes(node1, node2)
          output: '[''node_a'', ''node_b'']'
        - lines:
          - node1 = 'data_processing'
          - node2 = 'data_analysis'
          - connect_nodes(node1, node2)
          output: '[''data_processing'', ''data_analysis'']'
        parameters:
        - description: Name of the first node from definenode1 output.
          name: node1_name
          type: str
        - description: Name of the second node from definenode2 output.
          name: node2_name
          type: str
        raises:
        - description: If either node1_name or node2_name is empty or not a string.
          type: ValueError
        - description: If the nodes cannot be connected due to a cyclic dependency.
          type: ConnectionError
        returns:
          description: A list containing the names of the connected nodes.
          type: List[str]
        summary: Connects the defined nodes in the workflow.
    prompt: Connect the defined nodes to create a workflow DAG.
    shims:
    - agent: false
      code_node_type: virtual-stub
      description: Validates the names of two nodes to ensure they are properly formatted
        and valid for connection.
      implementation: "def validate_node_names(node1_name: str, node2_name: str) ->\
        \ str:\n    \"\"\"\n    Validates the names of two nodes to ensure they are\
        \ valid for connection.\n\n    Parameters\n    ----------\n    node1_name\
        \ : str\n        The name of the first node to be validated.\n    node2_name\
        \ : str\n        The name of the second node to be validated.\n\n    Returns\n\
        \    -------\n    str\n        A string indicating the validation result of\
        \ the node names.\n\n    Raises\n    ------\n    ValueError\n        If either\
        \ node name is empty or contains invalid characters.\n    TypeError\n    \
        \    If either node name is not a string.\n\n    Examples\n    --------\n\
        \    >>> validate_node_names(node1_name='valid_node1', node2_name='valid_node2')\n\
        \    'Node names are valid'\n\n    >>> validate_node_names(node1_name='',\
        \ node2_name='valid_node2')\n    ValueError: 'Node name cannot be empty'\n\
        \n    \"\"\"\n    raise NotImplementedError(\"This is a virtual stub node\
        \ that needs to be implemented\")"
      name: validate_node_names
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type Any
        key: output
        type: str
      - description: Input parameter of type str
        key: node1_name
        type: str
      - description: Input parameter of type str
        key: node2_name
        type: str
      prd:
        conceptual_info: This shim function is responsible for validating the names
          of two nodes before they are connected in a DAG.
        docstring:
          examples:
          - lines:
            - validate_node_names(node1_name='valid_node1', node2_name='valid_node2')
            output: '''Node names are valid'''
          - lines:
            - validate_node_names(node1_name='', node2_name='valid_node2')
            output: 'ValueError: ''Node name cannot be empty'''
          parameters:
          - description: The name of the first node to be validated.
            name: node1_name
            type: str
          - description: The name of the second node to be validated.
            name: node2_name
            type: str
          raises:
          - description: If either node name is empty or contains invalid characters.
            type: ValueError
          - description: If either node name is not a string.
            type: TypeError
          returns:
            description: A string indicating the validation result of the node names.
            type: str
          summary: Validates the names of two nodes to ensure they are valid for connection.
      prompt: Validate the names of node1 and node2
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Checks if there's a cyclic dependency between two given nodes in
        a directed graph.
      implementation: "def check_cyclic_dependency(node1_name: str, node2_name: str)\
        \ -> str:\n    \"\"\"\n    Checks if connecting two nodes creates a cyclic\
        \ dependency in a DAG.\n\n    Parameters\n    ----------\n    node1_name :\
        \ str\n        The name of the first node.\n    node2_name : str\n       \
        \ The name of the second node.\n\n    Returns\n    -------\n    str\n    \
        \    A message indicating whether a cyclic dependency exists.\n\n    Raises\n\
        \    ------\n    ValueError\n        If either node name is invalid or empty.\n\
        \    TypeError\n        If node names are not strings.\n\n    Examples\n \
        \   --------\n    >>> check_cyclic_dependency(node1_name='nodeA', node2_name='nodeB')\n\
        \    >>> check_cyclic_dependency(node1_name='nodeC', node2_name='nodeD')\n\
        \    'No cyclic dependency detected.'\n\n    >>> check_cyclic_dependency(node1_name='nodeE',\
        \ node2_name='nodeF')\n    'Cyclic dependency detected.'\n\n    \"\"\"\n \
        \   raise NotImplementedError(\"This is a virtual stub node that needs to\
        \ be implemented\")"
      name: check_cyclic_dependency
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type Any
        key: output
        type: str
      - description: Input parameter of type str
        key: node1_name
        type: str
      - description: Input parameter of type str
        key: node2_name
        type: str
      prd:
        conceptual_info: This shim function is crucial for validating the structural
          integrity of a directed acyclic graph (DAG) when connecting nodes. It ensures
          that adding an edge between two nodes does not introduce a cycle, which
          is essential for maintaining the DAG property.
        docstring:
          examples:
          - lines:
            - check_cyclic_dependency(node1_name='nodeA', node2_name='nodeB')
            - check_cyclic_dependency(node1_name='nodeC', node2_name='nodeD')
            output: '''No cyclic dependency detected.'''
          - lines:
            - check_cyclic_dependency(node1_name='nodeE', node2_name='nodeF')
            output: '''Cyclic dependency detected.'''
          parameters:
          - description: The name of the first node.
            name: node1_name
            type: str
          - description: The name of the second node.
            name: node2_name
            type: str
          raises:
          - description: If either node name is invalid or empty.
            type: ValueError
          - description: If node names are not strings.
            type: TypeError
          returns:
            description: A message indicating whether a cyclic dependency exists.
            type: str
          summary: Checks if connecting two nodes creates a cyclic dependency in a
            DAG.
      prompt: Check if connecting node '{node1_name}' and node '{node2_name}' creates
        a cyclic dependency.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Establishes a connection between two nodes in a Directed Acyclic
        Graph (DAG) and returns the result as a list of connected node names.
      implementation: "from typing import List\n\n\ndef establish_dag_connection(node1:\
        \ str, node2: str) -> List[str]:\n    \"\"\"\n    Establishes a DAG connection\
        \ between two nodes and returns the connected\n    node names.\n\n    Parameters\n\
        \    ----------\n    node1 : str\n        The name of the first node to be\
        \ connected.\n    node2 : str\n        The name of the second node to be connected.\n\
        \n    Returns\n    -------\n    List[str]\n        A list of connected node\
        \ names after establishing the DAG\n        connection.\n\n    Raises\n  \
        \  ------\n    ValueError\n        If the input node names are invalid or\
        \ if the connection would\n        result in a cyclic dependency.\n    TypeError\n\
        \        If the input node names are not strings.\n\n    Examples\n    --------\n\
        \    >>> establish_dag_connection(node1='nodeA', node2='nodeB')\n    ['nodeA',\
        \ 'nodeB']\n\n    >>> establish_dag_connection(node1='task1', node2='task2')\n\
        \    ['task1', 'task2']\n\n    \"\"\"\n    raise NotImplementedError(\"This\
        \ is a virtual stub node that needs to be implemented\")"
      name: establish_dag_connection
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: node1
        type: str
      - description: Input parameter of type str
        key: node2
        type: str
      prd:
        conceptual_info: This shim function is responsible for establishing a connection
          between two nodes in a Directed Acyclic Graph (DAG). It takes the names
          of two nodes as input and returns a list representing the result of the
          connection.
        docstring:
          examples:
          - lines:
            - establish_dag_connection(node1='nodeA', node2='nodeB')
            output: '[''nodeA'', ''nodeB'']'
          - lines:
            - establish_dag_connection(node1='task1', node2='task2')
            output: '[''task1'', ''task2'']'
          parameters:
          - description: The name of the first node to be connected.
            name: node1
            type: str
          - description: The name of the second node to be connected.
            name: node2
            type: str
          raises:
          - description: If the input node names are invalid or if the connection
              would result in a cyclic dependency.
            type: ValueError
          - description: If the input node names are not strings.
            type: TypeError
          returns:
            description: A list of connected node names after establishing the DAG
              connection.
            type: List[str]
          summary: Establishes a DAG connection between two nodes and returns the
            connected node names.
      prompt: Establish a DAG connection between two nodes.
      shims: []
  definenode1:
    agent: false
    code_node_type: shim
    description: Create the first node with the required details.
    implementation: "from ._definenode1.validate_workflow_inputs import validate_workflow_inputs\n\
      from ._definenode1.generate_node_name import generate_node_name\nfrom ._definenode1.create_node_description\
      \ import create_node_description\nfrom ._definenode1.define_output_structure\
      \ import define_output_structure\n\nfrom pydantic import BaseModel, Field\n\
      from typing import List\n\n\nclass InitializeworkflowOutput(BaseModel):\n  \
      \  \"\"\"Pydantic model for initializeworkflow node outputs.\"\"\"\n    workflow_id:\
      \ str = (\n        Field(..., description=\"Unique identifier for the workflow\"\
      )\n    )\n    workflow_name: str = Field(..., description=\"Name of the workflow\"\
      )\n\n\nclass Definenode1Output(BaseModel):\n    \"\"\"Pydantic model for definenode1\
      \ node outputs.\"\"\"\n    node1_name: str = Field(..., description=\"Name of\
      \ the first node\")\n    node1_description: str = (\n        Field(..., description=\"\
      Description of the first node\")\n    )\n    node1_output_structure: List[str]\
      \ = (\n        Field(..., description=\"Output structure of the first node\"\
      )\n    )\n\n\ndef definenode1(initializeworkflow_input: InitializeworkflowOutput,\
      \ **kwargs) -> Definenode1Output:\n    \"\"\"\n    Defines the first node in\
      \ the workflow with the required details.\n\n    Parameters\n    ----------\n\
      \    workflow_id : str\n        Unique identifier for the workflow obtained\
      \ from the parent node\n        'initializeworkflow'.\n    workflow_name : str\n\
      \        Name of the workflow obtained from the parent node\n        'initializeworkflow'.\n\
      \n    Returns\n    -------\n    Tuple[str, str, List[str]]\n        A tuple\
      \ containing the name, description, and output structure of\n        the first\
      \ node.\n\n    Raises\n    ------\n    ValueError\n        If the workflow_id\
      \ or workflow_name is empty or not provided.\n\n    Examples\n    --------\n\
      \    >>> definenode1(workflow_id='wf_123', workflow_name='My Workflow')\n  \
      \  ...   node1_name = 'Node 1'\n    ...   node1_description = 'This is the first\
      \ node.'\n    ...   node1_output_structure = ['output1', 'output2']\n    ...\
      \   return node1_name, node1_description, node1_output_structure\n    ('Node\
      \ 1', 'This is the first node.', ['output1', 'output2'])\n\n    \"\"\"\n   \
      \ validate_workflow_inputs(workflow_id=initializeworkflow_input.workflow_id,\
      \ workflow_name=initializeworkflow_input.workflow_name)\n    \n    node_name:\
      \ str = generate_node_name(workflow_name=initializeworkflow_input.workflow_name)\n\
      \    node_description: str = create_node_description(workflow_id=initializeworkflow_input.workflow_id,\
      \ workflow_name=initializeworkflow_input.workflow_name)\n    output_structure:\
      \ List[str] = define_output_structure(workflow_context=initializeworkflow_input)\n\
      \    \n    return Definenode1Output(\n        node1_name=node_name,\n      \
      \  node1_description=node_description,\n        node1_output_structure=output_structure\n\
      \    )"
    name: definenode1
    nodes_depended_on:
    - initializeworkflow
    nodes_dependent_on: []
    output_structure:
    - description: Name of the first node
      key: node1_name
      type: str
    - description: Description of the first node
      key: node1_description
      type: str
    - description: Output structure of the first node
      key: node1_output_structure
      type: List[str]
    prd:
      conceptual_info: This node is responsible for defining the first node in a workflow,
        including its name, description, and output structure, based on the initialization
        provided by its parent node.
      docstring:
        examples:
        - lines:
          - definenode1(workflow_id='wf_123', workflow_name='My Workflow')
          - '  node1_name = ''Node 1'''
          - '  node1_description = ''This is the first node.'''
          - '  node1_output_structure = [''output1'', ''output2'']'
          - '  return node1_name, node1_description, node1_output_structure'
          output: ('Node 1', 'This is the first node.', ['output1', 'output2'])
        parameters:
        - description: Unique identifier for the workflow obtained from the parent
            node 'initializeworkflow'.
          name: workflow_id
          type: str
        - description: Name of the workflow obtained from the parent node 'initializeworkflow'.
          name: workflow_name
          type: str
        raises:
        - description: If the workflow_id or workflow_name is empty or not provided.
          type: ValueError
        returns:
          description: A tuple containing the name, description, and output structure
            of the first node.
          type: Tuple[str, str, List[str]]
        summary: Defines the first node in the workflow with the required details.
    prompt: Define the first node in the workflow, including its name, description,
      and output structure.
    shims:
    - agent: false
      code_node_type: virtual-stub
      description: Validates workflow inputs based on the provided workflow ID and
        name.
      implementation: "def validate_workflow_inputs(workflow_id: str, workflow_name:\
        \ str) -> str:\n    \"\"\"\n    Validates workflow inputs based on the provided\
        \ workflow ID and name,\n    returning a validation result.\n\n    Parameters\n\
        \    ----------\n    workflow_id : str\n        The unique identifier for\
        \ the workflow to be validated.\n    workflow_name : str\n        The name\
        \ of the workflow to be validated.\n\n    Returns\n    -------\n    str\n\
        \        A string indicating the outcome of the validation process.\n\n  \
        \  Raises\n    ------\n    ValueError\n        If either the workflow ID or\
        \ name is invalid or missing.\n    TypeError\n        If the input types for\
        \ workflow ID or name are not strings.\n\n    Examples\n    --------\n   \
        \ >>> validate_workflow_inputs(workflow_id='wf_123',\n    workflow_name='example_workflow')\n\
        \    'Validation successful'\n\n    >>> validate_workflow_inputs(workflow_id='',\n\
        \    workflow_name='invalid_workflow')\n    ValueError: Workflow ID is required.\n\
        \n    \"\"\"\n    raise NotImplementedError(\"This is a virtual stub node\
        \ that needs to be implemented\")"
      name: validate_workflow_inputs
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type Any
        key: output
        type: str
      - description: Input parameter of type str
        key: workflow_id
        type: str
      - description: Input parameter of type str
        key: workflow_name
        type: str
      prd:
        conceptual_info: This shim node is responsible for validating the inputs required
          for a workflow, ensuring that both the workflow ID and name are correctly
          provided and valid.
        docstring:
          examples:
          - lines:
            - validate_workflow_inputs(workflow_id='wf_123', workflow_name='example_workflow')
            output: '''Validation successful'''
          - lines:
            - validate_workflow_inputs(workflow_id='', workflow_name='invalid_workflow')
            output: 'ValueError: Workflow ID is required.'
          parameters:
          - description: The unique identifier for the workflow to be validated.
            name: workflow_id
            type: str
          - description: The name of the workflow to be validated.
            name: workflow_name
            type: str
          raises:
          - description: If either the workflow ID or name is invalid or missing.
            type: ValueError
          - description: If the input types for workflow ID or name are not strings.
            type: TypeError
          returns:
            description: A string indicating the outcome of the validation process.
            type: str
          summary: Validates workflow inputs based on the provided workflow ID and
            name, returning a validation result.
      prompt: Validate workflow inputs for workflow ID '{workflow_id}' and workflow
        name '{workflow_name}'
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Generates a node name based on the provided workflow name.
      implementation: "def generate_node_name(workflow_name: str) -> str:\n    \"\"\
        \"\n    Generates a node name based on the workflow name.\n\n    Parameters\n\
        \    ----------\n    workflow_name : str\n        The name of the workflow\
        \ for which to generate a node name.\n\n    Returns\n    -------\n    str\n\
        \        The generated node name based on the workflow name.\n\n    Raises\n\
        \    ------\n    ValueError\n        If the workflow name is empty or not\
        \ a string.\n    TypeError\n        If the workflow name is not of type string.\n\
        \n    Examples\n    --------\n    >>> generate_node_name('example_workflow')\n\
        \    'example_workflow_node'\n\n    >>> generate_node_name('another_workflow')\n\
        \    'another_workflow_node'\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: generate_node_name
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type str
        key: output
        type: str
      - description: Input parameter of type str
        key: workflow_name
        type: str
      prd:
        conceptual_info: This shim generates a node name based on the workflow name
          provided, serving as a unique identifier for a node within a workflow.
        docstring:
          examples:
          - lines:
            - generate_node_name('example_workflow')
            output: '''example_workflow_node'''
          - lines:
            - generate_node_name('another_workflow')
            output: '''another_workflow_node'''
          parameters:
          - description: The name of the workflow for which to generate a node name.
            name: workflow_name
            type: str
          raises:
          - description: If the workflow name is empty or not a string.
            type: ValueError
          - description: If the workflow name is not of type string.
            type: TypeError
          returns:
            description: The generated node name based on the workflow name.
            type: str
          summary: Generates a node name based on the workflow name.
      prompt: Typed node for shim generate_node_name
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Generates a typed node description for a given workflow ID and
        name.
      implementation: "def create_node_description(workflow_id: str, workflow_name:\
        \ str) -> str:\n    \"\"\"\n    Creates a node description string based on\
        \ the workflow ID and name.\n\n    Parameters\n    ----------\n    workflow_id\
        \ : str\n        The unique identifier for the workflow.\n    workflow_name\
        \ : str\n        The name of the workflow.\n\n    Returns\n    -------\n \
        \   str\n        A string representing the generated node description.\n\n\
        \    Raises\n    ------\n    ValueError\n        If either workflow_id or\
        \ workflow_name is empty or not a string.\n    TypeError\n        If workflow_id\
        \ or workflow_name are not strings.\n\n    Examples\n    --------\n    >>>\
        \ create_node_description(workflow_id='wf_123',\n    workflow_name='example_workflow')\n\
        \    'Typed node for workflow wf_123: example_workflow'\n\n    >>> create_node_description(workflow_id='wf_456',\n\
        \    workflow_name='another_workflow')\n    'Typed node for workflow wf_456:\
        \ another_workflow'\n\n    \"\"\"\n    raise NotImplementedError(\"This is\
        \ a virtual stub node that needs to be implemented\")"
      name: create_node_description
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type str
        key: output
        type: str
      - description: Input parameter of type str
        key: workflow_id
        type: str
      - description: Input parameter of type str
        key: workflow_name
        type: str
      prd:
        conceptual_info: This shim function generates a typed node description based
          on the provided workflow ID and name, serving as part of the node definition
          process in a workflow management system.
        docstring:
          examples:
          - lines:
            - create_node_description(workflow_id='wf_123', workflow_name='example_workflow')
            output: '''Typed node for workflow wf_123: example_workflow'''
          - lines:
            - create_node_description(workflow_id='wf_456', workflow_name='another_workflow')
            output: '''Typed node for workflow wf_456: another_workflow'''
          parameters:
          - description: The unique identifier for the workflow.
            name: workflow_id
            type: str
          - description: The name of the workflow.
            name: workflow_name
            type: str
          raises:
          - description: If either workflow_id or workflow_name is empty or not a
