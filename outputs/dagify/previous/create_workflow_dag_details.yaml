      \    \"\"\"Pydantic model for define_node_prompts_and_descriptions node outputs.\"\
      \"\"\n    node_names: List[str] = (\n        Field(..., description=\"List of\
      \ all node names in the DAG.\")\n    )\n    node_prompts: List[str] = (\n  \
      \      Field(..., description=\"List of prompts corresponding to each node name.\"\
      )\n    )\n    node_descriptions: List[str] = (\n        Field(..., description=\"\
      List of descriptions corresponding to each node name.\")\n    )\n\n\ndef define_node_prompts_and_descriptions(create_dag_structure_input:\
      \ CreateDagStructureOutput, **kwargs) -> DefineNodePromptsAndDescriptionsOutput:\n\
      \    \"\"\"\n    Generate node prompts and descriptions from the DAG structure.\n\
      \n    Parameters\n    ----------\n    dag_nodes : List[str]\n        List of\
      \ node names from the DAG structure.\n    dag_edges : List[str]\n        List\
      \ of edges in the DAG, represented as 'node1->node2'.\n    root_nodes : List[str]\n\
      \        List of root node names in the DAG.\n    is_valid_dag : bool\n    \
      \    Whether the constructed DAG is valid.\n\n    Returns\n    -------\n   \
      \ dict\n        A dictionary containing lists of node names, prompts, and\n\
      \        descriptions.\n\n    Raises\n    ------\n    ValueError\n        If\
      \ the input DAG structure is invalid or empty.\n\n    Examples\n    --------\n\
