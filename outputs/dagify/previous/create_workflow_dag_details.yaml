nodes:
  create_dag_structure:
    agent: false
    code_node_type: stub
    description: Create the DAG structure based on the subtasks and their dependencies.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass IdentifyDependenciesBetweenSubtasksOutput(BaseModel):\n    \"\"\"\
      Pydantic model for identify_dependencies_between_subtasks node outputs.\"\"\"\
      \n    dependencies_exist: bool = (\n        Field(..., description=\"Whether\
      \ dependencies exist between subtasks\")\n    )\n    dependency_list: str =\
      \ (\n        Field(..., description=\"List of dependencies between subtasks,\
      \ where each dependency is represented as 'subtask_id_1 -> subtask_id_2'\")\n\
      \    )\n\n\nclass CreateDagStructureOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for create_dag_structure node outputs.\"\"\"\n    dag_nodes: List[str] = (\n\
      \        Field(..., description=\"List of node names in the DAG\")\n    )\n\
      \    dag_edges: List[str] = (\n        Field(..., description=\"List of edges\
      \ in the DAG, represented as 'node1->node2'\")\n    )\n    root_nodes: List[str]\
      \ = (\n        Field(..., description=\"List of root node names in the DAG\"\
      )\n    )\n    is_valid_dag: bool = (\n        Field(..., description=\"Whether\
      \ the constructed DAG is valid\")\n    )\n\n\ndef create_dag_structure(identify_dependencies_between_subtasks_input:\
      \ IdentifyDependenciesBetweenSubtasksOutput, **kwargs) -> CreateDagStructureOutput:\n\
      \    \"\"\"\n    Creates a DAG structure based on subtasks and their dependencies.\n\
      \n    Parameters\n    ----------\n    subtasks : List[str]\n        List of\
      \ subtask names.\n    dependencies : List[str]\n        List of dependencies\
      \ between subtasks, where each dependency is\n        represented as 'subtask_id_1\
      \ -> subtask_id_2'.\n\n    Returns\n    -------\n    {dag_nodes: List[str],\
      \ dag_edges: List[str], root_nodes: List[str], is_valid_dag: bool}\n       \
      \ A dictionary containing the DAG nodes, edges, root nodes, and a flag\n   \
      \     indicating whether the DAG is valid.\n\n    Raises\n    ------\n    ValueError\n\
      \        If the dependencies form a cycle, making it impossible to create a\n\
      \        valid DAG.\n\n    Examples\n    --------\n    >>> subtasks = ['A',\
      \ 'B', 'C']\n    >>> dependencies = ['A -> B', 'B -> C']\n    >>> create_dag_structure(subtasks,\
      \ dependencies)\n    {'dag_nodes': ['A', 'B', 'C'], 'dag_edges': ['A->B', 'B->C'],\
      \ 'root_nodes':\n    ['A'], 'is_valid_dag': True}\n\n    \"\"\"\n    return\
      \ CreateDagStructureOutput(\n        dag_nodes=[],\n        dag_edges=[],\n\
      \        root_nodes=[],\n        is_valid_dag=False,\n    )"
    name: create_dag_structure
    nodes_depended_on:
    - identify_dependencies_between_subtasks
    nodes_dependent_on: []
    output_structure:
    - description: List of node names in the DAG
      key: dag_nodes
      type: List[str]
    - description: List of edges in the DAG, represented as 'node1->node2'
      key: dag_edges
      type: List[str]
    - description: List of root node names in the DAG
      key: root_nodes
      type: List[str]
    - description: Whether the constructed DAG is valid
      key: is_valid_dag
      type: bool
    prd:
      conceptual_info: Constructs a Directed Acyclic Graph (DAG) from given subtasks
        and their dependencies.
      docstring:
        examples:
        - lines:
          - subtasks = ['A', 'B', 'C']
          - dependencies = ['A -> B', 'B -> C']
          - create_dag_structure(subtasks, dependencies)
          output: '{''dag_nodes'': [''A'', ''B'', ''C''], ''dag_edges'': [''A->B'',
            ''B->C''], ''root_nodes'': [''A''], ''is_valid_dag'': True}'
        parameters:
        - description: List of subtask names.
          name: subtasks
          type: List[str]
        - description: List of dependencies between subtasks, where each dependency
            is represented as 'subtask_id_1 -> subtask_id_2'.
          name: dependencies
          type: List[str]
        raises:
        - description: If the dependencies form a cycle, making it impossible to create
            a valid DAG.
          type: ValueError
        returns:
          description: A dictionary containing the DAG nodes, edges, root nodes, and
            a flag indicating whether the DAG is valid.
          type: '{dag_nodes: List[str], dag_edges: List[str], root_nodes: List[str],
            is_valid_dag: bool}'
        summary: Creates a DAG structure based on subtasks and their dependencies.
    prompt: Using the subtasks and their dependencies, construct a Directed Acyclic
      Graph (DAG) that represents the workflow.
    shims: []
  decompose_task_into_subtasks:
    agent: false
    code_node_type: stub
    description: Decompose the task into smaller components that can be executed concurrently
      or sequentially.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass DefineTaskObjectiveOutput(BaseModel):\n    \"\"\"Pydantic model for\
      \ define_task_objective node outputs.\"\"\"\n    task_objective: str = (\n \
      \       Field(..., description=\"The primary objective or task that the workflow\
      \ will accomplish.\")\n    )\n    task_description: str = (\n        Field(...,\
      \ description=\"A detailed description of the task or objective.\")\n    )\n\
      \n\nclass DecomposeTaskIntoSubtasksOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for decompose_task_into_subtasks node outputs.\"\"\"\n    subtask_list: List[str]\
      \ = (\n        Field(..., description=\"List of subtasks or steps to achieve\
      \ the task objective\")\n    )\n    subtask_count: int = (\n        Field(...,\
      \ description=\"Number of subtasks or steps generated\")\n    )\n    sequencing_requirements:\
      \ str = (\n        Field(..., description=\"Description of any sequencing or\
      \ ordering requirements between subtasks\")\n    )\n\n\ndef decompose_task_into_subtasks(define_task_objective_input:\
      \ DefineTaskObjectiveOutput, **kwargs) -> DecomposeTaskIntoSubtasksOutput:\n\
      \    \"\"\"\n    Decompose a task into smaller subtasks or steps.\n\n    Parameters\n\
      \    ----------\n    task_objective : str\n        The primary objective or\
      \ task that the workflow will accomplish.\n    task_description : str\n    \
      \    A detailed description of the task or objective.\n\n    Returns\n    -------\n\
      \    dict\n        A dictionary containing the list of subtasks, the count of\
      \ subtasks,\n        and any sequencing requirements.\n\n    Raises\n    ------\n\
      \    ValueError\n        If the task objective or description is empty.\n\n\
      \    Examples\n    --------\n    >>> decompose_task_into_subtasks(task_objective='Create\
      \ a workflow',\n    task_description='Create a workflow to automate a process')\n\
      \    >>> print(result)\n    {'subtask_list': ['Define task objective', 'Identify\
      \ dependencies', 'Create\n    DAG structure'], 'subtask_count': 3, 'sequencing_requirements':\n\
      \    'Sequential'}\n\n    \"\"\"\n    return DecomposeTaskIntoSubtasksOutput(\n\
      \        subtask_list=[],\n        subtask_count=0,\n        sequencing_requirements=\"\
      \",\n    )"
    name: decompose_task_into_subtasks
    nodes_depended_on:
    - define_task_objective
    nodes_dependent_on: []
    output_structure:
    - description: List of subtasks or steps to achieve the task objective
      key: subtask_list
      type: List[str]
    - description: Number of subtasks or steps generated
      key: subtask_count
      type: int
    - description: Description of any sequencing or ordering requirements between
        subtasks
      key: sequencing_requirements
      type: str
    prd:
      conceptual_info: This node takes a task objective and breaks it down into smaller,
        manageable subtasks or steps.
      docstring:
        examples:
        - lines:
          - decompose_task_into_subtasks(task_objective='Create a workflow', task_description='Create
            a workflow to automate a process')
          - print(result)
          output: '{''subtask_list'': [''Define task objective'', ''Identify dependencies'',
            ''Create DAG structure''], ''subtask_count'': 3, ''sequencing_requirements'':
            ''Sequential''}'
        parameters:
        - description: The primary objective or task that the workflow will accomplish.
          name: task_objective
          type: str
        - description: A detailed description of the task or objective.
          name: task_description
          type: str
        raises:
        - description: If the task objective or description is empty.
          type: ValueError
        returns:
          description: A dictionary containing the list of subtasks, the count of
            subtasks, and any sequencing requirements.
          type: dict
        summary: Decompose a task into smaller subtasks or steps.
    prompt: Break down the task or objective into smaller, manageable subtasks or
      steps.
    shims: []
