      \ 'node_prompts': ['Task A', 'Task B', 'Task\n    C'], 'node_descriptions':\
      \ ['Description A', 'Description B', 'Description\n    C']}\n\n    \"\"\"\n\
      \    return DefineNodePromptsAndDescriptionsOutput(\n        node_names=[],\n\
      \        node_prompts=[],\n        node_descriptions=[],\n    )"
    name: define_node_prompts_and_descriptions
    nodes_depended_on:
