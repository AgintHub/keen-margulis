      docstring:
        examples:
        - lines:
          - node_names = ['A', 'B', 'C']
          - node_prompts = ['Task A', 'Task B', 'Task C']
          - node_descriptions = ['Description A', 'Description B', 'Description C']
          - result = define_node_prompts_and_descriptions(node_names, node_prompts,
            node_descriptions)
          output: '{''node_names'': [''A'', ''B'', ''C''], ''node_prompts'': [''Task
            A'', ''Task B'', ''Task C''], ''node_descriptions'': [''Description A'',
            ''Description B'', ''Description C'']}'
        parameters:
        - description: List of node names from the DAG structure.
          name: dag_nodes
          type: List[str]
        - description: List of edges in the DAG, represented as 'node1->node2'.
          name: dag_edges
          type: List[str]
        - description: List of root node names in the DAG.
          name: root_nodes
          type: List[str]
        - description: Whether the constructed DAG is valid.
          name: is_valid_dag
          type: bool
        raises:
        - description: If the input DAG structure is invalid or empty.
          type: ValueError
        returns:
          description: A dictionary containing lists of node names, prompts, and descriptions.
          type: dict
        summary: Generate node prompts and descriptions from the DAG structure.
    prompt: For each node in the DAG, define a clear and concise prompt or description
