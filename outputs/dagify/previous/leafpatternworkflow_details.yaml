        \    colors)\n    'The leaves exhibit common patterns such as parallel and\
        \ reticulate\n    venation. Variations include looped and branched patterns.\
        \ Vein patterns\n    range from simple to complex. The leaves are predominantly\
        \ green and\n    yellow.'\n\n    >>> common_patterns = 'net-like'\n    >>>\
