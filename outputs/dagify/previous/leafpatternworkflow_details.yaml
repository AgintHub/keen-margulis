dag_type: pure
description: Generated workflow from UI.
name: leafpatternworkflow
nodes:
  analyze_leaf_shapes:
    agent: false
    code_node_type: pure
    description: Analyze the shapes of leaves and categorize them
    implementation: "from ._analyze_leaf_shapes.validate_input_lengths import validate_input_lengths\n\
      from ._analyze_leaf_shapes.preprocess_leaf_images import preprocess_leaf_images\n\
      from ._analyze_leaf_shapes.normalize_characteristics import normalize_characteristics\n\
      from ._analyze_leaf_shapes.extract_shape_categories import extract_shape_categories\n\
      from ._analyze_leaf_shapes.count_shape_categories import count_shape_categories\n\
      \nfrom ._analyze_leaf_shapes.validate_input_lengths import validate_input_lengths\n\
      from ._analyze_leaf_shapes.preprocess_leaf_images import preprocess_leaf_images\n\
      from ._analyze_leaf_shapes.normalize_characteristics import normalize_characteristics\n\
      from ._analyze_leaf_shapes.extract_shape_categories import extract_shape_categories\n\
      from ._analyze_leaf_shapes.count_shape_categories import count_shape_categories\n\
      \nfrom pydantic import BaseModel, Field\nfrom typing import List\n\n\nclass\
      \ CollectLeafDataOutput(BaseModel):\n    \"\"\"Pydantic model for collect_leaf_data\
      \ node outputs.\"\"\"\n    leaf_images: List[str] = (\n        Field(..., description=\"\
      List of image file names or URLs of leaves\")\n    )\n    leaf_characteristics:\
      \ List[str] = (\n        Field(..., description = (\n            \"List of characteristic\
      \ descriptions for each leaf\")\n        )\n    )\n\n\nclass AnalyzeLeafShapesOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for analyze_leaf_shapes node outputs.\"\"\"\n    leaf_shape_categories:\
      \ List[str] = (\n        Field(..., description=\"List of shape categories for\
      \ the leaves\")\n    )\n    shape_category_counts: List[int] = (\n        Field(...,\
      \ description=\"Counts of leaves in each shape category\")\n    )\n\n\ndef analyze_leaf_shapes(collect_leaf_data_input:\
      \ CollectLeafDataOutput, **kwargs) -> AnalyzeLeafShapesOutput:\n    \"\"\"\n\
      \    Analyze leaf shapes and categorize them into different types based on the\n\
      \    collected leaf data.\n\n    Parameters\n    ----------\n    leaf_images\
      \ : List[str]\n        List of image file names or URLs of leaves collected\
      \ by the\n        'collect_leaf_data' node.\n    leaf_characteristics : List[str]\n\
      \        List of characteristic descriptions for each leaf collected by the\n\
      \        'collect_leaf_data' node.\n\n    Returns\n    -------\n    Tuple[List[str],\
      \ List[int]]\n        A tuple containing a list of shape categories for the\
      \ leaves and a\n        list of counts of leaves in each shape category.\n\n\
      \    Raises\n    ------\n    ValueError\n        If the input lists 'leaf_images'\
      \ and 'leaf_characteristics' are of\n        different lengths.\n\n    Examples\n\
      \    --------\n    >>> leaf_images = ['leaf1.jpg', 'leaf2.jpg', 'leaf3.jpg']\n\
      \    >>> leaf_characteristics = ['oval', 'lanceolate', 'cordate']\n    >>> leaf_shape_categories,\
      \ shape_category_counts =\n    analyze_leaf_shapes(leaf_images, leaf_characteristics)\n\
      \    (['oval', 'lanceolate', 'cordate'], [1, 1, 1])\n\n    >>> leaf_images =\
      \ ['leaf4.jpg', 'leaf5.jpg']\n    >>> leaf_characteristics = ['elliptical',\
      \ 'lanceolate']\n    >>> leaf_shape_categories, shape_category_counts =\n  \
      \  analyze_leaf_shapes(leaf_images, leaf_characteristics)\n    (['elliptical',\
      \ 'lanceolate'], [1, 1])\n\n    \"\"\"\n    validate_input_lengths(images=collect_leaf_data_input.leaf_images,\
      \ characteristics=collect_leaf_data_input.leaf_characteristics)\n    \n    processed_images:\
      \ List[str] = preprocess_leaf_images(images=collect_leaf_data_input.leaf_images)\n\
      \    normalized_characteristics: List[str] = normalize_characteristics(characteristics=collect_leaf_data_input.leaf_characteristics)\n\
      \    \n    shape_categories: List[str] = extract_shape_categories(images=processed_images,\
      \ characteristics=normalized_characteristics)\n    category_counts: List[int]\
      \ = count_shape_categories(categories=shape_categories)\n    \n    return AnalyzeLeafShapesOutput(\n\
      \        leaf_shape_categories=shape_categories,\n        shape_category_counts=category_counts\n\
      \    )"
    name: analyze_leaf_shapes
    nodes_depended_on:
    - collect_leaf_data
    nodes_dependent_on: []
    output_structure:
    - description: List of shape categories for the leaves
      key: leaf_shape_categories
      type: List[str]
    - description: Counts of leaves in each shape category
      key: shape_category_counts
      type: List[int]
    prd:
      conceptual_info: This node analyzes the shapes of leaves based on the data collected
        by the 'collect_leaf_data' node and categorizes them into different types.
      docstring:
        examples:
        - lines:
          - leaf_images = ['leaf1.jpg', 'leaf2.jpg', 'leaf3.jpg']
          - leaf_characteristics = ['oval', 'lanceolate', 'cordate']
          - leaf_shape_categories, shape_category_counts = analyze_leaf_shapes(leaf_images,
            leaf_characteristics)
          output: (['oval', 'lanceolate', 'cordate'], [1, 1, 1])
        - lines:
          - leaf_images = ['leaf4.jpg', 'leaf5.jpg']
          - leaf_characteristics = ['elliptical', 'lanceolate']
          - leaf_shape_categories, shape_category_counts = analyze_leaf_shapes(leaf_images,
            leaf_characteristics)
          output: (['elliptical', 'lanceolate'], [1, 1])
        parameters:
        - description: List of image file names or URLs of leaves collected by the
            'collect_leaf_data' node.
          name: leaf_images
          type: List[str]
        - description: List of characteristic descriptions for each leaf collected
            by the 'collect_leaf_data' node.
          name: leaf_characteristics
          type: List[str]
        raises:
        - description: If the input lists 'leaf_images' and 'leaf_characteristics'
            are of different lengths.
          type: ValueError
        returns:
          description: A tuple containing a list of shape categories for the leaves
            and a list of counts of leaves in each shape category.
          type: Tuple[List[str], List[int]]
        summary: Analyze leaf shapes and categorize them into different types based
          on the collected leaf data.
    prompt: Analyze the shapes of the collected leaves and categorize them into different
      types.
    shims:
    - agent: false
      code_node_type: virtual-pure
      description: Validates that the lengths of input images and characteristics
        are consistent.
      implementation: "def validate_input_lengths(images: str, characteristics: str)\
        \ -> str:\n    \"\"\"\n    Validates that the input lists of images and characteristics\
        \ have the same\n    length.\n\n    Parameters\n    ----------\n    images\
        \ : List[str]\n        List of image file names or URLs.\n    characteristics\
        \ : List[str]\n        List of characteristic descriptions for each image.\n\
        \n    Returns\n    -------\n    str\n        Output message indicating whether\
        \ the input lengths are valid.\n\n    Raises\n    ------\n    ValueError\n\
        \        When the lengths of images and characteristics do not match.\n\n\
        \    Examples\n    --------\n    >>> validate_input_lengths(images=['image1.jpg',\
        \ 'image2.jpg'],\n    characteristics=['char1', 'char2'])\n    'Input lengths\
        \ are valid.'\n\n    >>> validate_input_lengths(images=['image1.jpg'], characteristics=['char1',\n\
        \    'char2'])\n    ValueError: 'Lengths of images and characteristics do\
        \ not match.'\n\n    \"\"\"\n    if len(images) != len(characteristics):\n\
        \        raise ValueError(\"Lengths of images and characteristics do not match.\"\
        )\n    return \"Input lengths are valid.\""
      name: validate_input_lengths
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type Any
        key: output
        type: str
      - description: Input parameter of type str
        key: images
        type: str
      - description: Input parameter of type str
        key: characteristics
        type: str
      prd:
        conceptual_info: This shim node validates the consistency of input data lengths
          for further processing.
        docstring:
          examples:
          - lines:
            - validate_input_lengths(images=['image1.jpg', 'image2.jpg'], characteristics=['char1',
              'char2'])
            output: '''Input lengths are valid.'''
          - lines:
            - validate_input_lengths(images=['image1.jpg'], characteristics=['char1',
              'char2'])
            output: 'ValueError: ''Lengths of images and characteristics do not match.'''
          parameters:
          - description: List of image file names or URLs.
            name: images
            type: List[str]
          - description: List of characteristic descriptions for each image.
            name: characteristics
            type: List[str]
          raises:
          - description: When the lengths of images and characteristics do not match.
            type: ValueError
          returns:
            description: Output message indicating whether the input lengths are valid.
            type: str
          summary: Validates that the input lists of images and characteristics have
            the same length.
      prompt: Typed node for shim validate_input_lengths
      shims: []
    - agent: false
      code_node_type: virtual-pure
      description: A shim function to preprocess leaf images for further analysis.
      implementation: "from typing import List\n\n\nimport json\n\n\ndef preprocess_leaf_images(images:\
        \ str) -> List[str]:\n    \"\"\"\n    Preprocesses a list of leaf images represented\
        \ as file names or URLs.\n\n    Parameters\n    ----------\n    images : str\n\
        \        A string representing a list of image file names or URLs to be\n\
        \        preprocessed.\n\n    Returns\n    -------\n    List[str]\n      \
        \  A list of strings representing the preprocessed image file names or\n \
        \       URLs.\n\n    Raises\n    ------\n    ValueError\n        If the input\
        \ string is not a valid representation of a list of image\n        file names\
        \ or URLs.\n    TypeError\n        If the input is not a string.\n\n    Examples\n\
        \    --------\n    >>> preprocess_leaf_images(images='[\"image1.jpg\", \"\
        image2.jpg\"]')\n    ['preprocessed_image1.jpg', 'preprocessed_image2.jpg']\n\
        \n    >>> preprocess_leaf_images(images='[\"leaf1.png\", \"leaf2.png\"]')\n\
        \    ['preprocessed_leaf1.png', 'preprocessed_leaf2.png']\n\n    \"\"\"\n\
        \    \n    if not isinstance(images, str):\n        raise TypeError(\"Input\
        \ must be a string\")\n    \n    try:\n        image_list = json.loads(images)\n\
        \    except json.JSONDecodeError:\n        raise ValueError(\"Input string\
        \ is not a valid representation of a list of image file names or URLs\")\n\
        \    \n    if not isinstance(image_list, list):\n        raise ValueError(\"\
        Input string is not a valid representation of a list of image file names or\
        \ URLs\")\n    \n    preprocessed_images = []\n    for image in image_list:\n\
        \        if not isinstance(image, str):\n            raise ValueError(\"Input\
        \ string is not a valid representation of a list of image file names or URLs\"\
        )\n        \n        if '/' in image:\n            parts = image.rsplit('/',\
        \ 1)\n            if len(parts) == 2:\n                preprocessed_image\
        \ = parts[0] + '/preprocessed_' + parts[1]\n            else:\n          \
        \      preprocessed_image = 'preprocessed_' + image\n        else:\n     \
        \       preprocessed_image = 'preprocessed_' + image\n        \n        preprocessed_images.append(preprocessed_image)\n\
        \    \n    return preprocessed_images"
      name: preprocess_leaf_images
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: images
        type: str
      prd:
        conceptual_info: This shim function preprocesses leaf images, preparing them
          for analysis by potentially resizing, normalizing, or applying other necessary
          transformations.
        docstring:
          examples:
          - lines:
            - preprocess_leaf_images(images='["image1.jpg", "image2.jpg"]')
            output: '[''preprocessed_image1.jpg'', ''preprocessed_image2.jpg'']'
          - lines:
            - preprocess_leaf_images(images='["leaf1.png", "leaf2.png"]')
            output: '[''preprocessed_leaf1.png'', ''preprocessed_leaf2.png'']'
          parameters:
          - description: A string representing a list of image file names or URLs
              to be preprocessed.
            name: images
            type: str
          raises:
          - description: If the input string is not a valid representation of a list
              of image file names or URLs.
            type: ValueError
          - description: If the input is not a string.
            type: TypeError
          returns:
            description: A list of strings representing the preprocessed image file
              names or URLs.
            type: List[str]
          summary: Preprocesses a list of leaf images represented as file names or
            URLs.
      prompt: 'Description: Typed node for shim preprocess_leaf_images'
      shims: []
    - agent: false
      code_node_type: virtual-pure
      description: Normalizes a list of leaf characteristics into a standardized format.
      implementation: "from typing import List\n\n\nimport re\n\n\ndef normalize_characteristics(characteristics:\
        \ str) -> List[str]:\n    \"\"\"\n    Normalizes a string of leaf characteristics\
        \ into a list of standardized\n    format.\n\n    Parameters\n    ----------\n\
        \    characteristics : str\n        Input string containing leaf characteristics\
        \ to be normalized\n\n    Returns\n    -------\n    List[str]\n        List\
        \ of normalized characteristic descriptions for each leaf\n\n    Raises\n\
        \    ------\n    ValueError\n        When the input string is empty or contains\
        \ invalid characters\n    TypeError\n        When the input is not a string\n\
        \n    Examples\n    --------\n    >>> normalize_characteristics(characteristics='large,\
        \ green, oval-shaped')\n    >>> normalize_characteristics(characteristics='small,\
        \ yellow, heart-shaped')\n    ['large', 'green', 'oval-shaped']\n    ['small',\
        \ 'yellow', 'heart-shaped']\n\n    >>> normalize_characteristics(characteristics='')\n\
        \    []\n\n    \"\"\"\n    if not isinstance(characteristics, str):\n    \
        \    raise TypeError(\"Input must be a string\")\n    \n    if not characteristics:\n\
        \        return []\n    \n    \n    if not re.match(r'^[a-zA-Z0-9\\s,\\-]+$',\
        \ characteristics):\n        raise ValueError(\"Input contains invalid characters\"\
        )\n    \n    parts = [part.strip() for part in characteristics.split(',')]\n\
        \    normalized = [part for part in parts if part]\n    \n    return normalized"
      name: normalize_characteristics
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: characteristics
        type: str
      prd:
        conceptual_info: This shim function takes a string of leaf characteristics,
          normalizes it, and returns a list of normalized characteristic descriptions.
        docstring:
          examples:
          - lines:
            - normalize_characteristics(characteristics='large, green, oval-shaped')
            - normalize_characteristics(characteristics='small, yellow, heart-shaped')
            output: '[''large'', ''green'', ''oval-shaped'']

              [''small'', ''yellow'', ''heart-shaped'']'
          - lines:
            - normalize_characteristics(characteristics='')
            output: '[]'
          parameters:
          - description: Input string containing leaf characteristics to be normalized
            name: characteristics
            type: str
          raises:
          - description: When the input string is empty or contains invalid characters
            type: ValueError
          - description: When the input is not a string
            type: TypeError
          returns:
            description: List of normalized characteristic descriptions for each leaf
            type: List[str]
          summary: Normalizes a string of leaf characteristics into a list of standardized
            format.
      prompt: Typed node for shim normalize_characteristics
      shims: []
    - agent: false
      code_node_type: virtual-pure
      description: Extracts shape categories from leaf images and their characteristics.
      implementation: "from typing import List\n\n\ndef extract_shape_categories(images:\
        \ str, characteristics: str) -> List[str]:\n    \"\"\"\n    Extract shape\
        \ categories from leaf images and their characteristics.\n\n    Parameters\n\
        \    ----------\n    images : List[str]\n        List of image file names\
        \ or URLs of leaves.\n    characteristics : List[str]\n        List of characteristic\
        \ descriptions for each leaf.\n\n    Returns\n    -------\n    List[str]\n\
        \        List of shape categories for the leaves.\n\n    Raises\n    ------\n\
        \    ValueError\n        When the lengths of images and characteristics lists\
        \ do not match.\n    TypeError\n        When the input types are not as expected\
        \ (e.g., not lists or not\n        strings).\n\n    Examples\n    --------\n\
        \    >>> images = ['leaf1.jpg', 'leaf2.jpg']\n    >>> characteristics = ['oval',\
        \ 'lanceolate']\n    >>> shape_categories = extract_shape_categories(images,\
        \ characteristics)\n    ['oval', 'lanceolate']\n\n    >>> images = ['leaf3.jpg']\n\
        \    >>> characteristics = ['heart-shaped']\n    >>> shape_categories = extract_shape_categories(images,\
        \ characteristics)\n    ['heart-shaped']\n\n    \"\"\"\n    if not isinstance(images,\
        \ list) or not isinstance(characteristics, list):\n        raise TypeError(\"\
        Both images and characteristics must be lists\")\n    \n    if not all(isinstance(img,\
        \ str) for img in images):\n        raise TypeError(\"All items in images\
        \ list must be strings\")\n    \n    if not all(isinstance(char, str) for\
        \ char in characteristics):\n        raise TypeError(\"All items in characteristics\
        \ list must be strings\")\n    \n    if len(images) != len(characteristics):\n\
        \        raise ValueError(\"The lengths of images and characteristics lists\
        \ do not match\")\n    \n    shape_categories = []\n    for characteristic\
        \ in characteristics:\n        characteristic = characteristic.strip().lower()\n\
        \        if 'oval' in characteristic:\n            shape_categories.append('oval')\n\
        \        elif 'lanceolate' in characteristic:\n            shape_categories.append('lanceolate')\n\
        \        elif 'heart' in characteristic:\n            shape_categories.append('heart-shaped')\n\
        \        else:\n            shape_categories.append(characteristic)\n    \n\
        \    return shape_categories"
      name: extract_shape_categories
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: images
        type: str
      - description: Input parameter of type str
        key: characteristics
        type: str
      prd:
        conceptual_info: This shim function is designed to extract shape categories
          from a list of leaf images and their corresponding characteristics. It plays
          a crucial role in the leaf shape analysis pipeline.
        docstring:
          examples:
          - lines:
            - images = ['leaf1.jpg', 'leaf2.jpg']
            - characteristics = ['oval', 'lanceolate']
            - shape_categories = extract_shape_categories(images, characteristics)
            output: '[''oval'', ''lanceolate'']'
          - lines:
            - images = ['leaf3.jpg']
            - characteristics = ['heart-shaped']
            - shape_categories = extract_shape_categories(images, characteristics)
            output: '[''heart-shaped'']'
          parameters:
          - description: List of image file names or URLs of leaves.
            name: images
            type: List[str]
          - description: List of characteristic descriptions for each leaf.
            name: characteristics
            type: List[str]
          raises:
          - description: When the lengths of images and characteristics lists do not
              match.
            type: ValueError
          - description: When the input types are not as expected (e.g., not lists
              or not strings).
            type: TypeError
          returns:
            description: List of shape categories for the leaves.
            type: List[str]
          summary: Extract shape categories from leaf images and their characteristics.
      prompt: Extract shape categories from the given leaf images and characteristics.
      shims: []
    - agent: false
      code_node_type: virtual-pure
      description: Counts the occurrences of each shape category in the given list
        of categories.
      implementation: "from typing import List\n\n\ndef count_shape_categories(categories:\
        \ str) -> List[int]:\n    \"\"\"\n    Counts the occurrences of each shape\
        \ category in the given list of\n    categories.\n\n    Parameters\n    ----------\n\
        \    categories : str\n        A string representing the shape categories,\
        \ expected to be a list or\n        a string that can be parsed into a list\
        \ of categories.\n\n    Returns\n    -------\n    List[int]\n        A list\
        \ of integers where each integer represents the count of a\n        unique\
        \ shape category in the input.\n\n    Raises\n    ------\n    ValueError\n\
        \        If the input categories are not in an expected format or if there's\n\
        \        an issue parsing the categories.\n    TypeError\n        If the input\
        \ categories are not of type str or if the parsed\n        categories are\
        \ not as expected.\n\n    Examples\n    --------\n    >>> count_shape_categories(categories='category1,category2,category1')\n\
        \    [2, 1]\n\n    >>> count_shape_categories(categories='oval, lance, oval,\
        \ round')\n    [2, 1, 1]\n\n    \"\"\"\n    if not isinstance(categories,\
        \ str):\n        raise TypeError(\"Input categories must be of type str\"\
        )\n    \n    if not categories.strip():\n        raise ValueError(\"Input\
        \ categories string is empty or contains only whitespace\")\n    \n    try:\n\
        \        category_list = [cat.strip() for cat in categories.split(',')]\n\
        \        category_list = [cat for cat in category_list if cat]  # Remove empty\
        \ strings\n        \n        if not category_list:\n            raise ValueError(\"\
        No valid categories found after parsing\")\n        \n        unique_categories\
        \ = []\n        counts = []\n        \n        for category in category_list:\n\
        \            if category in unique_categories:\n                index = unique_categories.index(category)\n\
        \                counts[index] += 1\n            else:\n                unique_categories.append(category)\n\
        \                counts.append(1)\n        \n        return counts\n    \n\
        \    except Exception as e:\n        if isinstance(e, (ValueError, TypeError)):\n\
        \            raise\n        raise ValueError(\"Error parsing categories\"\
        ) from e"
      name: count_shape_categories
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[int]
        key: output
        type: List[int]
      - description: Input parameter of type str
        key: categories
        type: str
      prd:
        conceptual_info: This shim node is responsible for counting the occurrences
          of each shape category in a given list, playing a crucial role in analyzing
          leaf shapes.
        docstring:
          examples:
          - lines:
            - count_shape_categories(categories='category1,category2,category1')
            output: '[2, 1]'
          - lines:
            - count_shape_categories(categories='oval, lance, oval, round')
            output: '[2, 1, 1]'
          parameters:
          - description: A string representing the shape categories, expected to be
              a list or a string that can be parsed into a list of categories.
            name: categories
            type: str
          raises:
          - description: If the input categories are not in an expected format or
              if there's an issue parsing the categories.
            type: ValueError
          - description: If the input categories are not of type str or if the parsed
              categories are not as expected.
            type: TypeError
          returns:
            description: A list of integers where each integer represents the count
              of a unique shape category in the input.
            type: List[int]
          summary: Counts the occurrences of each shape category in the given list
            of categories.
      prompt: Typed node for shim count_shape_categories
      shims: []
  collect_leaf_data:
    agent: false
    code_node_type: pure
    description: Gather data on various leaf patterns including images and characteristics
    implementation: "from ._collect_leaf_data.identify_leaf_data_sources import identify_leaf_data_sources\n\
      from ._collect_leaf_data.gather_raw_leaf_data import gather_raw_leaf_data\n\
      from ._collect_leaf_data.extract_leaf_images import extract_leaf_images\nfrom\
      \ ._collect_leaf_data.process_and_validate_images import process_and_validate_images\n\
      from ._collect_leaf_data.extract_leaf_characteristics import extract_leaf_characteristics\n\
      from ._collect_leaf_data.validate_characteristics import validate_characteristics\n\
      \nfrom ._collect_leaf_data.identify_leaf_data_sources import identify_leaf_data_sources\n\
      from ._collect_leaf_data.gather_raw_leaf_data import gather_raw_leaf_data\n\
      from ._collect_leaf_data.extract_leaf_images import extract_leaf_images\nfrom\
      \ ._collect_leaf_data.process_and_validate_images import process_and_validate_images\n\
      from ._collect_leaf_data.extract_leaf_characteristics import extract_leaf_characteristics\n\
      from ._collect_leaf_data.validate_characteristics import validate_characteristics\n\
      \nfrom pydantic import BaseModel, Field\nfrom typing import List\n\n\nclass\
      \ CollectLeafDataOutput(BaseModel):\n    \"\"\"Pydantic model for collect_leaf_data\
      \ node outputs.\"\"\"\n    leaf_images: List[str] = (\n        Field(..., description=\"\
      List of image file names or URLs of leaves\")\n    )\n    leaf_characteristics:\
      \ List[str] = (\n        Field(..., description = (\n            \"List of characteristic\
      \ descriptions for each leaf\")\n        )\n    )\n\n\ndef collect_leaf_data(general_input:\
      \ str, **kwargs) -> CollectLeafDataOutput:\n    \"\"\"\n    Collects leaf images\
      \ and their characteristics, returning lists of image\n    file names/URLs and\
      \ characteristic descriptions.\n\n    Returns\n    -------\n    Tuple[List[str],\
