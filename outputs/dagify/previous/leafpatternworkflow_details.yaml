        \ such as non-string inputs.\n\n    Examples\n    --------\n    >>> common_patterns\
        \ = 'parallel, reticulate'\n    >>> variations = 'looped, branched'\n    >>>\
        \ vein_patterns = 'simple, complex'\n    >>> colors = 'green, yellow'\n  \
