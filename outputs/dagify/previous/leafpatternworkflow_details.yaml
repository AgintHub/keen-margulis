        \ = []\n    \n    if len(common_patterns_list) == 1:\n        summary_parts.append(f\"\
        The leaves exhibit common patterns such as {common_patterns_list[0]} venation.\"\
        )\n    else:\n        patterns_text = ' and '.join([', '.join(common_patterns_list[:-1]),\
        \ common_patterns_list[-1]])\n        summary_parts.append(f\"The leaves exhibit\
