dag_type: shim
description: A workflow for analyzing sports data to extract insights and meaningful
  statistics
name: sportsanalysisworkflow
nodes:
  analyze_player_performance:
    agent: false
    code_node_type: shim
    description: Examine player statistics to determine strengths, weaknesses, and
      areas for improvement.
    implementation: "from ._analyze_player_performance.validate_input_data import\
      \ validate_input_data\nfrom ._analyze_player_performance.calculate_performance_metrics\
      \ import calculate_performance_metrics\nfrom ._analyze_player_performance.identify_player_strengths\
      \ import identify_player_strengths\nfrom ._analyze_player_performance.identify_player_weaknesses\
      \ import identify_player_weaknesses\nfrom ._analyze_player_performance.determine_improvement_areas\
      \ import determine_improvement_areas\n\nfrom pydantic import BaseModel, Field\n\
      from typing import List\n\n\nclass CleanAndPreprocessDataOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for clean_and_preprocess_data node outputs.\"\"\"\n\
      \    cleaned_game_statistics: List[float] = (\n        Field(..., description=\"\
      Cleaned game statistics\")\n    )\n    preprocessed_player_information: List[str]\
      \ = (\n        Field(..., description=\"Preprocessed player information\")\n\
      \    )\n    transformed_team_performance_metrics: List[float] = (\n        Field(...,\
      \ description=\"Transformed team performance metrics\")\n    )\n    data_quality_score:\
      \ float = (\n        Field(..., description=\"Score indicating data quality\"\
      )\n    )\n\n\nclass AnalyzePlayerPerformanceOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for analyze_player_performance node outputs.\"\"\"\n    player_performance_metrics:\
      \ List[float] = (\n        Field(..., description=\"List of player performance\
      \ metrics\")\n    )\n    player_strengths: List[str] = (\n        Field(...,\
      \ description=\"List of player strengths\")\n    )\n    player_weaknesses: List[str]\
      \ = (\n        Field(..., description=\"List of player weaknesses\")\n    )\n\
      \    areas_for_improvement: List[str] = (\n        Field(..., description=\"\
      List of areas for player improvement\")\n    )\n\n\ndef analyze_player_performance(clean_and_preprocess_data_input:\
      \ CleanAndPreprocessDataOutput, **kwargs) -> AnalyzePlayerPerformanceOutput:\n\
      \    \"\"\"\n    Analyzes player performance using preprocessed data to identify\
      \ key metrics\n    and trends.\n\n    Parameters\n    ----------\n    preprocessed_player_information\
      \ : List[str]\n        Preprocessed player information from the clean_and_preprocess_data\n\
      \        node.\n    cleaned_game_statistics : List[float]\n        Cleaned game\
      \ statistics from the clean_and_preprocess_data node.\n\n    Returns\n    -------\n\
      \    Tuple[List[float], List[str], List[str], List[str]]\n        A tuple containing\
      \ player performance metrics, strengths,\n        weaknesses, and areas for\
      \ improvement.\n\n    Raises\n    ------\n    ValueError\n        If preprocessed_player_information\
      \ or cleaned_game_statistics are\n        empty or malformed.\n\n    Examples\n\
      \    --------\n    >>> preprocessed_data = ['Player1', 'Player2']\n    >>> game_stats\
      \ = [0.8, 0.9]\n    >>> result = analyze_player_performance(preprocessed_data,\
      \ game_stats)\n    ([0.85, 0.9], ['Consistency'], ['Scoring'], ['Defense'])\n\
      \n    \"\"\"\n    validate_input_data(preprocessed_player_info=clean_and_preprocess_data_input.preprocessed_player_information,\
      \ game_stats=clean_and_preprocess_data_input.cleaned_game_statistics)\n    \n\
      \    performance_metrics: List[float] = calculate_performance_metrics(game_statistics=clean_and_preprocess_data_input.cleaned_game_statistics,\
      \ player_info=clean_and_preprocess_data_input.preprocessed_player_information)\n\
      \    \n    strengths: List[str] = identify_player_strengths(performance_metrics=performance_metrics,\
      \ player_info=clean_and_preprocess_data_input.preprocessed_player_information)\n\
      \    \n    weaknesses: List[str] = identify_player_weaknesses(performance_metrics=performance_metrics,\
      \ game_stats=clean_and_preprocess_data_input.cleaned_game_statistics)\n    \n\
      \    improvement_areas: List[str] = determine_improvement_areas(strengths=strengths,\
      \ weaknesses=weaknesses, performance_metrics=performance_metrics)\n    \n  \
      \  return AnalyzePlayerPerformanceOutput(\n        player_performance_metrics=performance_metrics,\n\
      \        player_strengths=strengths,\n        player_weaknesses=weaknesses,\n\
      \        areas_for_improvement=improvement_areas\n    )"
    name: analyze_player_performance
    nodes_depended_on:
    - clean_and_preprocess_data
    nodes_dependent_on: []
    output_structure:
    - description: List of player performance metrics
      key: player_performance_metrics
      type: List[float]
    - description: List of player strengths
      key: player_strengths
      type: List[str]
    - description: List of player weaknesses
      key: player_weaknesses
      type: List[str]
    - description: List of areas for player improvement
      key: areas_for_improvement
      type: List[str]
    prd:
      conceptual_info: Analyzes preprocessed player data to identify performance metrics,
        strengths, weaknesses, and areas for improvement.
      docstring:
        examples:
        - lines:
          - preprocessed_data = ['Player1', 'Player2']
          - game_stats = [0.8, 0.9]
          - result = analyze_player_performance(preprocessed_data, game_stats)
          output: ([0.85, 0.9], ['Consistency'], ['Scoring'], ['Defense'])
        parameters:
        - description: Preprocessed player information from the clean_and_preprocess_data
            node.
          name: preprocessed_player_information
          type: List[str]
        - description: Cleaned game statistics from the clean_and_preprocess_data
            node.
          name: cleaned_game_statistics
          type: List[float]
        raises:
        - description: If preprocessed_player_information or cleaned_game_statistics
            are empty or malformed.
          type: ValueError
        returns:
          description: A tuple containing player performance metrics, strengths, weaknesses,
            and areas for improvement.
          type: Tuple[List[float], List[str], List[str], List[str]]
        summary: Analyzes player performance using preprocessed data to identify key
          metrics and trends.
    prompt: Analyze player performance using the preprocessed data to identify key
      metrics and trends.
    shims:
    - agent: false
      code_node_type: virtual-stub
      description: Validates the preprocessed player information and game statistics
        to ensure they are in the correct format for further analysis.
      implementation: "def validate_input_data(preprocessed_player_info: str, game_stats:\
        \ str) -> str:\n    \"\"\"\n    Validates preprocessed player information\
        \ and game statistics.\n\n    Parameters\n    ----------\n    preprocessed_player_info\
        \ : str\n        Preprocessed player information in string format\n    game_stats\
        \ : str\n        Game statistics in string format\n\n    Returns\n    -------\n\
        \    str\n        Output indicating whether the input data is valid\n\n  \
        \  Raises\n    ------\n    ValueError\n        When the input data is not\
        \ in the expected format\n    TypeError\n        When the input types are\
        \ not as expected\n\n    Examples\n    --------\n    >>> validate_input_data(preprocessed_player_info='[\"\
        John\", \"Doe\"]',\n    game_stats='[1, 2, 3]')\n    'Valid input data'\n\n\
        \    >>> validate_input_data(preprocessed_player_info='Invalid input',\n \
        \   game_stats='[1, 2, 3]')\n    'Invalid input data'\n\n    \"\"\"\n    raise\
        \ NotImplementedError(\"This is a virtual stub node that needs to be implemented\"\
        )"
      name: validate_input_data
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type Any
        key: output
        type: str
      - description: Input parameter of type str
        key: preprocessed_player_info
        type: str
      - description: Input parameter of type str
        key: game_stats
        type: str
      prd:
        conceptual_info: This shim node is responsible for validating the preprocessed
          player information and game statistics, ensuring they are correctly formatted
          and contain the necessary data for subsequent analysis.
        docstring:
          examples:
          - lines:
            - validate_input_data(preprocessed_player_info='["John", "Doe"]', game_stats='[1,
              2, 3]')
            output: '''Valid input data'''
          - lines:
            - validate_input_data(preprocessed_player_info='Invalid input', game_stats='[1,
              2, 3]')
            output: '''Invalid input data'''
          parameters:
          - description: Preprocessed player information in string format
            name: preprocessed_player_info
            type: str
          - description: Game statistics in string format
            name: game_stats
            type: str
          raises:
          - description: When the input data is not in the expected format
            type: ValueError
          - description: When the input types are not as expected
            type: TypeError
          returns:
            description: Output indicating whether the input data is valid
            type: str
          summary: Validates preprocessed player information and game statistics.
      prompt: Validate the preprocessed player information and game statistics
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Calculates player performance metrics based on game statistics
        and player information.
      implementation: "from typing import List\n\n\ndef calculate_performance_metrics(game_statistics:\
        \ str, player_info: str) -> List[float]:\n    \"\"\"\n    Calculates player\
        \ performance metrics based on the provided game statistics\n    and player\
        \ information.\n\n    Parameters\n    ----------\n    game_statistics : str\n\
        \        String representation of game statistics that will be used to\n \
        \       calculate performance metrics.\n    player_info : str\n        String\
        \ representation of player information that will be used to\n        calculate\
        \ performance metrics.\n\n    Returns\n    -------\n    List[float]\n    \
        \    A list of floating-point numbers representing the calculated player\n\
        \        performance metrics.\n\n    Raises\n    ------\n    ValueError\n\
        \        If the input game statistics or player information is invalid or\n\
        \        cannot be processed.\n    TypeError\n        If the input types are\
        \ not as expected (e.g., not strings).\n\n    Examples\n    --------\n   \
        \ >>> game_stats = 'points:10,rebounds:5,assists:7'\n    >>> player_info =\
        \ 'name:John,position:Forward,minutes_played:30'\n    >>> performance_metrics\
        \ =\n    calculate_performance_metrics(game_statistics=game_stats,\n    player_info=player_info)\n\
        \    [0.8, 0.7, 0.9]\n\n    >>> game_stats = 'points:15,rebounds:3,assists:5'\n\
        \    >>> player_info = 'name:Jane,position:Guard,minutes_played:25'\n    >>>\
        \ performance_metrics =\n    calculate_performance_metrics(game_statistics=game_stats,\n\
        \    player_info=player_info)\n    [0.9, 0.6, 0.8]\n\n    \"\"\"\n    raise\
        \ NotImplementedError(\"This is a virtual stub node that needs to be implemented\"\
        )"
      name: calculate_performance_metrics
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[float]
        key: output
        type: List[float]
      - description: Input parameter of type str
        key: game_statistics
        type: str
      - description: Input parameter of type str
        key: player_info
        type: str
      prd:
        conceptual_info: This shim node is responsible for computing player performance
          metrics by processing game statistics and player information.
        docstring:
          examples:
          - lines:
            - game_stats = 'points:10,rebounds:5,assists:7'
            - player_info = 'name:John,position:Forward,minutes_played:30'
            - performance_metrics = calculate_performance_metrics(game_statistics=game_stats,
              player_info=player_info)
            output: '[0.8, 0.7, 0.9]'
          - lines:
            - game_stats = 'points:15,rebounds:3,assists:5'
            - player_info = 'name:Jane,position:Guard,minutes_played:25'
            - performance_metrics = calculate_performance_metrics(game_statistics=game_stats,
              player_info=player_info)
            output: '[0.9, 0.6, 0.8]'
          parameters:
          - description: String representation of game statistics that will be used
              to calculate performance metrics.
            name: game_statistics
            type: str
          - description: String representation of player information that will be
              used to calculate performance metrics.
            name: player_info
            type: str
          raises:
          - description: If the input game statistics or player information is invalid
              or cannot be processed.
            type: ValueError
          - description: If the input types are not as expected (e.g., not strings).
            type: TypeError
          returns:
            description: A list of floating-point numbers representing the calculated
              player performance metrics.
            type: List[float]
          summary: Calculates player performance metrics based on the provided game
            statistics and player information.
      prompt: Implement a function to calculate player performance metrics using game
        statistics and player information.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Identifies player strengths based on performance metrics and player
        information.
      implementation: "from typing import List\n\n\ndef identify_player_strengths(performance_metrics:\
        \ str, player_info: str) -> List[str]:\n    \"\"\"\n    Analyzes performance\
        \ metrics and player information to identify player\n    strengths.\n\n  \
        \  Parameters\n    ----------\n    performance_metrics : str\n        String\
        \ representation of performance metrics used to identify\n        strengths.\n\
        \    player_info : str\n        String containing relevant information about\
        \ the player.\n\n    Returns\n    -------\n    List[str]\n        A list of\
        \ strings representing the identified strengths of the\n        player.\n\n\
        \    Raises\n    ------\n    ValueError\n        If the input performance\
        \ metrics or player information are invalid\n        or cannot be processed.\n\
        \    TypeError\n        If the input types are not as expected (e.g., not\
        \ strings).\n\n    Examples\n    --------\n    >>> identify_player_strengths(performance_metrics='[0.8,\
        \ 0.7, 0.9]',\n    player_info='Experienced player with strong shooting skills')\n\
        \    >>> print(output)\n    ['Shooting', 'Teamwork']\n\n    >>> identify_player_strengths(performance_metrics='[0.4,\
        \ 0.6, 0.5]',\n    player_info='New player with potential')\n    >>> print(output)\n\
        \    ['Speed', 'Agility']\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: identify_player_strengths
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: performance_metrics
        type: str
      - description: Input parameter of type str
        key: player_info
        type: str
      prd:
        conceptual_info: This shim node is responsible for analyzing player performance
          metrics and information to identify the player's strengths, playing a crucial
          role in the player performance analysis pipeline.
        docstring:
          examples:
          - lines:
            - identify_player_strengths(performance_metrics='[0.8, 0.7, 0.9]', player_info='Experienced
              player with strong shooting skills')
            - print(output)
            output: '[''Shooting'', ''Teamwork'']'
          - lines:
            - identify_player_strengths(performance_metrics='[0.4, 0.6, 0.5]', player_info='New
              player with potential')
            - print(output)
            output: '[''Speed'', ''Agility'']'
          parameters:
          - description: String representation of performance metrics used to identify
              strengths.
            name: performance_metrics
            type: str
          - description: String containing relevant information about the player.
            name: player_info
            type: str
          raises:
          - description: If the input performance metrics or player information are
              invalid or cannot be processed.
            type: ValueError
          - description: If the input types are not as expected (e.g., not strings).
            type: TypeError
          returns:
            description: A list of strings representing the identified strengths of
              the player.
            type: List[str]
          summary: Analyzes performance metrics and player information to identify
            player strengths.
      prompt: Analyze the given performance metrics and player information to determine
        the player's strengths.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: This shim node identifies player weaknesses by analyzing performance
        metrics and game statistics.
      implementation: "from typing import List\n\n\ndef identify_player_weaknesses(performance_metrics:\
        \ str, game_stats: str) -> List[str]:\n    \"\"\"\n    Identify player weaknesses\
        \ based on performance metrics and game statistics.\n\n    Parameters\n  \
        \  ----------\n    performance_metrics : str\n        String representation\
        \ of performance metrics used to identify\n        weaknesses\n    game_stats\
        \ : str\n        String representation of game statistics used in conjunction\
        \ with\n        performance metrics\n\n    Returns\n    -------\n    List[str]\n\
        \        List of strings representing the identified player weaknesses\n\n\
        \    Raises\n    ------\n    ValueError\n        Raised when the input performance\
        \ metrics or game statistics are\n        invalid or malformed\n    TypeError\n\
        \        Raised when the input types do not match the expected string type\n\
        \n    Examples\n    --------\n    >>> identify_player_weaknesses(performance_metrics='[0.8,\
        \ 0.7, 0.9]',\n    game_stats='[100, 80, 90]')\n    ['Weakness in scoring',\
        \ 'Area for improvement in defense']\n\n    >>> identify_player_weaknesses(performance_metrics='[0.5,\
        \ 0.6, 0.4]',\n    game_stats='[50, 60, 40]')\n    ['Needs improvement in\
        \ overall performance', 'Low scoring rate']\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: identify_player_weaknesses
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: performance_metrics
        type: str
      - description: Input parameter of type str
        key: game_stats
        type: str
      prd:
        conceptual_info: This shim node plays a crucial role in player performance
          analysis by identifying weaknesses that need improvement.
        docstring:
          examples:
          - lines:
            - identify_player_weaknesses(performance_metrics='[0.8, 0.7, 0.9]', game_stats='[100,
              80, 90]')
            output: '[''Weakness in scoring'', ''Area for improvement in defense'']'
          - lines:
            - identify_player_weaknesses(performance_metrics='[0.5, 0.6, 0.4]', game_stats='[50,
              60, 40]')
            output: '[''Needs improvement in overall performance'', ''Low scoring
              rate'']'
          parameters:
          - description: String representation of performance metrics used to identify
              weaknesses
            name: performance_metrics
            type: str
          - description: String representation of game statistics used in conjunction
              with performance metrics
            name: game_stats
            type: str
          raises:
          - description: Raised when the input performance metrics or game statistics
              are invalid or malformed
            type: ValueError
          - description: Raised when the input types do not match the expected string
              type
            type: TypeError
          returns:
            description: List of strings representing the identified player weaknesses
            type: List[str]
          summary: Identify player weaknesses based on performance metrics and game
            statistics.
      prompt: Identify player weaknesses based on performance metrics and game statistics
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Determines areas for player improvement based on their strengths,
        weaknesses, and performance metrics.
      implementation: "from typing import List\n\n\ndef determine_improvement_areas(strengths:\
        \ str, weaknesses: str, performance_metrics: str) -> List[str]:\n    \"\"\"\
        \n    Determines areas for player improvement based on strengths, weaknesses,\
        \ and\n    performance metrics.\n\n    Parameters\n    ----------\n    strengths\
        \ : str\n        The player's strengths as identified by the system.\n   \
        \ weaknesses : str\n        The player's weaknesses as identified by the system.\n\
        \    performance_metrics : str\n        The player's performance metrics used\
        \ to assess their overall\n        performance.\n\n    Returns\n    -------\n\
        \    List[str]\n        A list of areas where the player needs improvement.\n\
        \n    Raises\n    ------\n    ValueError\n        If the input parameters\
        \ are not valid or are missing required\n        information.\n    TypeError\n\
        \        If the input parameters are not of the expected type.\n\n    Examples\n\
        \    --------\n    >>> strengths = 'good shooting, fast runner'\n    >>> weaknesses\
        \ = 'poor defense, slow passer'\n    >>> performance_metrics = '70% shooting\
        \ accuracy, 4.5 speed rating'\n    >>> improvement_areas = determine_improvement_areas(strengths,\
        \ weaknesses,\n    performance_metrics)\n    ['defensive techniques', 'passing\
        \ accuracy']\n\n    >>> strengths = 'excellent dribbling, high stamina'\n\
        \    >>> weaknesses = 'inaccurate shooting, weak tackling'\n    >>> performance_metrics\
        \ = '90% dribbling success, 8.5 stamina rating'\n    >>> improvement_areas\
        \ = determine_improvement_areas(strengths, weaknesses,\n    performance_metrics)\n\
        \    ['shooting practice', 'tackling drills']\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: determine_improvement_areas
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: strengths
        type: str
      - description: Input parameter of type str
        key: weaknesses
        type: str
      - description: Input parameter of type str
        key: performance_metrics
        type: str
      prd:
        conceptual_info: This shim function plays a crucial role in analyzing player
          performance by identifying areas that require improvement based on their
          strengths, weaknesses, and performance metrics.
        docstring:
          examples:
          - lines:
            - strengths = 'good shooting, fast runner'
            - weaknesses = 'poor defense, slow passer'
            - performance_metrics = '70% shooting accuracy, 4.5 speed rating'
            - improvement_areas = determine_improvement_areas(strengths, weaknesses,
              performance_metrics)
            output: '[''defensive techniques'', ''passing accuracy'']'
          - lines:
            - strengths = 'excellent dribbling, high stamina'
            - weaknesses = 'inaccurate shooting, weak tackling'
            - performance_metrics = '90% dribbling success, 8.5 stamina rating'
            - improvement_areas = determine_improvement_areas(strengths, weaknesses,
              performance_metrics)
            output: '[''shooting practice'', ''tackling drills'']'
          parameters:
          - description: The player's strengths as identified by the system.
            name: strengths
            type: str
          - description: The player's weaknesses as identified by the system.
            name: weaknesses
            type: str
          - description: The player's performance metrics used to assess their overall
              performance.
            name: performance_metrics
            type: str
          raises:
          - description: If the input parameters are not valid or are missing required
              information.
            type: ValueError
          - description: If the input parameters are not of the expected type.
            type: TypeError
          returns:
            description: A list of areas where the player needs improvement.
            type: List[str]
          summary: Determines areas for player improvement based on strengths, weaknesses,
            and performance metrics.
      prompt: Analyze the given strengths, weaknesses, and performance metrics to
        identify areas where the player needs improvement.
      shims: []
  analyze_team_performance:
    agent: false
    code_node_type: shim
    description: Examine team statistics to determine strengths, weaknesses, and areas
      for improvement.
    implementation: "from ._analyze_team_performance.validate_input_data import validate_input_data\n\
      from ._analyze_team_performance.calculate_key_performance_metrics import calculate_key_performance_metrics\n\
      from ._analyze_team_performance.identify_performance_trends import identify_performance_trends\n\
      from ._analyze_team_performance.identify_team_strengths import identify_team_strengths\n\
      from ._analyze_team_performance.identify_team_weaknesses import identify_team_weaknesses\n\
      from ._analyze_team_performance.determine_improvement_areas import determine_improvement_areas\n\
      \nfrom pydantic import BaseModel, Field\nfrom typing import List\n\n\nclass\
      \ CleanAndPreprocessDataOutput(BaseModel):\n    \"\"\"Pydantic model for clean_and_preprocess_data\
      \ node outputs.\"\"\"\n    cleaned_game_statistics: List[float] = (\n      \
      \  Field(..., description=\"Cleaned game statistics\")\n    )\n    preprocessed_player_information:\
      \ List[str] = (\n        Field(..., description=\"Preprocessed player information\"\
      )\n    )\n    transformed_team_performance_metrics: List[float] = (\n      \
      \  Field(..., description=\"Transformed team performance metrics\")\n    )\n\
      \    data_quality_score: float = (\n        Field(..., description=\"Score indicating\
      \ data quality\")\n    )\n\n\nclass AnalyzeTeamPerformanceOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for analyze_team_performance node outputs.\"\"\"\n\
      \    team_performance_metrics: List[float] = (\n        Field(..., description=\"\
      List of team performance metrics\")\n    )\n    team_strengths: List[str] =\
      \ Field(..., description=\"List of team strengths\")\n    team_weaknesses: List[str]\
      \ = (\n        Field(..., description=\"List of team weaknesses\")\n    )\n\
      \    areas_for_team_improvement: List[str] = (\n        Field(..., description=\"\
      List of areas for team improvement\")\n    )\n\n\ndef analyze_team_performance(clean_and_preprocess_data_input:\
      \ CleanAndPreprocessDataOutput, **kwargs) -> AnalyzeTeamPerformanceOutput:\n\
      \    \"\"\"\n    Analyze team performance using preprocessed data to determine\
