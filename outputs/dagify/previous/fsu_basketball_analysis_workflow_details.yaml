dag_type: shim
description: A workflow to analyze FSU basketball team performance, statistics, and
  player data
name: fsu_basketball_analysis_workflow
nodes:
  analyze_team_performance:
    agent: false
    code_node_type: shim
    description: Analyze overall team performance based on game data
    implementation: "from ._analyze_team_performance.validate_input_data import validate_input_data\n\
      from ._analyze_team_performance.parse_score_strings import parse_score_strings\n\
      from ._analyze_team_performance.count_wins import count_wins\nfrom ._analyze_team_performance.count_losses\
      \ import count_losses\nfrom ._analyze_team_performance.format_win_loss_record\
      \ import format_win_loss_record\nfrom ._analyze_team_performance.extract_team_scores\
      \ import extract_team_scores\nfrom ._analyze_team_performance.extract_opponent_scores\
      \ import extract_opponent_scores\nfrom ._analyze_team_performance.calculate_average_score\
      \ import calculate_average_score\n\nfrom pydantic import BaseModel, Field\n\
      from typing import List\n\n\nclass GatherHistoricalGameDataOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for gather_historical_game_data node outputs.\"\"\"\
      \n    game_dates: List[str] = Field(..., description=\"List of game dates\"\
      )\n    opponents: List[str] = Field(..., description=\"List of opponents\")\n\
      \    scores: List[str] = (\n        Field(..., description=\"List of game scores\
      \ (e.g., '74-68')\")\n    )\n    game_statistics: List[str] = (\n        Field(...,\
      \ description=\"List of game statistics (e.g., rebounds, turnovers, etc.)\"\
      )\n    )\n\n\nclass AnalyzeTeamPerformanceOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for analyze_team_performance node outputs.\"\"\"\n    win_loss_record:\
      \ str = (\n        Field(..., description=\"Team win/loss record (e.g., '20-10')\"\
      )\n    )\n    average_score: float = Field(..., description=\"Average score\
      \ per game\")\n    average_opponent_score: float = (\n        Field(..., description=\"\
      Average opponent score per game\")\n    )\n\n\ndef analyze_team_performance(gather_historical_game_data_input:\
      \ GatherHistoricalGameDataOutput, **kwargs) -> AnalyzeTeamPerformanceOutput:\n\
      \    \"\"\"\n    Analyzes team performance based on historical game data, computing\
      \ win/loss\n    record and average scores.\n\n    Parameters\n    ----------\n\
      \    game_dates : List[str]\n        List of game dates from historical game\
      \ data.\n    opponents : List[str]\n        List of opponents from historical\
      \ game data.\n    scores : List[str]\n        List of game scores from historical\
      \ game data, formatted as\n        'team_score-opponent_score'.\n    game_statistics\
      \ : List[str]\n        List of game statistics from historical game data.\n\n\
      \    Returns\n    -------\n    Tuple[str, float, float]\n        A tuple containing\
      \ the team's win/loss record, average score, and\n        average opponent score.\n\
      \n    Raises\n    ------\n    ValueError\n        If the input lists are of\
      \ different lengths or if scores are not\n        properly formatted.\n\n  \
      \  Examples\n    --------\n    >>> game_dates = ['2023-01-01', '2023-01-03']\n\
      \    >>> opponents = ['Team A', 'Team B']\n    >>> scores = ['80-70', '75-85']\n\
      \    >>> game_statistics = ['stats1', 'stats2']\n    >>> analyze_team_performance(game_dates,\
      \ opponents, scores, game_statistics)\n    ('1-1', 77.5, 77.5)\n\n    >>> game_dates\
      \ = ['2023-02-01', '2023-02-03', '2023-02-05']\n    >>> opponents = ['Team C',\
      \ 'Team D', 'Team E']\n    >>> scores = ['90-80', '85-95', '100-90']\n    >>>\
      \ game_statistics = ['stats3', 'stats4', 'stats5']\n    >>> analyze_team_performance(game_dates,\
      \ opponents, scores, game_statistics)\n    ('2-1', 91.66666666666667, 88.33333333333333)\n\
      \n    \"\"\"\n    validated_data = validate_input_data(game_dates=gather_historical_game_data_input.game_dates,\n\
      \                                          opponents=gather_historical_game_data_input.opponents,\n\
      \                                          scores=gather_historical_game_data_input.scores,\n\
      \                                          game_statistics=gather_historical_game_data_input.game_statistics)\n\
      \    \n    parsed_scores: List[tuple] = parse_score_strings(scores=gather_historical_game_data_input.scores)\n\
      \    \n    wins: int = count_wins(parsed_scores=parsed_scores)\n    losses:\
      \ int = count_losses(parsed_scores=parsed_scores)\n    \n    win_loss_record:\
      \ str = format_win_loss_record(wins=wins, losses=losses)\n    \n    team_scores:\
      \ List[int] = extract_team_scores(parsed_scores=parsed_scores)\n    opponent_scores:\
      \ List[int] = extract_opponent_scores(parsed_scores=parsed_scores)\n    \n \
      \   average_score: float = calculate_average_score(scores=team_scores)\n   \
      \ average_opponent_score: float = calculate_average_score(scores=opponent_scores)\n\
      \    \n    return AnalyzeTeamPerformanceOutput(\n        win_loss_record=win_loss_record,\n\
      \        average_score=average_score,\n        average_opponent_score=average_opponent_score\n\
      \    )"
