dag_type: stub
description: Generated workflow from UI.
name: create_simple_workflow
nodes:
  create_task_dag:
    agent: false
    code_node_type: stub
    description: Constructs a directed acyclic graph (DAG) from explicit dependency
      pairs, performs a topological sort to produce a deterministic execution order,
      and validates that the graph contains no cycles. The node returns the ordered
      task list, the dependency edge list in compact form, and a boolean flag indicating
      acyclicity.
    implementation: "import logging\nfrom collections import defaultdict, deque\n\
      from typing import Set, List\n\n\nlog = logging.getLogger(__name__)\n\n\ndef\
      \ _parse_edge(edge: str) -> tuple[str, str]:\n    \"\"\"\n    Creates a DAG\
      \ from dependency pairs and returns an execution order.\n\n    Parameters\n\
      \    ----------\n    identify_task_dependencies_input : IdentifyTaskDependenciesOutput\n\
      \        Output from the identify_task_dependencies node containing task\n \
      \       names and dependency pairs.\n    kwargs : dict\n        Additional keyword\
      \ arguments for future extensions.\n\n    Returns\n    -------\n    CreateTaskDagOutput\n\
      \        Dataclass containing the ordered task list, edge list, and\n      \
      \  acyclicity flag.\n\n    Raises\n    ------\n    ValueError\n        If input\
      \ validation fails or a cycle is detected in the dependency\n        graph.\n\
      \n    Examples\n    --------\n    >>> from your_module import create_task_dag,\
      \ IdentifyTaskDependenciesOutput\n    >>> input_data = IdentifyTaskDependenciesOutput(\n\
      \    ...     task_names=[\"A\", \"B\", \"C\"],\n    ...     dependency_pairs=[\"\
      A -> B\", \"B -> C\"],\n    ...     dependency_count=2\n    >>> )\n    >>> output\
      \ = create_task_dag(input_data)\n    >>> print(output.dag_nodes, output.dag_edges,\
      \ output.is_acyclic)\n    [\"A\", \"B\", \"C\"] ['A->B', 'B->C'] True\n\n  \
      \  \"\"\"\n    parts = [p.strip() for p in edge.split('->')]\n    if len(parts)\
      \ != 2 or not parts[0] or not parts[1]:\n        raise ValueError(f\"Invalid\
      \ dependency format: '{edge}'. Expected 'TaskA -> TaskB'\")\n    return parts[0],\
      \ parts[1]\n\n\ndef create_task_dag(identify_task_dependencies_input: IdentifyTaskDependenciesOutput,\
      \ **kwargs) -> CreateTaskDagOutput:\n    \"\"\"\n    Constructs a Directed Acyclic\
      \ Graph (DAG) from dependency pairs and returns an execution order.\n    \"\"\
      \"\n    task_names = identify_task_dependencies_input.task_names\n    dependency_pairs\
      \ = identify_task_dependencies_input.dependency_pairs\n    dependency_count\
      \ = identify_task_dependencies_input.dependency_count\n\n    if not isinstance(task_names,\
      \ list) or not all(isinstance(t, str) and t for t in task_names):\n        raise\
      \ ValueError(\"task_names must be a list of non-empty strings\")\n    if not\
      \ isinstance(dependency_pairs, list) or not all(isinstance(d, str) and d for\
      \ d in dependency_pairs):\n        raise ValueError(\"dependency_pairs must\
      \ be a list of non-empty strings\")\n    if dependency_count != len(dependency_pairs):\n\
      \        raise ValueError(\"dependency_count does not match the number of dependency_pairs\"\
      )\n\n    task_set: Set[str] = set(task_names)\n    adjacency: defaultdict[str,\
      \ Set[str]] = defaultdict(set)\n    indegree: defaultdict[str, int] = defaultdict(int)\n\
      \n    for pair in dependency_pairs:\n        src, dst = _parse_edge(pair)\n\
      \        if src == dst:\n            raise ValueError(f\"Self‑dependency detected:\
      \ '{src}' -> '{dst}'\")\n        if src not in task_set or dst not in task_set:\n\
      \            raise ValueError(f\"Dependency references unknown task: '{pair}'\"\
      )\n        if dst not in adjacency[src]:\n            adjacency[src].add(dst)\n\
      \            indegree[dst] += 1\n            if src not in indegree:\n     \
      \           indegree[src] += 0\n\n    zero_indegree = deque([t for t in task_names\
      \ if indegree[t] == 0])\n    topo_order: List[str] = []\n    while zero_indegree:\n\
      \        node = zero_indegree.popleft()\n        topo_order.append(node)\n \
      \       for neighbor in adjacency[node]:\n            indegree[neighbor] -=\
      \ 1\n            if indegree[neighbor] == 0:\n                zero_indegree.append(neighbor)\n\
      \n    is_acyclic = len(topo_order) == len(task_names)\n    if not is_acyclic:\n\
      \        cycle_nodes = [t for t in task_names if indegree[t] > 0]\n        raise\
      \ ValueError(f\"Cycle detected in task dependencies involving: {cycle_nodes}\"\
      )\n\n    dag_edges = [f\"{src}->{dst}\" for src in adjacency for dst in adjacency[src]]\n\
      \n    return CreateTaskDagOutput(\n        dag_nodes=topo_order,\n        dag_edges=dag_edges,\n\
      \        is_acyclic=is_acyclic\n    )"
    name: create_task_dag
    nodes_depended_on:
    - identify_task_dependencies
    nodes_dependent_on: []
    output_structure:
    - description: Ordered list of task identifiers in the DAG.
      key: dag_nodes
      type: List[str]
    - description: List of edges representing dependencies, formatted as 'source->target'.
      key: dag_edges
      type: List[str]
    - description: Indicates whether the constructed DAG is acyclic.
      key: is_acyclic
      type: bool
    prd:
      conceptual_info: Builds a topological representation of tasks based on identified
        dependencies, ensuring no cycles exist and producing an execution order.
      docstring:
        examples:
        - lines:
          - from your_module import create_task_dag, IdentifyTaskDependenciesOutput
          - input_data = IdentifyTaskDependenciesOutput(
          - '    task_names=["A", "B", "C"],'
          - '    dependency_pairs=["A -> B", "B -> C"],'
          - '    dependency_count=2'
          - )
          - output = create_task_dag(input_data)
          - print(output.dag_nodes, output.dag_edges, output.is_acyclic)
          output: '["A", "B", "C"] [''A->B'', ''B->C''] True'
        parameters:
        - description: Output from the identify_task_dependencies node containing
            task names and dependency pairs.
          name: identify_task_dependencies_input
          type: IdentifyTaskDependenciesOutput
        - description: Additional keyword arguments for future extensions.
          name: kwargs
          type: dict
        raises:
        - description: If input validation fails or a cycle is detected in the dependency
            graph.
          type: ValueError
        returns:
          description: Dataclass containing the ordered task list, edge list, and
            acyclicity flag.
          type: CreateTaskDagOutput
        summary: Creates a DAG from dependency pairs and returns an execution order.
    prompt: Using the task dependencies, construct a DAG that represents the workflow.
      Ensure it is acyclic and properly ordered.
    shims: []
  decompose_objective_into_tasks:
    agent: false
    code_node_type: stub
    description: Captures the high‑level purpose of a workflow as a single natural‑language
      sentence, ensuring clarity and consistency for downstream decomposition.
    implementation: "import logging\nfrom pydantic import BaseModel, Field\n\n\nlogger\
      \ = logging.getLogger(__name__)\n\nclass DefineWorkflowObjectiveOutput(BaseModel):\n\
      \    objective: str = (\n        Field(..., description=\"Primary goal statement\
      \ of the workflow\")\n    )\n\ndef define_workflow_objective(general_input:\
      \ str, **kwargs) -> DefineWorkflowObjectiveOutput:\n    \"\"\"\n    Return a\
      \ validated objective string.\n\n    Parameters\n    ----------\n    general_input\
      \ : str\n        Human‑readable description of the desired workflow.\n\n   \
      \ Returns\n    -------\n    DefineWorkflowObjectiveOutput\n        A pydantic\
      \ model containing the validated objective.\n\n    Raises\n    ------\n    ValueError\n\
      \        If the input is empty, non‑string, or only whitespace.\n\n    Examples\n\
      \    --------\n    >>> from your_package import define_workflow_objective\n\
      \    >>> objective_output = define_workflow_objective(\"Automate the ingestion,\n\
      \    transformation, and reporting of sales data.\")\n    >>> print(objective_output.objective)\n\
      \    \"Automate the ingestion, transformation, and reporting of sales data.\"\
      \n\n    \"\"\"\n    if not isinstance(general_input, str) or not general_input.strip():\n\
      \        logger.error(\"Input objective is empty or not a string\")\n      \
      \  raise ValueError(\"Input objective must be a non-empty string\")\n    objective\
      \ = general_input.strip()\n    return DefineWorkflowObjectiveOutput(objective=objective)"
    name: decompose_objective_into_tasks
    nodes_depended_on:
    - define_workflow_objective
    nodes_dependent_on: []
    output_structure:
    - description: List of task names identified by decomposition.
      key: task_names
      type: List[str]
    - description: Brief descriptions for each corresponding task.
      key: task_descriptions
      type: List[str]
    - description: Total number of tasks identified.
      key: num_tasks
      type: int
    prd:
      conceptual_info: This node serves as the foundational description of a workflow.
        By accepting a human‑friendly prompt and validating it, it guarantees that
        downstream nodes start from a well‑formed objective, reducing ambiguity and
        improving maintainability.
      docstring:
        examples:
        - lines:
          - from your_package import define_workflow_objective
          - objective_output = define_workflow_objective("Automate the ingestion,
            transformation, and reporting of sales data.")
          - print(objective_output.objective)
          output: '"Automate the ingestion, transformation, and reporting of sales
            data."'
        parameters:
        - description: Human‑readable description of the desired workflow.
          name: general_input
          type: str
        raises:
        - description: If the input is empty, non‑string, or only whitespace.
          type: ValueError
        returns:
          description: A pydantic model containing the validated objective.
          type: DefineWorkflowObjectiveOutput
        summary: Return a validated objective string.
    prompt: Provide a concise primary goal statement for the workflow.
    shims: []
  define_workflow_objective:
    agent: false
    code_node_type: stub
    description: Creates a clear, single-sentence statement that defines the primary
      goal of the entire workflow, serving as a guiding beacon for downstream task
      decomposition.
    implementation: "import logging\nfrom typing import Any\nfrom pydantic import\
      \ BaseModel, Field, ValidationError\n\n\nlogger = logging.getLogger(__name__)\n\
      \nclass DefineWorkflowObjectiveOutput(BaseModel):\n    objective: str = (\n\
      \        Field(..., description=\"Primary goal statement of the workflow\")\n\
      \    )\n\ndef define_workflow_objective(general_input: str, **kwargs: Any) ->\
      \ DefineWorkflowObjectiveOutput:\n    \"\"\"\n    Defines the workflow’s primary\
      \ objective statement.\n\n    Parameters\n    ----------\n    general_input\
      \ : str\n        High‑level description or context used to generate the objective.\n\
      \n    Returns\n    -------\n    DefineWorkflowObjectiveOutput\n        Object\
      \ containing the primary goal sentence.\n\n    Raises\n    ------\n    ValueError\n\
      \        If the input is empty or consists only of whitespace.\n\n    Examples\n\
      \    --------\n    >>> output = define_workflow_objective(\"automate data ingestion\
      \ and\n    reporting\")\n    >>> print(output.objective)\n    \"The primary\
      \ objective of this workflow is to automate data ingestion and\n    reporting.\"\
      \n\n    \"\"\"\n    if not isinstance(general_input, str):\n        logger.error(\"\
      general_input must be a string\")\n        raise ValueError(\"general_input\
      \ must be a string\")\n    cleaned = general_input.strip()\n    if not cleaned:\n\
      \        logger.error(\"general_input is empty or whitespace only\")\n     \
      \   raise ValueError(\"general_input must be a non-empty string\")\n    objective\
      \ = f\"The primary objective of this workflow is to {cleaned}.\"\n    try:\n\
      \        return DefineWorkflowObjectiveOutput(objective=objective)\n    except\
      \ ValidationError as ve:\n        logger.error(\"Validation error when creating\
      \ output: %s\", ve)\n        raise"
    name: define_workflow_objective
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Primary goal statement of the workflow
      key: objective
      type: str
    prd:
      conceptual_info: Captures the high-level purpose of the workflow in a single
        natural-language sentence, ensuring all downstream tasks align with a clear,
        actionable goal.
      docstring:
        examples:
        - lines:
          - output = define_workflow_objective("automate data ingestion and reporting")
          - print(output.objective)
          output: '"The primary objective of this workflow is to automate data ingestion
            and reporting."'
        parameters:
        - description: High‑level description or context used to generate the objective.
          name: general_input
          type: str
        raises:
        - description: If the input is empty or consists only of whitespace.
          type: ValueError
        returns:
          description: Object containing the primary goal sentence.
          type: DefineWorkflowObjectiveOutput
        summary: Defines the workflow’s primary objective statement.
    prompt: Generate a concise, single-sentence objective for the workflow based on
      the provided context or description.
    shims: []
  finalize_workflow:
    agent: false
    code_node_type: stub
    description: Validates the refined DAG, ensures completeness, acyclicity, and
      optimal concurrency, performs any last‑minute adjustments, and returns a concise
      summary.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      import logging\nimport re\n\n\nclass RefineDagOutput(BaseModel):\n    dag_edges:\
      \ List[str] = (\n        Field(..., description=\"List of directed edges in\
      \ the refined DAG, formatted as 'TaskA->TaskB'.\")\n    )\n    is_acyclic: bool\
      \ = (\n        Field(..., description=\"Indicates whether the refined DAG contains\
      \ any cycles.\")\n    )\n    is_concurrent: bool = (\n        Field(..., description=\"\
      Indicates whether the DAG has been adjusted to allow concurrent execution of\
      \ independent tasks.\")\n    )\n    max_concurrency: int = (\n        Field(...,\
      \ description=\"Maximum number of tasks that can run concurrently in the refined\
      \ DAG.\")\n    )\n\nclass FinalizeWorkflowOutput(BaseModel):\n    dag_is_complete:\
      \ bool = (\n        Field(..., description=\"Whether the DAG is fully defined\
      \ and ready\")\n    )\n    dag_is_concurrent: bool = (\n        Field(..., description=\"\
      Whether the DAG has maximized concurrency\")\n    )\n    dag_is_acyclic: bool\
      \ = (\n        Field(..., description=\"Whether the DAG contains no cycles\"\
      )\n    )\n    adjusted_node_list: str = (\n        Field(..., description=\"\
      Comma‑separated list of node names that were adjusted during finalization\"\
      )\n    )\n    dag_summary: str = (\n        Field(..., description=\"Human‑readable\
      \ summary of the finalized DAG\")\n    )\n\ndef finalize_workflow(refine_dag_input:\
      \ RefineDagOutput, **kwargs) -> FinalizeWorkflowOutput:\n    \"\"\"\n    Finalizes\
      \ and validates a workflow DAG, performing any necessary adjustments\n    and\
      \ returning key status flags and a summary.\n\n    Parameters\n    ----------\n\
      \    refine_dag_input : RefineDagOutput\n        Output from the refine_dag\
      \ node containing the refined edges,\n        acyclicity flag, concurrency flag,\
      \ and maximum concurrency count.\n\n    Returns\n    -------\n    FinalizeWorkflowOutput\n\
      \        An object containing completion, concurrency, acyclicity status,\n\
      \        list of adjusted nodes, and a textual summary.\n\n    Raises\n    ------\n\
      \    ValueError\n        If dag_edges is empty or contains malformed entries.\n\
      \n    Examples\n    --------\n    >>> from pydantic import BaseModel, Field\n\
      \    >>> from typing import List\n    >>> class RefineDagOutput(BaseModel):\n\
      \    ...     dag_edges: List[str] = Field(..., description=\"List of directed\n\
      \    edges in the refined DAG, formatted as 'TaskA->TaskB'.\")\n    ...    \
      \ is_acyclic: bool = Field(..., description=\"Indicates whether the\n    refined\
      \ DAG contains any cycles.\")\n    ...     is_concurrent: bool = Field(...,\
      \ description=\"Indicates whether the\n    DAG has been adjusted to allow concurrent\
      \ execution of independent tasks.\")\n    ...     max_concurrency: int = Field(...,\
      \ description=\"Maximum number of\n    tasks that can run concurrently in the\
      \ refined DAG.\")\n    >>> class FinalizeWorkflowOutput(BaseModel):\n    ...\
      \     dag_is_complete: bool = Field(..., description=\"Whether the DAG is\n\
      \    fully defined and ready\")\n    ...     dag_is_concurrent: bool = Field(...,\
      \ description=\"Whether the DAG\n    has maximized concurrency\")\n    ... \
      \    dag_is_acyclic: bool = Field(..., description=\"Whether the DAG\n    contains\
      \ no cycles\")\n    ...     adjusted_node_list: str = Field(..., description=\"\
      Comma‑separated\n    list of node names that were adjusted during finalization\"\
      )\n    ...     dag_summary: str = Field(..., description=\"Human‑readable summary\
      \ of\n    the finalized DAG\")\n    >>> def finalize_workflow(refine_dag_input:\
      \ RefineDagOutput, **kwargs) ->\n    FinalizeWorkflowOutput:\n    ...     import\
      \ logging\n    ...     import re\n    ...     logger = logging.getLogger(__name__)\n\
      \    ...     if not refine_dag_input.dag_edges:\n    ...         logger.error(\"\
      dag_edges list is empty\")\n    ...         raise ValueError(\"dag_edges list\
      \ is empty or contains malformed\n    entries\")\n    ...     edge_pattern =\
      \ re.compile(r'^\\s*([^\\s]+)\\s*->\\s*([^\\s]+)\\s*$')\n    ...     nodes =\
      \ set()\n    ...     for edge in refine_dag_input.dag_edges:\n    ...      \
      \   m = edge_pattern.match(edge)\n    ...         if not m:\n    ...       \
      \      logger.error(\"malformed edge: %s\", edge)\n    ...             raise\
      \ ValueError(\"dag_edges list is empty or contains\n    malformed entries\"\
      )\n    ...         src, dst = m.group(1), m.group(2)\n    ...         nodes.update([src,\
      \ dst])\n    ...     node_count = len(nodes)\n    ...     edge_count = len(refine_dag_input.dag_edges)\n\
      \    ...     dag_is_complete = node_count > 0 and edge_count > 0\n    ...  \
      \   dag_is_concurrent = refine_dag_input.is_concurrent\n    ...     dag_is_acyclic\
      \ = refine_dag_input.is_acyclic\n    ...     adjusted = []\n    ...     if not\
      \ dag_is_concurrent:\n    ...         adjusted.append(\"SyncNode\")\n    ...\
      \     if not dag_is_acyclic:\n    ...         adjusted.append(\"CycleBreaker\"\
      )\n    ...     adjusted_node_list = \",\".join(adjusted)\n    ...     dag_summary\
      \ = f\"DAG has {node_count} nodes and {edge_count} edges.\n    Acyclic: {dag_is_acyclic}.\
      \ Concurrency: {'maximized' if dag_is_concurrent\n    else 'not maximized'}.\"\
      \n    ...     return FinalizeWorkflowOutput(\n    ...         dag_is_complete=dag_is_complete,\n\
      \    ...         dag_is_concurrent=dag_is_concurrent,\n    ...         dag_is_acyclic=dag_is_acyclic,\n\
      \    ...         adjusted_node_list=adjusted_node_list,\n    ...         dag_summary=dag_summary\n\
      \    ...     )\n    >>> # Example usage:\n    >>> refine_output = RefineDagOutput(dag_edges=['A->B',\
      \ 'B->C'],\n    is_acyclic=True, is_concurrent=False, max_concurrency=2)\n \
      \   >>> result = finalize_workflow(refine_output)\n    >>> print(result.dag_summary)\n\
      \    DAG has 3 nodes and 2 edges. Acyclic: True. Concurrency: not maximized.\n\
      \n    \"\"\"\n    logger = logging.getLogger(__name__)\n    if not refine_dag_input.dag_edges:\n\
      \        logger.error(\"dag_edges list is empty\")\n        raise ValueError(\"\
      dag_edges list is empty or contains malformed entries\")\n    edge_pattern =\
      \ re.compile(r'^\\s*([^\\s]+)\\s*->\\s*([^\\s]+)\\s*$')\n    nodes = set()\n\
      \    for edge in refine_dag_input.dag_edges:\n        m = edge_pattern.match(edge)\n\
      \        if not m:\n            logger.error(\"malformed edge: %s\", edge)\n\
      \            raise ValueError(\"dag_edges list is empty or contains malformed\
      \ entries\")\n        src, dst = m.group(1), m.group(2)\n        nodes.update([src,\
      \ dst])\n    node_count = len(nodes)\n    edge_count = len(refine_dag_input.dag_edges)\n\
      \    dag_is_complete = node_count > 0 and edge_count > 0\n    dag_is_concurrent\
      \ = refine_dag_input.is_concurrent\n    dag_is_acyclic = refine_dag_input.is_acyclic\n\
      \    adjusted = []\n    if not dag_is_concurrent:\n        adjusted.append(\"\
      SyncNode\")\n    if not dag_is_acyclic:\n        adjusted.append(\"CycleBreaker\"\
      )\n    adjusted_node_list = \",\".join(adjusted)\n    dag_summary = f\"DAG has\
      \ {node_count} nodes and {edge_count} edges. Acyclic: {dag_is_acyclic}. Concurrency:\
      \ {'maximized' if dag_is_concurrent else 'not maximized'}.\"\n    return FinalizeWorkflowOutput(\n\
      \        dag_is_complete=dag_is_complete,\n        dag_is_concurrent=dag_is_concurrent,\n\
      \        dag_is_acyclic=dag_is_acyclic,\n        adjusted_node_list=adjusted_node_list,\n\
      \        dag_summary=dag_summary\n    )"
    name: finalize_workflow
    nodes_depended_on:
    - refine_dag
    nodes_dependent_on: []
    output_structure:
    - description: Whether the DAG is fully defined and ready
      key: dag_is_complete
      type: bool
    - description: Whether the DAG has maximized concurrency
      key: dag_is_concurrent
      type: bool
    - description: Whether the DAG contains no cycles
      key: dag_is_acyclic
      type: bool
    - description: List of node names that were adjusted during finalization
      key: adjusted_node_list
      type: str
    - description: Human-readable summary of the finalized DAG
      key: dag_summary
      type: str
    prd:
      conceptual_info: The finalize_workflow node is the final validation step in
        a workflow DAG pipeline. It verifies that the DAG is fully defined, contains
        no cycles, and is configured for maximum concurrency. If any of these properties
        are not satisfied, the node records the adjustments it would perform, such
        as adding a dummy synchronization node or a cycle‑breaking node, and logs
        the outcome. The node produces a summary that is useful for monitoring and
        debugging downstream processes.
      docstring:
        examples:
        - lines:
          - from pydantic import BaseModel, Field
          - from typing import List
          - 'class RefineDagOutput(BaseModel):'
          - '    dag_edges: List[str] = Field(..., description="List of directed edges
            in the refined DAG, formatted as ''TaskA->TaskB''.")'
          - '    is_acyclic: bool = Field(..., description="Indicates whether the
            refined DAG contains any cycles.")'
          - '    is_concurrent: bool = Field(..., description="Indicates whether the
            DAG has been adjusted to allow concurrent execution of independent tasks.")'
          - '    max_concurrency: int = Field(..., description="Maximum number of
            tasks that can run concurrently in the refined DAG.")'
          - 'class FinalizeWorkflowOutput(BaseModel):'
          - '    dag_is_complete: bool = Field(..., description="Whether the DAG is
            fully defined and ready")'
          - '    dag_is_concurrent: bool = Field(..., description="Whether the DAG
            has maximized concurrency")'
          - '    dag_is_acyclic: bool = Field(..., description="Whether the DAG contains
            no cycles")'
          - '    adjusted_node_list: str = Field(..., description="Comma‑separated
            list of node names that were adjusted during finalization")'
          - '    dag_summary: str = Field(..., description="Human‑readable summary
            of the finalized DAG")'
          - 'def finalize_workflow(refine_dag_input: RefineDagOutput, **kwargs) ->
            FinalizeWorkflowOutput:'
          - '    import logging'
          - '    import re'
          - '    logger = logging.getLogger(__name__)'
          - '    if not refine_dag_input.dag_edges:'
          - '        logger.error("dag_edges list is empty")'
          - '        raise ValueError("dag_edges list is empty or contains malformed
            entries")'
          - '    edge_pattern = re.compile(r''^\s*([^\s]+)\s*->\s*([^\s]+)\s*$'')'
          - '    nodes = set()'
          - '    for edge in refine_dag_input.dag_edges:'
          - '        m = edge_pattern.match(edge)'
          - '        if not m:'
          - '            logger.error("malformed edge: %s", edge)'
          - '            raise ValueError("dag_edges list is empty or contains malformed
            entries")'
          - '        src, dst = m.group(1), m.group(2)'
          - '        nodes.update([src, dst])'
          - '    node_count = len(nodes)'
          - '    edge_count = len(refine_dag_input.dag_edges)'
          - '    dag_is_complete = node_count > 0 and edge_count > 0'
          - '    dag_is_concurrent = refine_dag_input.is_concurrent'
          - '    dag_is_acyclic = refine_dag_input.is_acyclic'
          - '    adjusted = []'
          - '    if not dag_is_concurrent:'
          - '        adjusted.append("SyncNode")'
          - '    if not dag_is_acyclic:'
          - '        adjusted.append("CycleBreaker")'
          - '    adjusted_node_list = ",".join(adjusted)'
          - '    dag_summary = f"DAG has {node_count} nodes and {edge_count} edges.
            Acyclic: {dag_is_acyclic}. Concurrency: {''maximized'' if dag_is_concurrent
            else ''not maximized''}."'
          - '    return FinalizeWorkflowOutput('
          - '        dag_is_complete=dag_is_complete,'
          - '        dag_is_concurrent=dag_is_concurrent,'
          - '        dag_is_acyclic=dag_is_acyclic,'
