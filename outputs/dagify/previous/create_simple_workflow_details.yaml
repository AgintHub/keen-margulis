  refine_dag:
    agent: false
    code_node_type: stub
    description: Refines an existing task DAG to maximize parallel execution by computing
      level-wise execution groups, ensuring the graph remains acyclic, and producing
      metrics that indicate potential concurrency.
    implementation: "import logging\nfrom collections import defaultdict, deque\n\
      from typing import Dict, Set\nfrom pydantic import BaseModel, Field\n\n\nclass\
      \ CreateTaskDagOutput(BaseModel):\n    dag_nodes: list[str] = (\n        Field(...,\
      \ description=\"Ordered list of task identifiers in the DAG.\")\n    )\n   \
      \ dag_edges: list[str] = (\n        Field(..., description=\"List of edges representing\
      \ dependencies, formatted as 'source->target'.\")\n    )\n    is_acyclic: bool\
      \ = (\n        Field(..., description=\"Indicates whether the constructed DAG\
      \ is acyclic.\")\n    )\n\nclass RefineDagOutput(BaseModel):\n    dag_edges:\
      \ list[str] = (\n        Field(..., description=\"List of directed edges in\
      \ the refined DAG, formatted as 'TaskA->TaskB'.\")\n    )\n    is_acyclic: bool\
      \ = (\n        Field(..., description=\"Indicates whether the refined DAG contains\
      \ any cycles.\")\n    )\n    is_concurrent: bool = (\n        Field(..., description=\"\
      Indicates whether the DAG has been adjusted to allow concurrent execution of\
      \ independent tasks.\")\n    )\n    max_concurrency: int = (\n        Field(...,\
      \ description=\"Maximum number of tasks that can run concurrently in the refined\
      \ DAG.\")\n    )\n\ndef refine_dag(create_task_dag_input: CreateTaskDagOutput,\
      \ **kwargs) -> RefineDagOutput:\n    \"\"\"\n    Compute level‑based execution\
      \ plan and concurrency statistics for a task\n    DAG.\n\n    Parameters\n \
      \   ----------\n    create_task_dag_input : CreateTaskDagOutput\n        Output\
      \ from the create_task_dag node containing nodes, edges, and\n        acyclicity\
      \ flag.\n\n    Returns\n    -------\n    RefineDagOutput\n        Refined DAG\
      \ with reordered edges and concurrency metrics.\n\n    Raises\n    ------\n\
      \    ValueError\n        Raised when the input DAG is empty, malformed, or contains\
      \ cycles.\n\n    Examples\n    --------\n    >>> dag = CreateTaskDagOutput(dag_nodes=['A',\
      \ 'B', 'C'], dag_edges=['A->C'],\n    is_acyclic=True)\n    >>> result = refine_dag(dag)\n\
      \    >>> print(result.dag_edges, result.is_acyclic, result.is_concurrent,\n\
      \    result.max_concurrency)\n    ['A->C'] True True 2\n\n    \"\"\"\n    logger\
      \ = logging.getLogger(__name__)\n    dag_nodes = create_task_dag_input.dag_nodes\n\
      \    dag_edges = create_task_dag_input.dag_edges\n    if not dag_edges:\n  \
      \      raise ValueError(\"dag_edges list cannot be empty\")\n    node_set: Set[str]\
      \ = set(dag_nodes)\n    for edge in dag_edges:\n        parts = edge.split('->')\n\
      \        if len(parts) != 2:\n            raise ValueError(f\"Invalid edge format:\
      \ {edge}\")\n        src, tgt = parts[0].strip(), parts[1].strip()\n       \
      \ if src not in node_set or tgt not in node_set:\n            raise ValueError(f\"\
      Edge references unknown nodes: {edge}\")\n    adj: Dict[str, Set[str]] = defaultdict(set)\n\
      \    indegree: Dict[str, int] = {node: 0 for node in dag_nodes}\n    for edge\
      \ in dag_edges:\n        src, tgt = edge.split('->')\n        src, tgt = src.strip(),\
      \ tgt.strip()\n        if tgt in adj[src]:\n            continue\n        adj[src].add(tgt)\n\
      \        indegree[tgt] += 1\n    queue: deque = deque([node for node in dag_nodes\
      \ if indegree[node] == 0])\n    if not queue:\n        raise ValueError(\"No\
      \ source nodes found; possible cycle.\")\n    sorted_nodes: list[str] = []\n\
      \    levels: list[list[str]] = []\n    while queue:\n        level_size = len(queue)\n\
      \        current_level: list[str] = []\n        for _ in range(level_size):\n\
      \            node = queue.popleft()\n            current_level.append(node)\n\
      \            sorted_nodes.append(node)\n            for neigh in adj[node]:\n\
      \                indegree[neigh] -= 1\n                if indegree[neigh] ==\
      \ 0:\n                    queue.append(neigh)\n        levels.append(current_level)\n\
      \    if len(sorted_nodes) != len(dag_nodes):\n        raise ValueError(\"Cycle\
      \ detected during topological sort.\")\n    max_concurrency = max(len(lvl) for\
      \ lvl in levels)\n    is_concurrent = max_concurrency > 1\n    node_index =\
      \ {node: idx for idx, node in enumerate(sorted_nodes)}\n    sorted_edges = sorted(dag_edges,\
      \ key=lambda e: (node_index[e.split('->')[0].strip()], node_index[e.split('->')[1].strip()]))\n\
      \    return RefineDagOutput(\n        dag_edges=sorted_edges,\n        is_acyclic=True,\n\
      \        is_concurrent=is_concurrent,\n        max_concurrency=max_concurrency\n\
      \    )"
    name: refine_dag
    nodes_depended_on:
    - create_task_dag
    nodes_dependent_on: []
    output_structure:
    - description: List of directed edges in the refined DAG, formatted as "TaskA->TaskB".
      key: dag_edges
      type: List[str]
    - description: Indicates whether the refined DAG contains any cycles.
      key: is_acyclic
      type: bool
    - description: Indicates whether the DAG has been adjusted to allow concurrent
        execution of independent tasks.
      key: is_concurrent
      type: bool
    - description: Maximum number of tasks that can run concurrently in the refined
        DAG.
      key: max_concurrency
      type: int
    prd:
      conceptual_info: This node takes a pre‑built DAG and reorganizes it to expose
        parallelism while guaranteeing that all dependency constraints are honored
        and that the graph remains a DAG.
      docstring:
        examples:
        - lines:
          - dag = CreateTaskDagOutput(dag_nodes=['A', 'B', 'C'], dag_edges=['A->C'],
            is_acyclic=True)
          - result = refine_dag(dag)
          - print(result.dag_edges, result.is_acyclic, result.is_concurrent, result.max_concurrency)
          output: '[''A->C''] True True 2'
        parameters:
        - description: Output from the create_task_dag node containing nodes, edges,
            and acyclicity flag.
          name: create_task_dag_input
          type: CreateTaskDagOutput
        raises:
        - description: Raised when the input DAG is empty, malformed, or contains
            cycles.
          type: ValueError
        returns:
          description: Refined DAG with reordered edges and concurrency metrics.
          type: RefineDagOutput
        summary: Compute level‑based execution plan and concurrency statistics for
          a task DAG.
    prompt: Analyze the provided DAG for opportunities to increase concurrency while
