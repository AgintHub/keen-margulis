      \ description = (\n            \"Confidence score (0.0 to 1.0) for the assigned\
      \ sentiment.\")\n        )\n    )\n\n\nclass IdentifyTrendsOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for identify_trends node outputs.\"\"\"\n    trending_topics:\
      \ List[str] = (\n        Field(..., description = (\n            \"List of topics\
      \ that show a trend across the news articles.\")\n        )\n    )\n    sentiment_trends:\
      \ List[str] = (\n        Field(..., description = (\n            \"Sentiment\
      \ trend for each corresponding trending topic, e.g., 'increasing positive',\
      \ 'decreasing negative', or 'stable neutral'.\")\n        )\n    )\n    overall_trend_summary:\
      \ str = (\n        Field(..., description = (\n            \"A concise textual\
      \ summary of the overall trend patterns identified.\")\n        )\n    )\n\n\
      \nclass CompileAnalysisReportOutput(BaseModel):\n    \"\"\"Pydantic model for\
      \ compile_analysis_report node outputs.\"\"\"\n    report_text: str = (\n  \
      \      Field(..., description = (\n            \"Full textual analysis report\
      \ combining sentiment and trend insights.\")\n        )\n    )\n    sentiment_summary:\
      \ str = (\n        Field(..., description = (\n            \"Brief summary of\
      \ overall sentiment distribution (positive/negative/neutral).\")\n        )\n\
      \    )\n    trend_summary: str = (\n        Field(..., description = (\n   \
      \         \"Brief summary of key trends identified across articles.\")\n   \
      \     )\n    )\n    sentiment_per_article: List[str] = (\n        Field(...,\
      \ description = (\n            \"Sentiment category for each article in the\
      \ order processed.\")\n        )\n    )\n    trend_topics: List[str] = (\n \
      \       Field(..., description = (\n            \"List of trending topics or\
      \ themes identified in the articles.\")\n        )\n    )\n    article_count:\
      \ int = (\n        Field(..., description = (\n            \"Total number of\
      \ articles included in the analysis.\")\n        )\n    )\n    is_valid: bool\
      \ = (\n        Field(..., description = (\n            \"Flag indicating whether\
      \ the report was generated successfully.\")\n        )\n    )\n\n\ndef compile_analysis_report(analyze_sentiment_input:\
      \ AnalyzeSentimentOutput, identify_trends_input: IdentifyTrendsOutput, **kwargs)\
      \ -> CompileAnalysisReportOutput:\n    \"\"\"\n    Generate a comprehensive\
      \ analysis report from sentiment and trend data.\n\n    Parameters\n    ----------\n\
      \    sentiment_category : List[str]\n        Sentiment label for each article\
      \ ('positive', 'negative',\n        'neutral').\n    sentiment_confidence :\
      \ List[float]\n        Confidence score (0.0–1.0) for each article's sentiment.\n\
      \    trending_topics : List[str]\n        List of topics that exhibit a trend\
      \ across the articles.\n    sentiment_trends : List[str]\n        Sentiment\
      \ trend description for each corresponding trending topic.\n    overall_trend_summary\
      \ : str\n        Concise textual summary of the overall trend patterns identified.\n\
      \n    Returns\n    -------\n    Dict[str, Any]\n        Dictionary containing\
      \ the full report text, sentiment and trend\n        summaries, per‑article\
      \ sentiment list, trend topics list, article\n        count, and validity flag.\n\
      \n    Raises\n    ------\n    ValueError\n        If the lengths of `sentiment_category`\
      \ and `sentiment_confidence` do\n        not match, or if `trending_topics`\
      \ and `sentiment_trends` differ in\n        length.\n    TypeError\n       \
      \ If any input parameter is of an unexpected type.\n\n    Examples\n    --------\n\
      \    >>> sentiment_category = ['positive', 'neutral', 'negative'],\n    >>>\
      \ sentiment_confidence = [0.92, 0.85, 0.78],\n    >>> trending_topics = ['Climate\
      \ Action', 'Tech Innovation'],\n    >>> sentiment_trends = ['decreasing positive',\
      \ 'increasing positive'],\n    >>> overall_trend_summary = 'The overall sentiment\
      \ is shifting from positive\n    to more neutral, with rising excitement around\
      \ tech.'\n    >>> report = compile_analysis_report(sentiment_category,\n   \
      \ sentiment_confidence, trending_topics, sentiment_trends,\n    overall_trend_summary)\n\
      \    {\n      'report_text': 'Analysis Report:\\n\\nSentiment:\\n- Positive:\
      \ 1\\n- Neutral:\n    1\\n- Negative: 1\\n\\nTrends:\\n- Climate Action: decreasing\
      \ positive\\n- Tech\n    Innovation: increasing positive\\n\\nOverall Trend:\
      \ The overall sentiment is\n    shifting from positive to more neutral, with\
      \ rising excitement around\n    tech.',\n      'sentiment_summary': '1 positive,\
      \ 1 neutral, 1 negative',\n      'trend_summary': 'Climate Action shows decreasing\
      \ positivity while Tech\n    Innovation is gaining traction.',\n      'sentiment_per_article':\
      \ ['positive', 'neutral', 'negative'],\n      'trend_topics': ['Climate Action',\
      \ 'Tech Innovation'],\n      'article_count': 3,\n      'is_valid': True\n \
      \   }\n\n    \"\"\"\n    validate_input_parameters(sentiment_data=analyze_sentiment_input,\
      \ trends_data=identify_trends_input)\n    \n    sentiment_counts: dict = count_sentiment_categories(sentiment_categories=analyze_sentiment_input.sentiment_category)\n\
      \    \n    sentiment_summary_text: str = generate_sentiment_summary(sentiment_counts=sentiment_counts)\n\
      \    \n    trend_summary_text: str = generate_trend_summary(trending_topics=identify_trends_input.trending_topics,\
      \ sentiment_trends=identify_trends_input.sentiment_trends)\n    \n    full_report_text:\
      \ str = generate_full_report(sentiment_summary=sentiment_summary_text, trend_summary=trend_summary_text,\
