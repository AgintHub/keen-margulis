dag_type: shim
description: Generated workflow from UI.
name: news_analysis_workflow
nodes:
  analyze_sentiment:
    agent: false
    code_node_type: shim
    description: Analyze the sentiment of the news articles.
    implementation: "from ._analyze_sentiment.validate_summaries_input import validate_summaries_input\n\
      from ._analyze_sentiment.generate_article_indices import generate_article_indices\n\
      from ._analyze_sentiment.analyze_sentiment_batch import analyze_sentiment_batch\n\
      from ._analyze_sentiment.extract_sentiment_categories import extract_sentiment_categories\n\
      from ._analyze_sentiment.extract_confidence_scores import extract_confidence_scores\n\
      \nfrom pydantic import BaseModel, Field\nfrom typing import List\n\n\nclass\
      \ SummarizeNewsArticlesOutput(BaseModel):\n    \"\"\"Pydantic model for summarize_news_articles\
      \ node outputs.\"\"\"\n    summary_count: int = (\n        Field(..., description=\"\
      Number of article summaries generated\")\n    )\n    summaries: List[str] =\
      \ (\n        Field(..., description = (\n            \"Concise summaries for\
      \ each news article, ordered as input\")\n        )\n    )\n\n\nclass AnalyzeSentimentOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for analyze_sentiment node outputs.\"\"\"\n    article_index:\
      \ List[int] = (\n        Field(..., description = (\n            \"The sequential\
      \ index of each article in the input list.\")\n        )\n    )\n    sentiment_category:\
      \ List[str] = (\n        Field(..., description = (\n            \"Sentiment\
      \ category for each article, one of 'positive', 'negative', or 'neutral'.\"\
      )\n        )\n    )\n    sentiment_confidence: List[float] = (\n        Field(...,\
      \ description = (\n            \"Confidence score (0.0 to 1.0) for the assigned\
      \ sentiment.\")\n        )\n    )\n\n\ndef analyze_sentiment(summarize_news_articles_input:\
      \ SummarizeNewsArticlesOutput, **kwargs) -> AnalyzeSentimentOutput:\n    \"\"\
      \"\n    Analyze the sentiment of news article summaries.\n\n    Parameters\n\
      \    ----------\n    summaries : List[str]\n        A list of concise summaries\
      \ generated by `summarize_news_articles`.\n\n    Returns\n    -------\n    dict\n\
      \        A dictionary with keys `article_index`, `sentiment_category`, and\n\
      \        `sentiment_confidence`, each mapping to a list of the same length as\n\
      \        the input `summaries`.\n\n    Raises\n    ------\n    ValueError\n\
      \        Raised if `summaries` is empty or contains non-string entries.\n\n\
      \    Examples\n    --------\n    >>> results = analyze_sentiment(['Neutral news\
      \ about weather'])\n    {'article_index': [0], 'sentiment_category': ['neutral'],\n\
      \    'sentiment_confidence': [0.65]}\n\n    \"\"\"\n    summaries: List[str]\
      \ = summarize_news_articles_input.summaries\n    \n    validate_summaries_input(summaries=summaries)\n\
      \    \n    article_indices: List[int] = generate_article_indices(summaries_count=len(summaries))\n\
      \    \n    sentiment_results: List[dict] = analyze_sentiment_batch(summaries=summaries)\n\
      \    \n    sentiment_categories: List[str] = extract_sentiment_categories(results=sentiment_results)\n\
      \    \n    confidence_scores: List[float] = extract_confidence_scores(results=sentiment_results)\n\
      \    \n    return AnalyzeSentimentOutput(\n        article_index=article_indices,\n\
      \        sentiment_category=sentiment_categories,\n        sentiment_confidence=confidence_scores\n\
      \    )"
    name: analyze_sentiment
    nodes_depended_on:
    - summarize_news_articles
    nodes_dependent_on: []
    output_structure:
    - description: The sequential index of each article in the input list.
      key: article_index
      type: List[int]
    - description: Sentiment category for each article, one of 'positive', 'negative',
        or 'neutral'.
      key: sentiment_category
      type: List[str]
    - description: Confidence score (0.0 to 1.0) for the assigned sentiment.
      key: sentiment_confidence
      type: List[float]
    prd:
      conceptual_info: The node takes concise article summaries and determines the
        overall sentiment of each article, returning a list of indices, sentiment
        categories, and confidence scores.
      docstring:
        examples:
        - lines:
          - results = analyze_sentiment(['Neutral news about weather'])
          output: '{''article_index'': [0], ''sentiment_category'': [''neutral''],
            ''sentiment_confidence'': [0.65]}'
        parameters:
        - description: A list of concise summaries generated by `summarize_news_articles`.
          name: summaries
          type: List[str]
        raises:
        - description: Raised if `summaries` is empty or contains non-string entries.
          type: ValueError
        returns:
          description: A dictionary with keys `article_index`, `sentiment_category`,
            and `sentiment_confidence`, each mapping to a list of the same length
            as the input `summaries`.
          type: dict
        summary: Analyze the sentiment of news article summaries.
    prompt: Determine the sentiment of the news articles, categorizing them as positive,
      negative, or neutral.
    shims:
    - agent: false
      code_node_type: virtual-stub
      description: A shim that validates a list of article summaries, ensuring each
        element is a non‑empty string, and returns a confirmation message.
      implementation: "def validate_summaries_input(summaries: str) -> str:\n    \"\
        \"\"\n    Validate that the provided list of article summaries is a non‑empty\
        \ list of\n    non‑empty strings, and return a confirmation message.\n\n \
        \   Parameters\n    ----------\n    summaries : List[str]\n        List of\
        \ article summaries to be validated. Each element must be a\n        non‑empty\
        \ string.\n\n    Returns\n    -------\n    str\n        A string message confirming\
        \ successful validation, e.g., \"Summaries\n        validated successfully.\"\
        \n\n    Raises\n    ------\n    TypeError\n        If `summaries` is not a\
        \ list.\n    ValueError\n        If `summaries` is an empty list or contains\
        \ non‑string or empty\n        string elements.\n\n    Examples\n    --------\n\
        \    >>> validate_summaries_input(['First summary', 'Second summary'])\n \
        \   \"Summaries validated successfully.\"\n\n    >>> try:\n    ...     validate_summaries_input([\"\
        \", \"Valid summary\"])\n    >>> except ValueError as e:\n    ...     print(e)\n\
        \    \"Each summary must be a non-empty string.\"\n\n    \"\"\"\n    raise\
        \ NotImplementedError(\"This is a virtual stub node that needs to be implemented\"\
        )"
      name: validate_summaries_input
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type Any
        key: output
        type: str
      - description: Input parameter of type str
        key: summaries
        type: str
      prd:
        conceptual_info: The validate_summaries_input shim ensures that the input
          list of summaries is well‑formed before it is passed to downstream sentiment
          analysis. It performs type checks and non‑emptiness checks to prevent runtime
          errors in later stages.
        docstring:
          examples:
          - lines:
            - validate_summaries_input(['First summary', 'Second summary'])
            output: '"Summaries validated successfully."'
          - lines:
            - 'try:'
            - '    validate_summaries_input(["", "Valid summary"])'
            - 'except ValueError as e:'
            - '    print(e)'
            output: '"Each summary must be a non-empty string."'
          parameters:
          - description: List of article summaries to be validated. Each element must
              be a non‑empty string.
            name: summaries
            type: List[str]
          raises:
          - description: If `summaries` is not a list.
            type: TypeError
          - description: If `summaries` is an empty list or contains non‑string or
              empty string elements.
            type: ValueError
          returns:
            description: A string message confirming successful validation, e.g.,
              "Summaries validated successfully."
            type: str
          summary: Validate that the provided list of article summaries is a non‑empty
            list of non‑empty strings, and return a confirmation message.
      prompt: Implement validation logic that checks that `summaries` is a non‑empty
        list of strings and returns a success message; raise ValueError or TypeError
        as appropriate.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Generates a sequential list of article indices based on the number
        of summaries provided.
      implementation: "from typing import List\n\n\ndef generate_article_indices(summaries_count:\
        \ str) -> List[int]:\n    \"\"\"\n    Return a list of integers from 0 to\
        \ summaries_count-1 representing article\n    indices.\n\n    Parameters\n\
        \    ----------\n    summaries_count : int\n        The total number of article\
        \ summaries that require indexing.\n\n    Returns\n    -------\n    List[int]\n\
        \        A list of sequential integer indices corresponding to each article.\n\
        \n    Raises\n    ------\n    ValueError\n        Raised when summaries_count\
        \ is negative.\n    TypeError\n        Raised when summaries_count is not\
        \ of type int.\n\n    Examples\n    --------\n    >>> generate_article_indices(summaries_count=3)\n\
        \    [0, 1, 2]\n\n    >>> generate_article_indices(summaries_count=0)\n  \
        \  []\n\n    \"\"\"\n    raise NotImplementedError(\"This is a virtual stub\
        \ node that needs to be implemented\")"
      name: generate_article_indices
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[int]
        key: output
        type: List[int]
      - description: Input parameter of type str
        key: summaries_count
        type: str
      prd:
        conceptual_info: This shim creates a simple mapping from article count to
          a list of integer indices, which is used by downstream sentiment analysis
          to align results with the original article order.
        docstring:
          examples:
          - lines:
            - generate_article_indices(summaries_count=3)
            output: '[0, 1, 2]'
          - lines:
            - generate_article_indices(summaries_count=0)
            output: '[]'
          parameters:
          - description: The total number of article summaries that require indexing.
            name: summaries_count
            type: int
          raises:
          - description: Raised when summaries_count is negative.
            type: ValueError
          - description: Raised when summaries_count is not of type int.
            type: TypeError
          returns:
            description: A list of sequential integer indices corresponding to each
              article.
            type: List[int]
          summary: Return a list of integers from 0 to summaries_count-1 representing
            article indices.
      prompt: Generate a list of article indices for the given number of summaries.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Analyzes a batch of article summaries to produce sentiment categories
        and confidence scores.
      implementation: "from typing import List\n\n\ndef analyze_sentiment_batch(summaries:\
        \ str) -> List[str]:\n    \"\"\"\n    Classify each summary in the input list\
        \ into a sentiment category and\n    provide a confidence score.\n\n    Parameters\n\
        \    ----------\n    summaries : LIST_STR\n        A list of article summary\
        \ strings to be analyzed.\n\n    Returns\n    -------\n    LIST_STR\n    \
        \    A list of dictionaries, each containing 'sentiment_category' (str)\n\
        \        and 'sentiment_confidence' (float).\n\n    Raises\n    ------\n \
        \   ValueError\n        Raised if the input list is empty or contains non-string\
        \ elements.\n    TypeError\n        Raised if the input is not a list of strings.\n\
        \n    Examples\n    --------\n    >>> analyze_sentiment_batch(['Great product!',\
        \ 'Not good at all.'])\n    [{'sentiment_category': 'positive', 'sentiment_confidence':\
        \ 0.92},\n    {'sentiment_category': 'negative', 'sentiment_confidence': 0.88}]\n\
        \n    >>> analyze_sentiment_batch(['I love it', 'It could be better'])\n \
        \   [{'sentiment_category': 'positive', 'sentiment_confidence': 0.85},\n \
        \   {'sentiment_category': 'neutral', 'sentiment_confidence': 0.55}]\n\n \
        \   \"\"\"\n    raise NotImplementedError(\"This is a virtual stub node that\
        \ needs to be implemented\")"
      name: analyze_sentiment_batch
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[dict]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: summaries
        type: str
      prd:
        conceptual_info: The analyze_sentiment_batch shim is responsible for performing
          sentiment classification on a set of article summaries, returning structured
          results for downstream processing.
        docstring:
          examples:
          - lines:
            - analyze_sentiment_batch(['Great product!', 'Not good at all.'])
            output: '[{''sentiment_category'': ''positive'', ''sentiment_confidence'':
              0.92}, {''sentiment_category'': ''negative'', ''sentiment_confidence'':
              0.88}]'
          - lines:
            - analyze_sentiment_batch(['I love it', 'It could be better'])
            output: '[{''sentiment_category'': ''positive'', ''sentiment_confidence'':
              0.85}, {''sentiment_category'': ''neutral'', ''sentiment_confidence'':
              0.55}]'
          parameters:
          - description: A list of article summary strings to be analyzed.
            name: summaries
            type: LIST_STR
          raises:
          - description: Raised if the input list is empty or contains non-string
              elements.
            type: ValueError
          - description: Raised if the input is not a list of strings.
            type: TypeError
          returns:
            description: A list of dictionaries, each containing 'sentiment_category'
              (str) and 'sentiment_confidence' (float).
            type: LIST_STR
          summary: Classify each summary in the input list into a sentiment category
            and provide a confidence score.
      prompt: Analyze each article summary in the input list, classify its sentiment
        as 'positive', 'negative', or 'neutral', and assign a confidence score between
        0.0 and 1.0. Return a list of dictionaries with keys 'sentiment_category'
        and 'sentiment_confidence'.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Extracts a list of sentiment categories from sentiment analysis
        results.
      implementation: "from typing import List\n\n\ndef extract_sentiment_categories(results:\
        \ str) -> List[str]:\n    \"\"\"\n    Return a list of sentiment categories\
        \ from the given analysis results.\n\n    Parameters\n    ----------\n   \
        \ results : List[dict]\n        A list of dictionaries returned by a sentiment\
        \ analysis batch\n        process. Each dictionary must contain a 'sentiment_category'\
        \ key\n        with a string value.\n\n    Returns\n    -------\n    List[str]\n\
        \        A list of sentiment category strings in the same order as the input\n\
        \        results.\n\n    Raises\n    ------\n    TypeError\n        If the\
        \ input is not a list or contains non-dictionary elements.\n    ValueError\n\
        \        If any dictionary in the list lacks the 'sentiment_category' key.\n\
        \n    Examples\n    --------\n    >>> results = [\n    ...     {'sentiment_category':\
        \ 'positive', 'sentiment_confidence': 0.95},\n    ...     {'sentiment_category':\
        \ 'neutral', 'sentiment_confidence': 0.60},\n    ...     {'sentiment_category':\
        \ 'negative', 'sentiment_confidence': 0.20}\n    >>> ]\n    >>> extract_sentiment_categories(results=results)\n\
        \    ['positive', 'neutral', 'negative']\n\n    >>> results = [\n    ... \
        \    {'sentiment_confidence': 0.95},\n    ...     {'sentiment_category': 'neutral'}\n\
        \    >>> ]\n    >>> extract_sentiment_categories(results=results)\n    ValueError:\
        \ Each result dictionary must contain a 'sentiment_category' key.\n\n    \"\
        \"\"\n    raise NotImplementedError(\"This is a virtual stub node that needs\
        \ to be implemented\")"
      name: extract_sentiment_categories
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: results
        type: str
      prd:
        conceptual_info: This shim retrieves the sentiment category labels (e.g.,
          'positive', 'negative', 'neutral') from a batch of sentiment analysis result
          dictionaries, enabling downstream components to aggregate and report sentiment
          distributions across articles.
        docstring:
          examples:
          - lines:
            - results = [
            - '    {''sentiment_category'': ''positive'', ''sentiment_confidence'':
              0.95},'
            - '    {''sentiment_category'': ''neutral'', ''sentiment_confidence'':
              0.60},'
            - '    {''sentiment_category'': ''negative'', ''sentiment_confidence'':
              0.20}'
            - ']'
            - extract_sentiment_categories(results=results)
            output: '[''positive'', ''neutral'', ''negative'']'
          - lines:
            - results = [
            - '    {''sentiment_confidence'': 0.95},'
            - '    {''sentiment_category'': ''neutral''}'
            - ']'
            - extract_sentiment_categories(results=results)
            output: 'ValueError: Each result dictionary must contain a ''sentiment_category''
              key.'
          parameters:
          - description: A list of dictionaries returned by a sentiment analysis batch
              process. Each dictionary must contain a 'sentiment_category' key with
              a string value.
            name: results
            type: List[dict]
          raises:
          - description: If the input is not a list or contains non-dictionary elements.
            type: TypeError
          - description: If any dictionary in the list lacks the 'sentiment_category'
              key.
            type: ValueError
          returns:
            description: A list of sentiment category strings in the same order as
              the input results.
            type: List[str]
          summary: Return a list of sentiment categories from the given analysis results.
      prompt: Extract sentiment categories from the provided sentiment analysis results.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Extracts sentiment confidence scores from a list of sentiment analysis
        result dictionaries.
      implementation: "from typing import List\n\n\ndef extract_confidence_scores(results:\
        \ str) -> List[float]:\n    \"\"\"\n    Extracts sentiment confidence scores\
        \ from a list of sentiment analysis\n    result dictionaries.\n\n    Parameters\n\
        \    ----------\n    results : List[dict]\n        A list of dictionaries\
        \ returned by the sentiment analysis batch\n        function; each dictionary\
        \ should contain a key\n        'sentiment_confidence' mapping to a float\
        \ between 0.0 and 1.0.\n\n    Returns\n    -------\n    List[float]\n    \
        \    A list of confidence scores, preserving the order of the input\n    \
        \    results.\n\n    Raises\n    ------\n    ValueError\n        Raised if\
        \ any result dictionary lacks the 'sentiment_confidence' key\n        or if\
        \ the value is not a float between 0.0 and 1.0.\n    TypeError\n        Raised\
        \ if the input is not a list or if any element in the list is\n        not\
        \ a dictionary.\n\n    Examples\n    --------\n    >>> sample_results = [\n\
        \    ...     {'sentiment_confidence': 0.85},\n    ...     {'sentiment_confidence':\
        \ 0.42},\n    >>> ]\n    >>> extract_confidence_scores(sample_results)\n \
        \   [0.85, 0.42]\n\n    >>> invalid_results = [\n    ...     {'confidence':\
        \ 0.9},\n    ...     {'sentiment_confidence': 0.75}\n    >>> ]\n    >>> extract_confidence_scores(invalid_results)\n\
        \    ValueError: Missing or invalid 'sentiment_confidence' key in result\n\
        \    dictionary.\n\n    \"\"\"\n    raise NotImplementedError(\"This is a\
        \ virtual stub node that needs to be implemented\")"
      name: extract_confidence_scores
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[float]
        key: output
        type: List[float]
      - description: Input parameter of type str
        key: results
        type: str
      prd:
        conceptual_info: This shim function isolates the extraction of sentiment confidence
          scores from the raw batch sentiment analysis output, enabling downstream
          components to consume a clean list of float values.
        docstring:
          examples:
          - lines:
            - sample_results = [
            - '    {''sentiment_confidence'': 0.85},'
            - '    {''sentiment_confidence'': 0.42},'
            - ']'
            - extract_confidence_scores(sample_results)
            output: '[0.85, 0.42]'
          - lines:
            - invalid_results = [
            - '    {''confidence'': 0.9},'
            - '    {''sentiment_confidence'': 0.75}'
            - ']'
            - extract_confidence_scores(invalid_results)
            output: 'ValueError: Missing or invalid ''sentiment_confidence'' key in
              result dictionary.'
          parameters:
          - description: A list of dictionaries returned by the sentiment analysis
              batch function; each dictionary should contain a key 'sentiment_confidence'
              mapping to a float between 0.0 and 1.0.
            name: results
            type: List[dict]
          raises:
          - description: Raised if any result dictionary lacks the 'sentiment_confidence'
              key or if the value is not a float between 0.0 and 1.0.
            type: ValueError
          - description: Raised if the input is not a list or if any element in the
              list is not a dictionary.
            type: TypeError
          returns:
            description: A list of confidence scores, preserving the order of the
              input results.
            type: List[float]
          summary: Extracts sentiment confidence scores from a list of sentiment analysis
            result dictionaries.
      prompt: 'Implement extract_confidence_scores(results: List[dict]) -> List[float]
        that pulls the confidence score from each result dict.'
      shims: []
  categorize_news_articles:
    agent: false
    code_node_type: shim
    description: Categorize news articles by topic or theme.
    implementation: "from ._categorize_news_articles.validate_input import validate_input\n\
      from ._categorize_news_articles.normalize_article_titles import normalize_article_titles\n\
      from ._categorize_news_articles.assign_categories import assign_categories\n\
      from ._categorize_news_articles.get_unique_categories import get_unique_categories\n\
      \nfrom pydantic import BaseModel, Field\nfrom typing import List\n\n\nclass\
      \ FilterNewsArticlesOutput(BaseModel):\n    \"\"\"Pydantic model for filter_news_articles\
      \ node outputs.\"\"\"\n    filtered_article_ids: List[str] = (\n        Field(...,\
      \ description = (\n            \"List of article identifiers or titles that\
      \ passed the relevance and duplication filters.\")\n        )\n    )\n    removed_article_ids:\
      \ List[str] = (\n        Field(..., description = (\n            \"List of article\
      \ identifiers or titles that were excluded due to irrelevance or duplication.\"\
      )\n        )\n    )\n    filter_success: bool = (\n        Field(..., description\
      \ = (\n            \"Indicates whether the filtering operation completed successfully\
      \ without errors.\")\n        )\n    )\n\n\nclass CategorizeNewsArticlesOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for categorize_news_articles node outputs.\"\"\"\n\
      \    article_titles: List[str] = (\n        Field(..., description = (\n   \
      \         \"List of article titles that were filtered and are now categorized.\"\
      )\n        )\n    )\n    categories: List[str] = (\n        Field(..., description\
      \ = (\n            \"List of category labels corresponding to each article in\
      \ `article_titles`; indices match.\")\n        )\n    )\n    unique_category_count:\
      \ int = (\n        Field(..., description = (\n            \"Total number of\
      \ distinct categories identified.\")\n        )\n    )\n    article_count: int\
      \ = (\n        Field(..., description = (\n            \"Total number of articles\
      \ processed by this node.\")\n        )\n    )\n    is_successful: bool = (\n\
      \        Field(..., description = (\n            \"Indicates whether the categorization\
      \ succeeded without errors.\")\n        )\n    )\n\n\ndef categorize_news_articles(filter_news_articles_input:\
      \ FilterNewsArticlesOutput, **kwargs) -> CategorizeNewsArticlesOutput:\n   \
      \ \"\"\"\n    Assigns topical categories to a list of filtered news article\
      \ titles.\n\n    Parameters\n    ----------\n    filtered_article_ids : List[str]\n\
      \        List of article identifiers or titles that passed the relevance and\n\
      \        duplication filters.\n\n    Returns\n    -------\n    Dict[str, Any]\n\
      \        Dictionary containing `article_titles`, `categories`,\n        `unique_category_count`,\
      \ `article_count`, and `is_successful`.\n\n    Raises\n    ------\n    ValueError\n\
      \        Raised if `filtered_article_ids` is empty or not a list of strings.\n\
      \n    Examples\n    --------\n    >>> categorized = categorize_news_articles(['Economic\
      \ growth forecast',\n    'Parliament passes new law', 'Local community event'])\n\
      \    {\n      'article_titles': ['Economic growth forecast', 'Parliament passes\
      \ new\n    law', 'Local community event'],\n      'categories': ['Economics',\
      \ 'Politics', 'Social Issues'],\n      'unique_category_count': 3,\n      'article_count':\
      \ 3,\n      'is_successful': True\n    }\n\n    >>> categorize_news_articles([])\n\
      \    ValueError: filtered_article_ids must be a non-empty list of strings.\n\
      \n    \"\"\"\n    filtered_article_ids: List[str] = filter_news_articles_input.filtered_article_ids\n\
      \    \n    validate_input(filtered_article_ids=filtered_article_ids)\n    \n\
      \    normalized_titles: List[str] = normalize_article_titles(article_ids=filtered_article_ids)\n\
      \    \n    categories: List[str] = assign_categories(article_titles=normalized_titles)\n\
      \    \n    unique_categories: List[str] = get_unique_categories(categories=categories)\n\
      \    \n    unique_category_count: int = len(unique_categories)\n    article_count:\
      \ int = len(normalized_titles)\n    \n    return CategorizeNewsArticlesOutput(\n\
      \        article_titles=normalized_titles,\n        categories=categories,\n\
      \        unique_category_count=unique_category_count,\n        article_count=article_count,\n\
      \        is_successful=True\n    )"
