      \ import generate_full_report\nfrom ._compile_analysis_report.validate_report_completion\
      \ import validate_report_completion\n\nfrom pydantic import BaseModel, Field\n\
      from typing import List\n\n\nclass AnalyzeSentimentOutput(BaseModel):\n    \"\
      \"\"Pydantic model for analyze_sentiment node outputs.\"\"\"\n    article_index:\
