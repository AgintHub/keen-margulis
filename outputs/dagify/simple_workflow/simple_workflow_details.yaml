dag_type: plain_text
description: A simple workflow DAG with fundamental steps
name: simple_workflow
nodes:
  end_node:
    agent: false
    description: The ending point of the workflow
    name: end_node
    nodes_depended_on:
    - step_3
    nodes_dependent_on: []
    prompt: Finalize the workflow
  start_node:
    agent: false
    description: The starting point of the workflow
    name: start_node
    nodes_depended_on: []
    nodes_dependent_on:
    - step_1
    - step_2
    prompt: Initialize the workflow
  step_1:
    agent: false
    description: The first step in the workflow
    name: step_1
    nodes_depended_on:
    - start_node
    nodes_dependent_on:
    - step_3
    prompt: Perform the first task
  step_2:
    agent: false
    description: The second step in the workflow
    name: step_2
    nodes_depended_on:
    - start_node
    nodes_dependent_on:
    - step_3
    prompt: Perform the second task
  step_3:
    agent: false
    description: The third step in the workflow, dependent on step 1 and step 2
    name: step_3
    nodes_depended_on:
    - step_1
    - step_2
    nodes_dependent_on:
    - end_node
    prompt: Perform the third task using outputs from step 1 and step 2
