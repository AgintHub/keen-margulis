dag_type: typed
description: Generated workflow from UI.
name: create_workflow
nodes:
  create_task_prompts:
    agent: false
    description: Create prompts for each task
    name: create_task_prompts
    nodes_depended_on:
    - decompose_objective_into_tasks
    nodes_dependent_on: []
    output_structure:
    - description: List of task names that prompts were created for
      key: task_names
      type: List[str]
    - description: List of detailed prompts for each task, describing what needs to
        be done
      key: task_prompts
      type: List[str]
    - description: List of brief descriptions for each task
      key: task_descriptions
      type: List[str]
    - description: Total number of task prompts created
      key: prompt_count
      type: int
    - description: Whether prompts were successfully created for all tasks
      key: all_prompts_created
      type: bool
    prompt: Write a prompt for each task, describing what needs to be done.
  decompose_objective_into_tasks:
    agent: false
    description: Break down the objective into smaller tasks
    name: decompose_objective_into_tasks
    nodes_depended_on:
    - define_workflow_objective
    nodes_dependent_on: []
    output_structure:
    - description: List of task names that need to be completed
      key: task_names
      type: List[str]
    - description: Detailed descriptions for each task explaining what needs to be
        done
      key: task_descriptions
      type: List[str]
    - description: Total number of tasks identified
      key: estimated_task_count
      type: int
    - description: Priority levels for each task (1-5, where 1 is highest priority)
      key: task_priorities
      type: List[int]
    - description: Whether each task requires an AI agent to complete
      key: requires_agent
      type: List[bool]
    prompt: List the smaller tasks that need to be completed to achieve the workflow
      objective.
  define_workflow_objective:
    agent: false
    description: Define the objective of the workflow
    name: define_workflow_objective
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: A single sentence describing the main goal or purpose of the workflow
      key: workflow_objective
      type: str
    - description: Key terms or concepts extracted from the workflow objective
      key: objective_keywords
      type: List[str]
    - description: Whether the objective contains measurable success criteria
      key: is_measurable
      type: bool
    prompt: State the objective of the workflow in one sentence.
  design_workflow_dag:
    agent: false
    description: Create a directed acyclic graph of the workflow
    name: design_workflow_dag
    nodes_depended_on:
    - identify_task_dependencies
    nodes_dependent_on: []
    output_structure:
    - description: List of all task names/nodes in the workflow DAG
      key: task_nodes
      type: List[str]
    - description: List of dependency relationships in format 'task1->task2' indicating
        task1 must complete before task2
      key: dependency_edges
      type: List[str]
    - description: List of execution levels for each task (0 for no dependencies,
        1 for depends on level 0, etc.)
      key: execution_levels
      type: List[int]
    - description: Ordered list of tasks forming the critical path through the workflow
      key: critical_path
      type: List[str]
    - description: Whether the graph is acyclic (no circular dependencies detected)
      key: is_acyclic
      type: bool
    - description: Text-based representation of the DAG diagram using ASCII art or
        similar format
      key: diagram_representation
      type: str
    prompt: Create a diagram showing the tasks and their dependencies.
  identify_task_dependencies:
    agent: false
    description: Identify dependencies between tasks
    name: identify_task_dependencies
    nodes_depended_on:
    - decompose_objective_into_tasks
    nodes_dependent_on: []
    output_structure:
    - description: List of all task names identified in the workflow
      key: task_names
      type: List[str]
    - description: List of dependency relationships in format 'task_A -> task_B' where
        task_A must complete before task_B
      key: dependency_pairs
      type: List[str]
    - description: List of tasks that have no dependencies and can start immediately
      key: independent_tasks
      type: List[str]
    - description: List of tasks that no other tasks depend on
      key: terminal_tasks
      type: List[str]
    - description: Total number of dependency relationships identified
      key: dependency_count
      type: int
    - description: Whether any circular dependencies were detected in the task relationships
      key: has_circular_dependencies
      type: bool
    prompt: List the dependencies between tasks, including which tasks need to be
      completed before others.
  plan_workflow_execution:
    agent: false
    description: Plan the execution of the workflow
    name: plan_workflow_execution
    nodes_depended_on:
    - design_workflow_dag
    nodes_dependent_on: []
    output_structure:
    - description: Ordered list of steps describing how the workflow will be executed
      key: execution_steps
      type: List[str]
    - description: List of resources needed for workflow execution (e.g., computing
        resources, APIs, databases)
      key: required_resources
      type: List[str]
    - description: List of infrastructure components required (e.g., servers, cloud
        services, containers)
      key: infrastructure_requirements
      type: List[str]
    - description: Estimated total duration for workflow execution in minutes
      key: estimated_duration_minutes
      type: int
    - description: Whether any tasks in the workflow can be executed in parallel
      key: parallel_execution_possible
      type: bool
    - description: List of events or conditions that trigger workflow execution
      key: execution_triggers
      type: List[str]
    - description: List of checkpoints where workflow progress should be monitored
      key: monitoring_checkpoints
      type: List[str]
    prompt: Describe how the workflow will be executed, including any necessary resources
      or infrastructure.
  review_workflow:
    agent: false
    description: Review the workflow for completeness and accuracy
    name: review_workflow
    nodes_depended_on:
    - plan_workflow_execution
    nodes_dependent_on: []
    output_structure:
    - description: Whether the workflow contains all necessary steps to achieve the
        objective
      key: is_workflow_complete
      type: bool
    - description: Whether the workflow steps and dependencies are correctly defined
      key: is_workflow_accurate
      type: bool
    - description: Whether the workflow can be realistically executed with available
        resources
      key: is_workflow_achievable
      type: bool
    - description: List of any missing elements or gaps identified in the workflow
      key: missing_elements
      type: List[str]
    - description: List of accuracy issues or errors found in the workflow
      key: accuracy_issues
      type: List[str]
    - description: List of feasibility concerns or resource constraints identified
      key: feasibility_concerns
      type: List[str]
    - description: List of suggestions for improving the workflow
      key: improvement_suggestions
      type: List[str]
    - description: Summary of the overall workflow review findings
      key: overall_review_summary
      type: str
    - description: Overall quality score of the workflow from 0.0 to 1.0
      key: workflow_quality_score
      type: float
    prompt: Review the workflow and ensure it is complete, accurate, and achievable.
