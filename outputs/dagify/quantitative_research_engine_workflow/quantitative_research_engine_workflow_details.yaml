dag_type: typed
description: Generated workflow from UI.
name: quantitative_research_engine_workflow
nodes:
  assess_alternative_data_availability:
    agent: false
    description: Evaluates the availability and quality of the identified alternative
      data.
    name: assess_alternative_data_availability
    nodes_depended_on:
    - gather_alternative_data
    nodes_dependent_on: []
    output_structure:
    - description: Assessment of the availability of the alternative data (e.g., readily
        available, requires acquisition, limited availability).
      key: data_availability
      type: str
    - description: Number of years of historical data available.
      key: historical_coverage_years
      type: int
    - description: List of any immediate quality concerns identified (e.g., missing
        values, outliers, inconsistencies).
      key: quality_concerns
      type: List[str]
    - description: List of significant limitations of the alternative data, such as
        data granularity, frequency, or coverage gaps.
      key: significant_limitations
      type: List[str]
    prompt: For the specified alternative data, assess its availability, historical
      coverage, and any immediate quality concerns. Report any significant limitations.
  assess_implementation_constraints:
    agent: false
    description: Evaluates practical implementation challenges like liquidity and
      turnover.
    name: assess_implementation_constraints
    nodes_depended_on:
    - formulate_initial_hypotheses
    nodes_dependent_on: []
    output_structure:
    - description: List of practical implementation constraints for each hypothesis,
        including liquidity, turnover, and transaction cost impacts.
      key: hypothesis_constraints
      type: List[str]
    - description: List of significant limitations identified for each hypothesis
        concerning implementation.
      key: limitations_reported
      type: List[str]
    prompt: For each initial hypothesis (factors, signals, anomalies), assess practical
      implementation constraints including liquidity of the underlying assets, typical
      turnover thresholds, and potential transaction cost impacts. Report limitations.
  assess_macro_data_availability:
    agent: false
    description: Evaluates the availability and quality of the identified macroeconomic
      data.
    name: assess_macro_data_availability
    nodes_depended_on:
    - gather_macro_economic_data
    nodes_dependent_on: []
    output_structure:
    - description: Boolean indicating if the macroeconomic data is available.
      key: is_available
      type: bool
    - description: Number of years of historical data available.
      key: historical_coverage_years
      type: int
    - description: List of any immediate quality concerns identified in the data.
      key: quality_concerns
      type: List[str]
    - description: List of any significant limitations observed in the data's availability
        or quality.
      key: significant_limitations
      type: List[str]
    prompt: For the specified macroeconomic data, assess its availability, historical
      coverage, and any immediate quality concerns. Report any significant limitations.
  assess_market_data_availability:
    agent: false
    description: Evaluates the availability and quality of the identified market data.
    name: assess_market_data_availability
    nodes_depended_on:
    - gather_market_data
    nodes_dependent_on: []
    output_structure:
    - description: Indicates whether the market data is generally available.
      key: data_availability
      type: bool
    - description: The number of years of historical data available.
      key: historical_coverage_years
      type: int
    - description: A list of any immediate quality concerns identified with the market
        data.
      key: quality_concerns
      type: List[str]
    - description: A list of significant limitations in the market data's availability
        or quality.
      key: significant_limitations
      type: List[str]
    - description: A textual summary of the market data assessment.
      key: assessment_summary
      type: str
    prompt: For the specified market data, assess its availability, historical coverage,
      and any immediate quality concerns. Report any significant limitations.
  conduct_scenario_analysis:
    agent: false
    description: Performs scenario analysis to assess model performance under different
      market regimes.
    name: conduct_scenario_analysis
    nodes_depended_on:
    - perform_out_of_sample_testing
    nodes_dependent_on: []
    output_structure:
    - description: Name of the market scenario analyzed (e.g., inflation shock, geopolitical
        event).
      key: scenario_name
      type: List[str]
    - description: Description of the model's performance implications under each
        scenario.
      key: performance_implications
      type: List[str]
    prompt: Conduct scenario analysis by evaluating the model's performance under
      predefined market scenarios (e.g., inflation shock, geopolitical event). Report
      performance implications for each scenario.
  conduct_stress_testing:
    agent: false
    description: Performs stress tests on the model's predicted outcomes.
    name: conduct_stress_testing
    nodes_depended_on:
    - perform_out_of_sample_testing
    nodes_dependent_on: []
    output_structure:
    - description: Key performance metrics (e.g., drawdown, volatility) under stressed
        market conditions.
      key: stress_test_performance_metrics
      type: List[float]
    - description: Qualitative description of the model's behavior and stability during
        stress scenarios.
      key: model_behavior_under_stress
      type: List[str]
    - description: Quantified impact of adverse scenarios on portfolio value or strategy
        objectives.
      key: adverse_scenario_impact
      type: List[float]
    prompt: Conduct stress testing on the model's predictions using extreme but plausible
      market conditions. Evaluate the model's behavior and performance under these
      adverse scenarios.
  construct_portfolio:
    agent: false
    description: Constructs a diversified portfolio incorporating transaction cost
      modeling.
    name: construct_portfolio
    nodes_depended_on:
    - design_risk_budgeting
    nodes_dependent_on: []
    output_structure:
    - description: List of asset weights in the constructed portfolio.
      key: portfolio_allocations
      type: List[float]
    - description: List of risk contributions from each asset in the portfolio.
      key: portfolio_risk_contributions
      type: List[float]
    - description: The expected return of the constructed portfolio.
      key: portfolio_expected_return
      type: float
    - description: The expected volatility (standard deviation) of the constructed
        portfolio.
      key: portfolio_expected_volatility
      type: float
    - description: The correlation matrix of the assets within the portfolio.
      key: portfolio_correlation_matrix
      type: List[float]
    prompt: Construct a diversified portfolio based on the refined strategy, incorporating
      the risk budgeting framework. Optimize portfolio allocation while considering
      various risk factors.
  define_initial_anomalies:
    agent: false
    description: Defines the initial quantification of generated anomaly hypotheses.
    name: define_initial_anomalies
    nodes_depended_on:
    - generate_anomaly_hypotheses
    nodes_dependent_on: []
    output_structure:
    - description: A list of precise definitions for each anomaly hypothesis, including
        data sources, observation logic, and stock universe.
      key: anomaly_definitions
      type: List[str]
    prompt: For each generated anomaly hypothesis, provide a precise definition including
      data sources, observation logic, and stock universe.
  define_initial_factors:
    agent: false
    description: Defines the initial quantification of generated factor hypotheses.
    name: define_initial_factors
    nodes_depended_on:
    - generate_factor_hypotheses
    nodes_dependent_on: []
    output_structure:
    - description: The name of the factor hypothesis.
      key: factor_name
      type: str
    - description: A list of data sources used for the factor definition.
      key: data_sources
      type: List[str]
    - description: The precise logic for calculating the factor.
      key: calculation_logic
      type: str
    - description: The universe of stocks for which the factor is applicable.
      key: stock_universe
      type: str
    prompt: For each generated factor hypothesis, provide a precise definition including
      data sources, calculation logic, and stock universe.
  define_initial_signals:
    agent: false
    description: Defines the initial quantification of generated signal hypotheses.
    name: define_initial_signals
    nodes_depended_on:
    - generate_signal_hypotheses
    nodes_dependent_on: []
    output_structure:
    - description: A list of precise definitions for each generated signal hypothesis,
        including data sources, calculation logic, and stock universe.
      key: signal_definitions
      type: List[str]
    prompt: For each generated signal hypothesis, provide a precise definition including
      data sources, calculation logic, and stock universe.
  design_risk_budgeting:
    agent: false
    description: Develops a risk budgeting framework for the identified strategy.
    name: design_risk_budgeting
    nodes_depended_on:
    - conduct_stress_testing
    - conduct_scenario_analysis
    nodes_dependent_on: []
    output_structure:
    - description: Allocation of risk across different strategy components.
      key: risk_budget_allocation
      type: List[float]
    - description: The predefined limit for overall portfolio risk.
      key: overall_portfolio_risk_limit
      type: float
    - description: Metrics used to define and track portfolio risk.
      key: risk_management_metrics
      type: List[str]
    - description: Individual risk contributions from each strategy component.
      key: strategy_component_risks
      type: List[float]
    prompt: Based on the stress and scenario analyses, design a risk budgeting framework
      that allocates risk across different components of the strategy and limits overall
      portfolio risk according to predefined metrics.
  evaluate_signal_robustness:
    agent: false
    description: Assesses the statistical rigor and robustness of initial signals.
    name: evaluate_signal_robustness
    nodes_depended_on:
    - formulate_initial_hypotheses
    nodes_dependent_on: []
    output_structure:
    - description: The name of the evaluated signal.
      key: signal_name
      type: str
    - description: A score representing the signal's predictive power.
      key: predictive_power_score
      type: float
    - description: The p-value associated with the signal's statistical significance.
      key: statistical_significance_p_value
      type: float
    - description: Key performance metrics achieved during out-of-sample testing for
        the signal.
      key: out_of_sample_performance_metrics
      type: float
    - description: A qualitative assessment of the signal's robustness.
      key: robustness_assessment
      type: str
    prompt: Evaluate the statistical rigor of the initial signals by assessing properties
      like predictive power, statistical significance (e.g., p-values), and out-of-sample
      performance. Report findings for each signal.
  explore_economic_rationales:
    agent: false
    description: Explores underlying economic reasons that could support the investment
      theme.
    name: explore_economic_rationales
    nodes_depended_on:
    - receive_user_input
    nodes_dependent_on: []
    output_structure:
    - description: A list of potential economic rationales or theories that could
        support the investment theme.
      key: economic_rationales
      type: List[str]
    prompt: Describe potential economic rationales or theories that underpin the provided
      investment theme or alpha idea.
  formulate_initial_hypotheses:
    agent: false
    description: Consolidates initial hypotheses from data availability, factor, signal,
      anomaly, and economic rationale explorations.
    name: formulate_initial_hypotheses
    nodes_depended_on:
    - assess_market_data_availability
    - assess_alternative_data_availability
    - assess_macro_data_availability
    - generate_factor_hypotheses
    - generate_signal_hypotheses
    - generate_anomaly_hypotheses
    - explore_economic_rationales
    nodes_dependent_on: []
    output_structure:
    - description: A consolidated list of preliminary research hypotheses, incorporating
        insights from data availability, factors, signals, anomalies, and economic
        rationales.
      key: preliminary_hypotheses
      type: List[str]
    - description: Summarized findings on the availability and quality of market,
        alternative, and macroeconomic data.
      key: data_availability_summary
      type: List[str]
    - description: Initial definitions for proposed investment factor hypotheses.
      key: factor_definitions
      type: List[str]
    - description: Initial definitions for proposed investment signal hypotheses.
      key: signal_definitions
      type: List[str]
    - description: Initial definitions for proposed market anomaly hypotheses.
      key: anomaly_definitions
      type: List[str]
    - description: Underlying economic rationales supporting the investment theme.
      key: economic_rationales
      type: List[str]
    prompt: Synthesize the findings from data availability assessments, factor hypotheses,
      signal hypotheses, anomaly hypotheses, and economic rationales into a consolidated
      list of preliminary research hypotheses.
  gather_alternative_data:
    agent: false
    description: Initiates data gathering for relevant alternative data sources.
    name: gather_alternative_data
    nodes_depended_on:
    - identify_data_sources
    nodes_dependent_on: []
    output_structure:
    - description: A list of specific alternative data points to be acquired.
      key: alternative_data_points
      type: List[str]
    - description: A list of specific sources for the alternative data.
      key: alternative_data_sources
      type: List[str]
    prompt: Outline the specific alternative data points and sources to be acquired
      relevant to the provided investment theme.
  gather_macro_economic_data:
    agent: false
    description: Initiates data gathering for relevant macroeconomic data sources.
    name: gather_macro_economic_data
    nodes_depended_on:
    - identify_data_sources
    nodes_dependent_on: []
    output_structure:
    - description: A list of specific macroeconomic indicators to be acquired.
      key: macroeconomic_indicators
      type: List[str]
    - description: A list of timeframes for which the macroeconomic data should be
        acquired.
      key: timeframes
      type: List[str]
    prompt: Outline the specific macroeconomic indicators and timeframes to be acquired
      relevant to the provided investment theme.
  gather_market_data:
    agent: false
    description: Initiates data gathering for relevant market data sources.
    name: gather_market_data
    nodes_depended_on:
    - identify_data_sources
    nodes_dependent_on: []
    output_structure:
    - description: A list of specific market data points to be acquired (e.g., 'open
        prices', 'close prices', 'volume').
      key: market_data_points
      type: List[str]
    - description: A list of specific timeframes for the market data (e.g., 'daily',
        'hourly', 'intraday').
      key: market_data_timeframes
      type: List[str]
    prompt: Outline the specific market data points and timeframes to be acquired
      relevant to the provided investment theme.
  generate_anomaly_hypotheses:
    agent: false
    description: Generates initial hypotheses related to market anomalies.
    name: generate_anomaly_hypotheses
    nodes_depended_on:
    - identify_hypothesis_spaces
    nodes_dependent_on: []
    output_structure:
    - description: A list of names for the generated anomaly hypotheses.
      key: anomaly_hypothesis_names
      type: List[str]
    - description: A list of descriptions for each generated anomaly hypothesis, detailing
        the proposed anomaly and its potential exploitability.
      key: anomaly_hypothesis_descriptions
      type: List[str]
    prompt: Propose several distinct market anomaly hypotheses that might be exploitable
      given the provided investment theme or alpha idea.
  generate_factor_hypotheses:
    agent: false
    description: Generates initial hypotheses related to potential investment factors.
    name: generate_factor_hypotheses
    nodes_depended_on:
    - identify_hypothesis_spaces
    nodes_dependent_on: []
    output_structure:
    - description: A list of proposed factor names.
      key: factor_names
      type: List[str]
    - description: A list of detailed descriptions for each proposed factor, outlining
        the underlying logic and potential data sources.
      key: factor_descriptions
      type: List[str]
    - description: A list of potential economic rationales supporting each factor
        hypothesis.
      key: economic_rationales
      type: List[str]
    prompt: Propose several distinct investment factor hypotheses that could explain
      the provided investment theme or alpha idea.
  generate_signal_hypotheses:
    agent: false
    description: Generates initial hypotheses related to potential investment signals.
    name: generate_signal_hypotheses
    nodes_depended_on:
    - identify_hypothesis_spaces
    nodes_dependent_on: []
    output_structure:
    - description: A list of distinct investment signal hypotheses.
      key: signal_hypotheses
      type: List[str]
    prompt: Propose several distinct investment signal hypotheses that could capture
      the provided investment theme or alpha idea.
  identify_data_sources:
    agent: false
    description: Identifies relevant data categories for exploration based on user
      input.
    name: identify_data_sources
    nodes_depended_on:
    - receive_user_input
    nodes_dependent_on: []
    output_structure:
    - description: List of identified market data sources to be explored.
      key: market_data_sources
      type: List[str]
    - description: List of identified alternative data sources to be explored.
      key: alternative_data_sources
      type: List[str]
    - description: List of identified macroeconomic data sources to be explored.
      key: macroeconomic_data_sources
      type: List[str]
    prompt: Based on the provided investment theme/idea, identify the primary categories
      of data sources that should be explored. Categorize into Market Data, Alternative
      Data, and Macroeconomic Data.
  identify_hypothesis_spaces:
    agent: false
    description: Identifies potential areas for hypothesis generation based on user
      input.
    name: identify_hypothesis_spaces
    nodes_depended_on:
    - receive_user_input
    nodes_dependent_on: []
    output_structure:
    - description: A list of potential areas or categories for generating factor hypotheses.
      key: potential_factor_spaces
      type: List[str]
    - description: A list of potential areas or categories for generating signal hypotheses.
      key: potential_signal_spaces
      type: List[str]
    - description: A list of potential areas or categories for generating anomaly
        hypotheses.
      key: potential_anomaly_spaces
      type: List[str]
    prompt: Based on the provided investment theme/idea, identify potential hypothesis
      spaces focusing on factors, signals, and anomalies.
  model_transaction_costs:
    agent: false
    description: Models the impact of transaction costs on portfolio performance.
    name: model_transaction_costs
    nodes_depended_on:
    - construct_portfolio
    nodes_dependent_on: []
    output_structure:
    - description: Indicates whether transaction costs significantly impact expected
        net returns.
      key: transaction_cost_impact_significant
      type: bool
    - description: Estimated transaction costs for the portfolio across different
        trading frequencies and market conditions.
      key: estimated_transaction_costs
      type: List[float]
    - description: Details on any adjustments made to portfolio construction due to
        transaction costs.
      key: adjusted_portfolio_allocation_details
      type: str
    prompt: Model the expected transaction costs for the constructed portfolio under
      various trading frequencies and market conditions. Adjust portfolio construction
      if transaction costs significantly impact expected net returns.
  output_strategy_specification:
    agent: false
    description: Generates the final output detailing the fully specified strategy.
    name: output_strategy_specification
    nodes_depended_on:
    - synthesize_final_strategy
    nodes_dependent_on: []
    output_structure:
    - description: A list of definitive formulas for the factors used in the strategy.
      key: definitive_factor_formulas
      type: List[str]
    - description: A list of finalized parameters for the chosen model architectures.
      key: finalized_model_parameters
      type: List[str]
    - description: The annualized return of the strategy based on backtesting.
      key: annualized_return
      type: float
    - description: The Sharpe ratio of the strategy based on backtesting.
      key: sharpe_ratio
      type: float
    - description: The maximum drawdown experienced by the strategy during backtesting.
      key: maximum_drawdown
      type: float
    - description: The turnover rate of the strategy based on backtesting.
      key: turnover
      type: float
    - description: A detailed and actionable plan for implementing the investment
        strategy.
      key: actionable_implementation_plan
      type: str
    prompt: 'Present the final, fully specified investment strategy. Include: definitive
      factor formulas, finalized model parameters, comprehensive backtest performance
      metrics (e.g., annualized return, Sharpe ratio, maximum drawdown, turnover),
      and a detailed actionable implementation plan.'
  perform_out_of_sample_testing:
    agent: false
    description: Conducts out-of-sample testing to validate model performance and
      robustness.
    name: perform_out_of_sample_testing
    nodes_depended_on:
    - specify_model_parameters
    nodes_dependent_on: []
    output_structure:
    - description: Key performance metrics achieved during the out-of-sample testing
        period. This could include metrics like accuracy, precision, recall, F1-score,
        AUC, Sharpe Ratio, information ratio, etc., depending on the model's objective.
      key: out_of_sample_performance_metrics
      type: str
    - description: An assessment of the model's robustness based on the out-of-sample
        test results, highlighting stability and reliability under unseen data.
      key: model_robustness_assessment
      type: str
    - description: The start date of the out-of-sample validation period.
      key: validation_period_start_date
      type: str
    - description: The end date of the out-of-sample validation period.
      key: validation_period_end_date
      type: str
    - description: A breakdown of out-of-sample performance metrics across different
        segments or timeframes within the validation period, if applicable.
      key: performance_breakdown
      type: float
    prompt: Execute out-of-sample testing for the specified model architectures and
      parameters. Report key performance metrics achieved during this validation period.
  receive_user_input:
    agent: false
    description: Captures the initial high-level investment theme, stock universe,
      or alpha idea from the user.
    name: receive_user_input
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: The high-level investment theme or alpha idea provided by the user.
      key: investment_theme
      type: str
    - description: The universe of stocks specified by the user for research.
      key: stock_universe
      type: List[str]
    prompt: Please provide the high-level investment theme, stock universe, or alpha
      idea to initiate the research process.
  refine_factor_definitions:
    agent: false
    description: Further refines factor definitions based on iterative evaluation.
    name: refine_factor_definitions
    nodes_depended_on:
    - validate_and_refine_factors_and_signals
    nodes_dependent_on: []
    output_structure:
    - description: A list of finalized definitions for the refined investment factors,
        including data sources and calculation methodologies.
      key: refined_factor_definitions
      type: List[str]
    prompt: Update and finalize the precise definitions for the refined investment
      factors, including any new data sources or altered calculation methodologies
      identified during the validation process.
  refine_model_architectures:
    agent: false
    description: Explores and refines potential model architectures for leveraging
      insights.
    name: refine_model_architectures
    nodes_depended_on:
    - validate_and_refine_factors_and_signals
    nodes_dependent_on: []
    output_structure:
    - description: A list of proposed model architectures (e.g., linear regression,
        random forest, gradient boosting, neural networks).
      key: candidate_model_architectures
      type: List[str]
    - description: A list of detailed rationales for each proposed model architecture,
        explaining why it's suitable for the refined factors and signals.
      key: model_architecture_rationales
      type: List[str]
    - description: A list of input features, derived from the refined factors and
        signals, that are suitable for each proposed model architecture.
      key: suitable_input_features
      type: List[str]
    prompt: Based on the refined factors and signals, propose candidate model architectures
      (e.g., linear models, machine learning models) suitable for generating investment
      predictions. Detail the rationale for each architecture.
  refine_signal_processing:
    agent: false
    description: Optimizes signal processing techniques based on iterative evaluation.
    name: refine_signal_processing
    nodes_depended_on:
    - validate_and_refine_factors_and_signals
    nodes_dependent_on: []
    output_structure:
    - description: A list of optimized parameters for signal processing, including
        tuning, normalization, smoothing, and filtering.
      key: optimized_signal_parameters
      type: List[str]
    - description: A list of refined signal processing techniques applied to the signals.
      key: signal_processing_methodologies
      type: List[str]
    - description: A list of metrics indicating the improvement in signal quality
        after processing.
      key: signal_quality_improvements
      type: List[float]
    prompt: Optimize the signal processing techniques for the refined investment signals.
      This includes parameter tuning, normalization, and any necessary smoothing or
      filtering.
  specify_model_parameters:
    agent: false
    description: Determines specific parameters for the chosen model architectures.
    name: specify_model_parameters
    nodes_depended_on:
    - refine_model_architectures
    - refine_factor_definitions
    - refine_signal_processing
    nodes_dependent_on: []
    output_structure:
    - description: A list of specific parameters determined for the chosen model architectures,
        potentially including names and their calibrated values or ranges.
      key: model_parameters
      type: List[str]
    - description: Details related to the in-sample fitting or calibration process,
        such as fitting method, convergence criteria, or performance metrics on the
        in-sample data.
      key: fit_details
      type: List[str]
    - description: A list of boolean indicators, where each element corresponds to
        a model parameter, indicating whether it passed initial validation checks.
      key: parameter_validation_status
      type: List[bool]
    prompt: Determine the specific parameters for the selected model architectures
      using the refined factors and signals. This may involve in-sample fitting or
      other calibration techniques.
  synthesize_final_strategy:
    agent: false
    description: Consolidates all research outputs into a comprehensive final strategy
      specification.
    name: synthesize_final_strategy
    nodes_depended_on:
    - model_transaction_costs
    - refine_factor_definitions
    - refine_signal_processing
    nodes_dependent_on: []
    output_structure:
    - description: A list of the finalized definitions for investment factors, including
        data sources and calculation methodologies.
      key: refined_factor_definitions
      type: List[str]
    - description: A list detailing the optimized signal processing techniques, including
        parameter tuning, normalization, and filtering.
      key: signal_processing_techniques
      type: List[str]
    - description: A list of the chosen model architectures suitable for generating
        investment predictions.
      key: model_architectures
      type: List[str]
    - description: A list of the specific parameters determined for the selected model
        architectures.
      key: model_parameters
      type: List[str]
    - description: A description of the designed risk budgeting framework, outlining
        risk allocation and limits.
      key: risk_management_framework
      type: str
    - description: Details on the constructed diversified portfolio, including optimization
        and risk factor considerations.
      key: portfolio_construction_details
      type: str
    - description: A description of the modeled transaction costs for the portfolio
        under various conditions.
      key: transaction_cost_model
      type: str
    - description: Indicates whether all components of the strategy are cohesive and
        practically implementable.
      key: cohesiveness_assessment
      type: bool
    prompt: Synthesize all refined factors, signal processing techniques, model architectures,
      parameters, risk management frameworks, portfolio construction, and transaction
      cost models into a single, fully specified investment strategy. Ensure all components
      are cohesive and practically implementable.
  validate_and_refine_factors_and_signals:
    agent: false
    description: Iteratively refines factors and signals based on robustness and constraint
      evaluations.
    name: validate_and_refine_factors_and_signals
    nodes_depended_on:
    - evaluate_signal_robustness
    - assess_implementation_constraints
    nodes_dependent_on: []
    output_structure:
    - description: List of refined factor definitions, including updated data sources
        and calculation methodologies.
      key: refined_factor_definitions
      type: List[str]
    - description: List of refined signal processing techniques, including parameter
        tuning, normalization, and filtering.
      key: refined_signal_processing
      type: List[str]
    - description: List of specific areas identified for further iteration and refinement
        in factors and signals.
      key: areas_for_iteration
      type: List[str]
