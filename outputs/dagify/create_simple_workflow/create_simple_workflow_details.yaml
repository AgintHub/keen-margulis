    shims: []
  finalize_workflow:
    agent: false
    code_node_type: stub
    description: Finalize the workflow DAG
    implementation: "from pydantic import BaseModel, Field\n\n\nclass ValidateDagOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for validate_dag node outputs.\"\"\"\n    is_valid:\
      \ bool = Field(..., description=\"Indicates whether the DAG passes all validation\
      \ checks.\")\n    node_count: int = Field(..., description=\"Total number of\
      \ nodes present in the DAG.\")\n    edge_count: int = Field(..., description=\"\
      Total number of directed edges in the DAG.\")\n    cycles_detected: str = Field(...,\
      \ description=\"List of cycle identifiers or descriptions found in the DAG (empty\
      \ if none).\")\n    missing_dependencies: str = Field(..., description=\"List\
      \ of node names that reference non\\u2011existent dependencies (empty if none).\"\
      )\n    errors: str = Field(..., description=\"Detailed error messages for any\
      \ validation failures.\")\n\n\nclass FinalizeWorkflowOutput(BaseModel):\n  \
      \  \"\"\"Pydantic model for finalize_workflow node outputs.\"\"\"\n    dag_representation:\
      \ str = Field(..., description=\"String representation of the finalized DAG,\
      \ e.g., serialized adjacency list or other format.\")\n    is_valid: bool =\
      \ Field(..., description=\"Whether the finalized DAG is valid and acyclic.\"\
      )\n    adjustments_made: bool = Field(..., description=\"Whether any adjustments\
      \ were made to the DAG during finalization.\")\n    adjusted_task_order: str\
      \ = Field(..., description=\"Ordered list of task identifiers in the finalized\
      \ DAG.\")\n    missing_dependencies: str = Field(..., description=\"List of\
      \ task identifiers that have missing or unresolved dependencies.\")\n    cycles_detected:\
      \ str = Field(..., description=\"List of detected cycles in the DAG, if any.\"\
      )\n    warnings: str = Field(..., description=\"Any warnings or notes about\
      \ potential issues.\")\n    summary: str = Field(..., description=\"Short textual\
      \ summary of the finalized workflow.\")\n\n\ndef finalize_workflow(validate_dag_input:\
      \ ValidateDagOutput, **kwargs) -> FinalizeWorkflowOutput:\n    \"\"\"Finalize\
      \ the workflow DAG\n\n    Args:\n        validate_dag_input: Input from the\
      \ 'validate_dag' node.\n        **kwargs: Additional keyword arguments.\n\n\
      \    Returns:\n        FinalizeWorkflowOutput: Object containing outputs for\
      \ this node.\n    \"\"\"\n    # TODO: Implement this function\n\n    # Return\
      \ stub output with placeholder values\n    return FinalizeWorkflowOutput(\n\
      \        dag_representation=\"\",\n        is_valid=False,\n        adjustments_made=False,\n\
      \        adjusted_task_order=\"\",\n        missing_dependencies=\"\",\n   \
      \     cycles_detected=\"\",\n        warnings=\"\",\n        summary=\"\",\n\
      \    )"
    name: finalize_workflow
    nodes_depended_on:
    - validate_dag
    nodes_dependent_on: []
    output_structure:
    - description: String representation of the finalized DAG, e.g., serialized adjacency
        list or other format.
      key: dag_representation
      type: str
    - description: Whether the finalized DAG is valid and acyclic.
      key: is_valid
      type: bool
    - description: Whether any adjustments were made to the DAG during finalization.
      key: adjustments_made
      type: bool
    - description: Ordered list of task identifiers in the finalized DAG.
      key: adjusted_task_order
      type: str
    - description: List of task identifiers that have missing or unresolved dependencies.
      key: missing_dependencies
      type: str
    - description: List of detected cycles in the DAG, if any.
      key: cycles_detected
      type: str
    - description: Any warnings or notes about potential issues.
      key: warnings
      type: str
    - description: Short textual summary of the finalized workflow.
      key: summary
      type: str
    prd:
      conceptual_info: The finalize_workflow node takes a validated DAG, checks for
        any remaining inconsistencies such as missing dependencies or cycles, applies
        necessary adjustments, and produces a clean, ordered representation ready
        for execution.
      docstring:
        examples:
        - lines:
          - 'dag = finalize_workflow(

            '
          - '    task_ids=[''A'', ''B'', ''C''],

            '
          - '    edge_sources=[''A'', ''B''],

            '
          - '    edge_destinations=[''B'', ''C''],

            '
          - '    is_valid=True,

            '
          - '    node_count=3,

            '
          - '    edge_count=2,

            '
          - '    cycles_detected=[],

            '
          - '    missing_dependencies=[],

            '
          - '    errors=[]

            '
          - )
          output: '{''dag_representation'': ''A -> B -> C'', ''is_valid'': True, ''adjustments_made'':
            False, ''adjusted_task_order'': [''A'', ''B'', ''C''], ''missing_dependencies'':
            [], ''cycles_detected'': [], ''warnings'': [], ''summary'': ''DAG finalized
            successfully.''}'
        - lines:
          - 'dag = finalize_workflow(

            '
          - '    task_ids=[''A'', ''B'', ''C''],

            '
          - '    edge_sources=[''A'', ''B'', ''C''],

            '
          - '    edge_destinations=[''B'', ''C'', ''A''],

            '
          - '    is_valid=False,

            '
          - '    node_count=3,

            '
          - '    edge_count=3,

            '
          - '    cycles_detected=[''A->B->C->A''],

            '
          - '    missing_dependencies=[],

            '
          - '    errors=[''Cycle detected'']

            '
          - )
          output: '{''dag_representation'': ''A -> B -> C'', ''is_valid'': False,
            ''adjustments_made'': True, ''adjusted_task_order'': [''A'', ''B'', ''C''],
            ''missing_dependencies'': [], ''cycles_detected'': [''A->B->C->A''], ''warnings'':
            [''Cycle removed: A->B->C->A''], ''summary'': ''DAG finalized with cycle
            removal.''}'
        parameters:
        - description: Unique identifiers of all tasks in the DAG.
          name: task_ids
          type: List[str]
        - description: Source task identifiers for each directed edge.
          name: edge_sources
          type: List[str]
        - description: Destination task identifiers for each directed edge.
          name: edge_destinations
          type: List[str]
        - description: Result of the validation step (True if the DAG passed all checks).
          name: is_valid
          type: bool
        - description: Total number of nodes in the DAG.
          name: node_count
          type: int
        - description: Total number of directed edges in the DAG.
          name: edge_count
          type: int
        - description: List of cycle identifiers found during validation.
          name: cycles_detected
          type: List[str]
        - description: List of node names that reference non‑existent dependencies.
          name: missing_dependencies
          type: List[str]
        - description: Detailed error messages from the validation step.
          name: errors
          type: List[str]
        raises:
        - description: If any required input lists are empty or lengths of edge_sources
            and edge_destinations mismatch.
          type: ValueError
        returns:
          description: 'A dictionary containing the finalized DAG representation and
            metadata: dag_representation (str), is_valid (bool), adjustments_made
            (bool), adjusted_task_order (List[str]), missing_dependencies (List[str]),
            cycles_detected (List[str]), warnings (List[str]), and summary (str).'
          type: Dict[str, Any]
        summary: Finalize a workflow DAG by validating its structure, resolving missing
          dependencies, removing cycles, and ordering tasks.
    prompt: Review the workflow DAG for completeness and make any necessary adjustments.
    shims: []
  identify_task_dependencies:
