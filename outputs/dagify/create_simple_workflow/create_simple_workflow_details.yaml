dag_type: plain_text
description: A workflow for creating a simple workflow DAG
name: create_simple_workflow
nodes:
  create_task_dag:
    agent: false
    description: Create a DAG representing the tasks and their dependencies
    name: create_task_dag
    nodes_depended_on:
    - determine_task_dependencies
    nodes_dependent_on: []
    prompt: Using the tasks and dependencies identified, create a Directed Acyclic
      Graph (DAG) that represents the workflow. Ensure the DAG is acyclic and properly
      ordered.
  define_workflow_objective:
    agent: false
    description: Define the objective of the workflow
    name: define_workflow_objective
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Clearly state the primary objective of the workflow. What is the main
      task or goal?
  determine_task_dependencies:
    agent: false
    description: Determine the dependencies between tasks
    name: determine_task_dependencies
    nodes_depended_on:
    - identify_required_tasks
    nodes_dependent_on: []
    prompt: Analyze the tasks identified and determine their dependencies. Which tasks
      must be completed before others can start?
  finalize_workflow:
    agent: false
    description: Finalize the workflow based on the validated DAG
    name: finalize_workflow
    nodes_depended_on:
    - validate_dag
    nodes_dependent_on: []
    prompt: Using the validated DAG, finalize the workflow. This includes formatting
      the DAG into the required JSON structure.
  identify_required_tasks:
    agent: false
    description: Identify the tasks required to achieve the workflow objective
    name: identify_required_tasks
    nodes_depended_on:
    - define_workflow_objective
    nodes_dependent_on: []
    prompt: List the key tasks or operations necessary to accomplish the workflow
      objective. Break down complex tasks into simpler components.
  validate_dag:
    agent: false
    description: Validate the created DAG for correctness and acyclicity
    name: validate_dag
    nodes_depended_on:
    - create_task_dag
    nodes_dependent_on: []
    prompt: Check the DAG for any cycles or inconsistencies. Verify that it accurately
      represents the workflow and its dependencies.
