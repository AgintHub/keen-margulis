dag_type: plain_text
description: A workflow for creating a simple workflow DAG
name: create_simple_workflow
nodes:
  create_task_dag:
    agent: false
    description: Create a DAG representing the tasks and their dependencies
    name: create_task_dag
    nodes_depended_on:
    - identify_task_dependencies
    nodes_dependent_on:
    - validate_dag
    prompt: Using the tasks and their dependencies, construct a Directed Acyclic Graph
      (DAG) that represents the workflow.
  decompose_objective_into_tasks:
    agent: false
    description: Break down the workflow objective into individual tasks
    name: decompose_objective_into_tasks
    nodes_depended_on:
    - define_workflow_objective
    nodes_dependent_on:
    - identify_task_dependencies
    prompt: Decompose the workflow objective into smaller, manageable tasks. List
      them out.
  define_workflow_objective:
    agent: false
    description: Define the objective of the workflow
    name: define_workflow_objective
    nodes_depended_on: []
    nodes_dependent_on:
    - decompose_objective_into_tasks
    prompt: Clearly articulate the primary goal of the workflow. What is it intended
      to achieve?
  finalize_workflow:
    agent: false
    description: Finalize the workflow DAG
    name: finalize_workflow
    nodes_depended_on:
    - validate_dag
    nodes_dependent_on: []
    prompt: Review the workflow DAG for completeness and make any necessary adjustments.
  identify_task_dependencies:
    agent: false
    description: Identify dependencies between tasks
    name: identify_task_dependencies
    nodes_depended_on:
    - decompose_objective_into_tasks
    nodes_dependent_on:
    - create_task_dag
    prompt: Analyze the tasks identified and determine their dependencies. Which tasks
      depend on others?
  validate_dag:
    agent: false
    description: Validate the created DAG for correctness and acyclicity
    name: validate_dag
    nodes_depended_on:
    - create_task_dag
    nodes_dependent_on:
    - finalize_workflow
    prompt: Check the DAG for any cycles or inconsistencies. Ensure it accurately
      represents the workflow.
