    prd:
      conceptual_info: Captures the high‑level purpose of the workflow, providing
        a clear goal that drives the subsequent task decomposition, dependency analysis,
        and DAG construction.
      docstring:
        examples:
        - lines:
          - objective = define_workflow_objective()
          output: '''Implement an automated data ingestion pipeline for real‑time
            analytics'''
        - lines:
          - objective = define_workflow_objective()
          output: '''Develop a user‑friendly mobile application for inventory management'''
        parameters: []
        raises:
        - description: If the generated objective is empty or exceeds an acceptable
            length.
          type: ValueError
        returns:
          description: Concise objective of the workflow.
          type: str
        summary: Generate a concise objective statement for the workflow based on
          the user’s intent.
    prompt: Clearly articulate the primary goal of the workflow. What is it intended
