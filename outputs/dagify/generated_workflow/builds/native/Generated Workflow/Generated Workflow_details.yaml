dag_type: plain_text
description: Generated workflow from UI.
name: Generated Workflow
nodes:
  analyze_market_trends:
    agent: false
    description: Analyze market trends based on historical data to predict future
      movements.
    name: analyze_market_trends
    nodes_depended_on:
    - gather_market_data
    nodes_dependent_on: []
    prompt: Analyze historical market data to identify trends.
  evaluate_trading_strategies:
    agent: false
    description: Evaluate different trading strategies based on market analysis and
      risk assessment.
    name: evaluate_trading_strategies
    nodes_depended_on:
    - analyze_market_trends
    nodes_dependent_on: []
    prompt: Evaluate trading strategies based on market trends and risk.
  execute_trades:
    agent: false
    description: Execute trades based on the selected optimal strategy.
    name: execute_trades
    nodes_depended_on:
    - select_optimal_strategy
    nodes_dependent_on: []
    prompt: Execute trades according to the chosen strategy.
  gather_market_data:
    agent: false
    description: Collect current market data including stock prices, trading volumes,
      and other relevant metrics.
    name: gather_market_data
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Collect current market data from reliable sources.
  monitor_trade_performance:
    agent: false
    description: Monitor the performance of executed trades and adjust strategies
      as needed.
    name: monitor_trade_performance
    nodes_depended_on:
    - execute_trades
    nodes_dependent_on: []
    prompt: Monitor trade performance and adjust strategies.
  select_optimal_strategy:
    agent: false
    description: Select the optimal trading strategy based on evaluations and risk
      assessments.
    name: select_optimal_strategy
    nodes_depended_on:
    - evaluate_trading_strategies
    nodes_dependent_on: []
    prompt: Choose the best trading strategy based on evaluations.
