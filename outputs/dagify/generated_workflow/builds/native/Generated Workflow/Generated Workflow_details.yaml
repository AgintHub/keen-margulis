dag_type: plain_text
description: Generated workflow from UI.
name: Generated Workflow
nodes:
  construct_dag:
    agent: false
    description: Construct the workflow DAG using the decomposed tasks and their dependencies
    name: construct_dag
    nodes_depended_on:
    - identify_dependencies
    - define_node_outputs
    nodes_dependent_on: []
    prompt: Use the task list, dependency map, and node outputs to construct the workflow
      DAG
  decompose_objective:
    agent: false
    description: Decompose the objective into smaller, manageable tasks or steps
    name: decompose_objective
    nodes_depended_on:
    - define_objective
    nodes_dependent_on: []
    prompt: Break down the objective into fundamental steps or tasks
  define_node_outputs:
    agent: false
    description: Define the output structure for each node or task
    name: define_node_outputs
    nodes_depended_on:
    - decompose_objective
    nodes_dependent_on: []
    prompt: Determine the output fields, their types, and descriptions for each task
  define_objective:
    agent: false
    description: Clearly define the objective or task description that the workflow
      needs to achieve
    name: define_objective
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Define the objective or task description for the workflow
  finalize_workflow:
    agent: false
    description: Finalize the workflow by ensuring all nodes are connected and the
      DAG is valid
    name: finalize_workflow
    nodes_depended_on:
    - validate_dag
    nodes_dependent_on: []
    prompt: Make any necessary adjustments to ensure the workflow DAG is complete
      and valid
  identify_dependencies:
    agent: false
    description: Identify dependencies between the decomposed tasks
    name: identify_dependencies
    nodes_depended_on:
    - decompose_objective
    nodes_dependent_on: []
    prompt: Analyze the decomposed tasks to identify dependencies between them
  validate_dag:
    agent: false
    description: Validate the constructed workflow DAG for correctness and acyclicity
    name: validate_dag
    nodes_depended_on:
    - construct_dag
    nodes_dependent_on: []
    prompt: Check the DAG for any cycles or inconsistencies
